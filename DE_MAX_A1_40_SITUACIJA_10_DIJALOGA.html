 const clean=(p)=>{let [de,sr]=p;de=de.replace(/^(Guten Morgen|Guten Tag|Guten Abend|Hallo)[!,.\s]*/i,"").trim();sr=sr.replace(/^(Dobro jutro|Dobar dan|Dobro veče|Zdravo)[!,.\s]*/i,"").trim();return [greeting+"! "+de,greetingSr+"! "+sr]};
 const opening=[clean(a),clean(b)];
 const finish=goodbye[s.n]||(informal?[["Dann bis bald!","Onda se vidimo uskoro!"],["Ja, bis bald!","Da, vidimo se uskoro!"]]:[["Vielen Dank! Auf Wiedersehen!","Hvala vam! Doviđenja!"],["Gern. Auf Wiedersehen!","Rado. Doviđenja!"]]);
 return [...opening,...body,...finish];
}
const reversed=new Set([38]);
function speakerNames(){const s=S[sc];if(s.n===7&&di>=5)return ["Lekar","Pacijent"];let parts=s.roles.split(/\s*\/\s*/);if(parts.length!==2)return ["Osoba A","Osoba B"];return reversed.has(s.n)?parts.reverse():parts}
function stop(){run++;playing=false;$("play").classList.remove("running");synth?.cancel();document.querySelectorAll(".line.on").forEach(x=>x.classList.remove("on"))}
function say(t,done){if(!synth)return;const u=new SpeechSynthesisUtterance(t),id=run;u.lang="de-DE";u.rate=rate;const vs=synth.getVoices().filter(v=>v.lang.toLowerCase().startsWith("de"));if(vs.length)u.voice=vs.find(v=>/google|natural/i.test(v.name))||vs[0];u.onend=()=>{if(run===id)done?.()};synth.speak(u)}
function read(i){if(!playing)return;const a=dialogue();if(i>=a.length){stop();$("status").textContent="Dijalog je završen.";return}document.querySelectorAll(".line.on").forEach(x=>x.classList.remove("on"));const el=$("line"+i);el?.classList.add("on");el?.scrollIntoView({block:"nearest"});$("status").textContent="Slušanje "+(i+1)+" / 12";say(a[i][0],()=>{const id=run;setTimeout(()=>{if(id===run)read(i+1)},400)})}
function vocab(){const a=dialogue().map(p=>p[0]).join(" ");return dictionary.filter(w=>a.toLowerCase().includes(w[0].toLowerCase())&&new RegExp("(^|[^a-zäöüß])"+w[0].toLowerCase().replace(/[.?*+^$|()[\]{}]/g,"\\$&")+"([^a-zäöüß]|$)","i").test(a)).slice(0,25)}
function popup(title,content){$("sheetTitle").textContent=title;$("sheetBody").innerHTML=content;$("modal").classList.add("open")}
function draw(){stop();const s=S[sc];if(!s){$("content").textContent="Podaci nisu dostupni.";return}
$("sceneLabel").innerHTML=E(s.emoji)+" "+s.n+". "+E(s.n===7?"U apoteci / kod doktora":s.sr)+"<small>"+E(s.de)+"</small>";
$("tabs").innerHTML=Array.from({length:10},(_,i)=>'<button class="tab '+(i===di?"active":"")+'" data-dialog="'+i+'">Dijalog '+(i+1)+'</button>').join("");
$("content").innerHTML='<p class="hint">'+E(speakerNames().join(' / '))+' · Dijalog '+(di+1)+'/10 · 12 replika</p><div class="toolbar"><button class="tool" id="translation">'+(translation?"✓ Prevod SR":"Prikaži prevod")+'</button><button class="tool gold" id="words">📖 Korisne reči ('+vocab().length+')</button></div>'+dialogue().map((p,i)=>'<article class="line '+(i%2?"b":"")+'" id="line'+i+'"><div class="topline"><span>'+E(speakerNames()[i%2])+'</span><button class="sound" data-sound="'+i+'">🔊</button></div><div class="de">'+E(p[0])+'</div>'+(translation?'<div class="sr">'+E(p[1])+'</div>':'')+'</article>').join("");
try{history.replaceState(null,"",location.pathname+"?s="+s.n+"&d="+(di+1))}catch(e){}
$("status").textContent="Dijalog "+(di+1)+"/10 · 12 replika";}
$("prev").onclick=()=>{sc=(sc+S.length-1)%S.length;di=0;draw()};$("next").onclick=()=>{sc=(sc+1)%S.length;di=0;draw()};
$("tabs").onclick=e=>{let b=e.target.closest("[data-dialog]");if(b){di=+b.dataset.dialog;draw()}};
$("content").onclick=e=>{let b=e.target.closest("button");if(!b)return;
if(b.dataset.sound!==undefined){stop();say(dialogue()[+b.dataset.sound][0]);return}
if(b.id==="translation"){translation=!translation;draw();return}
if(b.id==="words"){const v=vocab();popup("📖 Korisne reči · Dijalog "+(di+1),'<div class="note">Važne reči iz ovog dijaloga. 🔊 za izgovor.</div>'+v.map((w,i)=>'<div class="word"><b>'+E(w[0])+'</b><span>'+E(w[1])+'</span><button class="sound" data-word="'+i+'">🔊</button></div>').join(""));return}};
$("sceneLabel").onclick=()=>popup("Izaberi situaciju",S.map((s,i)=>'<button class="choose" data-sc="'+i+'">'+E(s.emoji)+' '+s.n+'. '+E(s.n===7?"U apoteci / kod doktora":s.sr)+' — '+E(s.de)+'</button>').join(""));
$("sheetBody").onclick=e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.sc!==undefined){sc=+b.dataset.sc;di=0;$("close").click();draw()}else if(b.dataset.word!==undefined){stop();say(vocab()[+b.dataset.word][0])}};
$("close").onclick=()=>$("modal").classList.remove("open");$("modal").onclick=e=>{if(e.target===$("modal"))$("close").click()};
$("play").onclick=()=>{stop();playing=true;$("play").classList.add("running");read(0)};$("stop").onclick=()=>{stop();$("status").textContent="Zaustavljeno."};
const speeds=[{label:"Sporo",value:.7},{label:"Srednje",value:.85},{label:"Brzo",value:1.12}];$("rate").onclick=()=>{speedIndex=(speedIndex+1)%speeds.length;rate=speeds[speedIndex].value;$("rate").textContent=speeds[speedIndex].label;$("status").textContent="Brzina čitanja: "+speeds[speedIndex].label};
draw();
})();
</script></body></html>
