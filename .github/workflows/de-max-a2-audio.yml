name: Publish DE-MAX A2 listening audio
on:
  push:
    paths:
      - '.github/workflows/de-max-a2-audio.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-official-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official ÖSD A2 model audio
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, zipfile, io, pathlib, re, shutil
          url="https://osd.at/wp-content/uploads/2021/06/za2_modellsatz_hoeren_mit_audiodateien.zip_062021.zip"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 DE-MAX educational training"})
          content=urllib.request.urlopen(req,timeout=100).read()
          z=zipfile.ZipFile(io.BytesIO(content))
          out=pathlib.Path("DE-MAX_OSD_A2_TEST_1/audio")
          out.mkdir(parents=True,exist_ok=True)
          files=[x for x in z.namelist() if x.lower().endswith((".mp3",".wav",".m4a")) and not x.startswith("__MACOSX")]
          files=sorted(files,key=lambda s:[int(t) if t.isdigit() else t.lower() for t in re.split(r'(\d+)',s)])
          print("Official ZIP audio filenames:",files)
          if len(files)<3:raise RuntimeError("Three audio tracks expected; found "+str(len(files)))
          for i,src in enumerate(files[:3],1):
            path=out/f"track-{i}{pathlib.Path(src).suffix.lower()}"
            path.write_bytes(z.read(src))
            if path.suffix!=".mp3":
              import subprocess
              dst=out/f"track-{i}.mp3"
              subprocess.run(["ffmpeg","-y","-i",str(path),"-codec:a","libmp3lame","-b:a","64k",str(dst)],check=True)
              path.unlink()
            print("Wrote",out/f"track-{i}.mp3")
          PY
      - name: Commit sound files to Pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DE-MAX_OSD_A2_TEST_1/audio
          if ! git diff --cached --quiet; then
            git commit -m "Add official ÖSD A2 model audio to DE-MAX test"
            git push origin HEAD:main
          fi
