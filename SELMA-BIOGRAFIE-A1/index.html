:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#eaf0ff;background:#0b1631}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 0,#223b72 0,transparent 42%),#0b1631}.shell{width:min(850px,100%);margin:auto;padding:18px 14px 35px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;color:#fff;letter-spacing:.04em}.brand b{color:#ffc857}.small{font-size:12px;color:#b8c9ed}.hero{margin:23px 0 14px}.hero h1{font-size:clamp(25px,5vw,38px);margin:0 0 6px}.hero p{color:#cad5ed;line-height:1.55;margin:0}.controls{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.btn{border:0;border-radius:12px;padding:13px 15px;font:inherit;font-weight:750;cursor:pointer;color:#102144;background:#edf3ff}.btn:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #f5c454;outline-offset:2px}.primary{background:#ffcd59}.green{background:#33df9a}.red{background:#fa737c}.blue{background:#76baff}.topics{width:100%;padding:13px 10px;background:#15274b;color:white;border:1px solid #45608f;border-radius:12px;font-size:16px}.sheet{background:#f9fbff;color:#1c2940;border-radius:22px;padding:22px 18px;box-shadow:0 20px 60px #0003}.num{color:#63718e;font-size:13px;font-weight:800}.sheet h2{margin:7px 0 16px;font-size:26px}.line{border:3px solid transparent;border-bottom-color:#e2e8f1;border-radius:12px;padding:11px 10px;transition:border-color .15s,background .15s;}.line.reading{border:3px solid #e32636;background:#fff2f3;box-shadow:0 0 0 2px #ffd0d4;}.sheet h2.reading-title{outline:3px solid #e32636;outline-offset:5px;border-radius:5px;}.line{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}.de{font-size:19px;line-height:1.56;font-weight:550}.sr{font-size:15px;color:#416185;margin-top:9px;line-height:1.5}.say{flex-shrink:0;border:0;background:#e7edff;border-radius:10px;padding:10px;cursor:pointer;font-size:19px}.nav{display:flex;gap:10px;margin:17px 0}.nav .btn <script>
const topics=[["Biografie","Predstavljanje",["Guten Tag. Mein Name ist Selma.","Ich bin 41 Jahre alt.","Ich bin verheiratet und Hausfrau.","Mein Mann heißt Rafet und ist auch 41 Jahre alt.","Wir haben drei Kinder.","Unsere Kinder heißen Merjema, Muhamed und Amina."],["Dobar dan. Moje ime je Selma.","Imam 41 godinu.","Udata sam i domaćica sam.","Moj muž se zove Rafet i on takođe ima 41 godinu.","Imamo troje dece.","Naša deca se zovu Merjema, Muhamed i Amina."]],["Familie","Porodica",["Mein Mann heißt Rafet.","Er ist 41 Jahre alt.","Er ist Bauarbeiter von Beruf.","Er lebt in Deutschland, in Frankfurt am Main.","Wir haben drei Kinder: zwei Töchter und einen Sohn.","Unsere älteste Tochter heißt Merjema.","Sie ist 17 Jahre alt und geht auf eine weiterführende Schule.","Unser Sohn heißt Muhamed und ist 14 Jahre alt.","Unsere jüngste Tochter heißt Amina und ist 13 Jahre alt.","Muhamed und Amina gehen in die Grundschule.","Meine Familie ist mir sehr wichtig."],["Moj muž se zove Rafet.","On ima 41 godinu.","Po zanimanju je građevinski radnik.","Živi u Nemačkoj, u Frankfurtu na Majni.","Imamo troje dece: dve ćerke i jednog sina.","Naša najstarija ćerka se zove Merjema.","Ima 17 godina i ide u srednju školu.","Naš sin se zove Muhamed i ima 14 godina.","Naša najmlađa ćerka se zove Amina i ima 13 godina.","Muhamed i Amina idu u osnovnu školu.","Moja porodica mi je veoma važna."]],["Hobbys","Hobiji",["Meine Hobbys sind Kochen, Spazierengehen und Musik hören.","Ich verbringe gern Zeit mit meiner Familie.","Am Wochenende gehe ich gern spazieren."],["Moji hobiji su kuvanje, šetnja i slušanje muzike.","Volim da provodim vreme sa svojom porodicom.","Vikendom volim da šetam."]],["Lieblingsessen","Omiljena hrana",["Ich habe viele Lieblingsgerichte.","Am liebsten esse ich Pizza und Hähnchen mit Pommes.","Ich koche gern für meine Familie."],["Imam mnogo omiljenih jela.","Najviše volim da jedem picu i piletinu sa pomfritom.","Volim da kuvam za svoju porodicu."]],["Lieblingsgetränk","Omiljeno piće",["Ich trinke sehr gerne Kaffee und Tee.","Ich trinke auch Mineralwasser.","Am Morgen trinke ich gern eine Tasse Kaffee."],["Veoma rado pijem kafu i čaj.","Pijem i mineralnu vodu.","Ujutru volim da popijem šolju kafe."]],["Sprachen / Deutsch","Jezici / nemački",["Ich lerne Deutsch.","Ich spreche schon ein bisschen Deutsch.","Ich möchte besser Deutsch sprechen.","Ich lerne Deutsch, weil mein Mann in Deutschland lebt."],["Učim nemački jezik.","Već govorim malo nemački.","Želim bolje da govorim nemački.","Učim nemački jer moj muž živi u Nemačkoj."]],["Freizeit","Slobodno vreme",["In meiner Freizeit koche ich und räume das Haus auf.","Ich verbringe auch gern Zeit mit meinen Kindern.","Manchmal höre ich Musik oder gehe spazieren."],["U slobodno vreme kuvam i sređujem kuću.","Takođe volim da provodim vreme sa svojom decom.","Ponekad slušam muziku ili idem u šetnju."]],["Sport / mag gern","Sport / šta volim",["Ich finde Sport gesund.","Ich gehe gern spazieren.","Ich habe nicht immer Zeit für Sport, weil ich zu Hause viel zu tun habe."],["Smatram da je sport zdrav.","Volim da šetam.","Nemam uvek vremena za sport jer kod kuće imam mnogo obaveza."]],["Musik","Muzika",["Ich höre sehr gerne Musik.","Ich mag Volksmusik und Popmusik.","Manchmal höre ich Musik, wenn ich koche."],["Veoma rado slušam muziku.","Volim narodnu i pop muziku.","Ponekad slušam muziku dok kuvam."]],["Bücher","Knjige",["Ich lese manchmal Bücher.","Ich lerne auch mit meinem Deutschbuch.","Ich finde die deutsche Sprache interessant."],["Ponekad čitam knjige.","Učim i iz svoje knjige za nemački.","Smatram da je nemački jezik zanimljiv."]],["Lieblingskleidung","Omiljena odeća",["Ich trage gerne Kleider, Blusen und Hosen.","Zu Hause trage ich bequeme Kleidung.","Wenn ich ausgehe, ziehe ich gern ein schönes Kleid an."],["Volim da nosim haljine, bluze i pantalone.","Kod kuće nosim udobnu odeću.","Kada izlazim, volim da obučem lepu haljinu."]],["Freunde","Prijatelji",["Ich treffe mich gerne mit meinen Freundinnen.","Wir trinken zusammen Kaffee und unterhalten uns.","Manchmal gehen wir zusammen spazieren."],["Volim da se viđam sa svojim prijateljicama.","Zajedno pijemo kafu i razgovaramo.","Ponekad zajedno šetamo."]],["Urlaub","Odmor / putovanja",["Ich mache gerne Urlaub mit meiner Familie.","Im Sommer fahre ich gern ans Meer.","Im Urlaub möchte ich mich erholen und Zeit mit meinen Kindern verbringen."],["Volim da provodim odmor sa svojom porodicom.","Leti volim da idem na more.","Na odmoru želim da se odmorim i provedem vreme sa svojom decom."]],["Was ich gern mache","Šta volim da radim",["Ich koche gern für meine Kinder.","Ich lerne gerne neue deutsche Wörter.","Ich gehe gern mit meiner Familie spazieren."],["Volim da kuvam za svoju decu.","Volim da učim nove nemačke reči.","Volim da šetam sa svojom porodicom."]],["Arbeit / Beruf / Job","Posao / zanimanje",["Ich bin Hausfrau.","Ich kümmere mich um meine Familie und meine Kinder.","Zu Hause koche ich, putze und wasche die Wäsche.","Mein Mann ist Bauarbeiter von Beruf."],["Ja sam domaćica.","Brinem o svojoj porodici i deci.","Kod kuće kuvam, čistim i perem veš.","Moj muž je po zanimanju građevinski radnik."]],["Tiere / Haustiere","Životinje / kućni ljubimci",["Ich mag Hunde und Katzen.","Ich finde Katzen sehr süß.","Meine Kinder mögen auch Tiere."],["Volim pse i mačke.","Smatram da su mačke veoma slatke.","Moja deca takođe vole životinje."]],["Filme","Filmovi",["Ich sehe gerne Filme und Serien.","Ich mag Komödien und Familienfilme.","Am Abend sehe ich manchmal fern."],["Volim da gledam filmove i serije.","Volim komedije i porodične filmove.","Uveče ponekad gledam televiziju."]],["Lieblingsfarbe","Omiljena boja",["Meine Lieblingsfarbe ist Blau.","Ich mag auch Weiß und Schwarz.","Ich trage gerne Kleidung in diesen Farben."],["Moja omiljena boja je plava.","Volim i belu i crnu.","Volim da nosim odeću u tim bojama."]],["Wohnort / Woher ich komme","Mesto stanovanja / odakle dolazim",["Ich komme aus Serbien, aus Novi Pazar.","Ich bin in Novi Pazar geboren und ich lebe hier mit meiner Familie."],["Dolazim iz Srbije, iz Novog Pazara.","Rođena sam u Novom Pazaru i ovde živim sa svojom porodicom."]],["Lieblingslied","Omiljena pesma",["Ich höre gerne verschiedene Lieder.","Ich mag ruhige Musik und Volksmusik.","Musik macht mir viel Freude."],["Volim da slušam različite pesme.","Volim mirnu i narodnu muziku.","Muzika me mnogo raduje."]]];let index=0,utter=null;const $=id=>document.getElementById(id);const synth=window.speechSynthesis;
let selectedRate=.8;
let playToken=0;let currentSentence=-1;let sentencePage=0;
function showSentence(i){
const count=topics[index][2].length;
sentencePage=Math.max(0,Math.min(i,count-1));
Array.from($('sentences').children).forEach((line,j)=>line.classList.toggle('current',j===sentencePage));
$('sentenceCount').textContent=(sentencePage+1)+' / '+count;
$('sentencePrev').disabled=sentencePage===0;
$('sentenceNext').disabled=sentencePage>=count-1;
}
function clearHighlight(){document.querySelectorAll('.line.reading').forEach(el=>el.classList.remove('reading'));$('heading').classList.remove('reading-title');currentSentence=-1}
function highlight(i){clearHighlight();showSentence(i);const line=$('sentences').children[i];if(line){currentSentence=i;line.classList.add('reading');$('heading').classList.add('reading-title');if(window.matchMedia('(min-width:650px)').matches)line.scrollIntoView({block:'nearest',behavior:'smooth'})}}
function stop(){playToken++;if(synth)synth.cancel();utter=null;clearHighlight();$('pause').textContent='⏸ Pauza'}
function speakSentence(i,token,auto){if(token!==playToken)return;const sentences=topics[index][2];if(i>=sentences.length){clearHighlight();utter=null;return}highlight(i);utter=new SpeechSynthesisUtterance(sentences[i]);utter.lang='de-DE';utter.rate=selectedRate;utter.pitch=1;const voices=synth.getVoices().filter(v=>v.lang.toLowerCase().startsWith('de'));if(voices.length)utter.voice=voices.find(v=>v.lang==='de-DE')||voices[0];utter.onend=()=>{if(token!==playToken)return;if(auto)speakSentence(i+1,token,true);else clearHighlight()};utter.onerror=()=>{if(token===playToken)clearHighlight()};synth.speak(utter)}
function speak(i,auto=false){if(!synth){alert('Vaš pregledač ne podržava izgovor.');return}stop();const token=playToken;speakSentence(i,token,auto)}
function render(){stop();document.querySelector('.sheet').classList.toggle('bio-all',index===0);const t=topics[index];$('topCount').textContent=(index+1)+' / '+topics.length;$('topName').textContent=topics[index][0];$('counter').textContent=(index+1)+' / '+topics.length;$('ord').textContent=index===0?'PREDSTAVLJANJE':'TEMA '+index;$('heading').textContent=t[0];const area=$('sentences');area.textContent='';t[2].forEach((s,i)=>{const wrap=document.createElement('div');wrap.className='line';const left=document.createElement('div');left.style.flex='1';const de=document.createElement('div');de.className='de';de.textContent=s;left.append(de);{const sr=document.createElement('div');sr.className='sr';sr.textContent=t[3][i];left.append(sr)}const b=document.createElement('button');b.className='say';b.textContent='🔊';b.setAttribute('aria-label','Izgovori rečenicu '+(i+1));b.onclick=()=>speak(i,false);wrap.append(left,b);area.append(wrap)});$('prev').disabled=index===0;$('next').disabled=index===topics.length-1;$('topPrev').disabled=index===0;$('topNext').disabled=index===topics.length-1;showSentence(0)}
document.querySelectorAll('.speedbtn').forEach(btn=>btn.addEventListener('click',()=>{selectedRate=Number(btn.dataset.rate);document.querySelectorAll('.speedbtn').forEach(b=>{const on=b===btn;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on))});if(synth&&(synth.speaking||synth.paused))stop()}));$('play').onclick=()=>speak(0,true);$('pause').onclick=()=>{if(!synth)return;if(synth.paused){synth.resume();$('pause').textContent='⏸ Pauza'}else if(synth.speaking){synth.pause();$('pause').textContent='▶ Nastavi'}};$('stop').onclick=()=>{stop();$('pause').textContent='⏸ Pauza'};$('prev').onclick=()=>{if(index>0){index--;render()}};$('next').onclick=()=>{if(index<topics.length-1){index++;render()}};$('topPrev').onclick=$('prev').onclick;$('topNext').onclick=$('next').onclick;$('sentencePrev').onclick=()=>{if(sentencePage>0){stop();showSentence(sentencePage-1)}};$('sentenceNext').onclick=()=>{if(sentencePage<topics[index][2].length-1){stop();showSentence(sentencePage+1)}};render();if(synth)synth.getVoices();
</script></body></html>
