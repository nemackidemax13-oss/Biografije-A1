<!doctype html>
<html lang="sr">
<head>

<style>
:root{color-scheme:light;--ink:#173452;--navy:#133c70;--blue:#2467bf;--line:#d8e4f2;--muted:#647990;--red:#d42845;--green:#168357;--soft:#f4f8ff}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#e9f2ff;color:var(--ink);display:flex;justify-content:center;overscroll-behavior:none}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #ffba3e;outline-offset:1px}
.app{position:relative;width:min(100vw,530px);height:100dvh;min-height:0;background:#fff;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;overflow:hidden;box-shadow:0 10px 50px #173c6b2c}
header{display:flex;align-items:center;gap:8px;padding:calc(6px + env(safe-area-inset-top)) 9px 7px;background:linear-gradient(115deg,#ffed8a,#ffcc43);border-bottom:1px solid #dca92c}
.logo{color:#ca243d;font-weight:1000;font-size:17px;font-style:italic;letter-spacing:-1.3px;white-space:nowrap}.logo small{display:block;font-style:normal;color:#345278;font-size:7px;letter-spacing:1px;text-align:center}
.heading{flex:1;min-width:0}.heading h1{font-size:14px;line-height:1.15;margin:0;font-weight:900}.heading p{font-size:10px;margin:2px 0 0;font-weight:700;color:#644c23}
.search-trigger{flex:none;display:grid;place-items:center;width:39px;height:37px;border:1px solid #e4a434;border-radius:10px;background:#fff9e2;color:#d21b3c;padding:5px;box-shadow:0 2px 6px #bd8c2d18}
.search-trigger svg{height:22px;width:22px;stroke:currentColor;fill:none;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}
.scene-bar{padding:8px;display:grid;grid-template-columns:36px 1fr 36px;gap:6px;background:var(--soft);border-bottom:1px solid var(--line)}
.arrow{background:#fff0f2;color:#d21e3e;border:2px solid #edacb7;border-radius:10px;font-size:29px;font-weight:1000;line-height:1;display:grid;place-items:center}.arrow:active{background:#d21e3e;color:#fff}
.current{display:flex;align-items:center;justify-content:center;text-align:left;gap:10px;min-width:0;background:#fff;border:1px solid #cbd9eb;padding:6px 8px;border-radius:10px;color:var(--ink)}
.scene-emoji{font-size:27px;flex:none}.current-text{min-width:0;flex:1}.current-text strong{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.current-text small{display:block;font-size:11px;color:#57728f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.current{cursor:default}
.toptabs{display:flex;gap:5px;padding:6px 7px 7px;background:#fff;border-bottom:1px solid var(--line)}.tab{flex:1;min-width:0;border:1px solid #d8e4f1;border-radius:9px;background:#f3f7fc;padding:7px 2px;font-size:11px;font-weight:900;color:#425e80}.tab.active{background:var(--blue);border-color:var(--blue);color:#fff}
.workspace{overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#bacdea transparent;padding:9px 8px 14px;background:linear-gradient(#fbfdff,#f0f6fe)}
.hint{font-size:11px;color:#64809b;font-weight:700;margin:1px 3px 8px;display:flex;gap:6px;justify-content:space-between;align-items:center}.hint b{color:#275b9b}.option-label{display:flex;align-items:center;gap:5px;white-space:nowrap}
.line{position:relative;background:#fff;border:1px solid #dde7f4;border-radius:11px;padding:9px 8px;margin:0 0 7px;box-shadow:0 2px 6px #1c4c8208;border-left:4px solid #3379c7;transition:background .15s,border-color .15s}.line.speakerB{border-left-color:#d9793e;background:#fffcf9}.line.active{outline:2px solid #e4334d;outline-offset:-2px;background:#fff5f7}.linehead{display:flex;align-items:center;gap:5px;margin:0 0 5px}.speaker{font-weight:900;font-size:10px;text-transform:uppercase;letter-spacing:.2px;color:#2b66ae}.speakerB .speaker{color:#af5c24}.counter{font-size:10px;color:#8c9db0;margin-left:auto}
.words{font-size:14px;line-height:1.34;font-weight:750;color:#173655;word-wrap:break-word}.translation{margin-top:4px;color:#7a6269;font-size:11.5px;line-height:1.3}.lineactions{display:flex;gap:6px;justify-content:flex-end;margin-top:7px}
.mini{border:1px solid #d2e1f3;border-radius:8px;background:#ecf4ff;color:#174f97;min-width:43px;height:29px;padding:0 9px;font-size:12px;font-weight:850}.mini.star{background:#fff8e4;border-color:#efd999;color:#715c16}.mini.star.saved{background:#ffe08b;color:#664400}.mini.reveal{color:#ba3450;background:#fff2f5}
.hidden-answer .words,.hidden-answer .translation{display:none}
.empty{margin:25px auto;text-align:center;color:#526b88;padding:16px}.empty strong{display:block;margin-bottom:8px}
footer{z-index:2;padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #cfdeef;box-shadow:0 -6px 16px #22467410}
.actions{display:grid;grid-template-columns:1.5fr 1fr .75fr .85fr;gap:5px}.ctrl{border:1px solid #c5d8ee;color:#1e508c;border-radius:9px;background:#eef5ff;min-height:39px;padding:6px 3px;font-size:11px;font-weight:900}.ctrl.main{background:#168557;color:#fff;border-color:#168557}.ctrl.danger{color:#b32d46;background:#fff1f3;border-color:#f0b8c2}
.status{font-size:10px;line-height:1.2;color:#697e97;margin:5px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.overlay{position:absolute;z-index:10;inset:0;background:#122b48a8;display:flex;justify-content:center;align-items:flex-end;padding:12px 8px calc(12px + env(safe-area-inset-bottom))}
.overlay[hidden]{display:none}.sheet{background:#fff;border-radius:18px 18px 10px 10px;width:100%;height:min(80dvh,700px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 38px #0a193b3d}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:12px 13px 7px}.sheet-head strong{font-size:15px}.close{border:0;border-radius:8px;background:#eef4ff;color:#184b88;width:34px;height:34px;font-size:24px;font-weight:700}
.search{margin:2px 11px 10px;padding:10px 12px;border:1px solid #becfe3;border-radius:10px;outline:none;background:#f8fbff;color:#173857;font-size:15px}
.scene-list{min-height:0;overflow-y:auto;padding:0 10px 10px;overscroll-behavior:contain}
.scene-item{width:100%;display:flex;align-items:center;gap:10px;border:1px solid #e1e9f3;background:#fff;padding:9px;margin:0 0 5px;border-radius:10px;text-align:left;color:#193b5e;font-size:13px}.scene-item.now{background:#eaf4ff;border-color:#7ca9e3}.scene-item .em{font-size:23px}.scene-item span:nth-child(2){flex:1}.scene-item small{display:block;color:#6b829f;font-size:10px;margin-top:2px}.num-chip{color:#4875a8;font-weight:800;font-size:11px}
@media(min-width:600px){.app{height:min(95dvh,950px);margin:auto;border-radius:18px;box-shadow:0 18px 70px #122b4860}.words{font-size:15.5px}.translation{font-size:12.5px}.line{padding:11px}.current-text strong{font-size:16px}}
@media(max-height:560px){.scene-bar{padding:4px}.current{padding:3px}.scene-emoji{font-size:19px}.toptabs{padding:4px}.tab{padding:5px}.line{padding:6px}.lineactions{margin-top:4px}.actions .ctrl{min-height:33px}header{padding-top:3px;padding-bottom:3px}}
</style>
<style>
.app{grid-template-rows:auto auto auto auto minmax(0,1fr) auto}
.plus-bar{display:flex;gap:6px;padding:5px 8px;background:#fff7da;border-bottom:1px solid #e9d18a;align-items:center}
.plus-open{background:#175b9d;border:0;color:#fff;border-radius:10px;min-height:35px;font-size:12px;font-weight:900;flex:1}

.plus-overlay.on{display:flex}
.plus-head{background:linear-gradient(115deg,#ffed8a,#ffce48);padding:calc(10px + env(safe-area-inset-top)) 10px 10px;display:flex;gap:8px;align-items:center}
.plus-back{border:1px solid #d8a83a;border-radius:9px;background:white;color:#ad2440;font-size:21px;font-weight:900;width:40px;height:38px}
.plus-title{font-weight:950;color:#173e69;font-size:15px;flex:1}
.plus-body{flex:1;overflow:auto;padding:12px 11px 22px;overscroll-behavior:contain}
.plus-sub{font-size:12px;color:#536f8e;margin:2px 0 13px}
.plus-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.plus-card{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:104px;gap:7px;border-radius:14px;background:white;border:1px solid #d1deef;box-shadow:0 2px 9px #132c5111;color:#214c81;font-size:13px;font-weight:900;padding:10px;text-align:center}
.plus-card .ico{font-size:28px}.plus-card small{font-weight:600;font-size:10px;color:#647d98}
.plus-question{background:#fff;border:1px solid #d8e5f4;border-left:4px solid #2c70c4;border-radius:13px;padding:14px;margin-bottom:10px;font-size:18px;font-weight:850;line-height:1.4;overflow-wrap:anywhere}
.plus-trans{font-size:13px;color:#775f6b;margin-top:9px;font-weight:600}
.plus-info{background:#eaf3ff;border-radius:10px;padding:9px 11px;color:#305d8e;font-size:12px;margin-bottom:12px}
.plus-actions{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
.plus-btn{border:1px solid #bad0e8;color:#174d87;background:#fff;padding:10px 12px;border-radius:10px;font-weight:850;font-size:13px;flex:1;min-height:43px}
.plus-btn.primary{background:#158358;border-color:#158358;color:#fff}
.plus-btn.gold{background:#ffdf81;border-color:#ebc460;color:#6a460c}
.plus-btn.warn{background:#fff0f1;color:#a32e48;border-color:#f0c7cd}
.plus-count{font-size:12px;font-weight:800;color:#526e8b;margin-bottom:7px}
.plus-select{display:block;width:100%;border:1px solid #bad0e8;padding:10px;border-radius:9px;background:white;font-size:14px;margin-bottom:10px}
.plus-answer{background:#eaf7ed;color:#126340;border:1px solid #a9dab6;border-radius:11px;padding:13px;font-weight:900;font-size:16px;line-height:1.5;margin:9px 0}
.plus-choice{display:block;width:100%;text-align:left;margin:7px 0;padding:11px;border-radius:10px;border:1px solid #cbd9ec;background:white;color:#173e70;font-size:14px;font-weight:750}
.plus-choice.ok{background:#e4f8e9;border-color:#37a666}.plus-choice.bad{background:#fff0f0;border-color:#cd6262}
.plus-progress{height:7px;background:#e1e9f2;border-radius:20px;overflow:hidden;margin:9px 0 15px}
.plus-progress div{height:100%;background:#168357;transition:width .2s}
.plus-listrow{padding:9px 8px;border-bottom:1px solid #e0e9f5;display:flex;gap:8px;align-items:center;background:white}
.plus-listrow span{flex:1;font-size:12px;font-weight:700}
.plus-muted{font-size:12px;color:#65809e}
@media(min-width:600px){.plus-overlay{border-radius:18px}.plus-body{padding:18px 20px}}
</style>
</head>
<body>
<div class="app" id="app">
<header><div class="logo">DE-MAX<small>TUTIN</small></div><div class="heading"><h1>ÖSD A1 · Dijalozi</h1><p>40 situacija · razgovor • slušanje • prevod</p></div><button class="search-trigger" type="button" id="openSearch" title="Pretraži 40 situacija i rečenice" aria-label="Otvori pretragu"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.9"/><path d="m16.1 16.1 5 5"/></svg></button></header>
<div class="scene-bar">
<button class="arrow" type="button" id="prev" aria-label="Prethodna situacija">‹</button>
<div class="current" id="choose" aria-live="polite"><span class="scene-emoji" id="emo"></span><span class="current-text"><strong id="sceneName"></strong><small id="sceneMeta"></small></span></div>
<button class="arrow" type="button" id="next" aria-label="Sledeća situacija">›</button>
</div>
<div class="toptabs" role="tablist" aria-label="Način vežbanja"><button class="tab active" id="tab-dialog" type="button">💬 Dijalog</button><button class="tab" id="tab-extra" type="button">＋ Dodatne</button><button class="tab" id="tab-mine" type="button">★ Moj dijalog</button><button class="tab" id="tab-practice" type="button">🎯 Vežbaj</button></div>

<div class="plus-bar"><button class="plus-open" id="plusOpen" type="button">📚 Dodatno vežbanje · 7 načina</button><span class="plus-tip">A1 · 40 dijaloga</span></div><div class="workspace" id="workspace" tabindex="0" aria-label="Rečenice dijaloga"><div id="lines"></div></div>
<footer><div class="actions"><button type="button" class="ctrl main" id="play">▶ Pusti redom</button><button type="button" class="ctrl" id="pause">⏸ Pauza</button><button type="button" class="ctrl danger" id="stop">■ Stop</button><button type="button" class="ctrl" id="speed">1,0×</button></div><div class="status" id="status" role="status">Izaberi situaciju i pokreni slušanje.</div></footer>
<div class="overlay" id="overlay" hidden><div class="sheet" role="dialog" aria-label="Izbor situacije" aria-modal="true"><div class="sheet-head"><strong>Pretraga · ÖSD A1 (40 situacija)</strong><button class="close" type="button" id="close" aria-label="Zatvori">×</button></div><input id="search" class="search" placeholder="Pretraži situacije i rečenice…" type="search" autocomplete="off"><div class="scene-list" id="sceneList"></div></div></div>

<div class="plus-overlay" id="plusOverlay" aria-label="Dodatno vežbanje">
<div class="plus-head"><button class="plus-back" id="plusBack" aria-label="Nazad" type="button">‹</button><div class="plus-title" id="plusTitle">Dodatno vežbanje</div><button class="plus-back" id="plusClose" type="button" aria-label="Zatvori">×</button></div>
<div class="plus-body" id="plusBody"></div></div></div>

<script src="DE_MAX_A1_DIJALOZI_40_DATA_02.js?v=recepcija-39-v2"></script>
<script src="DE_MAX_A1_DIJALOZI_DODATNE_01.js?v=20261018b"></script>
<script src="DE_MAX_A1_DIJALOZI_DODATNE_02.js?v=recepcija-39-v2"></script>
<script>
"use strict";
(function(){
const scenes=(window.DEMAX_SCENES||[]).slice().sort((a,b)=>a.n-b.n);
const $=id=>document.getElementById(id), escape=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const synth=window.speechSynthesis||null;
const rates=[0.82,1,1.13],labels=["Sporo","1,0×","Brže"];
let speedIndex=1,sceneIndex=0,tab="dialog",current=-1,playing=false,paused=false,epoch=0,showTranslations=true,revealed=new Set(),saved={},activeRows=[],listener=null;
try{saved=JSON.parse(localStorage.getItem("demax-a1-40-saved")||"{}")||{}}catch(e){saved={}}
function save(){try{localStorage.setItem("demax-a1-40-saved",JSON.stringify(saved))}catch(e){}}
function scene(){return scenes[sceneIndex]}
function key(p){return p[0]+"\u0001"+p[1]}
function chosen(){return saved[scene().n]||[]}
function viewRows(){if(tab==="extra")return scene().extra.map((p,i)=>({p,i,from:"extra"}));if(tab==="mine")return chosen().map((p,i)=>({p,i,from:"mine"}));return scene().dialog.map((p,i)=>({p,i,from:"dialog"}))}
function setStatus(t){$("status").textContent=t}
function voice(){
 const vs=synth?.getVoices()||[],de=vs.filter(v=>(v.lang||"").toLowerCase().startsWith("de"));
 return de.find(v=>/google deutsch/i.test(v.name))||de.find(v=>/natural|premium|enhanced/i.test(v.name))||de.find(v=>(v.lang||"").toLowerCase()==="de-de")||de[0]||null;
}
function stop(){
 epoch++;playing=false;paused=false;current=-1;
 if(synth){synth.cancel()}
 $("pause").textContent="⏸ Pauza";$("play").textContent="▶ Pusti redom";
 document.querySelectorAll(".line.active").forEach(x=>x.classList.remove("active"));
}
function highlight(i){
 document.querySelectorAll(".line.active").forEach(x=>x.classList.remove("active"));
 current=i;
 const item=$("line"+i);
 if(item){item.classList.add("active");item.scrollIntoView({block:"nearest",behavior:"smooth"})}
}
function speak(i,all=false,session=epoch){
 if(!synth){setStatus("Izgovor nije dostupan u ovom pregledaču.");return}
 if(session!==epoch)return;
 const rows=activeRows;
 if(i>=rows.length){stop();setStatus("Slušanje je završeno.");return}
 const de=rows[i].p[0];
 highlight(i);
 setStatus("Slušanje: "+(i+1)+" / "+rows.length+" · "+de);
 const u=new SpeechSynthesisUtterance(de);
 u.lang="de-DE";u.rate=rates[speedIndex];u.pitch=1;const v=voice();if(v)u.voice=v;
 u.onend=()=>{if(session!==epoch)return;if(all&&playing){window.setTimeout(()=>{if(session===epoch&&!paused)speak(i+1,true,session);else if(session===epoch&&paused)listener=()=>speak(i+1,true,session)},260)}else if(!all){highlight(-1)}};
 u.onerror=()=>{if(session===epoch){stop();setStatus("Izgovor nije uspeo. Dodirni ponovo zvučnik.")}};
 synth.speak(u);
}
function playAll(){
 stop();activeRows=viewRows();if(!activeRows.length){setStatus("Ovde nema izabranih rečenica.");return}
 playing=true;$("play").textContent="▶ Od početka";speak(0,true,epoch)
}
function playSingle(i){stop();activeRows=viewRows();speak(i,false,epoch)}
function render(){
 stop();revealed.clear();
 const s=scene();
 if(!s){$("sceneName").textContent="Nema podataka";setStatus("Dijalozi nisu učitani.");return}
 $("emo").textContent=s.emoji;$("sceneName").textContent=s.n+". "+s.sr;
 $("sceneMeta").textContent=s.de+" · "+s.roles;
 for(const mode of ["dialog","extra","mine","practice"]){$("tab-"+mode).classList.toggle("active",tab===mode)}
 const rows=viewRows();activeRows=rows;
 const isSaved=p=>chosen().some(x=>key(x)===key(p));
 let out='<div class="hint"><span><b>'+rows.length+' rečenica</b> · '+(tab==="practice"?"Dodirni „Prikaži odgovor“":tab==="mine"?"Tvoj izbor":s.roles)+'</span><label class="option-label"><input id="translationToggle" type="checkbox" '+(showTranslations?"checked":"")+'> Prevod</label></div>';
 if(!rows.length)out='<div class="empty"><strong>Još nema izabranih rečenica.</strong>Idi na Dijalog ili Dodatne i dodaj rečenice pomoću dugmeta ★.</div>';
 else rows.forEach(({p,i,from})=>{
  const letter=tab==="extra"?"":(i%2?"B":"A");
  const hide=tab==="practice"&&(i%2===1)&&!revealed.has(i);
  out+='<article class="line '+(letter==="B"?"speakerB ":"")+(hide?"hidden-answer":"")+'" id="line'+i+'"><div class="linehead"><span class="speaker">'+(tab==="extra"?"Dodatna rečenica":tab==="mine"?"Moj izbor":"Osoba "+letter)+'</span><span class="counter">'+(i+1)+' / '+rows.length+'</span></div>';
  if(hide)out+='<div class="words" data-prompt="1" style="display:block;color:#aa6584;font-size:12px">Odgovori naglas na nemačkom, pa prikaži odgovor.</div>';
  out+='<div class="words">'+escape(p[0])+'</div>'+(showTranslations?'<div class="translation">'+escape(p[1])+'</div>':'');
  out+='<div class="lineactions">'+(hide?'<button class="mini reveal" data-reveal="'+i+'" type="button">👁 Prikaži</button>':'')+'<button class="mini" data-sound="'+i+'" type="button" title="Poslušaj">🔊</button><button class="mini star '+(isSaved(p)?"saved":"")+'" data-save="'+i+'" type="button" title="Dodaj ili ukloni iz Moj dijalog">'+(isSaved(p)?"★ Dodato":"☆ Dodaj")+'</button></div></article>'
 });
 $("lines").innerHTML=out;$("workspace").scrollTop=0;
 const chk=$("translationToggle");if(chk)chk.onchange=()=>{showTranslations=chk.checked;render()};
 setStatus(s.n+" / 40 · "+s.de+" · "+rows.length+" rečenica");
 try{history.replaceState(null,"",location.pathname+"?s="+s.n)}catch(e){}
}
function setScene(i){sceneIndex=(i+scenes.length)%scenes.length;tab="dialog";closeChoose();render()}
function setTab(t){tab=t;render()}
function saveRow(i){const p=viewRows()[i]?.p;if(!p)return;const arr=chosen().slice(),k=key(p),at=arr.findIndex(x=>key(x)===k);if(at>=0)arr.splice(at,1);else arr.push(p);saved[scene().n]=arr;save();let mode=tab;render();setStatus(at>=0?"Rečenica uklonjena iz Moj dijalog.":"Rečenica dodata u Moj dijalog.")}
function sceneSelector(){
 const q=$("search").value.toLocaleLowerCase("sr").trim();
 const selected=scenes.filter(s=>!q||[s.sr,s.de,s.roles,...s.dialog.flat(),...s.extra.flat()].join(" ").toLocaleLowerCase("sr").includes(q));
 $("sceneList").innerHTML=selected.map(s=>'<button type="button" class="scene-item '+(s.n===scene().n?"now":"")+'" data-scene="'+s.n+'"><span class="em">'+escape(s.emoji)+'</span><span><b>'+escape(s.sr)+'</b><small>'+escape(s.de)+'</small></span><span class="num-chip">'+s.n+' / 40</span></button>').join("")||'<p class="empty">Nema rezultata pretrage.</p>'
}
function openChoose(){$("overlay").hidden=false;$("search").value="";sceneSelector();$("search").focus()}
function closeChoose(){$("overlay").hidden=true}
$("openSearch").onclick=openChoose;$("close").onclick=closeChoose;
$("overlay").addEventListener("click",e=>{if(e.target===$("overlay"))closeChoose()});
$("search").addEventListener("input",sceneSelector);
$("sceneList").addEventListener("click",e=>{const b=e.target.closest("[data-scene]");if(b)setScene(Number(b.dataset.scene)-1)});
$("prev").onclick=()=>setScene(sceneIndex-1);$("next").onclick=()=>setScene(sceneIndex+1);
for(const mode of ["dialog","extra","mine","practice"]) $("tab-"+mode).onclick=()=>setTab(mode);
$("lines").addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.sound!==undefined)playSingle(Number(b.dataset.sound));
 else if(b.dataset.save!==undefined)saveRow(Number(b.dataset.save));
 else if(b.dataset.reveal!==undefined){revealed.add(Number(b.dataset.reveal));let div=$("line"+b.dataset.reveal);div?.classList.remove("hidden-answer");div?.querySelector("[data-prompt]")?.remove();b.remove()}
});
$("play").onclick=playAll;
$("stop").onclick=()=>{stop();setStatus("Slušanje je zaustavljeno.")};
$("pause").onclick=()=>{
 if(!synth)return;
 if(!playing){setStatus("Prvo dodirni „Pusti redom“.");return}
 if(!paused){synth.pause();paused=true;$("pause").textContent="▶ Nastavi";setStatus("Pauzirano.");}
 else{paused=false;synth.resume();$("pause").textContent="⏸ Pauza";setStatus("Slušanje se nastavlja.");if(listener){let fn=listener;listener=null;fn()}}
};
$("speed").onclick=()=>{speedIndex=(speedIndex+1)%rates.length;$("speed").textContent=labels[speedIndex];setStatus("Brzina izgovora: "+labels[speedIndex])};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(!$("overlay").hidden)closeChoose();else stop()}});
if(synth){synth.getVoices();synth.addEventListener?.("voiceschanged",()=>synth.getVoices())}
const start=Number(new URLSearchParams(location.search).get("s"));if(Number.isInteger(start)&&start>=1&&start<=scenes.length)sceneIndex=start-1;
render();
})();
</script>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const scenes=(window.DEMAX_SCENES||[]).slice().sort((a,b)=>a.n-b.n);
const modes=[["repeat","🔊","Slušaj i ponovi","Audio, pauza i ponavljanje"],["translate","🌐","Prevedi sam","Srpski → nemački"],["fill","✍️","Dopuni rečenicu","Pronađi reč koja nedostaje"],["swap","🔄","Menjaj reči","Vežbaj više odgovora"],["role","👥","Osoba A ili B","Uvežbavaj jednu ulogu"],["hard","⭐","Teške rečenice","Sačuvaj i ponavljaj"],["review","🎲","Mini-ponavljanje","Pet slučajnih rečenica"]];
let mode="",idx=0,role="B",revealed=false,help=0,selected="",run=0,pauseId=0,repeatN=0,hard={};
try{hard=JSON.parse(localStorage.getItem("demax-a1-plus-hard")||"{}")||{}}catch(e){hard={}}
const save=()=>{try{localStorage.setItem("demax-a1-plus-hard",JSON.stringify(hard))}catch(e){}};
function currentScene(){const p=Number(new URLSearchParams(location.search).get("s"))||1;return scenes.find(s=>s.n===p)||scenes[0]}
function pairs(){return currentScene()?.dialog||[]}
function k(p){return p[0]+"\u0001"+p[1]}
function hardRows(){return scenes.flatMap(s=>s.dialog.filter(p=>hard[k(p)]).map(p=>({p,s})))}
function rows(){if(mode==="hard")return hardRows().map(x=>x.p);if(mode==="review"){let rs=pairs().slice();return rs.sort((a,b)=>hash(k(a)+run)-hash(k(b)+run)).slice(0,5)}return pairs()}
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(Math.imul(31,h)+s.charCodeAt(i))|0;return h}
function stopAudio(){pauseId++;if(window.speechSynthesis)window.speechSynthesis.cancel()}
function speak(t,onEnd){stopAudio();const id=pauseId;if(!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(t);u.lang="de-DE";u.rate=Number(localStorage.getItem("demax-a1-plus-rate")||"0.85");let vs=speechSynthesis.getVoices().filter(x=>x.lang.toLowerCase().startsWith("de"));if(vs.length)u.voice=vs.find(x=>/google|natural/i.test(x.name))||vs[0];u.onend=()=>{if(id===pauseId)onEnd?.()};speechSynthesis.speak(u)}
function area(s){$("plusBody").innerHTML=s}
function nav(){stopAudio();mode="";idx=0;revealed=false;const s=currentScene();$("plusTitle").textContent="Dodatno vežbanje";
area('<div class="plus-info">📖 '+esc(s?.n)+'. '+esc(s?.sr)+' · '+pairs().length+' rečenica<br>Uči svojim tempom, bez bodova i ocenjivanja.</div><div class="plus-grid">'+modes.map(([id,ic,t,d])=>'<button type="button" class="plus-card" data-mode="'+id+'"><span class="ico">'+ic+'</span>'+t+'<small>'+d+'</small></button>').join("")+'</div><p class="plus-muted" style="margin-top:15px">Savet: prvo slušaj, zatim prevodi sam, pa vežbaj ulogu A ili B. Teške rečenice sačuvaj za kasnije.</p>');
}
function iconHard(p){return '<button type="button" class="plus-btn gold" data-action="hard">'+(hard[k(p)]?"★ Ukloni iz teških":"☆ Sačuvaj kao tešku")+'</button>'}
function progress(rs){return '<div class="plus-count">'+(rs.length?idx+1:0)+' / '+rs.length+' rečenica</div><div class="plus-progress"><div style="width:'+(rs.length?100*(idx+1)/rs.length:0)+'%"></div></div>'}
function controls(rs){return '<div class="plus-actions"><button type="button" class="plus-btn" data-action="prev">❮ Prethodna</button><button type="button" class="plus-btn primary" data-action="next">Sledeća ❯</button></div>'}
function tts(p){return '<div class="plus-actions"><button type="button" class="plus-btn" data-action="speak">🔊 Poslušaj</button><button type="button" class="plus-btn" data-action="slow">🐢 Sporije / normalno</button></div>'}
function repeatLoop(p){let id=pauseId;repeatN++;speak(p[0],()=>{if(id!==pauseId-1)return; if(repeatN<3){let next=pauseId;setTimeout(()=>{if(next===pauseId)repeatLoop(p)},5000)}else{$("plusMessage")&&($("plusMessage").textContent="Završena su 3 ponavljanja.")}})}
function fillData(p){const txt=p[0];const tokens=txt.match(/[\p{L}ÄÖÜäöüß]+/gu)||[];const choices=tokens.filter(x=>x.length>=4&&!/^(bitte|hallo)$/i.test(x));const word=(choices[Math.floor(choices.length/2)]||tokens[Math.floor(tokens.length/2)]||"");const start=txt.indexOf(word);return {word,masked:start<0?txt:txt.slice(0,start)+"________"+txt.slice(start+word.length)}}
function swapExamples(p){const de=p[0],sr=p[1];let options=[];
const rules=[[/\b(einen Kaffee|einen Tee|ein Wasser|einen Saft)\b/i,["einen Kaffee","einen Tee","ein Wasser","einen Saft"]],[/\b(Montag|Dienstag|Mittwoch|Donnerstag|Freitag|Samstag|Sonntag)\b/i,["Montag","Dienstag","Mittwoch","Freitag","Samstag"]],[/\b(heute|morgen|übermorgen)\b/i,["heute","morgen","übermorgen"]],[/\b(um \d{1,2}(?::\d{2})? Uhr)\b/i,["um 9 Uhr","um 10 Uhr","um 15 Uhr"]],[/\b(mit dem Bus|mit dem Zug|mit dem Auto)\b/i,["mit dem Bus","mit dem Zug","mit dem Auto"]],[/\b(klein|groß|schön|teuer|billig)\b/i,["klein","groß","schön","teuer","billig"]]];
for(const [re,vals] of rules){const m=de.match(re);if(m){options=vals.filter(v=>v.toLowerCase()!==m[0].toLowerCase()).slice(0,3).map(v=>de.slice(0,m.index)+v+de.slice(m.index+m[0].length));break}}
return options}
function draw(){
stopAudio();let rs=rows();if(idx>=rs.length)idx=0;if(idx<0)idx=rs.length-1;let p=rs[idx];
$("plusTitle").textContent=(modes.find(x=>x[0]===mode)||[])[2]||"Vežbanje";
if(!p){area('<div class="plus-info">Još nema sačuvanih teških rečenica. U bilo kojoj vežbi pritisni ☆ da dodaš rečenicu.</div><button class="plus-btn primary" data-action="home">Nazad na vežbe</button>');return}
let html=progress(rs);
if(mode==="repeat"){
html+='<div class="plus-info">Dodirni „Ponovi 3 puta“ i slušaj istu rečenicu sa pauzom od 5 sekundi. Za vreme pauze je izgovori naglas.</div><div class="plus-question">'+esc(p[0])+'<div class="plus-trans">'+esc(p[1])+'</div></div><div class="plus-actions"><button class="plus-btn primary" data-action="repeat">▶ Ponovi 3 puta</button><button class="plus-btn warn" data-action="stop">■ Stop</button></div><p class="plus-muted" id="plusMessage">Uči bez žurbe. Po potrebi ponovi više puta.</p>';
}else if(mode==="translate"||mode==="review"){
html+='<div class="plus-info">Pročitaj srpsku rečenicu i pokušaj da je kažeš na nemačkom pre otkrivanja.</div><div class="plus-question">'+esc(p[1])+'</div>'+(revealed?'<div class="plus-answer">'+esc(p[0])+'</div>':'<div class="plus-info">'+(help?esc(p[0].split(" ").slice(0,help).join(" "))+" …":"Nemački odgovor je sakriven.")+'</div>')+'<div class="plus-actions"><button class="plus-btn" data-action="hint">💡 Pomoć</button><button class="plus-btn primary" data-action="reveal">👁 Prikaži odgovor</button></div>';
}else if(mode==="fill"){
let q=fillData(p);let choices=[q.word,...(pairs().flatMap(x=>(x[0].match(/[\p{L}ÄÖÜäöüß]{4,}/gu)||[])).filter(w=>w.toLowerCase()!==q.word.toLowerCase()).filter(w=>w[0]===q.word[0]).slice(0,3))];choices=[...new Set(choices)].slice(0,4);if(choices.length<3)choices=[q.word,"wohnen","kommen","machen"].filter((x,i,a)=>a.indexOf(x)===i).slice(0,4);choices.sort((a,b)=>hash(a+idx)-hash(b+idx));
html+='<div class="plus-info">Odaberi reč koja nedostaje u rečenici.</div><div class="plus-question">'+esc(q.masked)+'</div>'+choices.map(v=>'<button class="plus-choice '+(selected===v?(v===q.word?"ok":"bad"):"")+'" data-choice="'+esc(v)+'">'+esc(v)+'</button>').join("")+(selected?'<div class="'+(selected===q.word?"plus-answer":"plus-info")+'">'+(selected===q.word?"✓ Tačno! ":"Pokušaj ponovo. ")+(selected===q.word?esc(p[0]):"")+'</div>':'')+'<div class="plus-trans">'+esc(p[1])+'</div>';
}else if(mode==="swap"){
let ex=swapExamples(p);
html+='<div class="plus-info">Izgovori osnovnu rečenicu, pa promeni jednu reč ili izraz. Na taj način vežbaš više odgovora.</div><div class="plus-question">'+esc(p[0])+'<div class="plus-trans">'+esc(p[1])+'</div></div>'+(ex.length?ex.map((v,i)=>'<button class="plus-choice" data-say="'+esc(v)+'">'+(i+1)+'. '+esc(v)+' 🔊</button>').join(""):'<div class="plus-info">Za ovu rečenicu nema unapred pripremljene sigurne zamene. Vežbaj izgovor i pređi na sledeću.</div>');
}else if(mode==="role"){
let filtered=pairs().map((v,i)=>({p:v,i})).filter(x=>(x.i%2===0?"A":"B")===role);let pos=filtered[idx%filtered.length];if(!pos){area('<div class="plus-info">Nema rečenica za ovu ulogu.</div>');return}p=pos.p;
html='<label for="plusRole" class="plus-count">Izaberi svoju ulogu:</label><select class="plus-select" id="plusRole"><option '+(role==="A"?"selected":"")+' value="A">Osoba A</option><option '+(role==="B"?"selected":"")+' value="B">Osoba B</option></select>'+progress(filtered.map(x=>x.p))+'<div class="plus-info">Pročitaj ili poslušaj drugu osobu, pa odgovori svojom rečenicom. Zatim proveri odgovor.</div>';
const prev=pairs()[Math.max(0,pos.i-1)];
html+='<div class="plus-question"><small>Druga osoba:</small><div>'+esc(role==="B"?prev[0]:"Tvoj red da započneš razgovor.")+'</div></div>'+(revealed?'<div class="plus-answer">'+esc(p[0])+'<div class="plus-trans">'+esc(p[1])+'</div></div>':'<div class="plus-info">Tvoja rečenica je sakrivena. Pokušaj da je izgovoriš.</div>')+'<button class="plus-btn primary" data-action="reveal">👁 Prikaži moju rečenicu</button>';
}else if(mode==="hard"){
html+='<div class="plus-info">Ovo su rečenice koje želiš dodatno da ponavljaš. Sačuvane su na ovom uređaju.</div><div class="plus-question">'+esc(p[0])+'<div class="plus-trans">'+esc(p[1])+'</div></div>';
}
html+=tts(p)+iconHard(p)+controls(rs);
area(html);
}
function next(n){revealed=false;help=0;selected="";idx+=n;draw()}
function toggleHard(){let p;if(mode==="role"){const f=pairs().filter((x,i)=>(i%2===0?"A":"B")===role);p=f[idx%f.length]}else p=rows()[idx];if(!p)return;hard[k(p)]?delete hard[k(p)]:hard[k(p)]=true;save();draw()}
$("plusOpen").onclick=()=>{$("plusOverlay").classList.add("on");nav()};
$("plusClose").onclick=()=>{stopAudio();$("plusOverlay").classList.remove("on")};
$("plusBack").onclick=()=>{if(mode)nav();else $("plusClose").click()};
$("plusBody").onclick=e=>{
const b=e.target.closest("button");if(!b)return;
if(b.dataset.mode){mode=b.dataset.mode;idx=0;run++;revealed=false;help=0;selected="";draw();return}
const act=b.dataset.action;
if(b.dataset.choice!==undefined){selected=b.dataset.choice;draw();return}
if(b.dataset.say!==undefined){speak(b.dataset.say);return}
if(act==="home"){nav();return}
if(act==="next"){next(1);return}
if(act==="prev"){next(-1);return}
if(act==="hard"){toggleHard();return}
if(act==="hint"){help=Math.min(help+1,3);draw();return}
if(act==="reveal"){revealed=true;draw();return}
if(act==="stop"){stopAudio();return}
let p=mode==="role"?pairs().filter((x,i)=>(i%2===0?"A":"B")===role)[idx%pairs().filter((x,i)=>(i%2===0?"A":"B")===role).length]:rows()[idx];
if(!p)return;
if(act==="speak"){speak(p[0]);return}
if(act==="slow"){const old=Number(localStorage.getItem("demax-a1-plus-rate")||"0.85"),r=old===0.7?1:old===1?0.85:0.7;localStorage.setItem("demax-a1-plus-rate",String(r));speak(p[0]);return}
if(act==="repeat"){repeatN=0;repeatLoop(p);return}
};
$("plusBody").onchange=e=>{if(e.target.id==="plusRole"){role=e.target.value;idx=0;draw()}};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("plusOverlay").classList.contains("on")){$("plusClose").click()}});
})();
</script></body>
</html>
