<!doctype html>

<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1b3151;background:#f2f6fc;font-synthesis:none}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0}
.container{max-width:780px;margin:0 auto;padding:16px 12px 40px}
header{background:linear-gradient(130deg,#0b4995,#1576d7);color:#fff;border-radius:22px;padding:24px 19px 21px;box-shadow:0 10px 27px #0e5ea525}

button.primary{background:#1364bd;color:white;border-color:#1364bd}button.primary:hover{background:#0d509e}

.status{flex:1;font-size:13px;line-height:1.55;color:#395777;margin:0}

.jump{display:flex;align-items:center;gap:9px;margin:0 2px 17px}.jump label{font-size:13px;font-weight:800;color:#244e7d}.jump select{flex:1;min-width:0;max-width:none}
section{border:1px solid #dce7f3;background:white;border-radius:18px;margin:13px 0;padding:17px 15px 15px;box-shadow:0 4px 14px #0b37650c;scroll-margin-top:10px}
h2{font-size:18px;margin:0 0 10px;color:#1052a1;line-height:1.3}
.sentence{font-size:16.7px;line-height:1.55;margin:0 0 6px;border-radius:9px;padding:7px 8px;border:2px solid transparent;transition:background .12s,border-color .12s}.sentence-line{display:flex;align-items:center;justify-content:space-between;gap:10px}.sentence-line .de{flex:1;min-width:0}.speaker-btn{flex:0 0 42px;display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;min-height:42px;border:1px solid #bfd6f0;border-radius:12px;padding:0;background:#e9f3ff;color:#125baa;font-size:21px;line-height:1}.speaker-btn:hover{background:#d7eafe}.speaker-btn:active{background:#bddbfb;transform:scale(.96)}.sentence.active .speaker-btn{background:#fff;color:#bd412b;border-color:#f2ad9e}
.sentence.active{background:#fff4ee;border-color:#e94c39}
.de{display:block;font-weight:600;color:#213650}.translation{display:block;font-size:13px;font-weight:500;line-height:1.55;color:#b42643;margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.actions button{font-size:13.5px;padding:10px 12px;min-height:42px}
.footer{text-align:center;color:#60788f;font-size:12px;margin:23px 0 6px}
@media (max-width:450px){.container{padding:10px 9px 27px}header{border-radius:18px;padding:21px 16px}section{padding:14px 12px;border-radius:15px}.sentence{font-size:16.3px;padding:6px}.translation{font-size:12.6px}.controls{gap:7px}.controls select{min-width:0;flex:1}.actions button{flex:1}h2{font-size:17.5px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head><body>
<main class="container">
<header><span class="chip">DE-MAX • A1</span>
<h1>Edina Fakić – nemački izgovor</h1>
<p class="subtitle">Biografija + svih 19 tema • nemačke rečenice sa prevodom • slušaj pojedinačno ili celu temu</p>
<div class="controls"><label for="speed">Brzina:</label>
<select id="speed" aria-label="Brzina izgovora"><option value="0.72">Sporo (0,72×)</option><option value="0.88" selected>Polako (0,88×)</option><option value="1">Normalno (1×)</option><option value="1.12">Brzo (1,12×)</option></select>
<button class="stop" id="stop" type="button">■ Zaustavi</button></div>
</header>
<div class="info"><p class="status" id="status" aria-live="polite">Dodirni nemačku rečenicu ili pritisni „Slušaj celu temu“ za izgovor.</p><span class="counter" id="counter"></span></div>
<div class="jump"><label for="goto">Izaberi temu:</label><select id="goto" aria-label="Pređi na temu"></select></div>
<div id="content"></div>
<p class="footer">DE-MAX • A1 • Izgovor putem govorne funkcije telefona ili računara</p>
</main>
<script>
const topics=[{"title":"Biografie – Edina Fakić","rows":[{"de":"Guten Tag.","sr":"Dobar dan."},{"de":"Ich heiße Edina Fakić.","sr":"Zovem se Edina Fakić."},{"de":"Ich bin 28 Jahre alt.","sr":"Imam 28 godina."},{"de":"Ich bin verheiratet und habe zwei Kinder.","sr":"Udata sam i imam dvoje dece."},{"de":"Ich bin Hausfrau.","sr":"Domaćica sam."},{"de":"Mein Mann heißt Milahudin und ist 30 Jahre alt.","sr":"Moj muž se zove Milahudin i ima 30 godina."},{"de":"Er lebt und arbeitet in Schwenningen in Deutschland.","sr":"On živi i radi u Šveningenu u Nemačkoj."},{"de":"Er arbeitet auf dem Bau.","sr":"On radi u građevinarstvu."},{"de":"Mein Sohn heißt Semir und ist sieben Jahre alt.","sr":"Moj sin se zove Semir i ima sedam godina."},{"de":"Er geht in die erste Klasse.","sr":"On ide u prvi razred."},{"de":"Meine Tochter Senida ist fünf Jahre alt.","sr":"Moja ćerka Senida ima pet godina."},{"de":"Sie geht noch nicht zur Schule.","sr":"Ona još ne ide u školu."}]},{"title":"1. Familie – Porodica","rows":[{"de":"Meine Familie ist nicht sehr groß.","sr":"Moja porodica nije veoma velika."},{"de":"Wir haben zwei Kinder, einen Sohn und eine Tochter.","sr":"Imamo dvoje dece, sina i ćerku."},{"de":"Mein Mann heißt Milahudin.","sr":"Moj muž se zove Milahudin."},{"de":"Er ist 30 Jahre alt und arbeitet in Deutschland.","sr":"On ima 30 godina i radi u Nemačkoj."},{"de":"Unser Sohn Semir ist sieben Jahre alt.","sr":"Naš sin Semir ima sedam godina."},{"de":"Semir geht schon in die erste Klasse.","sr":"Semir već ide u prvi razred."},{"de":"Unsere Tochter Senida ist fünf Jahre alt.","sr":"Naša ćerka Senida ima pet godina."},{"de":"Senida geht noch nicht zur Schule.","sr":"Senida još ne ide u školu."},{"de":"Meine Kinder spielen gern zusammen.","sr":"Moja deca se rado igraju zajedno."},{"de":"Ich liebe meine Familie sehr.","sr":"Mnogo volim svoju porodicu."}]},{"title":"2. Hobbys – Hobiji","rows":[{"de":"Ich koche und backe gern.","sr":"Rado kuvam i pečem kolače."},{"de":"Ich gehe gern mit meinen Kindern spazieren.","sr":"Rado šetam sa svojom decom."},{"de":"Am Wochenende höre ich manchmal Musik.","sr":"Vikendom ponekad slušam muziku."},{"de":"Ich spiele auch gern mit Semir und Senida.","sr":"Rado se igram i sa Semirom i Senidom."}]},{"title":"3. Lieblingsessen – Omiljena hrana","rows":[{"de":"Mein Lieblingsessen ist Pizza.","sr":"Moje omiljeno jelo je pica."},{"de":"Ich esse gern Reis und Hähnchen.","sr":"Rado jedem pirinač i piletinu."},{"de":"Zum Frühstück esse ich Brot mit Käse.","sr":"Za doručak jedem hleb sa sirom."},{"de":"Für meine Kinder koche ich oft etwas Leckeres.","sr":"Za svoju decu često kuvam nešto ukusno."}]},{"title":"4. Lieblingsgetränk – Omiljeno piće","rows":[{"de":"Ich trinke am liebsten Tee.","sr":"Najradije pijem čaj."},{"de":"Am Morgen trinke ich manchmal Kaffee.","sr":"Ujutru ponekad pijem kafu."},{"de":"Ich trinke auch viel Wasser.","sr":"Pijem i mnogo vode."},{"de":"Im Sommer mag ich kalte Getränke.","sr":"Leti volim hladna pića."}]},{"title":"5. Sprachen – Jezici","rows":[{"de":"Ich spreche meine Muttersprache und lerne Deutsch.","sr":"Govorim svoj maternji jezik i učim nemački."},{"de":"Ich übe Deutsch jeden Tag.","sr":"Svakog dana vežbam nemački."},{"de":"Ich lerne neue Wörter und Sätze.","sr":"Učim nove reči i rečenice."},{"de":"Ich möchte gut Deutsch sprechen.","sr":"Želim dobro da govorim nemački."}]},{"title":"6. Freizeit – Slobodno vreme","rows":[{"de":"In meiner Freizeit bin ich gern mit meinen Kindern zusammen.","sr":"U slobodno vreme rado sam sa svojom decom."},{"de":"Ich gehe mit Semir und Senida nach draußen.","sr":"Izlazim napolje sa Semirom i Senidom."},{"de":"Abends telefoniere ich manchmal mit meinem Mann.","sr":"Uveče ponekad razgovaram telefonom sa mužem."},{"de":"Danach sehe ich gern etwas im Fernsehen.","sr":"Posle toga rado nešto gledam na televiziji."}]},{"title":"7. Sport – Sport","rows":[{"de":"Ich mache nicht jeden Tag Sport.","sr":"Ne bavim se sportom svakog dana."},{"de":"Ich gehe aber gern zu Fuß.","sr":"Ali rado idem peške."},{"de":"Manchmal mache ich Übungen zu Hause.","sr":"Ponekad vežbam kod kuće."},{"de":"Meine Kinder spielen gern draußen.","sr":"Moja deca se rado igraju napolju."}]},{"title":"8. Musik – Muzika","rows":[{"de":"Ich höre gern fröhliche Musik.","sr":"Rado slušam veselu muziku."},{"de":"Beim Kochen höre ich manchmal Radio.","sr":"Dok kuvam, ponekad slušam radio."},{"de":"Meine Kinder singen gern mit.","sr":"Moja deca rado pevaju uz muziku."},{"de":"Musik macht gute Laune.","sr":"Muzika popravlja raspoloženje."}]},{"title":"9. Bücher – Knjige","rows":[{"de":"Ich lese gern kurze Geschichten.","sr":"Rado čitam kratke priče."},{"de":"Ich lese meinen Kindern manchmal vor.","sr":"Ponekad čitam svojoj deci naglas."},{"de":"Semir hat Bücher für die Schule.","sr":"Semir ima knjige za školu."},{"de":"Ich lese auch einfache deutsche Texte.","sr":"Čitam i jednostavne nemačke tekstove."}]},{"title":"10. Lieblingskleidung – Omiljena odeća","rows":[{"de":"Ich trage gern bequeme Kleidung.","sr":"Rado nosim udobnu odeću."},{"de":"Zu Hause trage ich oft eine Hose und ein T-Shirt.","sr":"Kod kuće često nosim pantalone i majicu."},{"de":"Im Winter trage ich eine warme Jacke.","sr":"Zimi nosim toplu jaknu."},{"de":"Ich kaufe auch gern Kleidung für meine Kinder.","sr":"Rado kupujem i odeću za svoju decu."}]},{"title":"11. Freunde – Prijatelji","rows":[{"de":"Ich habe gute Freundinnen.","sr":"Imam dobre prijateljice."},{"de":"Wir treffen uns manchmal zum Kaffee.","sr":"Ponekad se sastajemo na kafi."},{"de":"Wir sprechen über unsere Familien.","sr":"Razgovaramo o svojim porodicama."},{"de":"Gute Freundinnen helfen einander.","sr":"Dobre prijateljice pomažu jedna drugoj."}]},{"title":"12. Urlaub – Odmor","rows":[{"de":"Im Urlaub möchte ich mich ausruhen.","sr":"Na odmoru želim da se odmorim."},{"de":"Ich fahre gern mit meiner Familie weg.","sr":"Rado putujem sa svojom porodicom."},{"de":"Meine Kinder spielen gern am Strand.","sr":"Moja deca se rado igraju na plaži."},{"de":"Ich mache im Urlaub gern Fotos.","sr":"Rado fotografišem na odmoru."}]},{"title":"13. Was ich gerne mache – Šta rado radim","rows":[{"de":"Ich backe gern Kuchen.","sr":"Rado pečem kolače."},{"de":"Ich spiele gern mit meiner Tochter Senida.","sr":"Rado se igram sa ćerkom Senidom."},{"de":"Ich helfe meinem Sohn Semir bei den Hausaufgaben.","sr":"Pomažem sinu Semiru oko domaćeg zadatka."},{"de":"Ich lerne auch gern Deutsch.","sr":"Rado učim i nemački."}]},{"title":"14. Arbeit / Beruf / Job – Posao","rows":[{"de":"Ich bin Hausfrau und arbeite zu Hause.","sr":"Domaćica sam i radim kod kuće."},{"de":"Ich koche, putze und räume auf.","sr":"Kuvam, čistim i sređujem."},{"de":"Ich kümmere mich um meine zwei Kinder.","sr":"Brinem o svoje dvoje dece."},{"de":"Mein Mann Milahudin arbeitet auf dem Bau.","sr":"Moj muž Milahudin radi u građevinarstvu."},{"de":"Er wohnt und arbeitet in Schwenningen.","sr":"On stanuje i radi u Šveningenu."}]},{"title":"15. Tiere / Haustiere – Životinje","rows":[{"de":"Ich mag kleine Tiere.","sr":"Volim male životinje."},{"de":"Meine Kinder mögen Hunde und Katzen.","sr":"Moja deca vole pse i mačke."},{"de":"Ich finde Kaninchen sehr süß.","sr":"Zečevi su mi veoma slatki."},{"de":"Manchmal sehen wir Vögel im Park.","sr":"Ponekad gledamo ptice u parku."}]},{"title":"16. Filme – Filmovi","rows":[{"de":"Ich sehe abends gern Filme.","sr":"Uveče rado gledam filmove."},{"de":"Mit meinen Kindern sehe ich manchmal Zeichentrickfilme.","sr":"Sa decom ponekad gledam crtane filmove."},{"de":"Ich mag lustige Familienfilme.","sr":"Volim zabavne porodične filmove."},{"de":"Am Wochenende haben wir mehr Zeit dafür.","sr":"Vikendom imamo više vremena za to."}]},{"title":"17. Lieblingsfarbe – Omiljena boja","rows":[{"de":"Meine Lieblingsfarbe ist Rosa.","sr":"Moja omiljena boja je roze."},{"de":"Ich mag auch Hellblau.","sr":"Volim i svetloplavu."},{"de":"Ich trage gern helle Farben.","sr":"Rado nosim svetle boje."},{"de":"Meine Kinder malen gern mit vielen Farben.","sr":"Moja deca rado crtaju mnogim bojama."}]},{"title":"18. Wohnort / Herkunft – Mesto stanovanja i poreklo","rows":[{"de":"Mein Mann Milahudin lebt in Schwenningen.","sr":"Moj muž Milahudin živi u Šveningenu."},{"de":"Schwenningen liegt in Deutschland.","sr":"Šveningen se nalazi u Nemačkoj."},{"de":"Mein Mann arbeitet dort auf dem Bau.","sr":"Moj muž tamo radi u građevinarstvu."},{"de":"Ich möchte meinen Mann in Deutschland besuchen.","sr":"Želela bih da posetim muža u Nemačkoj."},{"de":"Ich lerne Deutsch für den Alltag.","sr":"Učim nemački za svakodnevni život."}]},{"title":"19. Lieblingslied – Omiljena pesma","rows":[{"de":"Ich höre gern schöne Lieder.","sr":"Rado slušam lepe pesme."},{"de":"Mein Lieblingslied höre ich oft zu Hause.","sr":"Svoju omiljenu pesmu često slušam kod kuće."},{"de":"Manchmal singe ich mit meinen Kindern.","sr":"Ponekad pevam sa svojom decom."},{"de":"Musik macht uns Freude.","sr":"Muzika nas raduje."}]}];
const content=document.getElementById('content');
const statusEl=document.getElementById('status');
const counter=document.getElementById('counter');
const jump=document.getElementById('goto');
counter.textContent='19 tema + biografija • '+topics.reduce((sum,t)=>sum+t.rows.length,0)+' rečenica';
let token=0;
const supported='speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
let preferredVoice=null;
function chooseVoice(){if(!supported)return null;const voices=window.speechSynthesis.getVoices();const german=voices.filter(v=>(v.lang||'').toLowerCase().startsWith('de'));
return german.find(v=>/google|microsoft|anna|katja|deutsch/i.test(v.name))||german[0]||null}
if(supported){preferredVoice=chooseVoice();speechSynthesis.addEventListener?.('voiceschanged',()=>{preferredVoice=chooseVoice()})}
else {statusEl.textContent='Ovaj pregledač ne podržava čitanje naglas. Koristi Chrome, Edge ili Safari sa uključenim zvukom.'}
function clearActive(){document.querySelectorAll('.sentence.active').forEach(el=>el.classList.remove('active'))}
function stop(manual=true){token++;if(supported)window.speechSynthesis.cancel();clearActive();if(manual)statusEl.textContent='Čitanje zaustavljeno.'}
document.getElementById('stop').addEventListener('click',()=>stop(true));
function say(topicIndex,rowIndex,currentToken){return new Promise(resolve=>{
if(!supported||currentToken!==token){resolve();return}
const row=topics[topicIndex].rows[rowIndex];
clearActive();const el=document.getElementById('s-'+topicIndex+'-'+rowIndex);if(el){el.classList.add('active');el.scrollIntoView({block:'nearest',behavior:'smooth'})}
const u=new SpeechSynthesisUtterance(row.de);u.lang='de-DE';u.rate=Number(document.getElementById('speed').value);u.pitch=1;
preferredVoice=chooseVoice();if(preferredVoice)u.voice=preferredVoice;
let settled=false;function finish(){if(!settled){settled=true;resolve()}}
u.onend=finish;u.onerror=finish;
statusEl.textContent='Slušaš: '+topics[topicIndex].title;
window.speechSynthesis.speak(u);
})}
async function play(topicIndex,startIndex,wholeTopic){
if(!supported){statusEl.textContent='Izgovor nije podržan u ovom pregledaču.';return}
stop(false);const currentToken=token;const end=wholeTopic?topics[topicIndex].rows.length:startIndex+1;
for(let i=startIndex;i<end;i++){if(currentToken!==token)return;await say(topicIndex,i,currentToken)}
if(currentToken===token){clearActive();statusEl.textContent='Čitanje završeno. Izaberi rečenicu ili sledeću temu.'}
}
topics.forEach((topic,t)=>{
const opt=document.createElement('option');opt.value='topic-'+t;opt.textContent=topic.title;jump.appendChild(opt);
const sec=document.createElement('section');sec.id='topic-'+t;
const h2=document.createElement('h2');h2.textContent=topic.title;sec.appendChild(h2);
topic.rows.forEach((row,i)=>{
const p=document.createElement('div');p.className='sentence';p.id='s-'+t+'-'+i;
const line=document.createElement('div');line.className='sentence-line';
const de=document.createElement('span');de.className='de';de.textContent=row.de;
const speaker=document.createElement('button');speaker.type='button';speaker.className='speaker-btn';speaker.textContent='🔊';speaker.title='Slušaj nemačku rečenicu';speaker.setAttribute('aria-label','Slušaj nemačku rečenicu: '+row.de);
speaker.addEventListener('click',()=>play(t,i,false));
const sr=document.createElement('span');sr.className='translation';sr.textContent=row.sr;
line.append(de,speaker);p.append(line,sr);sec.appendChild(p);
});
const actions=document.createElement('div');actions.className='actions';
const btn=document.createElement('button');btn.type='button';btn.className='primary';btn.textContent='▶ Slušaj celu temu';btn.addEventListener('click',()=>play(t,0,true));
const again=document.createElement('button');again.type='button';again.className='secondary';again.textContent='↻ Ponovi od početka';again.addEventListener('click',()=>play(t,0,true));
actions.append(btn,again);sec.appendChild(actions);content.appendChild(sec);
});
jump.addEventListener('change',()=>{const target=document.getElementById(jump.value);if(target)target.scrollIntoView({behavior:'smooth',block:'start'})});
</script></body></html>
