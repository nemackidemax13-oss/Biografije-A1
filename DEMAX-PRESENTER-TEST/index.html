<!doctype html>
<html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DE-MAX | Presenter View – test</title><style>
:root{font:16px system-ui,sans-serif;color:#17243a;background:#edf2f8}*{box-sizing:border-box}body{margin:0}header{background:#142940;color:white;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header b{letter-spacing:.06em}main{max-width:1400px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}.card{background:white;border:1px solid #dbe3ee;border-radius:18px;padding:24px;box-shadow:0 4px 20px #10203009}h1,h2,h3,p{margin:0 0 14px}h1{font-size:clamp(24px,4vw,50px)}.meta{color:#52657e;font-size:14px;font-weight:700;letter-spacing:.05em}button,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:12px 18px;background:#1b60b0;color:white;font-weight:700}button:disabled{opacity:.45;cursor:default}.secondary{background:#e5edf7;color:#174778}.danger{background:#a33140}.green{background:#15834f}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.opt{display:block;width:100%;text-align:left;padding:18px 20px;margin:10px 0;background:#f0f5fc;border:2px solid #dbe5f2;color:#152d4a;font-size:clamp(18px,2.6vw,32px)}.opt.good{background:#d7f5e3;border-color:#159455;color:#075b31}.opt.bad{background:#ffe3e3;border-color:#cc3745;color:#8d1424}.opt:disabled{opacity:1}.feedback{font-size:22px;font-weight:800;margin-top:16px}.goodtext{color:#087c44}.badtext{color:#b52b37}.score{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #e0e7ef;padding:12px 0;overflow-wrap:anywhere}.note{background:#fff5d9;color:#744d00;padding:14px;border-radius:10px;margin-bottom:18px}textarea{width:100%;min-height:120px;padding:12px;border:1px solid #aebfd4;border-radius:10px}.audience main{max-width:1200px;min-height:calc(100vh - 58px);display:grid;align-items:center}.audience .card{padding:clamp(20px,5vw,66px)}.audience .opt{cursor:default}.audience .meta{font-size:clamp(16px,2vw,25px)}.audience .score{font-size:clamp(20px,3vw,40px)}.muted{color:#52657e}.timer{font-variant-numeric:tabular-nums}.pill{background:#e2edfa;color:#144d94;padding:8px 12px;border-radius:99px;display:inline-block;margin-bottom:16px;font-weight:700}@media(max-width:800px){.grid{grid-template-columns:1fr}main{padding:10px}.card{padding:18px}}</style></head><body><header><b>DE-MAX TUTIN · A2 QUIZ</b><span id="mode"></span><span id="tools"></span></header><main id="main"></main><script>
"use strict";
const Q=[{q:"Ich warte ___ den Bus.",a:["auf","an","mit"],c:0,n:"warten auf + Akkusativ"},{q:"Wohin stellst du die Lampe?",a:["Neben dem Sofa.","Neben das Sofa.","Neben der Sofa."],c:1,n:"Wohin? → Akkusativ: neben das Sofa."},{q:"Ich bleibe ___ in Berlin.",a:["ein Tag","einem Tag","einen Tag"],c:2,n:"Wie lange? → Akkusativ der Zeit."}];
const params=new URLSearchParams(location.search), audience=params.get("view")==="audience", session=params.get("session")||"demo", key="demax-presenter-v1-"+session;
const fresh=()=>({phase:"setup",names:[],scores:[],i:0,answers:[],started:0});
let s=fresh(),draft="Učenik 1\nUčenik 2",channel=null,storageOK=true,audienceWin=null;
try{const raw=localStorage.getItem(key);if(raw)s=JSON.parse(raw)}catch(e){storageOK=false}
try{channel=new BroadcastChannel(key);channel.onmessage=e=>{if(audience&&e.data?.type==="state"){s=e.data.state;render()}else if(!audience&&e.data?.type==="hello")broadcast()}}catch(e){}
function broadcast(){try{localStorage.setItem(key,JSON.stringify(s))}catch(e){storageOK=false}if(channel)channel.postMessage({type:"state",state:s})}
window.addEventListener("storage",e=>{if(audience&&e.key===key&&e.newValue){try{s=JSON.parse(e.newValue);render()}catch(err){}}});
const esc=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id);
function rank(){return s.names.map((n,i)=>({n,v:s.scores[i]})).sort((a,b)=>b.v-a.v)}
function scores(final=false){let arr=final?rank():s.names.map((n,i)=>({n,v:s.scores[i]}));return arr.map((x,i)=>'<div class="score"><b>'+(final?(1+arr.filter(y=>y.v>x.v).length)+'. ':'')+esc(x.n)+'</b><strong>'+x.v+' bod.</strong></div>').join("")}
function openAudience(){let u=new URL(location.href);u.searchParams.set("view","audience");u.searchParams.set("session",session);audienceWin=window.open(u.href,"DEMAX_AUDIENCE_"+session,"popup,width=1100,height=760");if(!audienceWin)alert("Dozvoli otvaranje prozora u pregledaču.");else{audienceWin.focus();broadcast()}}
function full(){if(document.fullscreenElement){document.exitFullscreen?.()}else{document.documentElement.requestFullscreen?.().catch(()=>{})}}
function start(){let a=$("names").value.split(/\n/).map(x=>x.trim()).filter(Boolean);if(a.length<1||a.length>12){alert("Unesi od 1 do 12 imena, po jedno u svakom redu.");return}if(new Set(a.map(x=>x.toLowerCase())).size!==a.length){alert("Imena moraju biti različita.");return}s={phase:"quiz",names:a,scores:a.map(()=>0),i:0,answers:[],started:Date.now()};update()}
function beep(ok){try{let C=window.AudioContext||window.webkitAudioContext,ctx=new C(),o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=ok?660:260;g.gain.setValueAtTime(.035,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.24);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.25);o.onended=()=>ctx.close()}catch(e){}}
function choose(j){if(audience||s.phase!=="quiz"||s.answers[s.i]!==undefined||!Q[s.i].a[j])return;s.answers[s.i]=j;let ok=j===Q[s.i].c;if(ok)s.scores[s.i%s.names.length]++;beep(ok);update()}
function next(){if(audience||s.phase!=="quiz"||s.answers[s.i]===undefined)return;if(s.i===Q.length-1)s.phase="done";else s.i++;update()}
function prev(){if(!audience&&s.phase==="quiz"&&s.i>0){s.i--;update()}}
function reset(){if(!audience&&confirm("Obrisati bodove i započeti novu vežbu?")){draft=s.names.join("\n")||draft;s=fresh();update()}}
function update(){broadcast();render()}
function render(){const root=$("main");if(s.phase==="setup"){root.innerHTML=audience?'<section class="card"><p class="meta">DE-MAX · NEMAČKI JEZIK</p><h1>Willkommen!</h1><p>Sačekajte da predavač pokrene kviz.</p></section>':'<div class="grid"><section class="card"><p class="meta">PROBNI KVIZ · 3 PITANJA</p><h1>Registracija učenika</h1><p>Unesi do 12 imena (jedno u svakom redu). Za test preporučujemo dva učenika.</p><textarea id="names" maxlength="600">'+esc(draft)+'</textarea><div class="bar"><button class="green" id="start">Pokreni kviz</button></div></section><aside class="card"><h2>Presenter View</h2><p>Otvori ekran za učenike, prebaci ga na drugi monitor ili podeli samo taj prozor. Ti biraš odgovore i vidiš rešenja.</p><p class="muted">Oba prozora moraju biti u istom pregledaču i profilu.</p></aside></div>';if(!audience){$("names").oninput=e=>draft=e.target.value;$("start").onclick=start}return}
if(s.phase==="done"){root.innerHTML='<section class="card"><p class="meta">DE-MAX · REZULTATI</p><h1>Rang-lista</h1>'+scores(true)+(audience?"":'<div class="bar"><button id="restart">Novi kviz</button></div>')+'</section>';if(!audience)$("restart").onclick=reset;return}
const q=Q[s.i],j=s.answers[s.i],answered=j!==undefined,student=s.names[s.i%s.names.length],opts=q.a.map((a,k)=>'<button class="opt '+(answered?(k===q.c?"good":k===j?"bad":""):"")+'" data-answer="'+k+'" '+(audience||answered?"disabled":"")+'>'+String.fromCharCode(65+k)+'. '+esc(a)+'</button>').join(""),feedback=answered?'<div class="feedback '+(j===q.c?"goodtext":"badtext")+'">'+(j===q.c?"✓ Richtig!":"✗ Leider falsch.")+'</div>':"";
const current='<section class="card"><p class="meta">PITANJE '+(s.i+1)+' / '+Q.length+'</p><div class="pill">Na redu: '+esc(student)+'</div><h1>'+esc(q.q)+'</h1>'+opts+feedback+(audience?"":'<div class="bar"><button class="secondary" id="prev" '+(s.i===0?"disabled":"")+'>← Nazad</button><button class="green" id="next" '+(!answered?"disabled":"")+'>'+(s.i===Q.length-1?"Rang-lista":"Sledeće →")+'</button></div>')+'</section>';
root.innerHTML=audience?current:'<div class="grid">'+current+'<aside class="card"><p class="meta">SAMO ZA PREDAVAČA</p><h2>Tačan odgovor</h2><div class="note"><b>'+String.fromCharCode(65+q.c)+'. '+esc(q.a[q.c])+'</b><p style="margin:8px 0 0">'+esc(q.n)+'</p></div><h3>Sledeće pitanje</h3><p>'+esc(Q[s.i+1]?.q||"Rang-lista")+'</p><h3>Bodovi</h3>'+scores()+'<p class="muted" style="margin-top:18px">Tasteri: 1–3 odgovor · → sledeće · ← nazad</p></aside></div>';
if(!audience){root.querySelectorAll("[data-answer]").forEach(b=>b.onclick=()=>choose(Number(b.dataset.answer)));$("next").onclick=next;$("prev").onclick=prev}}
document.body.className=audience?"audience":"presenter";$("mode").textContent=audience?"Ekran za učenike":"Presenter View · predavač";$("tools").innerHTML=audience?'<button class="secondary" id="full">Ceo ekran</button>':'<button id="open">Otvori ekran za učenike ↗</button> <button class="danger" id="reset">Reset</button>';if(audience){$("full").onclick=full;channel?.postMessage({type:"hello"})}else{$("open").onclick=openAudience;$("reset").onclick=reset;document.addEventListener("keydown",e=>{if(e.target.matches("input,textarea,button")||e.repeat)return;if(["1","2","3"].includes(e.key))choose(Number(e.key)-1);if(e.key==="ArrowRight")next();if(e.key==="ArrowLeft")prev()})}render();if(!storageOK&&!channel)alert("Pregledač blokira sinhronizaciju. Otvori oba prozora u običnom režimu.");
</script></body></html>
