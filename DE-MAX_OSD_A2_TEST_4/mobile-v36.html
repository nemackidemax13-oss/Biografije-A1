htige Wohnung zu finden ist oft schwierig. Vieles muss passen, damit man gerne nach Hause kommt. Deshalb ist es wichtig, genau zu wissen, was man will. Wir stellen Ihnen die richtigen Fragen und suchen die besten Wohnungsangebote für Sie. Einfacher geht es nicht. Mehr Informationen finden Sie auf www.traumwohnungen.de."],"story":["Immer öfter setzen sich die Menschen auf ihre Fahrräder, weil ihnen die Kosten für einen Wagen zu hoch sind. Sie fahren mit dem Rad zur Arbeit und unternehmen in der Freizeit Fahrradausflüge. Mit dem Rad kann man aber auch größere Reisen machen. Dafür ist eigentlich nur genug Zeit und ein Fahrrad nötig.","Obwohl das einfach, schnell organisiert und ziemlich billig ist, tun es nur wenige. Barbara aus Wien ist nach ihrem Studium ohne Ziel einfach nach Westen gefahren. Als sie dann in Spanien am Meer war, wollte sie noch weiter. Vier Jahre später und nach einer Reise durch mehrere Kontinente war sie wieder zu Hause.","Auf der Reise hat sie gelernt, ihr Rad zu reparieren, denn Geld hatte sie fast keines. „Die tollen Menschen an den verschiedenen Orten und die vielen neuen Freunde haben durch ihre Hilfe diese Reise erst möglich gemacht“, meint Barbara.","Felix und sein Freund Fynn aus Stuttgart wollten als Jugendliche mit der Schule aufhören und auf Weltreise gehen. Nach dem Abitur und einigen Jahren Arbeit im Sportmanagement konnten sie endlich starten.","Leider wurde Fynn schon nach sechs Wochen krank und musste zurück nach Hause. Felix ist weitergefahren und hat auf seiner einjährigen Reise wunderbare Menschen getroffen, über die er einen Film gemacht hat."],"qs":[["Für eine Reise mit dem Fahrrad","braucht man nur wenig Geld.","interessieren sich viele Leute.","muss man alles genau planen."],["Barbara","hat mit dem Rad eine Weltreise gemacht.","ist 4 Jahre lang durch Spanien gefahren.","möchte zum Studieren ins Ausland fahren."],["Auf ihrer Reise hat Barbara","armen Menschen geholfen.","Fahrradprobleme selbst gelöst.","mit Nebenjobs ihr Geld
