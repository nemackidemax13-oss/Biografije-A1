function sync(){if(popup&&!popup.closed)popup.postMessage({type:'DEMAX6_STATE',n,states,original,asset,available},location.origin)}
function go(i){n=Math.max(0,Math.min(D.length-1,i));original=false;render()}
function normalize(t){return t.toLowerCase().replace(/\s+([,.!?])/g,'$1').replace(/\s+/g,' ').trim()}
function act(str){if(student)return;let [a,x,y]=str.split(':'),i=Number(x),j=Number(y),s=S(),d=D[n];if(a==='jump')return go(i);if(a==='fill'){s.active=i;s.picks[i]=!s.picks[i];if(s.picks[i])beep(true)}if(a==='pick'){s.active=i;s.picks[i]=j;beep(true)}if(a==='match'){s.active=i;s.picks[i]=j;beep(j===d.items[i][1])}if(a==='tile'){s.tiles.push(i);s.checked=null}if(a==='remove'){s.tiles.splice(i,1);s.checked=null}if(a==='undo'){s.tiles.pop();s.checked=null}if(a==='clear'){s.tiles=[];s.checked=null}if(a==='check'){let t=normalize(s.tiles.map(k=>d.words[k]).join(' '));s.checked=[d.answer,d.alt].filter(Boolean).some(v=>normalize(v)===t);beep(s.checked)}render()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(b)act(b.dataset.act)});
$('select').innerHTML=D.map((d,i)=>'<option value="'+i+'">'+(i+1)+'. '+esc(d.title)+'</option>').join('');
$('select').onchange=e=>go(+e.target.value);$('prev').onclick=()=>go(n-1);$('next').onclick=()=>go(n+1);$('keys').onclick=()=>{show=!show;render()};$('side').onclick=()=>{side=!side;render()};$('sound').onclick=()=>{sound=!sound;render()};$('orig').onclick=()=>{if(!has(n)){alert('Originalne slike nisu još učitane. Izaberi Učitaj materijal i označi slike iz ZIP paketa.');return}original=!original;render()};$('reset').onclick=()=>{if(confirm('Pokrenuti prezentaciju ispočetka?')){states={};go(0)}};$('student').onclick=()=>{popup=window.open(location.pathname+'?student=1','DEMAX_A2_6_UCENICI','popup,width=1280,height=720');if(!popup)alert('Dozvoli otvaranje novog prozora.');else setTimeout(sync,700)};
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(student&&e.source===window.opener&&e.data?.type==='DEMAX6_STATE'){({n,states,original,asset,available}=e.data);render()}if(!student&&e.source===popup&&e.data?.type==='DEMAX6_READY')sync()});
document.addEventListener('keydown',e=>{if(student||['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(n-1)}if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(n+1)}});
$('load').onclick=()=>$('files').click();$('files').onchange=e=>{for(const f of e.target.files){let k=f.name.toLowerCase();if(/^slide-\d\d\.jpg$/.test(k)||k==='slusanje.mp3'){let u=URL.createObjectURL(f);localUrls.push(u);asset[k]=u}}render()};
if(student){show=false;window.opener?.postMessage({type:'DEMAX6_READY'},location.origin)}else{for(let i=0;i<D.length;i++){let p=new Image();p.onload=()=>{available[name(i)]=true;if(i===n||i===n+1)render();else sync()};p.src=url(name(i))}}
render();
</script></body></html>
