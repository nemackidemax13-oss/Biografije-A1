function wordCount(s){return (String(s||'').match(/[\p{L}\p{N}]+(?:[-’'][\p{L}\p{N}]+)*/gu)||[]).length}
function digits(s){return String(s||'').replace(/\D/g,'')}
function normalize(s){return String(s||'').trim().toLocaleLowerCase('de').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}


const EMAIL_AI_API='https://a2mejlovi.nemackidemax13.workers.dev/api/check-a2-email';
const EMAIL_AI_HEALTH='https://a2mejlovi.nemackidemax13.workers.dev/health';
const EMAIL_AI_VERSIONS=['a2-de-max-50-words-rubric-v2','a2-de-max-26-min-50-target-v3','a2-de-max-original-first-v4'];

/* ÖSD ZA2: TL+A+K+T+L+F. Previous Worker speaks another rubric: AI maps to a
   preliminary estimate, which teacher can adjust using official criteria. */
function osdLengthPenalty(n){
 if(n<26)return {points:0,nb:true,label:'Manje od 26 reči – n.b., zadatak se ne ocenjuje'};
 if(n<=30)return {points:-3,nb:false,label:'26–30 reči: −3 boda'};
 if(n<=35)return {points:-2,nb:false,label:'31–35 reči: −2 boda'};
 if(n<=39)return {points:-1,nb:false,label:'36–39 reči: −1 bod'};
 return {points:0,nb:false,label:'40+ reči: bez odbitka'};
}
function aiOsdProposal(ai){
 if(!ai||!ai.rubric)return null;
 const q=Array.isArray(ai.questionPoints)?ai.questionPoints:[];
 const answered=q.filter(x=>Number(x)>0).length;
 const qSum=q.reduce((n,x)=>n+(Number(x)||0),0);
 const grammar=Math.max(0,Math.min(4,Number(ai.rubric.grammar)||0));
 return {
 A:ai.offTopic||answered<2?'nb':answered===2?-2:answered===3?-1:0,
 K:Math.min(2,(Number(ai.rubric.opening)>0?1:0)+(Number(ai.rubric.closing)>0?1:0)),
 T:Number(ai.rubric.coherence)>0?2:0,
 L:Math.max(0,Math.min(5,Math.round(5*(.55*qSum/8+.45*grammar/4)))),
 F:Math.max(0,Math.min(5,Math.round(5*grammar/4)))
 };
}
function osdPoints(v,tl){
 if(tl.nb||v?.A==='nb')return 0;
 if(!v||!['A','K','T','L','F'].every(k=>v[k]!==null&&v[k]!==undefined&&v[k]!==''))return null;
 const A=Number(v.A),K=Number(v.K),T=Number(v.T),L=Number(v.L),F=Number(v.F);
 if(![-2,-1,0,1].includes(A)||![0,1,2].includes(K)||![0,1,2].includes(T)||![0,1,2,3,4,5].includes(L)||![0,1,2,3,4,5].includes(F))return null;
 return Math.max(0,Math.min(15,tl.points+A+K+T+L+F));
}
function emailScore(){
 const answer=String(st.mail||'').trim(),count=wordCount(answer),tl=osdLengthPenalty(count);
 if(tl.nb)return {count,tl,points:0,valid:false,graded:true,status:'too_short',source:'word_limit',values:{A:'nb',K:null,T:null,L:null,F:null}};
 const cached=st.aiEmail?.answer===answer?st.aiEmail.response:null;
 const candidate=cached&&cached.rubric?cached:null;
 const manual=st.osdMailRubric?.answer===answer?st.osdMailRubric.values:null;
 const values={A:null,K:null,T:null,L:null,F:null,...(aiOsdProposal(candidate)||{}),...(manual||{})};
 const pts=osdPoints(values,tl),graded=pts!==null;
 return {count,tl,points:graded?pts:0,valid:true,graded,status:manual?'manual':candidate?'ai':count>50?'too_long':'not_checked',source:manual?'teacher_adjusted':candidate?'ai_estimate':'pending',values,feedback:candidate,workerRaw:candidate?Number(candidate.score):null};
}

/* Worker connectivity check: /health does not send the student's email. */
async function checkEmailWorkerStatus(){
 const indicator=document.getElementById('aiWorkerConnection');
 if(!indicator)return;
 indicator.textContent='• Proveravam Cloudflare vezu…';
 indicator.classList.remove('connected','unavailable');
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),10000);
 try{
  const res=await fetch(EMAIL_AI_HEALTH,{
   method:'GET',mode:'cors',credentials:'omit',cache:'no-store',signal:controller.signal
  });
  if(!res.ok)throw Error('HTTP '+res.status);
  const data=await res.json();
  if(!indicator.isConnected)return;
  if(data?.status==='ok'&&data?.openaiConfigured===true){
   indicator.textContent='• Cloudflare AI povezan';
   indicator.classList.add('connected');
  }else if(data?.status==='ok'){
   indicator.textContent='• Worker radi, ali AI ključ nije podešen';
   indicator.classList.add('unavailable');
  }else{
   indicator.textContent='• Veza nije potvrđena';
   indicator.classList.add('unavailable');
  }
 }catch(err){
  if(!indicator.isConnected)return;
  indicator.textContent='• Veza nije potvrđena — možete pokušati proveru';
  indicator.classList.add('unavailable');
 }finally{clearTimeout(timeout)}
}

function validateAiResponse(data){
 if(!data||typeof data!=='object')throw Error('Cloudflare nije vratio JSON rezultat.');
 if(!Number.isInteger(Number(data.score))||Number(data.score)<0||Number(data.score)>15)throw Error('Cloudflare rezultat nema ispravnu ocenu 0–15.');
 if(!data.rubric||typeof data.rubric!=='object')throw Error('Cloudflare nije vratio raspodelu bodova.');
 if(!Array.isArray(data.questionPoints)||data.questionPoints.length!==4)throw Error('Cloudflare nije vratio bodove za četiri pitanja.');
 if(!EMAIL_AI_VERSIONS.includes(data.verificationVersion))throw Error('Cloudflare verzija ocenjivanja nije prepoznata.');
 return data;
}

function grade(){
 const rd1=['K','C','F','G','A'],rd2=['B','A','A','B','B'];
 const r1=st.r1.reduce((n,v,i)=>n+(v===rd1[i]?3:0),0);
 const r2=st.r2.reduce((n,v,i)=>n+(v===rd2[i]?2:0),0);
 const correct=[0,2,3,6],hit=st.w1.filter(i=>correct.includes(i)).length;
 let w1=st.w1.length>5?0:[0,1,4,7,10][hit];if(st.w1.length===5)w1=Math.max(0,w1-3);
 const noteok=[
  ['sonntag','so','so.'].includes(normalize(st.w2[0])),
  ['12','zwolf','zwölf','12euro','12eur'].includes(normalize(st.w2[1])),
  ['9','9uhr','09','09uhr','9:00','09:00','9.00'].includes(String(st.w2[2]).trim().toLowerCase().replace(/\s/g,'')),
  normalize(st.w2[3]).includes('studentenausweis'),
  digits(st.w2[4])==='01726194'
  ];
  const w2=noteok.filter(Boolean).length*2;
 const w3rows=st.w3.map((vals,i)=>{let errors=0;for(let j=0;j<5;j++)if(vals.includes(j)!==SPORTSKEY[i].includes(j))errors++;return Math.max(0,2-errors)});
 const w3=w3rows.reduce((sum,n)=>sum+n,0);
 const mail=emailScore(),lesen=r1+r2,horen=w1+w2+w3,total=lesen+horen+mail.points;
 const pass=mail.graded&&total>=35&&lesen>=5&&horen>=6&&mail.points>=3&&mail.valid;
 return {r1,r2,w1,w2,w3,w3rows,noteok,mail,lesen,horen,total,pass};
}

    if(resp.modelEmail)area+='<details class="card"><summary>Model – primer pravilnog mejla</summary><p class="mail-result">'+esc(resp.modelEmail)+'</p></details>';
   }else if(m.status==='not_checked'){
     area+='<div class="card"><button id="retryAiResult" type="button" class="btn primary" style="width:100%">✦ Proveri mejl AI</button><p id="aiStatus" class="small" role="status"></p></div>';
   }else if(m.status==='too_long'){
     area+='<div class="card"><p class="small">Radna verzija Cloudflare Workera trenutno ne prihvata više od 50 reči. Vratite se i skratite mejl ili koristite zasebnu procenu nastavnika.</p></div>';
   }
   area+='<div class="card"><h3>Tvoj mejl</h3><p class="mail-result">'+esc(st.mail||'Mejl nije napisan.')+'</p></div>';

 }
 return '<div class="stage-label">DE-MAX · ÖSD A2</div><h1 class="stage-title">Rezultati testa</h1>'+
 '<div class="result-tabs">'+[['score','Bodovi'],['lesen','Lesen'],['horen','Hören'],['mail','E-Mail']].map(([k,v])=>'<button type="button" data-result="'+k+'" class="'+(tab===k?'active':'')+'">'+v+'</button>').join('')+'</div>'+
 '<div class="result-details">'+area+'</div>'+
 '<div style="display:flex;gap:8px;margin-top:8px"><button class="btn soft" id="copyResult" style="flex:1">Kopiraj rezultat</button><button class="btn danger" id="reset" style="flex:1">Novi test ↺</button></div>';
}

const PAGES=[cover,lesenIntro,r1,r2,horenIntro,h1,h2,h3,schreibenIntro,mailPrompt,mailEditor,result];
const LAST=PAGES.length-1;
if(!st.flowV2){st.page=0;st.flowV2=true;st.speaker=0;save()}
if(!st.flowV3){
 const p=Number(st.page)||0;
 st.page=p<=1?p:p<=6?2:p<=15?3:p===16?4:p===17?5:p===18?6:p===19?7:p===20?8:p===21?9:10;
 st.flowV3=true;save();
}
if(!st.flowV12){if(Number(st.page)>=8)st.page=Math.min(11,Number(st.page)+1);st.flowV12=true;save();}
function fitPage(){
 const content=document.getElementById('pageContent');if(!content)return;
 content.style.transform='';
 if(st.page===1||st.page===2||st.page===3||st.page===4||st.page===5||st.page===6||st.page===7||st.page===9||st.page===LAST||st.page===LAST-1)return; // Full-screen Lesen intro; scrollable tasks and flexible writing
 const h=main.clientHeight,n=content.scrollHeight;
 const ratio=h&&n?Math.min(1,(h-2)/n):1;
 content.style.transform='scale('+Math.max(.5,ratio)+')';
}

/* Hören 1 and 3 run once. Hören 2 runs twice. If the browser rejects autoplay,
   the user can trigger the first playback with a single button. */

/* Each time the student enters a Hören page, start its playback immediately
   from the Next navigation gesture. Playback quotas are enforced per page visit:
   Hören 1 and 3: once; Hören 2: twice consecutively. Older localStorage locks
   are intentionally ignored because they previously left audio stuck. */
function setupExamAudio(page){
 const idx=page-5, required=idx===1?2:1;
 const audio=document.getElementById('player');
 const status=document.getElementById('audiosignal');
 const bar=document.getElementById('audioBar');
 const fallback=document.getElementById('audioFallback');
 if(!audio||!status||!bar||!fallback)return;
 let completed=0,finished=false;
 const valid=()=>st.page===page&&audio.isConnected;
 const updateProgress=()=>{
  if(!valid())return;
  const duration=audio.duration;
  bar.style.width=Number.isFinite(duration)&&duration>0?Math.min(100,Math.max(0,100*audio.currentTime/duration))+'%':'0%';
 };
 const offerStart=(message)=>{
  if(!valid()||finished)return;
  status.textContent=message;
  fallback.hidden=false;
  fallback.textContent='▶ Pokreni slušanje';
 };
 function startCurrentRound(){
  if(!valid()||finished)return;
  fallback.hidden=true;
  status.textContent='Pokreće se slušanje '+(completed+1)+'/'+required+'…';
  let p;
  try{
   // Call play synchronously while the Next-button user gesture is still active.
   p=audio.play();
  }catch(err){
   offerStart('Telefon zahteva dodir za reprodukciju zvuka.');
   return;
  }
  if(p&&typeof p.then==='function'){
   p.then(()=>{
    if(!valid()||finished)return;
    fallback.hidden=true;
    status.textContent='Slušanje '+(completed+1)+'/'+required+' je u toku';
   }).catch(err=>{
    if(!valid()||finished)return;
    offerStart(err?.name==='NotAllowedError'
      ?'Telefon blokira automatski zvuk. Dodirnite ▶ samo za početak.'
      :'Snimak nije pokrenut. Dodirnite ▶ da pokušate ponovo.');
   });
  }
 }
 audio.autoplay=true;
 audio.playsInline=true;
 audio.preload='auto';
 audio.addEventListener('timeupdate',updateProgress);
 audio.addEventListener('playing',()=>{
  if(!valid()||finished)return;
  fallback.hidden=true;
  status.textContent='Slušanje '+(completed+1)+'/'+required+' je u toku';
 });
 audio.addEventListener('waiting',()=>{
  if(valid()&&!finished&&!audio.paused)status.textContent='Učitava se zvuk…';
 });
 audio.addEventListener('ended',()=>{
  if(!valid()||finished)return;
  completed++;
  if(completed<required){
   bar.style.width='0%';
   audio.currentTime=0;
   startCurrentRound();
  }else{
   finished=true;
   bar.style.width='100%';
   fallback.hidden=true;
   status.textContent='Slušanje završeno ('+required+'/'+required+').';
  }
 });
 audio.addEventListener('error',()=>{
  if(!valid()||finished)return;
  offerStart('Snimak se nije učitao. Proverite internet i pokušajte ponovo.');
 });
 fallback.addEventListener('click',()=>{
  if(!valid()||finished)return;
  startCurrentRound();
 });
 // No stale audioUsed/audioRounds guards: entering a page cannot stay locked.
 startCurrentRound();
}

function render(){
 const a=document.getElementById('player');if(a){a.pause();if(objectAudio){URL.revokeObjectURL(objectAudio);objectAudio=null}}
 st.page=Math.max(0,Math.min(LAST,st.page));save();
 document.getElementById('app').classList.toggle('home-mode',st.page===0);
 prev.hidden=st.page===0;main.style.setProperty('--read-size',Math.max(11,Math.min(24,Number(st.fontSize)||14))+'px');
 main.classList.toggle('reading-scroll',st.page===2||st.page===3);
 main.classList.toggle('lesen-intro-active',st.page===1);
 main.classList.toggle('horen-intro-active',st.page===4);
 main.classList.toggle('hearing-one',st.page===5);
 main.classList.toggle('mail-prompt-active',st.page===9);
 main.classList.toggle('hearing2-scroll',st.page===6);
 main.classList.toggle('h2-keyboard',st.page===6&&document.activeElement?.matches?.('[data-w2]'));
 main.classList.toggle('hearing-three',st.page===7);
 main.classList.toggle('results-scroll',st.page===LAST);
 main.classList.toggle('mail-writing-active',st.page===LAST-1);
 main.classList.remove('mail-keyboard');
 document.getElementById('app').classList.remove('keyboard-input-open','h2-keyboard-mode');
 main.innerHTML='<div id="pageContent">'+PAGES[st.page]()+'</div>';
 main.scrollTop=0;
 document.getElementById('bar').style.width=(st.page/LAST*100)+'%';

 const zoomFooter=document.getElementById('fontFooter');
 zoomFooter.hidden=!(st.page===2||st.page===3||st.page===9);
 const fontNow=st.page===9?Math.max(14,Math.min(24,Number(st.mailPromptFontSize)||18)):Math.max(11,Math.min(24,Number(st.fontSize)||14));
 main.style.setProperty('--mail-prompt-size',Math.max(14,Math.min(24,Number(st.mailPromptFontSize)||18))+'px');
 zoomFooter.querySelectorAll('[data-font-adjust]').forEach(b=>{b.disabled=b.dataset.fontAdjust==='-1'?fontNow<=(st.page===9?14:11):fontNow>=24;});
 prev.disabled=st.page===0;
 next.textContent=st.page===0?'Počni test →':st.page===LAST-1?'Završi i oceni ✓':st.page===LAST?'Na početak ↺':'Nastavi →';
 requestAnimationFrame(fitPage);
 if(st.page===LAST){const copy=document.getElementById('copyResult');copy.onclick=()=>{const g=grade();const txt='DE-MAX ÖSD A2 Test 11 | Lesen '+g.lesen+'/25 | Hören '+g.horen+'/30 | E-Mail '+g.mail.points+'/15 | Ukupno '+g.total+'/70 | '+(g.pass?'POLOŽENO':'NIJE POLOŽENO')+' | E-Mail automatska procena';if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(()=>notify('Rezultat kopiran')).catch(()=>notify('Kopiranje nije dostupno'));else notify(txt)};
 document.getElementById('reset').onclick=()=>{if(confirm('Obrisati sve odgovore i početi ponovo?')){st=freshA2Test();save();render()}}}
 if(st.page>=5&&st.page<=7)setupExamAudio(st.page);
 if(st.page===LAST-1)checkEmailWorkerStatus();
}
window.addEventListener('resize',()=>requestAnimationFrame(fitPage),{passive:true});
window.visualViewport?.addEventListener('resize',()=>requestAnimationFrame(fitPage),{passive:true});
function notify(s){const el=document.createElement('div');el.className='toast';el.textContent=s;document.body.append(el);setTimeout(()=>el.remove(),2800)}


function openTitlePicker(i){
 const old=document.getElementById('a2HeadingPickerOverlay');if(old)old.remove();
 if(!Number.isInteger(i)||i<0||i>=TEXTS.length)return;
 const opener=main.querySelector('[data-title-picker="'+i+'"]');
 const wrap=document.createElement('div');wrap.className='a2-picker-overlay';wrap.id='a2HeadingPickerOverlay';
 wrap.innerHTML='<div class="a2-picker-backdrop" data-dismiss-picker="1"></div>'+
 '<section class="a2-picker-dialog" role="dialog" aria-modal="true" aria-label="Izaberi naslov za tekst '+(i+1)+'">'+
 '<div class="a2-picker-head"><strong>Text '+(i+1)+' · Izaberi naslov</strong><button type="button" data-dismiss-picker="1" aria-label="Zatvori izbor">✕</button></div>'+
 '<div class="a2-picker-items">'+H.map((h,j)=>'<button type="button" data-heading-value="'+h+'" class="a2-picker-option'+(st.r1[i]===h?' chosen':'')+'" aria-pressed="'+(st.r1[i]===h)+'"><span class="a2-picker-mark">'+h+'</span><span>'+esc(HEAD[j])+'</span></button>').join('')+'</div>'+
 '</section>';
 const close=()=>{wrap.remove();document.removeEventListener('keydown',onKeys);if(opener?.isConnected)opener.focus({preventScroll:true});};
 const onKeys=(e)=>{if(e.key==='Escape'){e.preventDefault();close()}};
 wrap.addEventListener('click',e=>{
  if(e.target.closest('[data-dismiss-picker]')){close();return}
  const option=e.target.closest('[data-heading-value]');if(!option)return;
  const value=option.dataset.headingValue;
  if(!H.includes(value))return;
  st.r1[i]=value;save();
  const updated=main.querySelector('[data-title-picker="'+i+'"]');
  if(updated)updated.outerHTML=getSelect(i);
  close();
 });
 document.body.appendChild(wrap);
 document.addEventListener('keydown',onKeys);
 wrap.querySelector('.a2-picker-option.chosen,.a2-picker-option')?.focus({preventScroll:true});
}


/* Hören 2 keyboard handling: do not rerender the player or move it above inputs.
   The parent iframe resizes with visualViewport, so use the current actual frame height. */
let h2Focused=null;
function updateH2Keyboard(){
 const inH2=st.page===6;
 const focused=inH2&&h2Focused?.isConnected&&document.activeElement===h2Focused;
 const keyboardLikely=focused;
 const container=main;
 container.classList.toggle('h2-keyboard',keyboardLikely);
 document.getElementById('app').classList.toggle('h2-keyboard-mode',keyboardLikely);
 document.getElementById('app').classList.toggle('keyboard-input-open',keyboardLikely);
 if(keyboardLikely)requestAnimationFrame(syncMobileViewportHeight);
}
main.addEventListener('focusin',e=>{
 if(st.page!==6||!e.target.matches?.('[data-w2]'))return;
 h2Focused=e.target;
 updateH2Keyboard();
 syncMobileViewportHeight();
 requestAnimationFrame(keepFocusedInputAboveKeyboard);
});
main.addEventListener('focusout',e=>{
 if(st.page!==6||!e.target.matches?.('[data-w2]'))return;
 queueMicrotask(()=>{
  if(st.page!==6)return;
  h2Focused=main.querySelector('[data-w2]:focus')||null;
  updateH2Keyboard();
 });
});

window.visualViewport?.addEventListener('resize',()=>{
 if(st.page===6)requestAnimationFrame(updateH2Keyboard);
 if(st.page===LAST-1)requestAnimationFrame(updateMailKeyboard);
},{passive:true});
/* Track available height without restarting audio or rendering the input. */
function syncMobileViewportHeight(){
 const vv=window.visualViewport;
 const available=vv&&Number.isFinite(vv.height)?Math.min(vv.height,window.innerHeight):window.innerHeight;
 if(available>100)document.documentElement.style.setProperty('--live-app-height',Math.floor(available)+'px');
}

function keepFocusedInputAboveKeyboard(){
 if(st.page===6){
  const focused=document.activeElement;
  if(focused?.matches?.('[data-w2]')){
   const list=main.querySelector('.note-grid');
   const item=focused.closest('.note-row');
   if(list&&item){
    const top=item.offsetTop-list.offsetTop;
    const bottom=top+item.offsetHeight;
    if(top<list.scrollTop)list.scrollTop=top;
    else if(bottom>list.scrollTop+list.clientHeight)list.scrollTop=bottom-list.clientHeight+3;
   }
  }
 }
 // No forced body scroll for the email. The editor is sized inside the
 // shrunken visual viewport and remains immediately above the keyboard.
}

function updateMailKeyboard(){
 const mailFocused=st.page===LAST-1&&document.activeElement?.id==='emailAnswer';
 main.classList.toggle('mail-keyboard',Boolean(mailFocused));
 document.getElementById('app').classList.toggle('keyboard-input-open',Boolean(mailFocused));
 if(mailFocused)requestAnimationFrame(syncMobileViewportHeight);
}
main.addEventListener('focusin',e=>{
 if(st.page===LAST-1&&e.target.id==='emailAnswer'){
  updateMailKeyboard();
  requestAnimationFrame(syncMobileViewportHeight);
  requestAnimationFrame(keepFocusedInputAboveKeyboard);
 }
});
main.addEventListener('focusout',e=>{
 if(st.page===LAST-1&&e.target.id==='emailAnswer'){
  queueMicrotask(()=>{
   updateMailKeyboard();
   requestAnimationFrame(syncMobileViewportHeight);
  });
 }
});
window.addEventListener('resize',syncMobileViewportHeight,{passive:true});
window.visualViewport?.addEventListener('resize',syncMobileViewportHeight,{passive:true});
window.visualViewport?.addEventListener('resize',()=>requestAnimationFrame(keepFocusedInputAboveKeyboard),{passive:true});
window.visualViewport?.addEventListener('scroll',syncMobileViewportHeight,{passive:true});
syncMobileViewportHeight();


document.getElementById('app').addEventListener('click',e=>{
 const chooseHeading=e.target.closest('[data-title-picker]');
 if(chooseHeading){openTitlePicker(Number(chooseHeading.dataset.titlePicker));return;}
 const aiBtn=e.target.closest('#aiGradeBtn, #retryAiResult');
 if(aiBtn){checkEmailAI(aiBtn.id==='retryAiResult');return;}
 const skipBtn=e.target.closest('#skipAiBtn');
 if(skipBtn){st.page=LAST;st.resultTab='score';render();return;}
 const resultTab=e.target.closest('[data-result]');
 if(resultTab){st.resultTab=resultTab.dataset.result;save();render();return;}
 const b=e.target.closest('[data-font-adjust]');
 if(b){
  const mailPage=st.page===9;
  const low=mailPage?14:11;
  const n=Math.max(low,Math.min(24,(mailPage?(Number(st.mailPromptFontSize)||18):(Number(st.fontSize)||14))+Number(b.dataset.fontAdjust)));
  if(mailPage){st.mailPromptFontSize=n;main.style.setProperty('--mail-prompt-size',n+'px')}
  else{st.fontSize=n;main.style.setProperty('--read-size',n+'px')}
  save();
  document.querySelectorAll('#fontFooter [data-font-adjust]').forEach(v=>v.disabled=v.dataset.fontAdjust==='-1'?n<=low:n>=24);
  return;
 }
});
main.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='emailAnswer'){
  st.mail=t.value;st.aiEmail=null;st.osdMailRubric=null;
  const n=wordCount(st.mail);
  document.getElementById('wordCount').textContent=n+' reči';
  const meter=document.getElementById('mailWordMeter'),fill=document.getElementById('mailWordFill');
  if(fill){fill.style.width=Math.min(100,n/26*100)+'%';fill.classList.toggle('met',n>=26);fill.classList.toggle('below',n<26)}
  if(meter)meter.setAttribute('aria-valuenow',String(Math.min(n,26)));
  setAiStatus('Tekst je izmenjen. Proverite ga ponovo preko Cloudflare AI.',false);
 }
 if(t.dataset.w2!==undefined)st.w2[Number(t.dataset.w2)]=t.value;
 save();
});
main.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.osdField){
   const vals=emailScore().values;
   st.osdMailRubric={answer:String(st.mail||'').trim(),values:{...vals,[t.dataset.osdField]:t.value||null}};
   save();
   const oldScroll=main.scrollTop;render();main.scrollTop=oldScroll;
   return;
 }
 if(t.dataset.r1!==undefined)st.r1[Number(t.dataset.r1)]=t.value;
 if(t.dataset.r2!==undefined)st.r2[Number(t.dataset.r2)]=t.value;
 if(t.dataset.w1!==undefined){const i=Number(t.dataset.w1);st.w1=t.checked?[...new Set([...st.w1,i])]:st.w1.filter(x=>x!==i);const c=document.getElementById('weatherCount');if(c)c.textContent=st.w1.length+' / 4 izabrano';}
 if(t.dataset.sp!==undefined){const i=Number(t.dataset.sp),j=Number(t.dataset.sport);st.w3[i]=t.checked?[...new Set([...st.w3[i],j])]:st.w3[i].filter(x=>x!==j)}
 save();
});
prev.onclick=()=>{if(st.page>0){st.page--;render()}};
next.onclick=()=>{if(st.page===LAST-1){checkEmailAI(true);return;}if(st.page===0){st.started=Date.now();st.page=1}else if(st.page<LAST)st.page++;else st.page=0;render()};
render();
/* Mobile back-forward cache must not reopen another student's completed test. */
window.addEventListener('pageshow',event=>{if(event.persisted){st=freshA2Test();render();}});
</script>
