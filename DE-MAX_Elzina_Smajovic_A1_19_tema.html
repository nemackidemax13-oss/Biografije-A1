<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1b3151;background:#f2f6fc;font-synthesis:none}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0}
.container{max-width:780px;margin:0 auto;padding:16px 12px 40px}
header{background:linear-gradient(130deg,#0b4995,#1576d7);color:#fff;border-radius:22px;padding:24px 19px 21px;box-shadow:0 10px 27px #0e5ea525}

.jump{display:flex;align-items:center;gap:9px;margin:0 2px 17px}.jump label{font-size:13px;font-weight:800;color:#244e7d}.jump select{flex:1;min-width:0;max-width:none}
section{border:1px solid #dce7f3;background:white;border-radius:18px;margin:13px 0;padding:17px 15px 15px;box-shadow:0 4px 14px #0b37650c;scroll-margin-top:10px}
h2{font-size:18px;margin:0 0 10px;color:#1052a1;line-height:1.3}
.sentence{font-size:16.7px;line-height:1.55;margin:0 0 6px;border-radius:9px;padding:7px 8px;border:2px solid transparent;transition:background .12s,border-color .12s}.sentence-line{display:flex;align-items:center;justify-content:space-between;gap:10px}.sentence-line .de{flex:1;min-width:0}.speaker-btn{flex:0 0 42px;display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;min-height:42px;border:1px solid #bfd6f0;border-radius:12px;padding:0;background:#e9f3ff;color:#125baa;font-size:21px;line-height:1}.speaker-btn:hover{background:#d7eafe}.speaker-btn:active{background:#bddbfb;transform:scale(.96)}.sentence.active .speaker-btn{background:#fff;color:#bd412b;border-color:#f2ad9e}
.sentence.active{background:#fff4ee;border-color:#e94c39}
.de{display:block;font-weight:600;color:#213650}.translation{display:block;font-size:13px;font-weight:500;line-height:1.55;color:#b42643;margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.actions button{font-size:13.5px;padding:10px 12px;min-height:42px}
.footer{text-align:center;color:#60788f;font-size:12px;margin:23px 0 6px}
@media (max-width:450px){.container{padding:10px 9px 27px}header{border-radius:18px;padding:21px 16px}section{padding:14px 12px;border-radius:15px}.sentence{font-size:16.3px;padding:6px}.translation{font-size:12.6px}.controls{gap:7px}.controls select{min-width:0;flex:1}.actions button{flex:1}h2{font-size:17.5px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

<main class="container">
<header><span class="chip">DE-MAX • A1</span>
<h1>Elzina Smajovic – nemački izgovor</h1>
<p class="subtitle">Biografija + svih 19 tema • nemačke rečenice sa prevodom • slušaj pojedinačno ili celu temu</p>
<div class="controls"><label for="speed">Brzina:</label>
<select id="speed" aria-label="Brzina izgovora"><option value="0.72">Sporo (0,72×)</option><option value="0.88" selected>Polako (0,88×)</option><option value="1">Normalno (1×)</option><option value="1.12">Brzo (1,12×)</option></select>
<button class="stop" id="stop" type="button">■ Zaustavi</button></div>
</header>
<div class="info"><p class="status" id="status" aria-live="polite">Dodirni nemačku rečenicu ili pritisni „Slušaj celu temu“ za izgovor.</p><span class="counter" id="counter"></span></div>
<div class="jump"><label for="goto">Izaberi temu:</label><select id="goto" aria-label="Pređi na temu"></select></div>
<div id="content"></div>
<p class="footer">DE-MAX • A1 • Izgovor putem govorne funkcije telefona ili računara</p>
</main>
<script>
const topics=[{"title":"Biografie – Elzina Smajovic","rows":[{"de":"Guten Tag.","sr":"Dobar dan."},{"de":"Mein Name ist Elzina Smajovic.","sr":"Moje ime je Elzina Smajovic."},{"de":"Ich bin verheiratet und habe einen Sohn.","sr":"Udata sam i imam jednog sina."},{"de":"Mein Sohn heißt Jakup und ist zwei Jahre alt.","sr":"Moj sin se zove Jakup i ima dve godine."},{"de":"Ich bin Erzieherin von Beruf.","sr":"Po zanimanju sam vaspitačica."},{"de":"Zurzeit arbeite ich nicht.","sr":"Trenutno ne radim."},{"de":"Früher habe ich fünf Jahre im Kindergarten Mladost in Novi Pazar gearbeitet.","sr":"Ranije sam pet godina radila u predškolskoj ustanovi Mladost u Novom Pazaru."},{"de":"Mein Mann heißt Mirzet und ist 34 Jahre alt.","sr":"Moj muž se zove Mirzet i ima 34 godine."},{"de":"Er lebt in Hameln in Deutschland.","sr":"On živi u Hamelnu u Nemačkoj."},{"de":"Er arbeitet auf dem Bau.","sr":"On radi u građevinarstvu."}]},{"title":"1. Familie – Porodica","rows":[{"de":"Meine Familie ist klein.","sr":"Moja porodica je mala."},{"de":"Ich bin verheiratet und habe einen Sohn.","sr":"Udata sam i imam jednog sina."},{"de":"Mein Mann heißt Mirzet.","sr":"Moj muž se zove Mirzet."},{"de":"Er ist 34 Jahre alt.","sr":"On ima 34 godine."},{"de":"Er wohnt in Hameln in Deutschland.","sr":"On stanuje u Hamelnu u Nemačkoj."},{"de":"Er arbeitet auf einer Baustelle.","sr":"On radi na gradilištu."},{"de":"Unser Sohn heißt Jakup.","sr":"Naš sin se zove Jakup."},{"de":"Jakup ist zwei Jahre alt.","sr":"Jakup ima dve godine."},{"de":"Ich verbringe gern Zeit mit meinem Sohn.","sr":"Rado provodim vreme sa svojim sinom."},{"de":"Meine Familie ist mir sehr wichtig.","sr":"Moja porodica mi je veoma važna."}]},{"title":"2. Hobbys – Hobiji","rows":[{"de":"Mein Hobby ist Spazierengehen.","sr":"Moj hobi je šetnja."},{"de":"Ich gehe gern mit meinem Sohn spazieren.","sr":"Rado šetam sa svojim sinom."},{"de":"Zu Hause höre ich gern Musik.","sr":"Kod kuće rado slušam muziku."},{"de":"Manchmal lese ich auch ein Buch.","sr":"Ponekad čitam i knjigu."}]},{"title":"3. Lieblingsessen – Omiljena hrana","rows":[{"de":"Ich esse gern Gemüse mit Reis.","sr":"Rado jedem povrće sa pirinčem."},{"de":"Zum Frühstück esse ich oft Brot und Käse.","sr":"Za doručak često jedem hleb i sir."},{"de":"Ich koche gern für meine Familie.","sr":"Rado kuvam za svoju porodicu."},{"de":"Am Nachmittag esse ich manchmal Obst.","sr":"Popodne ponekad jedem voće."}]},{"title":"4. Lieblingsgetränk – Omiljeno piće","rows":[{"de":"Ich trinke gern Wasser.","sr":"Rado pijem vodu."},{"de":"Am Morgen trinke ich oft einen Kaffee.","sr":"Ujutru često pijem kafu."},{"de":"Mein Sohn trinkt gern Milch.","sr":"Moj sin rado pije mleko."},{"de":"Am Abend trinke ich manchmal Tee.","sr":"Uveče ponekad pijem čaj."}]},{"title":"5. Sprachen – Jezici","rows":[{"de":"Ich spreche meine Muttersprache.","sr":"Govorim svoj maternji jezik."},{"de":"Jetzt lerne ich Deutsch.","sr":"Sada učim nemački."},{"de":"Ich übe jeden Tag neue Wörter.","sr":"Svakog dana vežbam nove reči."},{"de":"Ich möchte Deutsch gut verstehen und sprechen.","sr":"Želim dobro da razumem i govorim nemački."}]},{"title":"6. Freizeit – Slobodno vreme","rows":[{"de":"In meiner Freizeit spiele ich gern mit Jakup.","sr":"U slobodno vreme rado se igram sa Jakupom."},{"de":"Wir gehen oft an die frische Luft.","sr":"Često izlazimo na svež vazduh."},{"de":"Wenn ich Zeit habe, höre ich Musik.","sr":"Kada imam vremena, slušam muziku."},{"de":"Abends telefoniere ich manchmal mit meinem Mann.","sr":"Uveče ponekad razgovaram telefonom sa svojim mužem."}]},{"title":"7. Sport – Sport","rows":[{"de":"Ich mache gern leichte Übungen.","sr":"Rado radim lagane vežbe."},{"de":"Ich gehe oft zu Fuß.","sr":"Često idem peške."},{"de":"Mit meinem Sohn gehe ich gern spazieren.","sr":"Rado šetam sa sinom."},{"de":"Bewegung ist gut für die Gesundheit.","sr":"Kretanje je dobro za zdravlje."}]},{"title":"8. Musik – Muzika","rows":[{"de":"Ich höre gern Musik.","sr":"Rado slušam muziku."},{"de":"Besonders gern höre ich ruhige Lieder.","sr":"Posebno rado slušam mirne pesme."},{"de":"Manchmal singe ich mit meinem Sohn.","sr":"Ponekad pevam sa svojim sinom."},{"de":"Musik macht gute Laune.","sr":"Muzika popravlja raspoloženje."}]},{"title":"9. Bücher – Knjige","rows":[{"de":"Ich lese gern kurze Geschichten.","sr":"Rado čitam kratke priče."},{"de":"Meinem Sohn zeige ich gern Bilderbücher.","sr":"Svom sinu rado pokazujem slikovnice."},{"de":"Ich lese auch einfache Texte auf Deutsch.","sr":"Čitam i jednostavne tekstove na nemačkom."},{"de":"So lerne ich neue Wörter.","sr":"Tako učim nove reči."}]},{"title":"10. Lieblingskleidung – Omiljena odeća","rows":[{"de":"Ich trage gern bequeme Kleidung.","sr":"Rado nosim udobnu odeću."},{"de":"Zu Hause trage ich oft eine Hose und ein T-Shirt.","sr":"Kod kuće često nosim pantalone i majicu."},{"de":"Im Winter trage ich eine warme Jacke.","sr":"Zimi nosim toplu jaknu."},{"de":"Für einen Spaziergang brauche ich bequeme Schuhe.","sr":"Za šetnju su mi potrebne udobne cipele."}]},{"title":"11. Freunde – Prijatelji","rows":[{"de":"Ich treffe gern meine Freundinnen.","sr":"Rado se viđam sa svojim prijateljicama."},{"de":"Wir trinken manchmal zusammen Kaffee.","sr":"Ponekad zajedno pijemo kafu."},{"de":"Wir sprechen über unsere Familien.","sr":"Razgovaramo o svojim porodicama."},{"de":"Gute Freunde helfen einander.","sr":"Dobri prijatelji pomažu jedni drugima."}]},{"title":"12. Urlaub – Odmor","rows":[{"de":"Im Urlaub möchte ich mich ausruhen.","sr":"Na odmoru želim da se odmorim."},{"de":"Ich reise gern mit meiner Familie.","sr":"Rado putujem sa porodicom."},{"de":"Ich möchte schöne Orte sehen.","sr":"Želim da vidim lepa mesta."},{"de":"Im Urlaub mache ich gern Fotos.","sr":"Na odmoru rado fotografišem."}]},{"title":"13. Was ich gerne mache – Šta rado radim","rows":[{"de":"Ich spiele gern mit meinem Sohn Jakup.","sr":"Rado se igram sa svojim sinom Jakupom."},{"de":"Ich gehe gern spazieren.","sr":"Rado idem u šetnju."},{"de":"Ich koche gern für meine Familie.","sr":"Rado kuvam za svoju porodicu."},{"de":"Ich lerne auch gern Deutsch.","sr":"Rado učim i nemački."}]},{"title":"14. Arbeit / Beruf / Job – Posao","rows":[{"de":"Ich bin Erzieherin von Beruf.","sr":"Po zanimanju sam vaspitačica."},{"de":"Zurzeit arbeite ich nicht.","sr":"Trenutno ne radim."},{"de":"Früher habe ich fünf Jahre in einem Kindergarten gearbeitet.","sr":"Ranije sam pet godina radila u vrtiću."},{"de":"Der Kindergarten heißt Mladost.","sr":"Vrtić se zove Mladost."},{"de":"Er ist in Novi Pazar.","sr":"Nalazi se u Novom Pazaru."},{"de":"Ich habe dort mit kleinen Kindern gearbeitet.","sr":"Tamo sam radila sa malom decom."},{"de":"Ich habe mit den Kindern gespielt und gelernt.","sr":"Igrala sam se i učila sa decom."},{"de":"Mein Mann arbeitet auf dem Bau in Deutschland.","sr":"Moj muž radi u građevinarstvu u Nemačkoj."}]},{"title":"15. Tiere / Haustiere – Životinje","rows":[{"de":"Ich mag Tiere.","sr":"Volim životinje."},{"de":"Katzen und Hunde finde ich schön.","sr":"Mačke i psi su mi lepi."},{"de":"Mit meinem Sohn sehe ich gern Tiere.","sr":"Sa sinom rado gledam životinje."},{"de":"Kleine Kinder lernen viel über Tiere.","sr":"Mala deca mnogo uče o životinjama."}]},{"title":"16. Filme – Filmovi","rows":[{"de":"Ich sehe gern Filme.","sr":"Rado gledam filmove."},{"de":"Besonders gern sehe ich Familienfilme.","sr":"Posebno rado gledam porodične filmove."},{"de":"Manchmal sehe ich abends eine Serie.","sr":"Ponekad uveče gledam neku seriju."},{"de":"Am Wochenende habe ich mehr Zeit dafür.","sr":"Vikendom imam više vremena za to."}]},{"title":"17. Lieblingsfarbe – Omiljena boja","rows":[{"de":"Ich mag die Farbe Blau.","sr":"Volim plavu boju."},{"de":"Auch Grün und Weiß gefallen mir.","sr":"Dopadaju mi se i zelena i bela."},{"de":"Mein Sohn mag bunte Spielsachen.","sr":"Moj sin voli šarene igračke."},{"de":"Im Frühling sieht man viele schöne Farben.","sr":"U proleće se vidi mnogo lepih boja."}]},{"title":"18. Wohnort / Herkunft – Mesto stanovanja i poreklo","rows":[{"de":"Mein Mann lebt in Hameln.","sr":"Moj muž živi u Hamelnu."},{"de":"Hameln ist eine Stadt in Deutschland.","sr":"Hameln je grad u Nemačkoj."},{"de":"Die Stadt liegt in Niedersachsen.","sr":"Grad se nalazi u Donjoj Saksoniji."},{"de":"Mein Mann arbeitet dort auf dem Bau.","sr":"Moj muž tamo radi u građevinarstvu."},{"de":"Ich habe früher in Novi Pazar gearbeitet.","sr":"Ranije sam radila u Novom Pazaru."}]},{"title":"19. Lieblingslied – Omiljena pesma","rows":[{"de":"Ich höre gern schöne Lieder.","sr":"Rado slušam lepe pesme."},{"de":"Mein Lieblingslied höre ich oft zu Hause.","sr":"Svoju omiljenu pesmu često slušam kod kuće."},{"de":"Manchmal singe ich leise mit.","sr":"Ponekad tiho pevušim uz pesmu."},{"de":"Musik macht meinen Tag schöner.","sr":"Muzika mi ulepšava dan."}]}];
const content=document.getElementById('content');
const statusEl=document.getElementById('status');
const counter=document.getElementById('counter');
const jump=document.getElementById('goto');
counter.textContent='19 tema + biografija • '+topics.reduce((sum,t)=>sum+t.rows.length,0)+' rečenica';
let token=0;
const supported='speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
let preferredVoice=null;
function chooseVoice(){if(!supported)return null;const voices=window.speechSynthesis.getVoices();const german=voices.filter(v=>(v.lang||'').toLowerCase().startsWith('de'));
return german.find(v=>/google|microsoft|anna|katja|deutsch/i.test(v.name))||german[0]||null}
if(supported){preferredVoice=chooseVoice();speechSynthesis.addEventListener?.('voiceschanged',()=>{preferredVoice=chooseVoice()})}
else {statusEl.textContent='Ovaj pregledač ne podržava čitanje naglas. Koristi Chrome, Edge ili Safari sa uključenim zvukom.'}
function clearActive(){document.querySelectorAll('.sentence.active').forEach(el=>el.classList.remove('active'))}
function stop(manual=true){token++;if(supported)window.speechSynthesis.cancel();clearActive();if(manual)statusEl.textContent='Čitanje zaustavljeno.'}
document.getElementById('stop').addEventListener('click',()=>stop(true));
function say(topicIndex,rowIndex,currentToken){return new Promise(resolve=>{
if(!supported||currentToken!==token){resolve();return}
const row=topics[topicIndex].rows[rowIndex];
clearActive();const el=document.getElementById('s-'+topicIndex+'-'+rowIndex);if(el){el.classList.add('active');el.scrollIntoView({block:'nearest',behavior:'smooth'})}
const u=new SpeechSynthesisUtterance(row.de);u.lang='de-DE';u.rate=Number(document.getElementById('speed').value);u.pitch=1;
preferredVoice=chooseVoice();if(preferredVoice)u.voice=preferredVoice;
let settled=false;function finish(){if(!settled){settled=true;resolve()}}
u.onend=finish;u.onerror=finish;
statusEl.textContent='Slušaš: '+topics[topicIndex].title;
window.speechSynthesis.speak(u);
})}
async function play(topicIndex,startIndex,wholeTopic){
if(!supported){statusEl.textContent='Izgovor nije podržan u ovom pregledaču.';return}
stop(false);const currentToken=token;const end=wholeTopic?topics[topicIndex].rows.length:startIndex+1;
for(let i=startIndex;i<end;i++){if(currentToken!==token)return;await say(topicIndex,i,currentToken)}
if(currentToken===token){clearActive();statusEl.textContent='Čitanje završeno. Izaberi rečenicu ili sledeću temu.'}
}
topics.forEach((topic,t)=>{
const opt=document.createElement('option');opt.value='topic-'+t;opt.textContent=topic.title;jump.appendChild(opt);
const sec=document.createElement('section');sec.id='topic-'+t;
const h2=document.createElement('h2');h2.textContent=topic.title;sec.appendChild(h2);
topic.rows.forEach((row,i)=>{
const p=document.createElement('div');p.className='sentence';p.id='s-'+t+'-'+i;
const line=document.createElement('div');line.className='sentence-line';
const de=document.createElement('span');de.className='de';de.textContent=row.de;
const speaker=document.createElement('button');speaker.type='button';speaker.className='speaker-btn';speaker.textContent='🔊';speaker.title='Slušaj nemačku rečenicu';speaker.setAttribute('aria-label','Slušaj nemačku rečenicu: '+row.de);
speaker.addEventListener('click',()=>play(t,i,false));
const sr=document.createElement('span');sr.className='translation';sr.textContent=row.sr;
line.append(de,speaker);p.append(line,sr);sec.appendChild(p);
});
const actions=document.createElement('div');actions.className='actions';
const btn=document.createElement('button');btn.type='button';btn.className='primary';btn.textContent='▶ Slušaj celu temu';btn.addEventListener('click',()=>play(t,0,true));
const again=document.createElement('button');again.type='button';again.className='secondary';again.textContent='↻ Ponovi od početka';again.addEventListener('click',()=>play(t,0,true));
actions.append(btn,again);sec.appendChild(actions);content.appendChild(sec);
});
jump.addEventListener('change',()=>{const target=document.getElementById(jump.value);if(target)target.scrollIntoView({behavior:'smooth',block:'start'})});
</script></body></html>
