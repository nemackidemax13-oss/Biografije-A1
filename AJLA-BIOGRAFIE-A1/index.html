<script>
const topics=[["Biografie","Biografija",["Guten Tag. Mein Name ist Ajla.","Ich bin 28 Jahre alt.","Ich komme aus Serbien und wohne in Novi Pazar.","Ich bin verheiratet.","Ich bin Krankenschwester von Beruf, aber ich habe noch nicht in meinem Beruf gearbeitet."],["Dobar dan. Zovem se Ajla.","Imam 28 godina.","Dolazim iz Srbije i živim u Novom Pazaru.","Udata sam.","Po zanimanju sam medicinska sestra, ali još nisam radila u svom zanimanju."]],["Familie","Porodica",["Mein Mann heißt Semir.","Er ist 33 Jahre alt.","Er ist Bauarbeiter von Beruf.","Er lebt und arbeitet in Deutschland, in Recke.","Wir haben keine Kinder.","Ich möchte mit meinem Mann in Deutschland leben."],["Moj muž se zove Semir.","Ima 33 godine.","Po zanimanju je građevinski radnik.","Živi i radi u Nemačkoj, u Rekeu.","Nemamo dece.","Želim da živim sa svojim mužem u Nemačkoj."]],["Hobbys","Hobiji",["Ich habe mehrere Hobbys.","Meine Hobbys sind Musik hören, spazieren gehen und Deutsch lernen."],["Imam nekoliko hobija.","Moji hobiji su slušanje muzike, šetnja i učenje nemačkog jezika."]],["Lieblingsessen","Omiljena hrana",["Meine Lieblingsessen sind Pizza, Spaghetti und Hähnchen mit Pommes.","Ich koche auch gerne zu Hause."],["Moja omiljena jela su pica, špagete i piletina sa pomfritom.","Volim i da kuvam kod kuće."]],["Lieblingsgetränk","Omiljeno piće",["Ich trinke gerne Kaffee mit Milch.","Ich trinke auch Tee und Mineralwasser."],["Rado pijem kafu sa mlekom.","Pijem i čaj i mineralnu vodu."]],["Sprachen / Deutsch","Jezici / Nemački",["Meine Muttersprache ist Serbisch.","Ich spreche auch ein bisschen Deutsch.","Ich finde die deutsche Sprache interessant.","Ich lerne Deutsch, weil ich in Deutschland leben möchte."],["Moj maternji jezik je srpski.","Govorim i malo nemačkog.","Smatram nemački jezik zanimljivim.","Učim nemački jer želim da živim u Nemačkoj."]],["Freizeit","Slobodno vreme",["In meiner Freizeit höre ich Musik.","Ich gehe gerne spazieren und treffe meine Freundinnen.","Manchmal lerne ich Deutsch."],["U slobodno vreme slušam muziku.","Volim da šetam i da se viđam sa drugaricama.","Ponekad učim nemački."]],["Sport","Sport",["Ich mag Sport.","Mein Lieblingssport ist Volleyball.","In meiner Freizeit gehe ich gerne spazieren."],["Volim sport.","Moj omiljeni sport je odbojka.","U slobodno vreme volim da šetam."]],["Musik","Muzika",["Ich höre sehr gerne Musik.","Ich höre Volksmusik und Popmusik.","Mein Lieblingssänger ist Dino Merlin."],["Veoma rado slušam muziku.","Slušam narodnu i pop muziku.","Moj omiljeni pevač je Dino Merlin."]],["Bücher","Knjige",["Ich lese manchmal Bücher.","Ich lese auch gerne einfache Texte auf Deutsch.","So lerne ich neue Wörter."],["Ponekad čitam knjige.","Volim da čitam i jednostavne tekstove na nemačkom.","Tako učim nove reči."]],["Lieblingskleidung","Omiljena odeća",["Ich trage gerne Kleider und Blusen.","Im Alltag trage ich meistens eine Hose und ein T-Shirt."],["Volim da nosim haljine i bluze.","U svakodnevnom životu najčešće nosim pantalone i majicu."]],["Freunde / Freundin","Prijatelji / drugarica",["Ich habe gute Freundinnen in Novi Pazar.","Wir treffen uns gerne und gehen zusammen spazieren.","Manchmal trinken wir zusammen Kaffee."],["Imam dobre drugarice u Novom Pazaru.","Volimo da se viđamo i zajedno šetamo.","Ponekad zajedno pijemo kafu."]],["Urlaub","Odmor",["Ich mache gerne Urlaub.","Am liebsten fahre ich nach Montenegro.","Ich möchte auch meinen Mann in Deutschland besuchen."],["Volim da idem na odmor.","Najradije putujem u Crnu Goru.","Želim i da posetim muža u Nemačkoj."]],["Was mache ich gern?","Šta volim da radim?",["Ich lerne gerne Deutsch und mache meine Hausaufgaben.","Ich koche auch gerne und räume meine Wohnung auf."],["Volim da učim nemački i radim domaće zadatke.","Volim i da kuvam i sređujem stan."]],["Arbeit / Beruf","Posao / zanimanje",["Ich bin Krankenschwester von Beruf.","Ich habe aber noch nicht als Krankenschwester gearbeitet.","Ich möchte später gerne in meinem Beruf arbeiten."],["Po zanimanju sam medicinska sestra.","Ali još nisam radila kao medicinska sestra.","Volela bih da kasnije radim u svom zanimanju."]],["Tiere / Haustiere","Životinje / kućni ljubimci",["Ich mag Tiere sehr.","Meine Lieblingstiere sind Katzen und Hunde.","Ich habe keine Haustiere."],["Mnogo volim životinje.","Moje omiljene životinje su mačke i psi.","Nemam kućne ljubimce."]],["Film","Film",["Ich sehe gerne Filme.","Mein Lieblingsfilm ist Titanic.","Ich mag auch Komödien."],["Volim da gledam filmove.","Moj omiljeni film je Titanik.","Volim i komedije."]],["Lieblingsfarbe","Omiljena boja",["Meine Lieblingsfarbe ist Blau.","Ich mag aber auch Weiß und Schwarz."],["Moja omiljena boja je plava.","Ali volim i belu i crnu."]],["Wohnort / Woher komme ich?","Mesto stanovanja / odakle dolazim",["Ich komme aus Serbien.","Ich wohne in Novi Pazar.","Mein Mann lebt und arbeitet in Recke in Deutschland."],["Dolazim iz Srbije.","Živim u Novom Pazaru.","Moj muž živi i radi u Rekeu u Nemačkoj."]],["Lieblingslied","Omiljena pesma",["Ich höre sehr gerne Musik von Dino Merlin.","Seine Lieder gefallen mir sehr."],["Vrlo rado slušam muziku Dina Merlina.","Njegove pesme mi se veoma dopadaju."]]];let index=0,utter=null;const $=id=>document.getElementById(id);const synth=window.speechSynthesis;
let selectedRate=.8;
let playToken=0;let currentSentence=-1;let sentencePage=0;
function perPage(){return window.innerWidth<=650?(window.innerHeight<600?1:2):3}
function pageTotal(){return Math.ceil(topics[index][2].length/perPage())}
function clearHighlight(){document.querySelectorAll('.line.reading').forEach(el=>el.classList.remove('reading'));$('heading').classList.remove('reading-title');currentSentence=-1}
function highlight(i){const page=Math.floor(i/perPage());if(sentencePage!==page){sentencePage=page;renderSentences()}clearHighlight();const line=$('sentences').querySelector('[data-sentence="'+i+'"]');if(line){currentSentence=i;line.classList.add('reading');$('heading').classList.add('reading-title')}}
function stop(){playToken++;if(synth)synth.cancel();utter=null;clearHighlight();$('pause').textContent='⏸ Pauza'}
function speakSentence(i,token,auto){if(token!==playToken)return;const sentences=topics[index][2];if(i>=sentences.length){clearHighlight();utter=null;return}highlight(i);utter=new SpeechSynthesisUtterance(sentences[i]);utter.lang='de-DE';utter.rate=selectedRate;utter.pitch=1;const voices=synth.getVoices().filter(v=>v.lang.toLowerCase().startsWith('de'));if(voices.length)utter.voice=voices.find(v=>v.lang==='de-DE')||voices[0];utter.onend=()=>{if(token!==playToken)return;if(auto)speakSentence(i+1,token,true);else clearHighlight()};utter.onerror=()=>{if(token===playToken)clearHighlight()};synth.speak(utter)}
function speak(i,auto=false){if(!synth){alert('Vaš pregledač ne podržava izgovor.');return}stop();const token=playToken;speakSentence(i,token,auto)}
function renderSentences(){const t=topics[index],area=$('sentences');area.textContent='';const start=sentencePage*perPage(),end=Math.min(start+perPage(),t[2].length);for(let i=start;i<end;i++){const s=t[2][i],wrap=document.createElement('div');wrap.className='line';wrap.dataset.sentence=String(i);const left=document.createElement('div');left.style.flex='1';const de=document.createElement('div');de.className='de';de.textContent=s;left.append(de);const sr=document.createElement('div');sr.className='sr';sr.textContent=t[3][i];left.append(sr);const b=document.createElement('button');b.className='say';b.textContent='🔊';b.setAttribute('aria-label','Izgovori rečenicu '+(i+1));b.onclick=()=>speak(i,false);wrap.append(left,b);area.append(wrap)}$('sentenceCount').textContent=(sentencePage+1)+' / '+pageTotal();$('sentencePrev').disabled=sentencePage===0;$('sentenceNext').disabled=sentencePage>=pageTotal()-1}
function render(){stop();sentencePage=0;const t=topics[index];$('topCount').textContent=(index+1)+' / '+topics.length;$('topName').textContent=t[0];$('counter').textContent=(index+1)+' / '+topics.length;$('ord').textContent=index===0?'PREDSTAVLJANJE':'TEMA '+index;$('heading').textContent=t[0];renderSentences();$('prev').disabled=index===0;$('next').disabled=index===topics.length-1;$('topPrev').disabled=index===0;$('topNext').disabled=index===topics.length-1}
document.querySelectorAll('.speedbtn').forEach(btn=>btn.addEventListener('click',()=>{selectedRate=Number(btn.dataset.rate);document.querySelectorAll('.speedbtn').forEach(b=>{const on=b===btn;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on))});if(synth&&(synth.speaking||synth.paused))stop()}));$('play').onclick=()=>speak(0,true);$('pause').onclick=()=>{if(!synth)return;if(synth.paused){synth.resume();$('pause').textContent='⏸ Pauza'}else if(synth.speaking){synth.pause();$('pause').textContent='▶ Nastavi'}};$('stop').onclick=()=>{stop();$('pause').textContent='⏸ Pauza'};$('prev').onclick=()=>{if(index>0){index--;render()}};$('next').onclick=()=>{if(index<topics.length-1){index++;render()}};$('topPrev').onclick=$('prev').onclick;$('topNext').onclick=$('next').onclick;$('sentencePrev').onclick=()=>{if(sentencePage>0){stop();sentencePage--;renderSentences()}};$('sentenceNext').onclick=()=>{if(sentencePage<pageTotal()-1){stop();sentencePage++;renderSentences()}};window.addEventListener('resize',()=>{sentencePage=Math.min(sentencePage,pageTotal()-1);renderSentences()});render();if(synth)synth.getVoices();
</script></body></html>
