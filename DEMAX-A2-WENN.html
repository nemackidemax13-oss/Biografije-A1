<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>De-Max A2 – Wenn-Sätze</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#fff;font-family:Arial,Helvetica,sans-serif}body{display:flex;flex-direction:column;overflow:hidden}main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;container-type:size}#slide{width:min(100cqw,177.7778cqh);height:min(100cqh,56.25cqw);container-type:size;display:grid;grid-template-rows:repeat(9,1fr);padding:1.1% 1%;gap:0}article{display:grid;grid-template-columns:5.6cqw 1fr;align-items:start;min-height:0}.num{display:grid;place-items:center;background:linear-gradient(135deg,#1746bd,#05267f);color:white;border-radius:.7cqw;width:3.8cqw;height:3.1cqw;font-size:2.65cqw;font-weight:800;margin-top:.35cqw}.first{font-size:2.65cqw;line-height:1.13;font-weight:800;letter-spacing:.01em;color:#111;white-space:nowrap}.first b{color:#f00}.second{display:flex;align-items:baseline;gap:.45cqw;font-size:2.25cqw;line-height:1.25;font-weight:800;color:#073488;white-space:nowrap}.arrow{font-size:3.0cqw;line-height:.7;margin-right:.65cqw}.blank{flex:1;border-bottom:.16cqw solid #111;min-width:0;position:relative;height:2.45cqw;display:flex;align-items:flex-end}.answer{font-size:3.15cqw;font-weight:400;line-height:.93;color:#416fc5;visibility:hidden;white-space:nowrap;letter-spacing:0}.shown .answer{visibility:visible;animation:appear .22s ease-out}@keyframes appear{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}.dot{color:#111}footer{display:flex;align-items:center;justify-content:center;gap:12px;padding:5px 12px;border-top:1px solid #dce3f0;background:#f7f9fd;flex-shrink:0}button{font:600 15px Arial;cursor:pointer;background:#fff;border:1px solid #cdd6e6;border-radius:8px;padding:8px 15px;color:#113b90;touch-action:manipulation}button:disabled{opacity:.35;cursor:default}#next{background:#133f9b;color:white;border-color:#133f9b}#count{min-width:54px;text-align:center;font-weight:700;color:#173777;font-variant-numeric:tabular-nums}#brand{color:#173777;font-size:13px;font-weight:bold;margin-right:auto}#full{margin-left:auto}@media(max-width:650px){footer{gap:5px;padding:5px}button{font-size:12px;padding:8px}#brand{display:none}#full{margin-left:0}}@media print{footer{display:none}.answer{visibility:visible}}
</style></head><body><main><section id="slide" aria-label="Wenn-Sätze"></section></main><footer><span id="brand">De-Max Tutin · A2</span><button id="prev" title="Pfeil links">← Zurück</button><span id="count" aria-live="polite">0 / 9</span><button id="next" title="Pfeil rechts">Weiter →</button><button id="reset" title="Pos1">↻ Neu</button><button id="full" title="Vollbild">⛶</button></footer><script>
const data=[['Ich trinke Kaffee,','ich lerne.','Wenn ich lerne,','trinke ich Kaffee'],['Ich bleibe zu Hause,','es regnet.','Wenn es regnet,','bleibe ich zu Hause'],['Ich lese ein Buch,','ich Zeit habe.','Wenn ich Zeit habe,','lese ich ein Buch'],['Wir lernen viel,','wir Deutsch sprechen.','Wenn wir Deutsch sprechen,','lernen wir viel'],['Sie schläft früh,','sie müde ist.','Wenn sie müde ist,','schläft sie früh'],['Ich tanze,','ich Musik höre.','Wenn ich Musik höre,','tanze ich'],['Du isst etwas,','du Hunger hast.','Wenn du Hunger hast,','isst du etwas'],['Ich esse,','ich nach Hause komme.','Wenn ich nach Hause komme,','esse ich'],['Der Unterricht beginnt,','der Lehrer kommt.','Wenn der Lehrer kommt,','beginnt der Unterricht']];
const $=id=>document.getElementById(id);let n=0;$('slide').innerHTML=data.map(([a,b,c,d],i)=>`<article><span class="num">${i+1}</span><div><div class="first">${a} <b>wenn</b> ${b}</div><div class="second"><span class="arrow">➞</span><span>${c} &nbsp;(dann)</span><span class="blank"><span class="answer">${d}</span></span><span class="dot">.</span></div></div></article>`).join('');function set(v){n=Math.min(9,Math.max(0,v));document.querySelectorAll('article').forEach((el,i)=>{el.classList.toggle('shown',i<n);el.querySelector('.answer').setAttribute('aria-hidden',String(i>=n))});$('count').textContent=n+' / 9';$('prev').disabled=n===0;$('next').disabled=n===9;} $('next').onclick=()=>set(n+1);$('prev').onclick=()=>set(n-1);$('reset').onclick=()=>set(0);$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>{})};document.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key)){if(e.key==='Enter'&&e.target.tagName==='BUTTON')return;e.preventDefault();set(n+1)}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();set(n-1)}else if(e.key==='Home'){e.preventDefault();set(0)}else if(e.key==='End'){e.preventDefault();set(9)}});window.addEventListener('message',e=>{const d=e.data;const k=typeof d==='string'?d:d?.type||d?.action||d?.key;if(['next','NEXT','ArrowRight','weiter'].includes(k))set(n+1);if(['prev','previous','PREV','ArrowLeft','zuruck'].includes(k))set(n-1);if(k==='reset')set(0)});set(0);
</script></body></html>
