<script>
const $=id=>document.getElementById(id), main=$('main'), peek=$('peek');
const key='demax-presenter-list-v1';
const defaults=[{id:'quiz',name:'DE-MAX Spiel',kind:'link',url:'https://nemackidemax13-oss.github.io/Biografije-A1/DEMAX-SPIEL/DEMAX-QUIZ-POWERPOINT.html?v=9'}];

const categories=[
{id:'a1-lessons',name:'A1 lekcije',color:'#1559b1'},
{id:'a2-lessons',name:'A2 lekcije',color:'#19804e'},
{id:'b1-lessons',name:'B1 lekcije',color:'#7845b4'},
{id:'a1-prep',name:'A1 pripreme',color:'#2179c1'},
{id:'a2-prep',name:'A2 pripreme',color:'#0c827f'},
{id:'b1-osd',name:'B1 pripreme ÖSD',color:'#b02e45'},
{id:'b1-telc',name:'B1 pripreme TELC',color:'#bd6c13'},
{id:'b1-dtz',name:'B1 pripreme DTZ',color:'#4459ad'},
{id:'b1-ecl',name:'B1 pripreme ECL',color:'#9a397e'}];
if(!Array.isArray(items))items=defaults;
items.forEach(item=>{if(!categories.some(c=>c.id===item.category))item.category='a1-lessons'});
const presenterLink={id:'presenter-link-slide-2',name:'DE-MAX Presenter',kind:'link',url:'https://nemackidemax13-oss.github.io/Biografije-A1/DEMAX-PRESENTER.html?v=10&utm_source=chatgpt.com',category:'a1-lessons'};
const migrationKey=key+'-presenter-slide-2';
try{if(!localStorage.getItem(migrationKey)){if(!items.some(i=>i.id===presenterLink.id)){const first=items.findIndex(i=>i.category==='a1-lessons');items.splice(first<0?items.length:first+1,0,presenterLink)}localStorage.setItem(migrationKey,'1')}}catch{if(!items.some(i=>i.id===presenterLink.id)){const first=items.findIndex(i=>i.category==='a1-lessons');items.splice(first<0?items.length:first+1,0,presenterLink)}}
function isPresenterLink(item){try{const u=new URL(item.url);return u.origin===location.origin&&u.pathname===location.pathname}catch{return false}}
let activeCategory=null, pendingCategory=null;
let current=null, generation=0, previewReady=false, lastTarget='', busy=false, staticSlides=null;
const nextPicture=$('nextPicture');
const localFiles=new Map();
const db=new Promise(resolve=>{try{const r=indexedDB.open('demax-presenter-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('html');r.onsuccess=()=>resolve(r.result);r.onerror=()=>resolve(null)}catch{resolve(null)}});
async function store(id,html){localFiles.set(id,html);const d=await db;if(!d)return;return new Promise(resolve=>{const tx=d.transaction('html','readwrite');tx.objectStore('html').put(html,id);tx.oncomplete=resolve;tx.onerror=resolve;tx.onabort=resolve})}

function save(){try{localStorage.setItem(key,JSON.stringify(items))}catch{$('status').textContent='Spisak nije sačuvan.'}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function render(){
 const box=$('categories');box.replaceChildren();
 for(const cat of categories){
  const section=document.createElement('div'), button=document.createElement('button');
  button.className='category'+(activeCategory===cat.id?' active':'');
  button.style.setProperty('--cat',cat.color);button.setAttribute('aria-expanded',String(activeCategory===cat.id));
  const label=document.createElement('span');label.textContent=cat.name;const chev=document.createElement('span');chev.className='chev';chev.textContent=activeCategory===cat.id?'▾':'▸';button.append(label,chev);
  button.onclick=()=>{activeCategory=activeCategory===cat.id?null:cat.id;render()};section.append(button);
  if(activeCategory===cat.id){
   const body=document.createElement('div');body.className='category-content';
   const add=document.createElement('div');add.className='add';
   const web=document.createElement('button');web.className='blue';web.textContent='+ GitHub link';web.onclick=()=>{pendingCategory=cat.id;$('linkForm').reset();$('dialogTitle').textContent='Dodaj link – '+cat.name;$('dialog').showModal()};
   const file=document.createElement('button');file.className='local';file.textContent='+ HTML sa računara';file.onclick=()=>{pendingCategory=cat.id;$('file').click()};add.append(web,file);body.append(add);
   const members=items.map((item,i)=>({item,i})).filter(x=>x.item.category===cat.id);
   if(!members.length){const p=document.createElement('p');p.className='category-empty';p.textContent='Još nema dodatih lekcija.';body.append(p)}
   members.forEach(({item,i},position)=>{
    const row=document.createElement('div');row.className='item'+(current?.id===item.id?' active':'');
    const n=document.createElement('button');n.className='name';n.textContent=(position+1)+'. '+item.name;const s=document.createElement('small');s.textContent=item.kind==='file'?'HTML':'Web';n.append(s);n.onclick=()=>openItem(item);row.append(n);
    [['↑',()=>move(i,-1)],['↓',()=>move(i,1)],['×',()=>remove(i)]].forEach(([t,fn],j)=>{const b=document.createElement('button');b.className='mini '+['move-up','move-down','remove-item'][j];b.textContent=t;b.title=['Pomeri gore','Pomeri dole','Ukloni'][j];b.disabled=(j===0&&position===0)||(j===1&&position===members.length-1);b.onclick=fn;row.append(b)});body.append(row);
   });section.append(body)
  }box.append(section)
 }
}
function move(i,d){const same=items.map((item,index)=>({item,index})).filter(x=>x.item.category===items[i].category);const p=same.findIndex(x=>x.index===i),j=same[p+d]?.index;if(j==null)return;[items[i],items[j]]=[items[j],items[i]];save();render()}
function remove(i){const item=items[i];if(!confirm('Ukloniti '+item.name+' iz spiska?'))return;items.splice(i,1);if(current?.id===item.id){current=null;generation++;main.removeAttribute('srcdoc');main.src='about:blank';main.classList.add('hidden');$('empty').classList.remove('hidden');clearPreview('Izaberi prezentaciju.')}save();render()}
function clearPreview(text){staticSlides=null;nextPicture.classList.add('hidden');nextPicture.removeAttribute('src');previewReady=false;lastTarget='';peek.classList.add('hidden');peek.removeAttribute('srcdoc');peek.src='about:blank';$('previewMsg').classList.remove('hidden');$('previewMsg').textContent=text;$('count').textContent='— / —';$('slideBack').disabled=true;$('slideForward').disabled=true}
function message(t){nextPicture.classList.add('hidden');peek.classList.add('hidden');$('previewMsg').classList.remove('hidden');$('previewMsg').textContent=t}
function scaled(){const w=main.clientWidth||1000,h=main.clientHeight||650,b=$('preview');if(!b.clientWidth||!b.clientHeight)return;const scale=Math.min(b.clientWidth/w,b.clientHeight/h);peek.style.width=w+'px';peek.style.height=h+'px';peek.style.transform='scale('+scale+')';peek.style.left=(b.clientWidth-w*scale)/2+'px';peek.style.top=Math.max(0,b.clientHeight-h*scale)+'px'}
function doc(f){try{return f.contentDocument?.documentElement?f.contentDocument:null}catch{return null}}
function counter(d){if(!d)return null;const els=d.querySelectorAll('[id*="count" i],[id*="page" i],[id*="slide" i],[class*="count" i],[class*="page" i],[class*="progress" i],span,small,div');for(const e of els){if(e.children.length>0||!e.getClientRects().length)continue;const m=(e.textContent||'').trim().match(/^(\d{1,3})\s*(?:\/|von|od|of)\s*(\d{1,3})$/i);if(m&&+m[1]>=1&&+m[2]>=+m[1]&&+m[2]>1)return [+m[1],+m[2]]}return null}
function nav(d,dir){if(!d)return null;const list=[...d.querySelectorAll('button,[role="button"],a,input[type="button"]')].filter(x=>x.getClientRects().length&&!x.disabled&&x.getAttribute('aria-disabled')!=='true');const pat=dir>0?/^(weiter|next|sledeć[ai]|sledec[ai]|naredni|napred|→|›|❯)(?:\s|$)/i:/^(zurück|back|previous|nazad|prethodni|←|‹|❮)(?:\s|$)/i;const idpat=dir>0?/^(next|nextbtn|btnnext|nextslide|weiter|forward)$/i:/^(prev|previous|prevbtn|btnprev|prevslide|back|zuruck)$/i;return list.find(x=>idpat.test(x.id.replace(/[-_]/g,'')))||list.find(x=>pat.test((x.getAttribute('aria-label')||x.title||x.textContent||x.value||'').trim()))}
const muteCode="(()=>{try{window.AudioContext=window.webkitAudioContext=function(){return new Proxy({currentTime:0,state:'suspended',destination:{},resume:()=>Promise.resolve(),suspend:()=>Promise.resolve(),close:()=>Promise.resolve()},{get:(o,k)=>k in o?o[k]:(()=>({connect(){return this},disconnect(){},start(){},stop(){},gain:{value:0,setValueAtTime(){},exponentialRampToValueAtTime(){},linearRampToValueAtTime(){}},frequency:{value:0,setValueAtTime(){},exponentialRampToValueAtTime(){},linearRampToValueAtTime(){}}}))})};}catch(e){}try{Object.defineProperty(window,'speechSynthesis',{value:{speak(){},cancel(){},pause(){},resume(){},getVoices(){return []},addEventListener(){},removeEventListener(){},speaking:false}})}catch(e){}try{HTMLMediaElement.prototype.play=function(){this.muted=true;return Promise.resolve()}}catch(e){}document.addEventListener('play',e=>{e.target.muted=true;e.target.pause()},true)})();";
function makePreview(html,base){const p=new DOMParser().parseFromString(html,'text/html');if(base){let b=p.querySelector('base');if(!b){b=p.createElement('base');p.head.prepend(b)}b.href=base}const script=p.createElement('script');script.textContent=muteCode;p.head.prepend(script);return '<!doctype html>'+p.documentElement.outerHTML}
function extractStaticSlides(html,base){try{const m=html.match(/\bconst\s+slides\s*=\s*(\[[\s\S]*?\])\s*;/);if(!m)return null;const list=JSON.parse(m[1]);if(!Array.isArray(list)||!list.length||!list.every(s=>s&&typeof s.image==='string'))return null;return list.map(s=>{if(/^data:image\//i.test(s.image))return s.image;if(!base)return null;const u=new URL(s.image,base);return /^https?:$/.test(u.protocol)?u.href:null})}catch{return null}}
async function openItem(item,automaticNavigation=false){const token=++generation;current=item;activeCategory=automaticNavigation?null:item.category;busy=false;render();$('status').textContent='Učitavanje…';$('empty').classList.add('hidden');main.classList.remove('hidden');clearPreview('Učitavanje pregleda…');main.removeAttribute('srcdoc');let html=null;
if(item.kind==='file'){html=await read(item.id);if(token!==generation)return;if(html==null){$('status').textContent='Ponovo dodaj HTML fajl.';main.src='about:blank';message('Fajl nije dostupan.');return}main.srcdoc=html}
else{if(isPresenterLink(item)&&window.self!==window.top){main.src='about:blank';$('status').textContent='Presenter je već otvoren u okviru drugog Presentera.';message('Povratak na prethodnu stavku.');updateNavigation(null);return}main.src=item.url;if(new URL(item.url).origin===location.origin&&!isGame(item)&&!isPresenterLink(item)){try{const r=await fetch(item.url);if(r.ok)html=await r.text()}catch{}}}
if(token!==generation)return;$('status').textContent='';if(!html){sync();return}
if(isGame(item)){sync();return}staticSlides=extractStaticSlides(html,item.kind==='link'?item.url:null);if(staticSlides&&staticSlides.every(Boolean)){sync();return}staticSlides=null;
scaled();peek.onload=()=>{if(token!==generation||!peek.hasAttribute('srcdoc'))return;previewReady=true;scaled();sync()};peek.srcdoc=makePreview(html,item.kind==='link'?item.url:null)}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function sequence(){return current?items.filter(i=>i.category===current.category):[]}
function adjacent(dir){const seq=sequence(),i=seq.findIndex(x=>x.id===current?.id);return i<0?null:seq[i+dir]||null}
function isGame(item){if(!item)return false;let leaf='';try{leaf=new URL(item.url).pathname.split('/').filter(Boolean).pop()||''}catch{}return /quiz|spiel|igra|game|kviz/i.test(leaf+' '+item.name)}
function slideCounter(){if(!current||isGame(current)||isPresenterLink(current))return null;if(current.kind==='link'){try{if(new URL(current.url).origin!==location.origin)return null;const actual=new URL(main.contentWindow.location.href);const expected=new URL(current.url);if(actual.pathname.replace(/index\.html$/,'')!==expected.pathname.replace(/index\.html$/,''))return null}catch{return null}}return counter(doc(main))}
function updateNavigation(c){const seq=sequence(),i=seq.findIndex(x=>x.id===current?.id),game=isGame(current);$('count').textContent=game?'1 / 1':c?c[0]+' / '+c[1]:(i>=0?(i+1)+' / '+seq.length:'— / —');$('count').title=game?'Igra – jedna stavka':c?'Slajd u prezentaciji':'Stavka u kategoriji';$('slideBack').disabled=!(c&&c[0]>1)&&!adjacent(-1);$('slideForward').disabled=!(c&&c[0]<c[1])&&!adjacent(1)}
async function showNextItem(){
 const item=adjacent(1),g=generation,marker=g+':item:'+(item?.id||'end');
 if(lastTarget===marker)return;lastTarget=marker;
 if(!item){message('Poslednja stavka.');return}
 message('Sledeće: '+item.name);
 if(isGame(item)||isPresenterLink(item))return;
 try{let html=null;if(item.kind==='file'){html=await read(item.id)}else if(new URL(item.url).origin===location.origin){const res=await fetch(item.url);if(res.ok)html=await res.text()}
 if(g!==generation||lastTarget!==marker||!html)return;
 const slides=extractStaticSlides(html,item.kind==='link'?item.url:null);
 if(slides?.[0]){peek.classList.add('hidden');$('previewMsg').classList.add('hidden');nextPicture.alt='Prvi slajd – '+item.name;nextPicture.src=slides[0];nextPicture.classList.remove('hidden')}
 }catch{}
}


// V19: preserve the original slide proportions and align the image with its navigation row.
let alignedSlideImage=null;
function alignSlideImage(){
 if(!current||isGame(current)||isPresenterLink(current))return;
 const d=doc(main);if(!d)return;
 const w=d.defaultView;
 const buttons=[...d.querySelectorAll('button,[role="button"],a,input[type="button"]')].filter(el=>el.getClientRects().length);
 const label=el=>[el.textContent,el.value,el.getAttribute('aria-label'),el.title].filter(Boolean).join(' ');
 const back=buttons.find(el=>/zurück|zurueck|prethodni|previous/i.test(label(el)))||nav(d,-1);
 const forward=buttons.find(el=>/weiter|sledeć|sledec|naredni|next/i.test(label(el)))||nav(d,1);
 if(!back||!forward)return;
 const br=back.getBoundingClientRect(),fr=forward.getBoundingClientRect();
 if(Math.abs(br.top-fr.top)>30)return;
 const line=Math.min(br.top,fr.top);
 const candidates=[...d.images].filter(img=>{const r=img.getBoundingClientRect(),style=w.getComputedStyle(img);return img.naturalWidth&&r.width>150&&r.height>90&&r.top<line&&style.visibility!=='hidden'&&style.display!=='none'});
 const img=candidates.sort((a,b)=>b.clientWidth*b.clientHeight-a.clientWidth*a.clientHeight)[0];if(!img)return;
 if(alignedSlideImage&&alignedSlideImage!==img){alignedSlideImage.style.removeProperty('translate');alignedSlideImage.style.removeProperty('object-position');delete alignedSlideImage.dataset.demaxShift}
 alignedSlideImage=img;
 if(img.style.objectPosition!=='center bottom')img.style.objectPosition='center bottom';
 const prev=Number(img.dataset.demaxShift||0),rect=img.getBoundingClientRect();
 const baseBottom=rect.bottom-prev;
 // Keep the entire slide visible, immediately above the navigation row.
 const shift=Math.max(0,Math.min(line-baseBottom-4,w.innerHeight-baseBottom-4));
 // Prevent a slide wrapper from clipping the relocated image; don't alter the page or navigation.
 if(shift>0){for(let p=img.parentElement;p&&p!==d.body&&p!==d.documentElement;p=p.parentElement){const pr=p.getBoundingClientRect(),ps=w.getComputedStyle(p);if(pr.bottom<baseBottom+shift-1&&/hidden|clip/.test(ps.overflowY)&&pr.top<=rect.top-prev+2&&pr.bottom<=line+4){p.style.overflow='visible'}}}
 if(Math.abs(shift-prev)>0.5||!img.dataset.demaxShift){img.style.translate='0 '+shift+'px';img.dataset.demaxShift=String(shift)}
}

async function sync(){if(busy||!current)return;try{alignSlideImage()}catch{};const c=slideCounter();updateNavigation(c);if(!c){if(isGame(current)||!previewReady&&!staticSlides)showNextItem();return}if(c[0]>=c[1]){showNextItem();return}if(staticSlides){const target=c[0]+1, marker=generation+':'+target, src=staticSlides[c[0]];if(!src){message('Naredni slajd nije dostupan.');return}if(lastTarget===marker)return;lastTarget=marker;peek.classList.add('hidden');$('previewMsg').classList.add('hidden');nextPicture.alt='Naredni slajd '+target;nextPicture.src=src;nextPicture.classList.remove('hidden');return}if(!previewReady)return;const target=c[0]+1, marker=generation+':'+target;if(lastTarget===marker)return;busy=true;const g=generation;try{const b=doc(peek);let z=counter(b),steps=0;if(!z){message('Pregled nije kompatibilan sa ovom lekcijom.');return}while(z[0]!==target&&steps++<150){if(g!==generation)return;const n=nav(b,z[0]<target?1:-1);if(!n)break;n.click();await wait(55);if(g!==generation)return;const v=counter(b);if(!v||v[0]===z[0])break;z=v}if(g!==generation)return;if(z[0]===target){$('previewMsg').classList.add('hidden');peek.classList.remove('hidden');scaled();lastTarget=marker}else{message('Naredni slajd nije moguće automatski prikazati.');lastTarget=marker}}catch{message('Pregled nije dostupan.')}finally{if(g===generation)busy=false}}
nextPicture.onerror=()=>{if(nextPicture.hasAttribute('src'))message('Naredni pregled nije moguće učitati.')};
function stepSlide(dir){if(!current)return;const c=slideCounter();if(!c||dir<0&&c[0]<=1||dir>0&&c[0]>=c[1]){const item=adjacent(dir);if(item)openItem(item,true);return}const d=doc(main),b=nav(d,dir);if(b)b.click();else if(d){const w=main.contentWindow;d.dispatchEvent(new w.KeyboardEvent('keydown',{key:dir>0?'ArrowRight':'ArrowLeft',bubbles:true,cancelable:true}))}sync()}
$('slideBack').onclick=e=>{if(e.shiftKey){const item=adjacent(-1);if(item)openItem(item,true)}else stepSlide(-1)};$('slideForward').onclick=e=>{if(e.shiftKey){const item=adjacent(1);if(item)openItem(item,true)}else stepSlide(1)};$('slideBack').title='Prethodni slajd ili stavka (Shift + klik: prethodni link)';$('slideForward').title='Sledeći slajd ili stavka (Shift + klik: sledeći link)';
setInterval(sync,150);window.addEventListener('resize',scaled);if(typeof ResizeObserver!=='undefined'){const previewObserver=new ResizeObserver(scaled);previewObserver.observe($('preview'));previewObserver.observe(main)}
$('cancel').onclick=()=>$('dialog').close();
$('linkForm').onsubmit=e=>{e.preventDefault();let u;try{u=new URL($('url').value.trim());if(u.protocol!=='https:'&&u.protocol!=='http:')throw 0}catch{alert('Unesi ispravan HTTPS link.');return}const item={id:uid(),name:$('label').value.trim()||decodeURIComponent(u.pathname.split('/').filter(Boolean).pop()||u.hostname),kind:'link',url:u.href,category:pendingCategory||activeCategory||'a1-lessons'};items.push(item);save();$('dialog').close();openItem(item)};
$('file').onchange=async e=>{let first=null;const category=pendingCategory||activeCategory||'a1-lessons';for(const f of e.target.files){const item={id:uid(),name:f.name.replace(/\.html?$/i,''),kind:'file',category};await store(item.id,await f.text());items.push(item);first??=item}save();render();if(first)openItem(first);e.target.value=''};
function updateClock(){const now=new Date();$('clock').textContent=new Intl.DateTimeFormat('sr-Latn-RS',{hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).format(now);$('date').textContent=new Intl.DateTimeFormat('sr-Latn-RS',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(now)}
updateClock();setInterval(updateClock,1000);save();render();
</script></body></html>
