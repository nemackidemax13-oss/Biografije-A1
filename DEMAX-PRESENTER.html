<!doctype html>
<html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DE-MAX Presenter</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font:15px system-ui,Arial,sans-serif;color:#172b45;background:#eef2f7}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:10px 12px;background:#e8eef7;color:#23456d;font-weight:650}button:hover{filter:brightness(.96)}button:focus-visible{outline:3px solid #65aaff}button:disabled{opacity:.45;cursor:default}.blue{background:#1659b1;color:white}.green{background:#137b42;color:white}.top{height:56px;display:flex;align-items:center;gap:12px;padding:0 14px;background:white;border-bottom:1px solid #d9e2ee}.brand{font-weight:850;letter-spacing:-.4px;color:#1557aa}.top .title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.layout{display:grid;grid-template-columns:210px minmax(0,1fr) 245px;height:calc(100% - 56px);gap:10px;padding:10px}.side,.right{background:white;border:1px solid #dbe3ee;border-radius:10px;min-height:0;overflow:auto;padding:12px}.side h2,.right h2{font-size:15px;margin:0 0 12px}.add{display:grid;gap:6px;margin-bottom:14px}.add button{width:100%;text-align:left}.item{display:flex;align-items:center;gap:4px;margin-bottom:6px;padding:5px;border:1px solid #e1e8f0;border-radius:8px}.item.active{background:#e7f1ff;border-color:#6399e3}.item .name{flex:1;text-align:left;overflow-wrap:anywhere;background:transparent;padding:6px;min-width:0;font-size:13px}.item small{display:block;color:#66788c;font-weight:400}.item .mini{padding:4px 6px;font-size:12px;background:transparent}.stage{background:white;min-width:0;min-height:0;position:relative;border:1px solid #dbe3ee;border-radius:10px;overflow:hidden}.stage iframe{width:100%;height:100%;display:block;border:0}.empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:#60758e;padding:22px}.empty b{font-size:22px;color:#154f98}.preview{position:relative;aspect-ratio:16/10;background:#f4f7fb;border:1px solid #dbe3ee;border-radius:7px;overflow:hidden}.preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:white;pointer-events:none}.preview iframe{position:absolute;top:0;left:0;border:0;transform-origin:top left;pointer-events:none;background:white}.msg{padding:12px;font-size:12px;color:#60758e;line-height:1.5}.count{margin:10px 0;font-weight:700;color:#1659b1}.nextLesson{font-size:13px;line-height:1.5;border-top:1px solid #e1e8f0;padding-top:12px;margin-top:15px}.nextLesson b{display:block;color:#60758e;font-size:12px;margin-bottom:4px}.hidden{display:none!important}#peek.hidden{display:block!important;visibility:hidden}.stage:fullscreen{border:0;border-radius:0;width:100vw;height:100vh}.stage:fullscreen iframe{width:100%;height:100%}.stage:fullscreen .exit{display:block}.exit{display:none;position:absolute;right:8px;top:8px;background:#172b45c9;color:white;padding:6px;z-index:20;opacity:.45}.exit:hover{opacity:1}dialog{border:0;border-radius:12px;padding:20px;width:min(440px,90vw);box-shadow:0 12px 60px #0004}dialog::backdrop{background:#142b4566}dialog label{display:block;font-size:13px;margin:10px 0 4px}dialog input{width:100%;padding:10px;border:1px solid #b9c9dc;border-radius:7px}dialog footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.note{font-size:11px;color:#718399;line-height:1.5}.status{font-size:12px;color:#62748a;max-width:180px}@media(max-width:850px){.layout{grid-template-columns:170px minmax(0,1fr) 170px;gap:5px;padding:5px}.side,.right{padding:7px}.top{gap:6px}.status{display:none}}

.layout{grid-template-columns:minmax(210px,260px) minmax(0,1fr) minmax(210px,260px);height:100%;gap:10px;padding:10px}
.side,.right{padding:12px;display:flex;flex-direction:column;align-items:stretch}
.side h2,.right h2{text-align:center;font-size:16px;margin:3px 0 14px}
.category-list{display:grid;gap:7px}
.category{width:100%;text-align:left;color:white;background:var(--cat);padding:11px 10px;font-size:13px;line-height:1.3;border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:5px}
.category.active{outline:2px solid var(--cat);outline-offset:2px}
.category .chev{font-size:12px;opacity:.85}
.category-content{padding:8px 0 3px;min-width:0}
.category-content .add{gap:5px;margin:0 0 8px}
.category-content .add button{font-size:12px;padding:8px;text-align:center}
.category-content .add .local{background:#facc15;color:#422d00}
.category-content .item .mini{padding:3px 4px}
.category-content .item .name{padding:5px}
.category-empty{font-size:12px;color:#718399;text-align:center;margin:7px 0}
.preview{aspect-ratio:16/9;flex-shrink:0}
.count{text-align:center;margin:12px 0}
.clockbox{border-top:1px solid #e1e8f0;margin-top:6px;padding:24px 0 0;text-align:center;font-variant-numeric:tabular-nums}
.clock{font-size:clamp(23px,2.6vw,37px);font-weight:750;letter-spacing:.02em;color:#173e70;line-height:1.15}
.date{font-size:13px;color:#516782;font-weight:600;margin-top:8px;line-height:1.5}
.redbrand{font-size:29px;font-weight:900;font-style:italic;letter-spacing:-1px;color:#d01925;margin-top:24px}
.status{max-width:none;text-align:center;margin-top:8px}
@media(max-width:850px){.layout{grid-template-columns:170px minmax(0,1fr) 170px;gap:5px;padding:5px}.side,.right{padding:7px}.category{font-size:11px;padding:9px 6px}.clock{font-size:22px}.date{font-size:11px}.redbrand{font-size:23px}}
</style></head><body>
<div class="layout"><aside class="side"><h2>Lekcije i igre</h2><div id="categories" class="category-list"></div><input id="file" type="file" accept=".html,.htm,text/html" multiple hidden><span class="status" id="status"></span></aside>
<main class="stage" id="stage"><div class="empty" id="empty"><b>DE-MAX Tutin</b><p>Dodaj lekciju ili izaberi igru sa leve strane.</p></div><iframe id="main" title="Originalna prezentacija" class="hidden" allow="autoplay; fullscreen; microphone" allowfullscreen></iframe></main>
<aside class="right"><h2>Naredni slajd</h2><div class="preview" id="preview"><div class="msg" id="previewMsg">Izaberi prezentaciju.</div><img id="nextPicture" class="hidden" alt="Naredni slajd"><iframe id="peek" title="Tihi pregled narednog slajda" class="hidden" tabindex="-1" aria-hidden="true" sandbox="allow-scripts allow-same-origin"></iframe></div><div class="count" id="count"></div><div class="clockbox"><div class="clock" id="clock"></div><div class="date" id="date"></div><div class="redbrand">De-Max</div></div></aside></div>
<dialog id="dialog"><form id="linkForm"><h2 id="dialogTitle">Dodaj link</h2><label for="label">Naziv lekcije / igre</label><input id="label" placeholder="Lektion 1 ili Spiel"><label for="url">GitHub Pages ili drugi HTTPS link</label><input id="url" type="url" placeholder="https://..." required><footer><button type="button" id="cancel">Otkaži</button><button class="blue" type="submit">Dodaj</button></footer></form></dialog>
<script>
const $=id=>document.getElementById(id), main=$('main'), peek=$('peek');
const key='demax-presenter-list-v1';
const defaults=[{id:'quiz',name:'DE-MAX Spiel',kind:'link',url:'https://nemackidemax13-oss.github.io/Biografije-A1/DEMAX-SPIEL/DEMAX-QUIZ-POWERPOINT.html?v=9'}];
let items;try{items=JSON.parse(localStorage.getItem(key))||defaults}catch{items=defaults}
const categories=[
{id:'a1-lessons',name:'A1 lekcije',color:'#1559b1'},
{id:'a2-lessons',name:'A2 lekcije',color:'#19804e'},
{id:'b1-lessons',name:'B1 lekcije',color:'#7845b4'},
{id:'a1-prep',name:'A1 pripreme',color:'#2179c1'},
{id:'a2-prep',name:'A2 pripreme',color:'#0c827f'},
{id:'b1-osd',name:'B1 pripreme ÖSD',color:'#b02e45'},
{id:'b1-telc',name:'B1 pripreme TELC',color:'#bd6c13'},
{id:'b1-dtz',name:'B1 pripreme DTZ',color:'#4459ad'},
{id:'b1-ecl',name:'B1 pripreme ECL',color:'#9a397e'}];
if(!Array.isArray(items))items=defaults;
items.forEach(item=>{if(!categories.some(c=>c.id===item.category))item.category='a1-lessons'});
let activeCategory=null, pendingCategory=null;
let current=null, generation=0, previewReady=false, lastTarget='', busy=false, staticSlides=null;
const nextPicture=$('nextPicture');
const localFiles=new Map();
const db=new Promise(resolve=>{try{const r=indexedDB.open('demax-presenter-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('html');r.onsuccess=()=>resolve(r.result);r.onerror=()=>resolve(null)}catch{resolve(null)}});
async function store(id,html){localFiles.set(id,html);const d=await db;if(!d)return;return new Promise(resolve=>{const tx=d.transaction('html','readwrite');tx.objectStore('html').put(html,id);tx.oncomplete=resolve;tx.onerror=resolve;tx.onabort=resolve})}
async function read(id){if(localFiles.has(id))return localFiles.get(id);const d=await db;if(!d)return null;return new Promise(resolve=>{const r=d.transaction('html').objectStore('html').get(id);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>resolve(null)})}
function save(){try{localStorage.setItem(key,JSON.stringify(items))}catch{$('status').textContent='Spisak nije sačuvan.'}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function render(){
 const box=$('categories');box.replaceChildren();
 for(const cat of categories){
  const section=document.createElement('div'), button=document.createElement('button');
  button.className='category'+(activeCategory===cat.id?' active':'');
  button.style.setProperty('--cat',cat.color);button.setAttribute('aria-expanded',String(activeCategory===cat.id));
  const label=document.createElement('span');label.textContent=cat.name;const chev=document.createElement('span');chev.className='chev';chev.textContent=activeCategory===cat.id?'▾':'▸';button.append(label,chev);
  button.onclick=()=>{activeCategory=activeCategory===cat.id?null:cat.id;render()};section.append(button);
  if(activeCategory===cat.id){
   const body=document.createElement('div');body.className='category-content';
   const add=document.createElement('div');add.className='add';
   const web=document.createElement('button');web.className='blue';web.textContent='+ GitHub link';web.onclick=()=>{pendingCategory=cat.id;$('linkForm').reset();$('dialogTitle').textContent='Dodaj link – '+cat.name;$('dialog').showModal()};
   const file=document.createElement('button');file.className='local';file.textContent='+ HTML sa računara';file.onclick=()=>{pendingCategory=cat.id;$('file').click()};add.append(web,file);body.append(add);
   const members=items.map((item,i)=>({item,i})).filter(x=>x.item.category===cat.id);
   if(!members.length){const p=document.createElement('p');p.className='category-empty';p.textContent='Još nema dodatih lekcija.';body.append(p)}
   members.forEach(({item,i},position)=>{
    const row=document.createElement('div');row.className='item'+(current?.id===item.id?' active':'');
    const n=document.createElement('button');n.className='name';n.textContent=(position+1)+'. '+item.name;const s=document.createElement('small');s.textContent=item.kind==='file'?'HTML':'Web';n.append(s);n.onclick=()=>openItem(item);row.append(n);
    [['↑',()=>move(i,-1)],['↓',()=>move(i,1)],['×',()=>remove(i)]].forEach(([t,fn],j)=>{const b=document.createElement('button');b.className='mini';b.textContent=t;b.title=['Pomeri gore','Pomeri dole','Ukloni'][j];b.disabled=(j===0&&position===0)||(j===1&&position===members.length-1);b.onclick=fn;row.append(b)});body.append(row);
   });section.append(body)
  }box.append(section)
 }
}
function move(i,d){const same=items.map((item,index)=>({item,index})).filter(x=>x.item.category===items[i].category);const p=same.findIndex(x=>x.index===i),j=same[p+d]?.index;if(j==null)return;[items[i],items[j]]=[items[j],items[i]];save();render()}
function remove(i){const item=items[i];if(!confirm('Ukloniti '+item.name+' iz spiska?'))return;items.splice(i,1);if(current?.id===item.id){current=null;generation++;main.removeAttribute('srcdoc');main.src='about:blank';main.classList.add('hidden');$('empty').classList.remove('hidden');clearPreview('Izaberi prezentaciju.')}save();render()}
function clearPreview(text){staticSlides=null;nextPicture.classList.add('hidden');nextPicture.removeAttribute('src');previewReady=false;lastTarget='';peek.classList.add('hidden');peek.removeAttribute('srcdoc');peek.src='about:blank';$('previewMsg').classList.remove('hidden');$('previewMsg').textContent=text;$('count').textContent=''}
function message(t){nextPicture.classList.add('hidden');peek.classList.add('hidden');$('previewMsg').classList.remove('hidden');$('previewMsg').textContent=t}
function scaled(){const w=main.clientWidth||1000,h=main.clientHeight||650,b=$('preview');const scale=Math.min(b.clientWidth/w,b.clientHeight/h);peek.style.width=w+'px';peek.style.height=h+'px';peek.style.transform='scale('+scale+')';peek.style.left=(b.clientWidth-w*scale)/2+'px';peek.style.top=(b.clientHeight-h*scale)/2+'px'}
function doc(f){try{return f.contentDocument?.documentElement?f.contentDocument:null}catch{return null}}
function counter(d){if(!d)return null;const els=d.querySelectorAll('[id*="count" i],[id*="page" i],[id*="slide" i],[class*="count" i],[class*="page" i],[class*="progress" i],span,small,div');for(const e of els){if(e.children.length>0||!e.getClientRects().length)continue;const m=(e.textContent||'').trim().match(/^(\d{1,3})\s*(?:\/|von|od|of)\s*(\d{1,3})$/i);if(m&&+m[1]>=1&&+m[2]>=+m[1]&&+m[2]>1)return [+m[1],+m[2]]}return null}
function nav(d,dir){if(!d)return null;const list=[...d.querySelectorAll('button,[role="button"],a,input[type="button"]')].filter(x=>x.getClientRects().length&&!x.disabled&&x.getAttribute('aria-disabled')!=='true');const pat=dir>0?/^(weiter|next|sledeć[ai]|sledec[ai]|naredni|napred|→|›|❯)(?:\s|$)/i:/^(zurück|back|previous|nazad|prethodni|←|‹|❮)(?:\s|$)/i;const idpat=dir>0?/^(next|nextbtn|btnnext|nextslide|weiter|forward)$/i:/^(prev|previous|prevbtn|btnprev|prevslide|back|zuruck)$/i;return list.find(x=>idpat.test(x.id.replace(/[-_]/g,'')))||list.find(x=>pat.test((x.getAttribute('aria-label')||x.title||x.textContent||x.value||'').trim()))}
const muteCode="(()=>{try{window.AudioContext=window.webkitAudioContext=function(){return new Proxy({currentTime:0,state:'suspended',destination:{},resume:()=>Promise.resolve(),suspend:()=>Promise.resolve(),close:()=>Promise.resolve()},{get:(o,k)=>k in o?o[k]:(()=>({connect(){return this},disconnect(){},start(){},stop(){},gain:{value:0,setValueAtTime(){},exponentialRampToValueAtTime(){},linearRampToValueAtTime(){}},frequency:{value:0,setValueAtTime(){},exponentialRampToValueAtTime(){},linearRampToValueAtTime(){}}}))})};}catch(e){}try{Object.defineProperty(window,'speechSynthesis',{value:{speak(){},cancel(){},pause(){},resume(){},getVoices(){return []},addEventListener(){},removeEventListener(){},speaking:false}})}catch(e){}try{HTMLMediaElement.prototype.play=function(){this.muted=true;return Promise.resolve()}}catch(e){}document.addEventListener('play',e=>{e.target.muted=true;e.target.pause()},true)})();";
function makePreview(html,base){const p=new DOMParser().parseFromString(html,'text/html');if(base){let b=p.querySelector('base');if(!b){b=p.createElement('base');p.head.prepend(b)}b.href=base}const script=p.createElement('script');script.textContent=muteCode;p.head.prepend(script);return '<!doctype html>'+p.documentElement.outerHTML}
function extractStaticSlides(html,base){try{const m=html.match(/\bconst\s+slides\s*=\s*(\[[\s\S]*?\])\s*;/);if(!m)return null;const list=JSON.parse(m[1]);if(!Array.isArray(list)||!list.length||!list.every(s=>s&&typeof s.image==='string'))return null;return list.map(s=>{if(/^data:image\//i.test(s.image))return s.image;if(!base)return null;const u=new URL(s.image,base);return /^https?:$/.test(u.protocol)?u.href:null})}catch{return null}}
async function openItem(item){const token=++generation;current=item;activeCategory=item.category;busy=false;render();$('status').textContent='Učitavanje…';$('empty').classList.add('hidden');main.classList.remove('hidden');clearPreview('Učitavanje pregleda…');main.removeAttribute('srcdoc');let html=null;
if(item.kind==='file'){html=await read(item.id);if(token!==generation)return;if(html==null){$('status').textContent='Ponovo dodaj HTML fajl.';main.src='about:blank';message('Fajl nije dostupan.');return}main.srcdoc=html}
else{main.src=item.url;if(new URL(item.url).origin===location.origin&&!/quiz|spiel|igra/i.test(new URL(item.url).pathname.split('/').filter(Boolean).pop()||'')){try{const r=await fetch(item.url);if(r.ok)html=await r.text()}catch{}}}
if(token!==generation)return;$('status').textContent='';if(!html){message('Za ovaj link nema automatskog pregleda slajdova. Original ostaje aktivan.');return}
staticSlides=extractStaticSlides(html,item.kind==='link'?item.url:null);if(staticSlides&&staticSlides.every(Boolean)){sync();return}staticSlides=null;
scaled();peek.onload=()=>{if(token!==generation||!peek.hasAttribute('srcdoc'))return;previewReady=true;scaled();sync()};peek.srcdoc=makePreview(html,item.kind==='link'?item.url:null)}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function sync(){if(busy||!current)return;const a=doc(main), c=counter(a);if(!c){if(previewReady)message('Čekam prepoznatljiv brojač slajdova…');return}$('count').textContent='Trenutno: '+c[0]+' / '+c[1];if(staticSlides){if(c[0]>=c[1]){message('Poslednji slajd.');lastTarget='end';return}const target=c[0]+1, marker=generation+':'+target, src=staticSlides[c[0]];if(!src){message('Naredni slajd nije dostupan.');return}if(lastTarget===marker)return;lastTarget=marker;peek.classList.add('hidden');$('previewMsg').classList.add('hidden');nextPicture.alt='Naredni slajd '+target;nextPicture.src=src;nextPicture.classList.remove('hidden');return}if(!previewReady)return;if(c[0]>=c[1]){message('Poslednji slajd.');lastTarget='end';return}const target=c[0]+1, marker=generation+':'+target;if(lastTarget===marker)return;busy=true;const g=generation;try{const b=doc(peek);let z=counter(b),steps=0;if(!z){message('Pregled nije kompatibilan sa ovom lekcijom.');return}while(z[0]!==target&&steps++<150){if(g!==generation)return;const n=nav(b,z[0]<target?1:-1);if(!n)break;n.click();await wait(55);if(g!==generation)return;const v=counter(b);if(!v||v[0]===z[0])break;z=v}if(g!==generation)return;if(z[0]===target){$('previewMsg').classList.add('hidden');peek.classList.remove('hidden');scaled();lastTarget=marker}else{message('Naredni slajd nije moguće automatski prikazati.');lastTarget=marker}}catch{message('Pregled nije dostupan.')}finally{if(g===generation)busy=false}}
nextPicture.onerror=()=>{if(staticSlides&&nextPicture.hasAttribute('src'))message('Naredni slajd nije moguće učitati.')};
setInterval(sync,150);window.addEventListener('resize',scaled);
$('cancel').onclick=()=>$('dialog').close();
$('linkForm').onsubmit=e=>{e.preventDefault();let u;try{u=new URL($('url').value.trim());if(u.protocol!=='https:'&&u.protocol!=='http:')throw 0}catch{alert('Unesi ispravan HTTPS link.');return}const item={id:uid(),name:$('label').value.trim()||decodeURIComponent(u.pathname.split('/').filter(Boolean).pop()||u.hostname),kind:'link',url:u.href,category:pendingCategory||activeCategory||'a1-lessons'};items.push(item);save();$('dialog').close();openItem(item)};
$('file').onchange=async e=>{let first=null;const category=pendingCategory||activeCategory||'a1-lessons';for(const f of e.target.files){const item={id:uid(),name:f.name.replace(/\.html?$/i,''),kind:'file',category};await store(item.id,await f.text());items.push(item);first??=item}save();render();if(first)openItem(first);e.target.value=''};
function updateClock(){const now=new Date();$('clock').textContent=new Intl.DateTimeFormat('sr-Latn-RS',{hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).format(now);$('date').textContent=new Intl.DateTimeFormat('sr-Latn-RS',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(now)}
updateClock();setInterval(updateClock,1000);save();render();
</script></body></html>
