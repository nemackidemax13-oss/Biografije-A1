<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DE-MAX · PowerPoint test</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf3fa;color:#172b46;font:clamp(16px,2.2vw,24px) system-ui,sans-serif}header{background:#142940;color:white;padding:12px 5%;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.72em;font-weight:700}main{max-width:1000px;margin:3vh auto;padding:0 4%}.card{background:white;border:1px solid #dce5f0;border-radius:18px;padding:clamp(18px,4vw,45px);box-shadow:0 8px 30px #193a6012}h1{font-size:1.65em;line-height:1.2;margin:12px 0 20px}p{margin:12px 0}.meta{font-size:.72em;color:#56718e;font-weight:700;letter-spacing:.05em}button,textarea,a.btn{font:inherit;border-radius:10px}button,a.btn{border:0;background:#1e62ae;color:white;cursor:pointer;padding:12px 20px;font-weight:700;text-decoration:none;display:inline-block}button:disabled{cursor:default}.green{background:#14804d}.secondary{background:#e5edf7!important;color:#184879!important}.danger{background:#a33140}textarea{width:100%;min-height:110px;padding:12px;border:1px solid #aebfd4}.opt{display:block;width:100%;text-align:left;padding:16px 20px;margin:10px 0;background:#f0f5fc;border:2px solid #dbe5f2;color:#152d4a;font-size:1.2em}.opt.good{background:#d7f5e3;border-color:#159455;color:#075b31}.opt.bad{background:#ffe3e3;border-color:#cc3745;color:#8d1424}.pill{display:inline-block;background:#dceafb;border-radius:30px;color:#174d89;padding:8px 14px;font-weight:700;font-size:.8em}.ok{color:#13804b;font-weight:800}.badtext{color:#b52b37;font-weight:800}.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #dde5ef;padding:12px 0}.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.small{font-size:.72em;color:#52667c}.warning{background:#fff1cf;color:#714c00;border-radius:10px;padding:12px}.status{font-size:.72em;color:#52667c}.hide{display:none}</style></head><body><header><span>DE-MAX TUTIN · A2</span><span id="page"></span></header><main id="root"></main><script>
"use strict";
const Q=[{q:"Ich warte ___ den Bus.",a:["auf","an","mit"],c:0},{q:"Wohin stellst du die Lampe?",a:["Neben dem Sofa.","Neben das Sofa.","Neben der Sofa."],c:1},{q:"Ich bleibe ___ in Berlin.",a:["ein Tag","einem Tag","einen Tag"],c:2}];
const p=new URLSearchParams(location.search),raw=p.get("slide")||"start",page=["start","1","2","3","results"].includes(raw)?raw:"start",key="demax-ppt-split-v1-"+(p.get("session")||"demo"),root=document.getElementById("root");
let state=null,storageOK=true,channel=null,draft=null;
const esc=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function read(){try{let v=localStorage.getItem(key);state=v?JSON.parse(v):null}catch(e){storageOK=false}return state}
function save(s){state=s;try{localStorage.setItem(key,JSON.stringify(s));storageOK=true}catch(e){storageOK=false}channel?.postMessage({type:"state",state:s});}
try{channel=new BroadcastChannel(key);channel.onmessage=e=>{if(e.data?.type==="state"){state=e.data.state;render(false)}else if(e.data?.type==="hello"&&state){channel.postMessage({type:"state",state})}}}catch(e){}
function link(v){let u=new URL(location.href);u.searchParams.set("slide",v);return esc(u.href)}
function nav(v,label){return '<a class="btn secondary" href="'+link(v)+'">'+label+'</a>'}
function warning(){return storageOK?"":'<p class="warning">Pregledač blokira čuvanje podataka. Prenos bodova između odvojenih slajdova možda neće raditi.</p>'}
function render(sync=true){if(sync)read();const label=page==="start"?"REGISTRACIJA":page==="results"?"RANG-LISTA":"PITANJE "+page+" / 3";document.getElementById("page").textContent=label;
if(page==="start"){root.innerHTML='<section class="card"><div class="meta">SLIDE 1 · TEST</div><h1>Registracija učenika</h1><p>Unesi imena, po jedno u svakom redu (najviše 12).</p><textarea id="names" maxlength="600">'+esc(draft??state?.names?.join("\n")??"Učenik 1\nUčenik 2")+'</textarea><div class="bar"><button class="green" id="start">Pokreni / resetuj kviz</button>'+nav("1","Pitanje 1 →")+'</div><p id="status" class="status">'+(state?'Aktivna vežba: '+state.names.length+' učenika.':'Još nema aktivne vežbe.')+'</p>'+warning()+'<p class="small">U PowerPoint-u posle registracije ručno pređi na sledeći slajd. Dugmad sa strelicom služe samo za testiranje u pregledaču.</p></section>';
document.getElementById("names").oninput=e=>draft=e.target.value;document.getElementById("start").onclick=()=>{let n=document.getElementById("names").value.split(/\n/).map(x=>x.trim()).filter(Boolean);if(n.length<1||n.length>12||new Set(n.map(x=>x.toLowerCase())).size!==n.length){alert("Unesi 1–12 različitih imena.");return}draft=n.join("\n");save({names:n,answers:{},id:Date.now()});render(false);document.getElementById("status").textContent="✓ Učenici su registrovani. Pređi na slajd 2."};return}
if(!state?.names?.length){root.innerHTML='<section class="card"><h1>Prvo registruj učenike</h1><p>Nema aktivne vežbe u ovom prozoru.</p>'+nav("start","Registracija")+warning()+'</section>';return}
let scores=state.names.map((n,i)=>({n,v:Q.reduce((sum,q,k)=>sum+(k%state.names.length===i&&state.answers[k]===q.c?1:0),0)}));
if(page==="results"){scores.sort((a,b)=>b.v-a.v);root.innerHTML='<section class="card"><div class="meta">SLIDE 5</div><h1>🏆 Rang-lista</h1><p>'+Object.keys(state.answers).length+' / 3 odgovorena pitanja</p>'+scores.map(x=>'<div class="row"><b>'+(1+scores.filter(y=>y.v>x.v).length)+'. '+esc(x.n)+'</b><strong>'+x.v+' bod.</strong></div>').join("")+'<div class="bar">'+nav("3","← Pitanje 3")+nav("start","Nova registracija")+'</div>'+warning()+'</section>';return}
let i=Number(page)-1,q=Q[i],ans=state.answers[i],answered=ans!==undefined;root.innerHTML='<section class="card"><div class="meta">SLIDE '+(i+2)+' · PITANJE '+page+' / 3</div><p class="pill">Na redu: '+esc(state.names[i%state.names.length])+'</p><h1>'+esc(q.q)+'</h1>'+q.a.map((a,k)=>'<button class="opt '+(answered?(k===q.c?"good":k===ans?"bad":""):"")+'" data-k="'+k+'" '+(answered?"disabled":"")+'>'+String.fromCharCode(65+k)+'. '+esc(a)+'</button>').join("")+(answered?'<p class="'+(ans===q.c?"ok":"badtext")+'">'+(ans===q.c?"✓ Richtig!":"✗ Leider falsch.")+'</p>':'')+'<div class="bar">'+nav(i===0?"start":String(i),"← Nazad")+nav(i===2?"results":String(i+2),i===2?"Rang-lista →":"Sledeće →")+'</div>'+warning()+'<p class="small">Klikni odgovor. Za sledeće pitanje koristi naredni PowerPoint slajd.</p></section>';
root.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{read();if(!state||state.answers[i]!==undefined){render(false);return}let k=Number(b.dataset.k);state.answers[i]=k;save(state);try{let C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=k===q.c?650:260;g.gain.setValueAtTime(.035,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.2);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.21);o.onended=()=>c.close()}catch(e){}render(false)})}
window.addEventListener("storage",e=>{if(e.key===key)render()});window.addEventListener("focus",()=>render());document.addEventListener("visibilitychange",()=>{if(!document.hidden)render()});render();channel?.postMessage({type:"hello"});
</script></body></html>
