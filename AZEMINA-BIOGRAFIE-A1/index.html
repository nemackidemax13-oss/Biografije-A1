<script>
const topics=[["Biografie","Predstavljanje",["Guten Tag. Mein Name ist Azemina.","Ich bin 23 Jahre alt.","Ich bin verheiratet.","Ich bin Schneiderin von Beruf.","Aber ich arbeite zurzeit nicht als Schneiderin."],["Dobar dan. Moje ime je Azemina.","Imam 23 godine.","Udata sam.","Po zanimanju sam krojačica.","Ali trenutno ne radim kao krojačica."]],["Familie","Porodica",["Ich bin seit drei Monaten verheiratet.","Mein Mann heißt Armin.","Er ist 27 Jahre alt.","Er ist Elektriker von Beruf.","Er lebt und arbeitet in Gera, in Deutschland.","Wir haben keine Kinder."],["U braku sam tri meseca.","Moj muž se zove Armin.","On ima 27 godina.","Po zanimanju je električar.","On živi i radi u Geri, u Nemačkoj.","Nemamo dece."]],["Hobbys","Hobiji",["Meine Hobbys sind Kochen und Spazierengehen.","Ich höre auch gern Musik.","Manchmal lerne ich in meiner Freizeit Deutsch."],["Moji hobiji su kuvanje i šetnja.","Takođe rado slušam muziku.","Ponekad u slobodno vreme učim nemački."]],["Lieblingsessen","Omiljena hrana",["Mein Lieblingsessen ist Pizza.","Ich esse auch gern Spaghetti und Salat.","Manchmal koche ich zu Hause."],["Moje omiljeno jelo je pica.","Rado jedem i špagete i salatu.","Ponekad kuvam kod kuće."]],["Lieblingsgetränk","Omiljeno piće",["Mein Lieblingsgetränk ist Kaffee.","Ich trinke auch gern Tee.","Ich trinke jeden Tag Wasser."],["Moje omiljeno piće je kafa.","Rado pijem i čaj.","Svakog dana pijem vodu."]],["Sprachen / Deutsch","Jezici / nemački",["Ich spreche Serbisch und ein bisschen Deutsch.","Ich lerne Deutsch.","Ich möchte noch besser Deutsch sprechen."],["Govorim srpski i malo nemački.","Učim nemački.","Želim da govorim nemački još bolje."]],["Freizeit","Slobodno vreme",["In meiner Freizeit koche ich gern.","Ich räume auch mein Haus auf.","Manchmal telefoniere ich mit meinem Mann."],["U slobodno vreme rado kuvam.","Takođe sređujem svoju kuću.","Ponekad razgovaram telefonom sa svojim mužem."]],["Sport / mag gern","Sport / šta volim",["Ich gehe gern spazieren.","Ich mache nicht oft Sport.","Aber ich finde Sport gut für die Gesundheit."],["Volim da šetam.","Ne bavim se često sportom.","Ali mislim da je sport dobar za zdravlje."]],["Musik","Muzika",["Ich höre sehr gern Musik.","Ich höre Volksmusik und Popmusik.","Manchmal höre ich beim Kochen Musik."],["Veoma rado slušam muziku.","Slušam narodnu i pop muziku.","Ponekad slušam muziku dok kuvam."]],["Bücher","Knjige",["Ich lese manchmal Bücher.","Ich lese auch kurze Texte auf Deutsch.","So lerne ich neue Wörter."],["Ponekad čitam knjige.","Čitam i kratke tekstove na nemačkom.","Tako učim nove reči."]],["Lieblingskleidung","Omiljena odeća",["Ich trage gern Kleider und Blusen.","Ich mag auch Hosen und Jacken.","Meine Kleidung soll bequem sein."],["Rado nosim haljine i bluze.","Volim i pantalone i jakne.","Moja odeća treba da bude udobna."]],["Freunde / Freundin","Prijatelji / prijateljica",["Ich treffe gern meine Freundinnen.","Wir trinken zusammen Kaffee.","Wir sprechen und gehen manchmal spazieren."],["Rado se viđam sa svojim prijateljicama.","Zajedno pijemo kafu.","Razgovaramo i ponekad idemo u šetnju."]],["Urlaub","Odmor / putovanja",["Ich mache gern Urlaub.","Ich fahre gern ans Meer.","Ich möchte auch Gera in Deutschland besuchen."],["Volim da idem na odmor.","Volim da idem na more.","Želela bih da posetim i Geru u Nemačkoj."]],["Was ich gern mache","Šta volim da radim",["Ich lerne gern Deutsch.","Ich mache meine Hausaufgaben.","Ich koche auch gern und gehe spazieren."],["Volim da učim nemački.","Radim domaće zadatke.","Rado i kuvam i šetam."]],["Arbeit / Beruf / Job","Posao / zanimanje",["Ich bin Schneiderin von Beruf.","Zurzeit arbeite ich nicht in meinem Beruf.","Mein Mann ist Elektriker und arbeitet in Deutschland."],["Po zanimanju sam krojačica.","Trenutno ne radim u svom zanimanju.","Moj muž je električar i radi u Nemačkoj."]],["Tiere / Haustiere","Životinje / kućni ljubimci",["Ich mag Hunde und Katzen.","Mein Lieblingstier ist eine Katze.","Ich habe keine Haustiere."],["Volim pse i mačke.","Moja omiljena životinja je mačka.","Nemam kućne ljubimce."]],["Filme","Filmovi",["Ich sehe gern Filme.","Besonders mag ich Komödien.","Am Wochenende sehe ich manchmal einen Film."],["Volim da gledam filmove.","Posebno volim komedije.","Vikendom ponekad gledam neki film."]],["Lieblingsfarbe","Omiljena boja",["Meine Lieblingsfarbe ist Rot.","Ich mag auch Weiß und Schwarz.","Diese Farben gefallen mir sehr."],["Moja omiljena boja je crvena.","Volim i belu i crnu.","Ove boje mi se veoma sviđaju."]],["Wohnort / woher ich komme","Mesto stanovanja / odakle dolazim",["Ich komme aus Serbien, aus Sjenica.","Dort lebe ich mit meiner Familie.","Sjenica ist eine schöne Stadt."],["Dolazim iz Srbije, iz Sjenice.","Tamo živim sa svojom porodicom.","Sjenica je lep grad."]],["Lieblingslied","Omiljena pesma",["Ich höre gern Volksmusik.","Mein Lieblingslied ist „Miljacka“.","Das Lied singt Halid Bešlić."],["Rado slušam narodnu muziku.","Moja omiljena pesma je „Miljacka“.","Tu pesmu peva Halid Bešlić."]]];let index=0,utter=null;const $=id=>document.getElementById(id);const synth=window.speechSynthesis;
let selectedRate=.8;
let playToken=0;let currentSentence=-1;let sentencePage=0;
function showSentence(i){
const count=topics[index][2].length;
sentencePage=Math.max(0,Math.min(i,count-1));
Array.from($('sentences').children).forEach((line,j)=>line.classList.toggle('current',j===sentencePage));
$('sentenceCount').textContent=(sentencePage+1)+' / '+count;
$('sentencePrev').disabled=sentencePage===0;
$('sentenceNext').disabled=sentencePage>=count-1;
}
function clearHighlight(){document.querySelectorAll('.line.reading').forEach(el=>el.classList.remove('reading'));$('heading').classList.remove('reading-title');currentSentence=-1}
function highlight(i){clearHighlight();showSentence(i);const line=$('sentences').children[i];if(line){currentSentence=i;line.classList.add('reading');$('heading').classList.add('reading-title');if(window.matchMedia('(min-width:650px)').matches)line.scrollIntoView({block:'nearest',behavior:'smooth'})}}
function stop(){playToken++;if(synth)synth.cancel();utter=null;clearHighlight();$('pause').textContent='⏸ Pauza'}
function speakSentence(i,token,auto){if(token!==playToken)return;const sentences=topics[index][2];if(i>=sentences.length){clearHighlight();utter=null;return}highlight(i);utter=new SpeechSynthesisUtterance(sentences[i]);utter.lang='de-DE';utter.rate=selectedRate;utter.pitch=1;const voices=synth.getVoices().filter(v=>v.lang.toLowerCase().startsWith('de'));if(voices.length)utter.voice=voices.find(v=>v.lang==='de-DE')||voices[0];utter.onend=()=>{if(token!==playToken)return;if(auto)speakSentence(i+1,token,true);else clearHighlight()};utter.onerror=()=>{if(token===playToken)clearHighlight()};synth.speak(utter)}
function speak(i,auto=false){if(!synth){alert('Vaš pregledač ne podržava izgovor.');return}stop();const token=playToken;speakSentence(i,token,auto)}
function render(){stop();document.querySelector('.sheet').classList.toggle('bio-all',index===0);const t=topics[index];$('topCount').textContent=(index+1)+' / '+topics.length;$('topName').textContent=topics[index][0];$('counter').textContent=(index+1)+' / '+topics.length;$('ord').textContent=index===0?'PREDSTAVLJANJE':'TEMA '+index;$('heading').textContent=t[0];const area=$('sentences');area.textContent='';t[2].forEach((s,i)=>{const wrap=document.createElement('div');wrap.className='line';const left=document.createElement('div');left.style.flex='1';const de=document.createElement('div');de.className='de';de.textContent=s;left.append(de);{const sr=document.createElement('div');sr.className='sr';sr.textContent=t[3][i];left.append(sr)}const b=document.createElement('button');b.className='say';b.textContent='🔊';b.setAttribute('aria-label','Izgovori rečenicu '+(i+1));b.onclick=()=>speak(i,false);wrap.append(left,b);area.append(wrap)});$('prev').disabled=index===0;$('next').disabled=index===topics.length-1;$('topPrev').disabled=index===0;$('topNext').disabled=index===topics.length-1;showSentence(0)}
document.querySelectorAll('.speedbtn').forEach(btn=>btn.addEventListener('click',()=>{selectedRate=Number(btn.dataset.rate);document.querySelectorAll('.speedbtn').forEach(b=>{const on=b===btn;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on))});if(synth&&(synth.speaking||synth.paused))stop()}));$('play').onclick=()=>speak(0,true);$('pause').onclick=()=>{if(!synth)return;if(synth.paused){synth.resume();$('pause').textContent='⏸ Pauza'}else if(synth.speaking){synth.pause();$('pause').textContent='▶ Nastavi'}};$('stop').onclick=()=>{stop();$('pause').textContent='⏸ Pauza'};$('prev').onclick=()=>{if(index>0){index--;render()}};$('next').onclick=()=>{if(index<topics.length-1){index++;render()}};$('topPrev').onclick=$('prev').onclick;$('topNext').onclick=$('next').onclick;$('sentencePrev').onclick=()=>{if(sentencePage>0){stop();showSentence(sentencePage-1)}};$('sentenceNext').onclick=()=>{if(sentencePage<topics[index][2].length-1){stop();showSentence(sentencePage+1)}};render();if(synth)synth.getVoices();
</script></body></html>
