    .speed-btn,.audio-btn {border:1px solid #ffffff4c;background:#ffffff19;color:#fff;border-radius:9px;padding:8px 9px;font-weight:850;font-size:12px;}

    .main {padding:13px 14px 16px;flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;}
    .bottom{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;flex:none;background:#fff;border-top:1px solid #d7e3f1;padding:7px 7px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -4px 15px #17366a08;}
    .nav-btn{background:transparent;color:#73839a;border:0;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:3px;flex-direction:column;min-height:50px;padding:6px 1px;font-size:11px;font-weight:800;white-space:nowrap;}
    .nav-btn .symbol{font-size:20px;line-height:1;}
    .nav-btn[aria-current="page"]{background:#e9f1ff;color:#164dac;}
    .page-title {margin:1px 0 7px;line-height:1.15;font-weight:900;letter-spacing:-.45px;font-size:21px;color:#102d5a;}
    .description {margin:0 0 13px;font-size:12px;line-height:1.5;color:var(--muted);}
    .card {background:white;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--r);padding:14px;}
    .hero{background:linear-gradient(142deg,#0e3b83 0%,#215fbe 100%);color:#fff;padding:20px 18px;position:relative;overflow:hidden;}

    .hero-label{display:inline-block;background:#ffffff25;border:1px solid #ffffff33;color:#e9f6ff;border-radius:50px;padding:6px 9px;font-size:11px;font-weight:800;}
    .hero h1{font-size:25px;line-height:1.1;letter-spacing:-.7px;margin:14px 0 9px;max-width:260px;position:relative;}
    .hero p{font-size:13px;line-height:1.55;max-width:300px;color:#e0edff;position:relative;margin:0;}
    .stats {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:12px 0;}
    .stat {border-radius:15px;background:#fff;border:1px solid var(--line);text-align:center;padding:11px 5px;}
    .stat strong {display:block;color:var(--blue);font-size:22px;line-height:1.12;font-variant-numeric:tabular-nums;}
    .stat span {font-size:10px;color:var(--muted);font-weight:750;}
    .section-header {font-size:14px;font-weight:900;color:#213b65;margin:19px 0 9px;}
    .launch {display:flex;align-items:center;gap:11px;width:100%;padding:14px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:8px;box-shadow:0 2px 8px #183b6d08;}
    .launch-icon {font-size:24px;display:grid;place-items:center;background:#eaf2ff;border-radius:12px;width:45px;height:45px;flex:none;}
    .launch strong{font-size:14px;display:block;color:#153966;}
    .launch small{color:var(--muted);display:block;font-size:11px;margin-top:3px;line-height:1.4;}
    .launch-arrow{margin-left:auto;color:var(--blue);font-size:20px;font-weight:900;}
    .tip{font-size:11px;color:var(--muted);line-height:1.5;margin:13px 1px 4px;text-align:center;}
    .field{display:block;width:100%;border:1px solid #cfddee;border-radius:12px;background:white;padding:12px 11px;color:#203857;outline:none;font-size:14px;min-height:45px;}
    .field:focus{border-color:#4082d9;box-shadow:0 0 0 3px #cfe3fd;}
    .controls-row{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center;margin-bottom:9px;}
    .smallbtn {font-size:12px;font-weight:850;white-space:nowrap;padding:10px 11px;border-radius:11px;border:1px solid #bcd2f0;color:#1e509c;background:#ecf3ff;min-height:42px;}
    .select-row{display:flex;gap:8px;margin-bottom:9px;}
    .select-row .field{min-width:0;flex:1;}
    .word-card{border-radius:21px;background:#fff;border:1px solid #d7e5f6;box-shadow:0 8px 25px #133c7510;padding:17px 16px 15px;min-height:235px;display:flex;flex-direction:column;justify-content:center;}
    .eyebrow{font-size:10px;text-transform:uppercase;font-weight:850;letter-spacing:1.25px;color:#6a84a8;text-align:center;}
    .bigword {font-size:clamp(23px,6.5vw,32px);font-weight:900;letter-spacing:-.75px;text-align:center;line-height:1.16;color:#123b7d;overflow-wrap:anywhere;margin:13px 0 10px;}
    .word-trans {text-align:center;font-size:18px;line-height:1.33;font-weight:650;color:#344766;margin:2px auto 13px;max-width:95%;overflow-wrap:anywhere;}
    .word-audio {display:flex;justify-content:center;gap:9px;align-items:center;}

    .circle-btn.prime{background:var(--blue);color:white;border-color:var(--blue);padding:5px 20px;font-size:14px;font-weight:900;}
    .circle-btn.saved{background:#fff8df;color:#a16b00;border-color:#f7d986;}
    .slide-controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px;}
    .btn {border:0;border-radius:13px;padding:12px 11px;min-height:45px;font-weight:900;color:white;font-size:14px;}
    .btn.red{background:#d13f57;}
    .btn.green{background:#099067;}
    .btn.blue{background:var(--blue);}
    .btn.ghost{border:1px solid #bdd3ee;color:var(--blueDark);background:#edf4ff;}
    .btn.wide{width:100%;}
    .progress-wrap{background:#e3edf9;height:6px;overflow:hidden;border-radius:20px;margin:12px 0 7px;}
    .progress-bar{height:100%;background:linear-gradient(90deg,#18b58e,#2770cf);border-radius:20px;transition:width .2s;}
    .row-between{display:flex;align-items:center;justify-content:space-between;gap:8px;}
    .meta{font-size:11px;font-weight:750;color:#627b9c;}
    .hint{margin-top:13px;text-align:center;font-size:11px;line-height:1.5;color:#7a8ba3;}
    .search-list {margin-top:10px;display:grid;gap:7px;}

    .vocab-row span{display:block;font-size:12px;color:#516781;margin-top:3px;overflow-wrap:anywhere;}

    .filter-foot{display:flex;align-items:center;justify-content:center;gap:8px;margin:13px 0;}
    .dialogue-card{padding:15px;min-height:275px;display:flex;flex-direction:column;justify-content:center;}

    .talk-row .de{font-weight:800;font-size:14px;color:#174886;}
    .talk-row .sr{color:#5f6f84;font-size:12px;}

    .top-tools {display:flex;gap:7px;margin:10px 0;flex-wrap:wrap;}

    .quiz-intro{background:#fff;border-radius:18px;padding:18px;border:1px solid var(--line);}

    .sticky-message{position:absolute;z-index:1000;left:50%;bottom:75px;transform:translateX(-50%);max-width:550px;width:calc(100% - 30px);background:#143864;color:white;padding:11px;border-radius:12px;text-align:center;font-size:12px;box-shadow:0 5px 20px #102b5c55;display:none;}

  </style>
</head>

ebotinu."},{"speaker":"A","de":"Wo ist der Kratzer?","sr":"Gde je ogrebotina?"},{"speaker":"B","de":"An der linken Tür.","sr":"Na levim vratima."},{"speaker":"A","de":"Ich sehe den Kratzer.","sr":"Vidim ogrebotinu."},{"speaker":"B","de":"Können Sie das reparieren?","sr":"Možete li to popraviti?"},{"speaker":"A","de":"Ja, natürlich.","sr":"Da, naravno."},{"speaker":"B","de":"Wie lange dauert das?","sr":"Koliko to traje?"},{"speaker":"A","de":"Ungefähr zwei Tage.","sr":"Otprilike dva dana."},{"speaker":"B","de":"Danke für die Information.","sr":"Hvala na informaciji."}]},{"name":"03 · Oštećen branik","topic":"Karoserija","lines":[{"speaker":"A","de":"Schau mal, die Stoßstange ist kaputt.","sr":"Pogledaj, branik je oštećen."},{"speaker":"B","de":"Ist das die vordere Stoßstange?","sr":"Da li je to prednji branik?"},{"speaker":"A","de":"Ja, genau.","sr":"Da, upravo tako."},{"speaker":"B","de":"Brauchen wir ein neues Teil?","sr":"Treba li nam novi deo?"},{"speaker":"A","de":"Nein, wir können das reparieren.","sr":"Ne, možemo to popraviti."},{"speaker":"B","de":"Was machen wir zuerst?","sr":"Šta prvo radimo?"},{"speaker":"A","de":"Wir reinigen die Stoßstange.","sr":"Čistimo branik."},{"speaker":"B","de":"Und dann?","sr":"A onda?"},{"speaker":"A","de":"Dann schleifen wir die Fläche.","sr":"Onda brusimo površinu."},{"speaker":"B","de":"Alles klar!","sr":"Sve jasno!"}]},{"name":"04 · Priprema lima","topic":"Priprema","lines":[{"speaker":"A","de":"Ist das Blech sauber?","sr":"Da li je lim čist?"},{"speaker":"B","de":"Nein, es ist noch schmutzig.","sr":"Ne, još je prljav."},{"speaker":"A","de":"Bitte wasch die Stelle.","sr":"Molim te operi to mesto."},{"speaker":"B","de":"Mit Wasser?","sr":"Vodom?"},{"speaker":"A","de":"Ja, und dann gut trocknen.","sr":"Da, a zatim dobro osušiti."},{"speaker":"B","de":"Brauchen wir den Entfetter?","sr":"Treba li nam odmašćivač?"},{"speaker":"A","de":"Ja, das ist wichtig.","sr":"Da, to je važno."},{"speaker":"B","de":"Jetzt ist das Blech sauber.","sr":"Sada je lim čist."},{"speaker":"A","de":"Sehr gut. Wir können beginnen.","sr":"Vrlo dobro. Možemo početi."},{"speaker":"B","de":"Ich hole das Material.","sr":"Doneću materijal."}]},{"name":"05 · Mešanje gita","topic":"Gitovanje","lines":[{"speaker":"A","de":"Wo ist die Spachtelmasse?","sr":"Gde je git masa?"},{"speaker":"B","de":"Hier, auf dem Tisch.","sr":"Ovde, na stolu."},{"speaker":"A","de":"Wir brauchen auch Härter.","sr":"Treba nam i učvršćivač."},{"speaker":"B","de":"Wie viel Härter brauchen wir?","sr":"Koliko učvršćivača nam treba?"},{"speaker":"A","de":"Bitte lies die Anleitung.","sr":"Molim te pročitaj uputstvo."},{"speaker":"B","de":"Okay, ich lese die Anleitung.","sr":"U redu, čitam uputstvo."},{"speaker":"A","de":"Jetzt mischen wir alles.","sr":"Sada sve mešamo."},{"speaker":"B","de":"Ist die Mischung fertig?","sr":"Da li je mešavina gotova?"},{"speaker":"A","de":"Ja, jetzt können wir spachteln.","sr":"Da, sada možemo gitovati."},{"speaker":"B","de":"Ich nehme den Spachtel.","sr":"Uzimam špahtlu."}]},{"name":"06 · Nanošenje gita","topic":"Gitovanje","lines":[{"speaker":"A","de":"Wo ist die Delle?","sr":"Gde je udubljenje?"},{"speaker":"B","de":"Hier, an der Tür.","sr":"Ovde, na vratima."},{"speaker":"A","de":"Ich trage die Spachtelmasse auf.","sr":"Nanosim git masu."},{"speaker":"B","de":"Bitte nicht zu viel.","sr":"Molim te, ne previše."},{"speaker":"A","de":"Ist diese Schicht gut?","sr":"Da li je ovaj sloj dobar?"},{"speaker":"B","de":"Ja, aber mach sie glatt.","sr":"Da, ali izravnaj ga."},{"speaker":"A","de":"So?","sr":"Ovako?"},{"speaker":"B","de":"Ja, genau. Sehr gut.","sr":"Da, baš tako. Vrlo dobro."},{"speaker":"A","de":"Jetzt lassen wir alles trocknen.","sr":"Sada ostavljamo sve da se osuši."},{"speaker":"B","de":"Okay, wir warten.","sr":"U redu, čekamo."}]},{"name":"07 · Brušenje gita","topic":"Brušenje","lines":[{"speaker":"A","de":"Ist die Spachtelmasse trocken?","sr":"Da li je git masa suva?"},{"speaker":"B","de":"Ja, sie ist trocken.","sr":"Da, suva je."},{"speaker":"A","de":"Dann schleifen wir die Stelle.","sr":"Onda brusimo to mesto."},{"speaker":"B","de":"Welches Schleifpapier nehmen wir?","sr":"Koju šmirglu uzimamo?"},{"speaker":"A","de":"Nimm zuerst das grobe Papier.","sr":"Uzmi prvo grubi papir."},{"speaker":"B","de":"Und danach?","sr":"A posle toga?"},{"speaker":"A","de":"Danach nehmen wir feines Papier.","sr":"Posle uzimamo fini papir."},{"speaker":"B","de":"Jetzt ist die Fläche glatt.","sr":"Sada je površina glatka."},{"speaker":"A","de":"Super! Bitte prüfe die Kante.","sr":"Super! Molim te proveri ivicu."},{"speaker":"B","de":"Die Kante ist auch glatt.","sr":"I ivica je glatka."}]},{"name":"08 · Priprema podloge","topic":"Prajmer","lines":[{"speaker":"A","de":"Die Tür ist jetzt glatt.","sr":"Vrata su sada glatka."},{"speaker":"B","de":"Was machen wir als Nächstes?","sr":"Šta radimo sledeće?"},{"speaker":"A","de":"Wir tragen Grundierung auf.","sr":"Nanosimo osnovni premaz."},{"speaker":"B","de":"Wo steht die Grundierung?","sr":"Gde stoji prajmer?"},{"speaker":"A","de":"Im Regal, links.","sr":"Na polici, levo."},{"speaker":"B","de":"Soll ich die Dose holen?","sr":"Da li da donesem limenku?"},{"speaker":"A","de":"Ja, bitte.","sr":"Da, molim te."},{"speaker":"B","de":"Wie viele Schichten brauchen wir?","sr":"Koliko slojeva nam treba?"},{"speaker":"A","de":"Wir lesen zuerst die Anleitung.","sr":"Prvo čitamo uputstvo."},{"speaker":"B","de":"Gut, ich lese sie.","sr":"Dobro, čitam ga."}]},{"name":"09 · Prajmer se suši","topic":"Prajmer","lines":[{"speaker":"A","de":"Ist die Grundierung schon trocken?","sr":"Da li je prajmer već suv?"},{"speaker":"B","de":"Noch nicht.","sr":"Još nije."},{"speaker":"A","de":"Wie lange müssen wir warten?","sr":"Koliko dugo moramo čekati?"},{"speaker":"B","de":"Das steht auf der Dose.","sr":"To piše na limenci."},{"speaker":"A","de":"Kann ich die Tür schon schleifen?","sr":"Mogu li već da brusim vrata?"},{"speaker":"B","de":"Nein, bitte warte noch.","sr":"Ne, molim te sačekaj još."},{"speaker":"A","de":"Okay, ich mache eine Pause.","sr":"U redu, pravim pauzu."},{"speaker":"B","de":"Gute Idee.","sr":"Dobra ideja."},{"speaker":"A","de":"Sag mir, wenn es trocken ist.","sr":"Reci mi kada bude suvo."},{"speaker":"B","de":"Ja, natürlich.","sr":"Da, naravno."}]},{"name":"10 · Izbor boje","topic":"Boje","lines":[{"speaker":"A","de":"Welche Farbe hat das Auto?","sr":"Koje je boje auto?"},{"speaker":"B","de":"Das Auto ist dunkelblau.","sr":"Auto je tamnoplav."},{"speaker":"A","de":"Haben wir diese Farbe?","sr":"Imamo li ovu boju?"},{"speaker":"B","de":"Ich schaue nach.","sr":"Pogledaću."},{"speaker":"A","de":"Hier ist der Farbcode.","sr":"Ovde je kod boje."},{"speaker":"B","de":"Danke. Ich prüfe die Nummer.","sr":"Hvala. Proveravam broj."},{"speaker":"A","de":"Passt die Farbe?","sr":"Da li boja odgovara?"},{"speaker":"B","de":"Ja, sie passt gut.","sr":"Da, dobro odgovara."},{"speaker":"A","de":"Dann mischen wir den Lack.","sr":"Onda mešamo boju."},{"speaker":"B","de":"Gut, ich hole den Mischbecher.","sr":"Dobro, donosim posudu za mešanje."}]},{"name":"11 · Mešanje boje","topic":"Boje","lines":[{"speaker":"A","de":"Wir brauchen den Basislack.","sr":"Treba nam bazna boja."},{"speaker":"B","de":"Hier ist der Lack.","sr":"Evo boje."},{"speaker":"A","de":"Wo ist der Mischbecher?","sr":"Gde je posuda za mešanje?"},{"speaker":"B","de":"Auf dem Arbeitstisch.","sr":"Na radnom stolu."},{"speaker":"A","de":"Bitte lies das Mischungsverhältnis.","sr":"Molim te pročitaj odnos mešanja."},{"speaker":"B","de":"Ja, es steht auf der Verpackung.","sr":"Da, piše na pakovanju."},{"speaker":"A","de":"Jetzt mische ich die Farbe.","sr":"Sada mešam boju."},{"speaker":"B","de":"Bitte rühre sie gut um.","sr":"Molim te dobro je promešaj."},{"speaker":"A","de":"Die Farbe ist fertig.","sr":"Boja je spremna."},{"speaker":"B","de":"Super!","sr":"Super!"}]},{"name":"12 · Pištolj za farbanje","topic":"Farbanje","lines":[{"speaker":"A","de":"Wo ist die Lackierpistole? const WORDS = DATA.vocab;

const MAIN = document.getElementById('view');
const storageKey='demax-auto-a1-v2';
let saved={};
try {saved=JSON.parse(localStorage.getItem(storageKey)||'{}')||{};}catch(e){saved={};}
let favorites = new Set((saved.favorites||[]).filter(i=>Number.isInteger(i)&&i>=0&&i<WORDS.length));
let bestQuiz = Number(saved.bestQuiz||0);
const state={page:'home',cat:-1,wordIndex:0,wordMode:'cards',search:'',listPage:0,dialogueIndex:0,lineIndex:0,allLines:false,showTranslation:true,quiz:null,quizCat:-1,quizDirection:'de-sr',quizLength:10,speed:Number(saved.speed||.85)};
const safe=(s)=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const countLines=DIALOGUES.reduce((n,x)=>n+x.lines.length,0);
let voices=[],speechToken=0,currentlySpeaking=false,paused=false,toastTimer=null;
const synth=window.speechSynthesis||null;
function persist(){try{localStorage.setItem(storageKey,JSON.stringify({favorites:[...favorites],bestQuiz,speed:state.speed}));}catch(e){}}
function loadVoices(){try{voices=synth?synth.getVoices():[];}catch(e){voices=[];}}
loadVoices(); if(synth){synth.onvoiceschanged=loadVoices;}
function voiceFor(speaker){const de=voices.filter(v=>/^de([_-]|$)/i.test(v.lang));return de.length ? (speaker==='B'&&de.length>1?de[1]:de[0]):null;}
function stopSpeech(){++speechToken;currentlySpeaking=false;paused=false;try{if(synth)synth.cancel();}catch(e){};updatePauseBtn();}
function updatePauseBtn(){const el=document.getElementById('pauseBtn');el.textContent=paused?'▶':'⏸';el.setAttribute('aria-label',paused?'Nastavi izgovor':'Pauziraj izgovor');}
function talk(text,speaker='A',token){return new Promise(resolve=>{
  if(!synth||typeof SpeechSynthesisUtterance==='undefined'){toast('Ovaj pregledač ne podržava izgovor. Otvorite u Chrome ili Safari.');resolve();return;}
  if(token!==speechToken){resolve();return;}
  const utterance=new SpeechSynthesisUtterance(text);
  utterance.lang='de-DE';utterance.rate=state.speed;utterance.pitch=speaker==='B'?0.98:1.02;
  const v=voiceFor(speaker);if(v)utterance.voice=v;
  let settled=false;const settle=()=>{if(!settled){settled=true;resolve();}};
  utterance.onend=settle; utterance.onerror=settle;
  try{synth.speak(utterance);}catch(e){toast('Izgovor nije dostupan na ovom uređaju.');settle();}
});}
async function speakOnce(text,speaker='A'){stopSpeech();const token=speechToken;currentlySpeaking=true;await talk(text,speaker,token);if(speechToken===token){currentlySpeaking=false;}}
async function speakSeries(rows,kind='dialogue'){
  stopSpeech();const token=speechToken;currentlySpeaking=true;
  for(let i=0;i<rows.length;i++){
    if(token!==speechToken)break;
    if(kind==='dialogue'&&state.page==='dialogues'){
      state.lineIndex=i;
      if(state.allLines){document.querySelectorAll('.talk-row').forEach((e,k)=>e.classList.toggle('playing',k===i));document.querySelectorAll('.talk-row')[i]?.scrollIntoView({block:'nearest',behavior:'smooth'});}
      else renderDialogues(false);
    }
    if(kind==='words'&&state.page==='words'){
      state.wordIndex=i;
      renderWords(false);
    }
    await talk(rows[i].de,rows[i].speaker||'A',token);
    // Yield to allow browsers to start the next utterance.
    await new Promise(r=>setTimeout(r,130));
  }
  if(token===speechToken){currentlySpeaking=false;document.querySelectorAll('.talk-row').forEach(e=>e.classList.remove('playing'));}
}
function toast(text){const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3200);}
function scrollTop(){MAIN.scrollTop=0;}
function setPage(page){if(state.page!==page)stopSpeech();state.page=page;render();scrollTop();}
function render(){

}

 <div class="progress-wrap"><div class="progress-bar" style="width:${(state.lineIndex+1)/d.lines.length*100}%"></div></div>
 <div class="slide-controls"><button class="btn red" data-action="line-prev" ${state.lineIndex===0&&state.dialogueIndex===0?'disabled':''}>${state.lineIndex===0?'← Prethodni dijalog':'← Prethodna'}</button><button class="btn green" data-action="line-next" ${state.lineIndex>=d.lines.length-1&&state.dialogueIndex===DIALOGUES.length-1?'disabled':''}>${state.lineIndex>=d.lines.length-1?'Sledeći dijalog →':'Sledeća →'}</button></div>`}
 <div class="slide-controls"><button class="btn ghost" data-action="dialogue-prev" ${state.dialogueIndex===0?'disabled':''}>← Prethodni dijalog</button><button class="btn blue" data-action="dialogue-next" ${state.dialogueIndex===DIALOGUES.length-1?'disabled':''}>Sledeći dijalog →</button></div>
 <div class="hint">A i B predstavljaju dve osobe. Dodirni izgovor, slušaj i naglas ponavljaj.</div>`;
 if(!keepScroll)scrollTop();
}
function randomShuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function uniqueEntries(){const seenDe=new Set(),seenSr=new Set();return WORDS.filter(w=>{if(seenDe.has(w.de)||seenSr.has(w.sr))return false;seenDe.add(w.de);seenSr.add(w.sr);return true;});}
function startQuiz(){stopSpeech();
 const dir=state.quizDirection;let pool=uniqueEntries().filter(x=>state.quizCat===-1||x.c===state.quizCat);
 if(pool.length<3){toast('Potrebno je bar 3 reči u ovoj oblasti.');return;}
 const asked=randomShuffle([...pool]).slice(0,Math.min(state.quizLength,pool.length));
 const questions=asked.map(w=>{
   const isDE=dir==='de-sr';const key=isDE?'sr':'de';
   const choices=randomShuffle([...new Set([w[key],...randomShuffle(pool.filter(z=>z[key]!==w[key])).slice(0,2).map(z=>z[key])])]);
   return {word:w,answer:w[key],choices};
 });
 state.quiz={questions,index:0,answers:[],selected:null};renderQuiz();scrollTop();
}
function quizAnswer(i){const q=state.quiz;if(!q||q.selected!==null)return;q.selected=i;q.answers.push(q.questions[q.index].choices[i]===q.questions[q.index].answer);renderQuiz();}
function quizNext(){const q=state.quiz;if(!q)return;if(q.index<q.questions.length-1){q.index++;q.selected=null;renderQuiz();scrollTop();}else{const score=q.answers.filter(Boolean).length;bestQuiz=Math.max(bestQuiz,Math.round(score/q.questions.length*100));persist();q.done=true;renderQuiz();scrollTop();}}
function renderQuiz(){let q=state.quiz;
  MAIN.innerHTML=`<h1 class="page-title">✅ A1 kviz</h1><p class="description">Vežbaj stručni rečnik kroz jednostavna pitanja.</p>${!q?
   `<div class="quiz-intro"><div class="emoji">🏆</div><h2>Koliko reči znaš?</h2><p>Reči iz svih oblasti. Odaberi način vežbanja bez padajućih menija.</p>
   <div class="quiz-setting-label">Smer prevođenja</div>
   <div class="quiz-choice-row"><button class="smallbtn" data-action="quiz-dir" data-dir="de-sr" aria-pressed="${state.quizDirection==='de-sr'}">🇩🇪 → 🇷🇸</button><button class="smallbtn" data-action="quiz-dir" data-dir="sr-de" aria-pressed="${state.quizDirection==='sr-de'}">🇷🇸 → 🇩🇪</button></div>
   <div class="quiz-setting-label">Broj pitanja</div>
   <div class="quiz-choice-row"><button class="smallbtn" data-action="quiz-len" data-len="10" aria-pressed="${state.quizLength===10}">10 pitanja</button><button class="smallbtn" data-action="quiz-len" data-len="20" aria-pressed="${state.quizLength===20}">20 pitanja</button></div>
   <button class="btn wide blue" data-action="quiz-start" style="margin-top:17px">Započni kviz →</button><div class="tip">Najbolji rezultat: ${bestQuiz}%</div></div>`:
   q.done?`<div class="quiz-result"><div style="font-size:42px">🏅</div><h2>Kviz je završen!</h2><div class="score">${q.answers.filter(Boolean).length} / ${q.questions.length}</div><p>Uspešnost: <b>${Math.round(q.answers.filter(Boolean).length/q.questions.length*100)}%</b><br>Najbolji rezultat: <b>${bestQuiz}%</b></p><button class="btn wide blue" data-action="quiz-restart">Novi kviz ↻</button><button style="margin-top:8px" class="btn wide ghost" data-action="quiz-done">Promeni oblast i opcije</button></div>`:
   renderQuizQuestion(q)}
   <div class="hint">Odgovori se obrađuju u aplikaciji; nije potreban nalog ni API ključ.</div>`;
}
function renderQuizQuestion(q){const p=q.questions[q.index],dir=state.quizDirection;return `<div class="row-between"><span class="meta">Pitanje ${q.index+1} od ${q.questions.length}</span><span class="meta">Tačno ${q.answers.filter(Boolean).length}</span></div><div class="progress-wrap"><div class="progress-bar" style="width:${q.index/q.questions.length*100}%"></div></div>
 <div class="quiz-question"><div class="eyebrow">${dir==='de-sr'?'Šta znači ova nemačka reč?':'Kako se kaže na nemačkom?'}</div><div class="quiz-word">${safe(dir==='de-sr'?p.word.de:p.word.sr)}</div>
 ${dir==='de-sr'?`<button class="smallbtn" style="display:block;margin:-12px auto 12px;" data-action="quiz-speak">🔊 Izgovor</button>`:''}
 ${p.choices.map((opt,i)=>`<button class="quiz-option ${q.selected!==null?(opt===p.answer?'good':(i===q.selected?'bad':'')):''}" data-action="quiz-answer" data-i="${i}" ${q.selected!==null?'disabled':''}><span style="display:inline-block;color:#7c8ba1;min-width:25px">${String.fromCharCode(65+i)}.</span> ${safe(opt)} ${q.selected!==null?(opt===p.answer?' ✓':(i===q.selected?' ✕':'')):''}</button>`).join('')}
 ${q.selected!==null?`<div class="notice" style="margin:11px 0">${q.answers[q.answers.length-1]?'✅ Tačno!':'❌ Netačno.'} <b>${safe(p.word.de)}</b> = ${safe(p.word.sr)}</div><button class="btn wide green" data-action="quiz-next">${q.index===q.questions.length-1?'Prikaži rezultat':'Sledeće pitanje →'}</button>`:''}
 </div>`;}
// Delegated events: accessible and resilient across rerenders.
document.querySelector('.bottom').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page);});
MAIN.addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b||b.disabled)return;
 const a=b.dataset.action,id=Number(b.dataset.id),i=Number(b.dataset.i);
 if(a==='home-word')setPage('words');
 else if(a==='home-dialogues')setPage('dialogues');
 else if(a==='home-quiz')setPage('quiz');
 else if(a==='word-mode'){state.wordMode=state.wordMode==='cards'?'list':'cards';state.listPage=0;stopSpeech();renderWords();}
 else if(a==='word-filter'){stopSpeech();state.cat=state.cat===-2?-1:-2;state.search='';state.wordIndex=0;state.listPage=0;renderWords();}
 else if(a==='word-speak'){const w=matchingWords()[state.wordIndex];if(w)speakOnce(w.de);}
 else if(a==='speak-by-id'){speakOnce(WORDS[id].de);}
 else if(a==='favorite'||a==='favorite-id'){const w=a==='favorite'?matchingWords()[state.wordIndex]:WORDS[id];if(!w)return;const idx=a==='favorite'?w.id:id;if(favorites.has(idx))favorites.delete(idx);else favorites.add(idx);persist();renderWords(true);}
 else if(a==='word-prev'||a==='word-next'){stopSpeech();state.wordIndex+=a==='word-next'?1:-1;renderWords();}
 else if(a==='word-play-ten'){const words=matchingWords(),from=state.wordIndex,to=Math.min(words.length,from+10);const subset=words.slice(from,to).map(x=>({de:x.de}));if(subset.length){ // speech cards are rendered from the current 10-word subset
      stopSpeech();const token=speechToken;currentlySpeaking=true;(async()=>{for(let k=0;k<subset.length;k++){if(token!==speechToken)break;state.wordIndex=from+k;renderWords(true);await talk(subset[k].de,'A',token);await new Promise(r=>setTimeout(r,130));}if(token===speechToken)currentlySpeaking=false;})();}}
 else if(a==='list-prev'||a==='list-next'){state.listPage+=a==='list-next'?1:-1;renderWords();}
 else if(a==='dialogue-view'){state.allLines=!state.allLines;renderDialogues();}
 else if(a==='toggle-translation'){state.showTranslation=!state.showTranslation;renderDialogues(true);}
 else if(a==='line-speak'){state.lineIndex=i;const l=DIALOGUES[state.dialogueIndex].lines[i];speakOnce(l.de,l.speaker);if(!state.allLines)renderDialogues(true);}
 else if(a==='dialogue-play-all'){speakSeries(DIALOGUES[state.dialogueIndex].lines);}
 else if(a==='dialogue-stop'){stopSpeech();toast('Izgovor je zaustavljen.');}
 else if(a==='line-prev'||a==='line-next'){stopSpeech();const d=DIALOGUES[state.dialogueIndex];if(a==='line-next'){if(state.lineIndex<d.lines.length-1)state.lineIndex++;else if(state.dialogueIndex<DIALOGUES.length-1){state.dialogueIndex++;state.lineIndex=0;}}else{if(state.lineIndex>0)state.lineIndex--;else if(state.dialogueIndex>0){state.dialogueIndex--;state.lineIndex=DIALOGUES[state.dialogueIndex].lines.length-1;}}renderDialogues();}
 else if(a==='dialogue-prev'||a==='dialogue-next'){stopSpeech();state.dialogueIndex+=a==='dialogue-next'?1:-1;state.lineIndex=0;renderDialogues();}
 else if(a==='quiz-dir'){state.quizDirection=b.dataset.dir;renderQuiz();}
 else if(a==='quiz-len'){state.quizLength=Number(b.dataset.len);renderQuiz();}
 else if(a==='quiz-start'){state.quizCat=-1;startQuiz();}
 else if(a==='quiz-answer')quizAnswer(i);
 else if(a==='quiz-next')quizNext();
 else if(a==='quiz-speak')speakOnce(state.quiz.questions[state.quiz.index].word.de);
 else if(a==='quiz-restart')startQuiz();
 else if(a==='quiz-done'){state.quiz=null;renderQuiz();}
});
MAIN.addEventListener('input',e=>{
 if(e.target.id==='search'){
  const pos=e.target.selectionStart;
  state.search=e.target.value;if(state.search.trim())state.cat=-1;state.wordIndex=0;state.listPage=0;
  renderWords(true);
  const n=document.getElementById('search');n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}
 }
});
document.getElementById('speedBtn').addEventListener('click',()=>{const a=[.7,.85,1,1.15];const i=a.findIndex(x=>Math.abs(x-state.speed)<.01);state.speed=a[(i+1)%a.length];document.getElementById('speedBtn').textContent=state.speed+'×';persist();toast('Brzina izgovora: '+state.speed+'×');});
document.getElementById('pauseBtn').addEventListener('click',()=>{
 if(!synth||!currentlySpeaking){toast('Pusti neku reč ili dijalog za slušanje.');return;}
 try{if(paused){synth.resume();paused=false;}else{synth.pause();paused=true;}updatePauseBtn();}catch(e){toast('Pauza nije podržana na ovom uređaju.');}
});
window.addEventListener('keydown',e=>{
 if(e.target.closest('input,select,textarea'))return;
 if(state.page==='words'&&state.wordMode==='cards'&&e.key==='ArrowRight'){state.wordIndex=Math.min(matchingWords().length-1,state.wordIndex+1);renderWords();}
 else if(state.page==='words'&&state.wordMode==='cards'&&e.key==='ArrowLeft'){state.wordIndex=Math.max(0,state.wordIndex-1);renderWords();}
 else if(state.page==='dialogues'&&!state.allLines&&e.key==='ArrowRight'){state.lineIndex=Math.min(DIALOGUES[state.dialogueIndex].lines.length-1,state.lineIndex+1);renderDialogues();}
 else if(state.page==='dialogues'&&!state.allLines&&e.key==='ArrowLeft'){state.lineIndex=Math.max(0,state.lineIndex-1);renderDialogues();}
});
// Keep audio under user's control when leaving the app.
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopSpeech();});
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
 window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});
}
</script>
</body>
</html>
