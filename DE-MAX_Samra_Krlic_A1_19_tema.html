<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">

<title>DE-MAX • Samra Krlic – A1 biografija i 19 tema</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1b3151;background:#f2f6fc;font-synthesis:none}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0}
.container{max-width:780px;margin:0 auto;padding:16px 12px 40px}
header{background:linear-gradient(130deg,#0b4995,#1576d7);color:#fff;border-radius:22px;padding:24px 19px 21px;box-shadow:0 10px 27px #0e5ea525}
h1{font-size:clamp(23px,4vw,29px);line-height:1.2;margin:9px 0 8px;letter-spacing:-.35px}
.subtitle{font-size:14.5px;line-height:1.5;opacity:.95;margin:0 0 15px}
.chip{display:inline-block;background:#e7f1ff;color:#135ba5;border-radius:30px;font-size:13px;font-weight:800;padding:5px 11px}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:15px 0 0}
.controls label{font-size:14px;font-weight:750}
select,button{font:inherit;border:1px solid #c9d8e8;border-radius:12px;padding:11px 12px;min-height:43px;background:white;color:#163a64}
select{max-width:100%;min-width:146px}button{cursor:pointer;font-weight:700}button:active{transform:translateY(1px)}
button.primary{background:#1364bd;color:white;border-color:#1364bd}button.primary:hover{background:#0d509e}
button.secondary:hover{background:#edf6ff}button.stop{color:#a61d2c;border-color:#ffd0d7}
button.stop:hover{background:#fff2f3}
button:focus-visible,select:focus-visible,.sentence:focus-visible{outline:3px solid #ff9c40;outline-offset:2px}
.info{display:flex;gap:9px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin:14px 2px 4px}
.info .counter{font-size:12px;font-weight:800;color:#165eaa;background:#e1efff;border-radius:20px;padding:6px 11px}
.status{flex:1;font-size:13px;line-height:1.55;color:#395777;margin:0}

.jump{display:flex;align-items:center;gap:9px;margin:0 2px 17px}.jump label{font-size:13px;font-weight:800;color:#244e7d}.jump select{flex:1;min-width:0;max-width:none}
section{border:1px solid #dce7f3;background:white;border-radius:18px;margin:13px 0;padding:17px 15px 15px;box-shadow:0 4px 14px #0b37650c;scroll-margin-top:10px}
h2{font-size:18px;margin:0 0 10px;color:#1052a1;line-height:1.3}
.sentence{font-size:16.7px;line-height:1.55;margin:0 0 6px;border-radius:9px;padding:7px 8px;border:2px solid transparent;transition:background .12s,border-color .12s}.sentence-line{display:flex;align-items:center;justify-content:space-between;gap:10px}.sentence-line .de{flex:1;min-width:0}.speaker-btn{flex:0 0 42px;display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;min-height:42px;border:1px solid #bfd6f0;border-radius:12px;padding:0;background:#e9f3ff;color:#125baa;font-size:21px;line-height:1}.speaker-btn:hover{background:#d7eafe}.speaker-btn:active{background:#bddbfb;transform:scale(.96)}.sentence.active .speaker-btn{background:#fff;color:#bd412b;border-color:#f2ad9e}
.sentence.active{background:#fff4ee;border-color:#e94c39}
.de{display:block;font-weight:600;color:#213650}.translation{display:block;font-size:13px;font-weight:500;line-height:1.55;color:#b42643;margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.actions button{font-size:13.5px;padding:10px 12px;min-height:42px}
.footer{text-align:center;color:#60788f;font-size:12px;margin:23px 0 6px}
@media (max-width:450px){.container{padding:10px 9px 27px}header{border-radius:18px;padding:21px 16px}section{padding:14px 12px;border-radius:15px}.sentence{font-size:16.3px;padding:6px}.translation{font-size:12.6px}.controls{gap:7px}.controls select{min-width:0;flex:1}.actions button{flex:1}h2{font-size:17.5px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head><body>
<main class="container">
<header><span class="chip">DE-MAX • A1</span>
<h1>Samra Krlic – nemački izgovor</h1>
<p class="subtitle">Biografija + svih 19 tema • nemačke rečenice sa prevodom • slušaj pojedinačno ili celu temu</p>
<div class="controls"><label for="speed">Brzina:</label>
<select id="speed" aria-label="Brzina izgovora"><option value="0.72">Sporo (0,72×)</option><option value="0.88" selected>Polako (0,88×)</option><option value="1">Normalno (1×)</option><option value="1.12">Brzo (1,12×)</option></select>
<button class="stop" id="stop" type="button">■ Zaustavi</button></div>
</header>
<div class="info"><p class="status" id="status" aria-live="polite">Dodirni nemačku rečenicu ili pritisni „Slušaj celu temu“ za izgovor.</p><span class="counter" id="counter"></span></div>
<div class="jump"><label for="goto">Izaberi temu:</label><select id="goto" aria-label="Pređi na temu"></select></div>
<div id="content"></div>
<p class="footer">DE-MAX • A1 • Izgovor putem govorne funkcije telefona ili računara</p>
</main>
<script>
const topics=[{"title":"Biografie – Samra Krlic","rows":[{"de":"Guten Tag.","sr":"Dobar dan."},{"de":"Ich heiße Samra Krlic.","sr":"Zovem se Samra Krlic."},{"de":"Ich bin 28 Jahre alt.","sr":"Imam 28 godina."},{"de":"Ich bin seit einem Jahr verheiratet.","sr":"U braku sam godinu dana."},{"de":"Ich habe keine Kinder.","sr":"Nemam dece."},{"de":"Ich bin Hausfrau.","sr":"Domaćica sam."},{"de":"Mein Mann heißt Zijad.","sr":"Moj muž se zove Zijad."},{"de":"Er ist 33 Jahre alt.","sr":"On ima 33 godine."},{"de":"Er arbeitet auf dem Bau in Dortmund.","sr":"On radi u građevinarstvu u Dortmundu."},{"de":"Dortmund liegt in Deutschland.","sr":"Dortmund se nalazi u Nemačkoj."}]},{"title":"1. Familie – Porodica","rows":[{"de":"Meine Familie ist klein.","sr":"Moja porodica je mala."},{"de":"Ich bin verheiratet.","sr":"Udata sam."},{"de":"Ich habe keine Kinder.","sr":"Nemam dece."},{"de":"Mein Mann heißt Zijad.","sr":"Moj muž se zove Zijad."},{"de":"Er ist 33 Jahre alt.","sr":"On ima 33 godine."},{"de":"Wir sind seit einem Jahr verheiratet.","sr":"U braku smo godinu dana."},{"de":"Mein Mann arbeitet in Dortmund.","sr":"Moj muž radi u Dortmundu."},{"de":"Meine Familie ist mir sehr wichtig.","sr":"Moja porodica mi je veoma važna."}]},{"title":"2. Hobbys – Hobiji","rows":[{"de":"Ich habe verschiedene Hobbys.","sr":"Imam različite hobije."},{"de":"Ich gehe gern spazieren.","sr":"Rado šetam."},{"de":"Zu Hause höre ich oft Musik.","sr":"Kod kuće često slušam muziku."},{"de":"Am Wochenende koche ich gern.","sr":"Vikendom rado kuvam."}]},{"title":"3. Lieblingsessen – Omiljena hrana","rows":[{"de":"Ich esse gern Pizza.","sr":"Rado jedem picu."},{"de":"Auch Reis mit Gemüse mag ich.","sr":"Volim i pirinač sa povrćem."},{"de":"Zum Frühstück esse ich Brot und Käse.","sr":"Za doručak jedem hleb i sir."},{"de":"Am Abend esse ich gern einen Salat.","sr":"Uveče rado jedem salatu."}]},{"title":"4. Lieblingsgetränk – Omiljeno piće","rows":[{"de":"Ich trinke gern Kaffee.","sr":"Rado pijem kafu."},{"de":"Morgens trinke ich eine Tasse Kaffee.","sr":"Ujutru popijem jednu šoljicu kafe."},{"de":"Tagsüber trinke ich viel Wasser.","sr":"Tokom dana pijem mnogo vode."},{"de":"Manchmal trinke ich auch Tee.","sr":"Ponekad pijem i čaj."}]},{"title":"5. Sprachen – Jezici","rows":[{"de":"Meine Muttersprache ist Bosnisch.","sr":"Moj maternji jezik je bosanski."},{"de":"Ich lerne jetzt Deutsch.","sr":"Sada učim nemački."},{"de":"Ich übe jeden Tag einfache Sätze.","sr":"Svakog dana vežbam jednostavne rečenice."},{"de":"Ich möchte gut Deutsch sprechen.","sr":"Želim dobro da govorim nemački."}]},{"title":"6. Freizeit – Slobodno vreme","rows":[{"de":"In meiner Freizeit ruhe ich mich gern aus.","sr":"U slobodno vreme rado se odmaram."},{"de":"Ich telefoniere oft mit meinem Mann.","sr":"Često razgovaram telefonom sa mužem."},{"de":"Manchmal treffe ich meine Freundinnen.","sr":"Ponekad se viđam sa prijateljicama."},{"de":"Am Abend sehe ich gern fern.","sr":"Uveče rado gledam televiziju."}]},{"title":"7. Sport – Sport","rows":[{"de":"Ich gehe gern zu Fuß.","sr":"Rado idem peške."},{"de":"Spazierengehen macht mir Spaß.","sr":"Šetnja mi pričinjava zadovoljstvo."},{"de":"Manchmal mache ich Sport zu Hause.","sr":"Ponekad vežbam kod kuće."},{"de":"Sport ist gut für die Gesundheit.","sr":"Sport je dobar za zdravlje."}]},{"title":"8. Musik – Muzika","rows":[{"de":"Ich höre oft Musik.","sr":"Često slušam muziku."},{"de":"Ich mag ruhige und fröhliche Musik.","sr":"Volim mirnu i veselu muziku."},{"de":"Beim Kochen höre ich gern Radio.","sr":"Dok kuvam, rado slušam radio."},{"de":"Musik macht mich glücklich.","sr":"Muzika me čini srećnom."}]},{"title":"9. Bücher – Knjige","rows":[{"de":"Ich lese manchmal Bücher.","sr":"Ponekad čitam knjige."},{"de":"Ich mag kurze Geschichten.","sr":"Volim kratke priče."},{"de":"Auch auf Deutsch lese ich einfache Texte.","sr":"I na nemačkom čitam jednostavne tekstove."},{"de":"Dabei lerne ich neue Wörter.","sr":"Pri tome učim nove reči."}]},{"title":"10. Lieblingskleidung – Omiljena odeća","rows":[{"de":"Ich trage gern bequeme Kleidung.","sr":"Rado nosim udobnu odeću."},{"de":"Zu Hause trage ich oft eine Hose und ein T-Shirt.","sr":"Kod kuće često nosim pantalone i majicu."},{"de":"Im Winter brauche ich eine warme Jacke.","sr":"Zimi mi je potrebna topla jakna."},{"de":"Ich kaufe gern neue Schuhe.","sr":"Rado kupujem nove cipele."}]},{"title":"11. Freunde – Prijatelji","rows":[{"de":"Ich habe gute Freundinnen.","sr":"Imam dobre prijateljice."},{"de":"Wir treffen uns manchmal in einem Café.","sr":"Ponekad se nalazimo u kafiću."},{"de":"Wir trinken Kaffee und sprechen viel.","sr":"Pijemo kafu i mnogo razgovaramo."},{"de":"Gute Freunde sind sehr wichtig.","sr":"Dobri prijatelji su veoma važni."}]},{"title":"12. Urlaub – Odmor","rows":[{"de":"Im Urlaub möchte ich mich erholen.","sr":"Na odmoru želim da se odmorim."},{"de":"Ich reise gern mit meinem Mann.","sr":"Rado putujem sa svojim mužem."},{"de":"Ich möchte neue Städte sehen.","sr":"Želim da vidim nove gradove."},{"de":"Ich mache gern Fotos im Urlaub.","sr":"Na odmoru rado fotografišem."}]},{"title":"13. Was ich gerne mache – Šta rado radim","rows":[{"de":"Ich verbringe gern Zeit mit meiner Familie.","sr":"Rado provodim vreme sa porodicom."},{"de":"Ich koche gern zu Hause.","sr":"Rado kuvam kod kuće."},{"de":"Ich gehe gern einkaufen.","sr":"Rado idem u kupovinu."},{"de":"Ich lerne auch gern Deutsch.","sr":"Rado učim i nemački."}]},{"title":"14. Arbeit / Beruf / Job – Posao","rows":[{"de":"Ich bin Hausfrau.","sr":"Domaćica sam."},{"de":"Ich arbeite zurzeit nicht.","sr":"Trenutno nisam zaposlena."},{"de":"Zu Hause koche ich, putze und räume auf.","sr":"Kod kuće kuvam, čistim i sređujem."},{"de":"Mein Mann heißt Zijad und ist 33 Jahre alt.","sr":"Moj muž se zove Zijad i ima 33 godine."},{"de":"Er arbeitet auf dem Bau in Dortmund.","sr":"On radi u građevinarstvu u Dortmundu."}]},{"title":"15. Tiere / Haustiere – Životinje","rows":[{"de":"Ich mag Tiere.","sr":"Volim životinje."},{"de":"Besonders gern mag ich Katzen.","sr":"Posebno volim mačke."},{"de":"Auch kleine Hunde finde ich süß.","sr":"I mali psi su mi slatki."},{"de":"Im Park sehe ich manchmal Vögel.","sr":"U parku ponekad vidim ptice."}]},{"title":"16. Filme – Filmovi","rows":[{"de":"Ich sehe gern Filme.","sr":"Rado gledam filmove."},{"de":"Am liebsten mag ich Komödien.","sr":"Najviše volim komedije."},{"de":"Manchmal sehe ich einen Film am Abend.","sr":"Ponekad uveče gledam film."},{"de":"Am Wochenende habe ich dafür mehr Zeit.","sr":"Vikendom imam više vremena za to."}]},{"title":"17. Lieblingsfarbe – Omiljena boja","rows":[{"de":"Meine Lieblingsfarbe ist Blau.","sr":"Moja omiljena boja je plava."},{"de":"Ich mag auch Weiß und Grün.","sr":"Volim i belu i zelenu."},{"de":"Blaue Kleidung gefällt mir gut.","sr":"Plava odeća mi se mnogo dopada."},{"de":"Im Frühling sehe ich viele schöne Farben.","sr":"U proleće vidim mnogo lepih boja."}]},{"title":"18. Wohnort / Herkunft – Mesto stanovanja i poreklo","rows":[{"de":"Mein Mann arbeitet in Dortmund.","sr":"Moj muž radi u Dortmundu."},{"de":"Dortmund ist eine Stadt in Deutschland.","sr":"Dortmund je grad u Nemačkoj."},{"de":"Die Stadt liegt im Westen von Deutschland.","sr":"Grad se nalazi na zapadu Nemačke."},{"de":"Mein Mann arbeitet dort auf einer Baustelle.","sr":"Moj muž tamo radi na gradilištu."},{"de":"Ich möchte mehr über Deutschland lernen.","sr":"Želim da naučim više o Nemačkoj."}]},{"title":"19. Lieblingslied – Omiljena pesma","rows":[{"de":"Ich höre gern schöne Lieder.","sr":"Rado slušam lepe pesme."},{"de":"Mein Lieblingslied höre ich oft zu Hause.","sr":"Svoju omiljenu pesmu često slušam kod kuće."},{"de":"Manchmal singe ich leise mit.","sr":"Ponekad tiho pevušim uz pesmu."},{"de":"Ein schönes Lied macht gute Laune.","sr":"Lepa pesma popravlja raspoloženje."}]}];
const content=document.getElementById('content');
const statusEl=document.getElementById('status');
const counter=document.getElementById('counter');
const jump=document.getElementById('goto');
counter.textContent='19 tema + biografija • '+topics.reduce((sum,t)=>sum+t.rows.length,0)+' rečenica';
let token=0;
const supported='speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
let preferredVoice=null;
function chooseVoice(){if(!supported)return null;const voices=window.speechSynthesis.getVoices();const german=voices.filter(v=>(v.lang||'').toLowerCase().startsWith('de'));
return german.find(v=>/google|microsoft|anna|katja|deutsch/i.test(v.name))||german[0]||null}
if(supported){preferredVoice=chooseVoice();speechSynthesis.addEventListener?.('voiceschanged',()=>{preferredVoice=chooseVoice()})}
else {statusEl.textContent='Ovaj pregledač ne podržava čitanje naglas. Koristi Chrome, Edge ili Safari sa uključenim zvukom.'}
function clearActive(){document.querySelectorAll('.sentence.active').forEach(el=>el.classList.remove('active'))}
function stop(manual=true){token++;if(supported)window.speechSynthesis.cancel();clearActive();if(manual)statusEl.textContent='Čitanje zaustavljeno.'}
document.getElementById('stop').addEventListener('click',()=>stop(true));
function say(topicIndex,rowIndex,currentToken){return new Promise(resolve=>{
if(!supported||currentToken!==token){resolve();return}
const row=topics[topicIndex].rows[rowIndex];
clearActive();const el=document.getElementById('s-'+topicIndex+'-'+rowIndex);if(el){el.classList.add('active');el.scrollIntoView({block:'nearest',behavior:'smooth'})}
const u=new SpeechSynthesisUtterance(row.de);u.lang='de-DE';u.rate=Number(document.getElementById('speed').value);u.pitch=1;
preferredVoice=chooseVoice();if(preferredVoice)u.voice=preferredVoice;
let settled=false;function finish(){if(!settled){settled=true;resolve()}}
u.onend=finish;u.onerror=finish;
statusEl.textContent='Slušaš: '+topics[topicIndex].title;
window.speechSynthesis.speak(u);
})}
async function play(topicIndex,startIndex,wholeTopic){
if(!supported){statusEl.textContent='Izgovor nije podržan u ovom pregledaču.';return}
stop(false);const currentToken=token;const end=wholeTopic?topics[topicIndex].rows.length:startIndex+1;
for(let i=startIndex;i<end;i++){if(currentToken!==token)return;await say(topicIndex,i,currentToken)}
if(currentToken===token){clearActive();statusEl.textContent='Čitanje završeno. Izaberi rečenicu ili sledeću temu.'}
}
topics.forEach((topic,t)=>{
const opt=document.createElement('option');opt.value='topic-'+t;opt.textContent=topic.title;jump.appendChild(opt);
const sec=document.createElement('section');sec.id='topic-'+t;
const h2=document.createElement('h2');h2.textContent=topic.title;sec.appendChild(h2);
topic.rows.forEach((row,i)=>{
const p=document.createElement('div');p.className='sentence';p.id='s-'+t+'-'+i;
const line=document.createElement('div');line.className='sentence-line';
const de=document.createElement('span');de.className='de';de.textContent=row.de;
const speaker=document.createElement('button');speaker.type='button';speaker.className='speaker-btn';speaker.textContent='🔊';speaker.title='Slušaj nemačku rečenicu';speaker.setAttribute('aria-label','Slušaj nemačku rečenicu: '+row.de);
speaker.addEventListener('click',()=>play(t,i,false));
const sr=document.createElement('span');sr.className='translation';sr.textContent=row.sr;
line.append(de,speaker);p.append(line,sr);sec.appendChild(p);
});
const actions=document.createElement('div');actions.className='actions';
const btn=document.createElement('button');btn.type='button';btn.className='primary';btn.textContent='▶ Slušaj celu temu';btn.addEventListener('click',()=>play(t,0,true));
const again=document.createElement('button');again.type='button';again.className='secondary';again.textContent='↻ Ponovi od početka';again.addEventListener('click',()=>play(t,0,true));
actions.append(btn,again);sec.appendChild(actions);content.appendChild(sec);
});
jump.addEventListener('change',()=>{const target=document.getElementById(jump.value);if(target)target.scrollIntoView({behavior:'smooth',block:'start'})});
</script></body></html>
