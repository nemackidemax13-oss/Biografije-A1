function playRows(mode,index=0,auto=true){
 if(!synth){alert("Ovaj pregledač ne podržava izgovor.");return}
 stopSpeech();readingMode=mode;readingIndex=index;dialogueAuto=mode==="dialog"&&auto;
 const token=voiceToken,rows=pageRows(mode);
 function next(){
  if(token!==voiceToken||paused)return;

   cleanHighlight();readingMode="";dialogueAuto=false;updateDialogueAudioUI();return
  }

}

function showDialoguePage(page){
 if(!dialoguePages.length)return;
 dialoguePageIndex=Math.max(0,Math.min(page,dialoguePages.length-1));

 $("dialoguePager").classList.toggle("single-page",dialoguePages.length<=1);
 $("dialoguePager").style.visibility=dialoguePages.length>1?"visible":"hidden";
 $("dialoguePrev").disabled=dialoguePageIndex===0;
 $("dialogueNext").disabled=dialoguePageIndex>=dialoguePages.length-1;
 const arr=dialoguePages[dialoguePageIndex];
 $("dialoguePageLabel").textContent="Replike "+(arr[0]+1)+"–"+(arr[arr.length-1]+1)+" / "+dialogRows.length;
}
function revealDialogueIndex(index){
 const page=dialoguePages.findIndex(arr=>arr.includes(index));
 if(page>=0&&page!==dialoguePageIndex)showDialoguePage(page);
}
function paginateDialogue(anchor=0){
 if(currentPage!==3)return;
 const box=$("dialogue");
 $("dialoguePager").classList.remove("single-page");
 for(const row of dialogRows)row.element.hidden=false;
 const available=Math.max(65,box.clientHeight-3);
 const sizes=dialogRows.map(r=>{
  const style=getComputedStyle(r.element);
  return r.element.getBoundingClientRect().height+
   parseFloat(style.marginTop||0)+parseFloat(style.marginBottom||0);
 });
 const groups=[];let items=[],height=0;
 for(let i=0;i<dialogRows.length;){
  const n=Math.min(2,dialogRows.length-i);
  const pairHeight=sizes.slice(i,i+n).reduce((sum,x)=>sum+x,0);
  if(items.length&&height+pairHeight>available-2){groups.push(items);items=[];height=0}
  for(let j=0;j<n;j++)items.push(i+j);
  height+=pairHeight;i+=n;
 }
 if(items.length)groups.push(items);
 dialoguePages=groups;
 if(!groups.length){$("dialoguePager").classList.add("single-page");$("dialoguePager").style.visibility="hidden";return}
 const page=groups.findIndex(arr=>arr.includes(anchor));
 showDialoguePage(page>=0?page:0);
}
$("dialoguePrev").onclick=()=>showDialoguePage(dialoguePageIndex-1);

window.addEventListener("resize",()=>{if(currentPage===3)requestAnimationFrame(()=>paginateDialogue(dialoguePages[dialoguePageIndex]?.[0]||0))});

}

$("dialogueFontMinus").onclick=()=>changeDialogueFont(-.1);
$("file").onchange=async e=>{
 if(generatedLocked&&!reachedDialogue){$("file").value="";setStatus("Prvo završi korake i dođi do dijaloga.",true);return}
 let f=e.target.files[0];if(!f)return;if(!f.type.startsWith("image/")||f.size>12e6){setStatus("Izaberi JPG/PNG/WebP sliku manju od 12 MB.",true);return}try{const bmp=await createImageBitmap(f),cv=document.createElement("canvas"),scale=Math.min(1,1280/Math.max(bmp.width,bmp.height));cv.width=Math.round(bmp.width*scale);cv.height=Math.round(bmp.height*scale);cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);bmp.close();imageData=cv.toDataURL("image/jpeg",.8);for(let i=0;i<4;i++){let img=$("photo"+i);img.src=imageData;img.style.display="block"}const reveal=$("photoReveal");reveal.classList.remove("ready");void reveal.offsetWidth;reveal.classList.add("ready");document.querySelector(".upload").classList.add("has-photo");document.querySelector(".upload-title").textContent="✓ Fotografija dodata";$("uploadHeading").textContent="Dodata slika za opis";$("analyze").disabled=false;setStatus("✓ Fotografija je uspešno dodata.")}catch(err){setStatus("Nije moguće otvoriti sliku.",true)}};
$("analyze").onclick=async()=>{
 if(generatedLocked&&!reachedDialogue){setStatus("Novu sliku možeš generisati tek kada dođeš do dijaloga.",true);return}
 if(!imageData){setStatus("Izaberi sliku.",true);return}if(!bank.length){setStatus("Baza opisa slike se još učitava. Pokušaj ponovo.",true);return}let url=$("endpoint").value.trim();if(!/^https:\/\//.test(url)){setStatus("Podesi Cloudflare Worker adresu.",true);return}$("analyze").disabled=true;setStatus("AI analizira sliku i priprema opis i dijalog…");
try{let res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image:imageData,scenes:scenes.map(s=>({n:s.n,sr:s.sr,de:s.de,roles:s.roles||"",dialog:(Array.isArray(s.dialog)?s.dialog:[]).map(pair=>({de:String(pair[0]||""),sr:String(pair[1]||"")})),extra:(Array.isArray(s.extra)?s.extra:[]).map(pair=>({de:String(pair[0]||""),sr:String(pair[1]||"")}))})),bankExamples:sampleBank()})});let data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.error||"HTTP "+res.status);if(!Array.isArray(data.steps)||data.steps.length!==10)throw Error("Nema 10 koraka opisa.");

$("dialogue").classList.add("hide-translation");
$("translationDialogue").textContent="Prevod";$("translationDialogue").setAttribute("aria-pressed","false");
dialogueFontScale=1;$("dialogue").style.setProperty("--dialogue-font-scale","1");

(Array.isArray(data.dialogue)?data.dialogue:[]).forEach((l,i)=>{
 const de=String(l.de||"").trim(),sr=String(l.sr||"").trim();
 if(!de)return;
 const role=String(l.speaker||((i%2)?"B":"A")).toUpperCase()==="B"?"B":"A";

 const el=document.createElement("article");el.className="sentence dialog dialogue-card";
 const roleTag=document.createElement("span");roleTag.className="dialogue-role "+(role==="A"?"role-a":"role-b");
 roleTag.textContent=role;roleTag.setAttribute("aria-label","Učenik "+role);roleTag.title="Učenik "+role;el.append(roleTag);

$("summarySerbian").textContent=summarySR||"Prevod trenutno nije dostupan.";

function separateGermanSentences(value){
 const text=String(value||"").trim();
 if(!text)return [];
 return text.split(/(?<=[.!?])\s+(?=[A-ZÄÖÜČĆŠĐŽ„"0-9])/u).map(s=>s.trim()).filter(Boolean);
}
function normalizeStepLines(step){
 const provided=Array.isArray(step.lines)?step.lines.filter(x=>x&&typeof x.de==="string"&&x.de.trim()):[];
 if(provided.length){
  return provided.map(x=>({de:String(x.de).trim(),sr:String(x.sr||"").trim()}));
 }
 // Support older, already-deployed Cloudflare versions while waiting for the new code.
 const german=separateGermanSentences(step.de);
 const serbian=separateGermanSentences(step.sr);
 const balanced=serbian.length===german.length;
 return german.map((de,i)=>({de,sr:balanced?serbian[i]:""}));
}
function renderFullDescription(){
 const field=$("fullDescription");field.replaceChildren();field.classList.toggle("show-serbian",fullTranslated);
 fullAudioLines=[];
 fullSteps.forEach((step,i)=>{
  const section=document.createElement("section");section.className="full-step";section.dataset.stepIndex=String(i);
  const title=document.createElement("div");title.className="full-step-title";title.textContent=step.title;
  const sentences=document.createElement("div");sentences.className="full-step-lines";
  if(i>=3&&i<=7&&!step.lines.length){
   const note=document.createElement("div");note.className="full-step-empty";
   note.textContent="Nema dovoljno jasno prepoznatih detalja za ovaj korak.";
   sentences.append(note);
  }
  step.lines.forEach((sentence,j)=>{
   const line=document.createElement("div");line.className="full-line";
   const lineText=document.createElement("div");lineText.className="full-line-copy";
   const de=document.createElement("span");de.className="full-step-de";de.textContent=sentence.de;
   de.contentEditable="true";de.spellcheck=false;de.setAttribute("aria-label","Nemačka rečenica "+(j+1)+" koraka "+(i+1));
   const sr=document.createElement("div");sr.className="full-step-sr";sr.textContent=sentence.sr;
   de.addEventListener("input",()=>{
    const changed=de.innerText.trim();
    sentence.de=changed;
    step.de=step.lines.map(x=>x.de).filter(Boolean).join(" ");
    if(sentence.sr){sr.textContent="Prevod treba obnoviti nakon izmene nemačke rečenice.";sentence.sr="";}
    requestAnimationFrame(fitFullDescription);
   });
   const index=fullAudioLines.length;
   const listen=document.createElement("button");listen.type="button";listen.className="full-line-play";listen.textContent="▶";listen.setAttribute("aria-label","Slušaj ili zaustavi rečenicu "+(index+1));listen.title="Slušaj / Stop";
   listen.onclick=()=>toggleFullLine(index);
   lineText.append(de,sr);
   line.append(lineText,listen);sentences.append(line);
   fullAudioLines.push({line,de,listen,section,stepIndex:i});
  });
  // Legacy Worker sends one paragraph translation for multiple German sentences.
  // Never present the paragraph as the exact translation of just the last sentence.
  if(!Array.isArray(step.lines)||!step.lines.some(x=>x.sr)){

   backup.textContent=step.sr||"";

  }else{section.append(title,sentences)}

 });

}
function showDescriptionPage(page,stopAudio=true){

 if(stopAudio&&descriptionPage!==next)stopSpeech();
 descriptionPage=next;
 for(const section of $("fullDescription").querySelectorAll(".full-step")){
  const i=Number(section.dataset.stepIndex);
  section.hidden=next===0?i>=6:i<6;
 }
 $("descPrev").disabled=next===0;
 $("descNext").disabled=next===totalPages-1;
 $("descPageLabel").textContent="Stranica "+(next+1)+"/"+totalPages;
 updateJourneyProgress();
 $("fullDescription").scrollTop=0;
 requestAnimationFrame(fitFullDescription);
}

function fitFullDescription(){
 const field=$("fullDescription");if(!field||currentPage!==2)return;

 field.style.setProperty("--font-scale",String(fullFontScale));
 let scale=1;
 for(let i=0;i<80&&field.scrollHeight>field.clientHeight+1;i++){
  scale=Math.max(.55,scale-.01);field.style.zoom=String(scale);
  if(scale<=.55)break;
 }
 // Very long AI texts remain readable: allow scrolling only when absolutely necessary.
 if(field.scrollHeight>field.clientHeight+2)field.style.overflowY="auto";
}

  row.listen.textContent=on?"■":"▶";row.listen.setAttribute("aria-pressed",String(on));row.line.classList.toggle("audio-active",on);
 }
 const auto=$("autoFull");
 if(auto){auto.textContent=fullAudioAuto?"■ Stop":"▶ Auto";auto.setAttribute("aria-pressed",String(fullAudioAuto))}
}
function startFullLine(index,auto=false){
 if(!synth){alert("Ovaj pregledač ne podržava izgovor.");return}
 if(index>=fullAudioLines.length){stopSpeech();return}
 const line=fullAudioLines[index],text=line.de.innerText.trim();
 if(!text){if(auto)startFullLine(index+1,true);return}
 stopSpeech();showDescriptionPage(line.stepIndex>=6?1:0,false);readingMode="full";fullAudioIndex=index;fullAudioAuto=auto;
 const ticket=voiceToken;
 updateFullAudioUI();
 const u=new SpeechSynthesisUtterance(text);u.lang="de-DE";u.rate=.83;
 u.onend=()=>{if(ticket!==voiceToken)return;if(auto)startFullLine(index+1,true);else stopSpeech()};
 u.onerror=e=>{if(ticket!==voiceToken)return;if(e.error==="canceled"||e.error==="interrupted")return;if(auto)startFullLine(index+1,true);else stopSpeech()};
 synth.speak(u);
}
function toggleFullLine(index){
 if(readingMode==="full"&&fullAudioIndex===index){stopSpeech();return}
 startFullLine(index,false);
}
$("autoFull").onclick=()=>{
 if(fullAudioAuto){stopSpeech();return}
 const target=descriptionPage===0?0:fullAudioLines.findIndex(x=>x.stepIndex>=6);
 startFullLine(Math.max(0,target),true);
};
function changeFullFont(delta){
 fullFontScale=Math.max(.8,Math.min(1.5,Math.round((fullFontScale+delta)*100)/100));
 requestAnimationFrame(fitFullDescription);
}

$("fontMinus").onclick=()=>changeFullFont(-.1);

 $("translateFull").setAttribute("aria-pressed",String(fullTranslated));

};

/* Complete mail-style student description with German speech, translation and font size. */
function updateSummaryAudioUI(){
 const b=$("summaryAuto");if(!b)return;
 const playing=readingMode==="summary";
 b.textContent=playing?"■ Auto STOP":"▶ Auto";b.setAttribute("aria-pressed",String(playing));
 const pause=$("summaryPause");
 if(pause){
  pause.textContent=playing&&paused?"▶":"⏸";
  pause.setAttribute("aria-label",playing&&paused?"Nastavi slušanje":"Pauziraj slušanje");
  pause.setAttribute("title",playing&&paused?"Nastavi slušanje":"Pauziraj slušanje");
  pause.setAttribute("aria-pressed",String(playing&&paused))
 }
}
function updateSummaryFont(){
 const scale=summaryFontScale;
 $("summaryGerman").style.fontSize=(Math.round(13*scale*10)/10)+"px";
 $("summaryReading").style.fontSize=(Math.round(13*scale*10)/10)+"px";
 $("summarySerbian").style.fontSize=(Math.round(11*scale*10)/10)+"px";
}

/* Highlight the exact spoken word when the browser supplies speech onboundary
   char offsets. Otherwise highlight the sentence without fabricating timing. */
function renderSummarySpeechText(){
 const text=$("summaryGerman").value,area=$("summaryReading");
 area.replaceChildren();summarySpeechTokens=[];
 const chunks=text.match(/\s+|[^\s]+/gu)||[];
 let offset=0;
 for(const chunk of chunks){
  if(/^\s+$/u.test(chunk)){area.append(document.createTextNode(chunk));offset+=chunk.length;continue}
  const span=document.createElement("span");span.className="speech-word";
  span.textContent=chunk;area.append(span);
  summarySpeechTokens.push({start:offset,end:offset+chunk.length,span});
  offset+=chunk.length;
 }
}
function clearSummaryHighlight(){
 const editor=$("summaryGerman"),area=$("summaryReading");
 if(!editor||!area)return;
 editor.classList.remove("reading-mode");area.hidden=true;
 for(const t of summarySpeechTokens)t.span.classList.remove("speech-active");
}
function markSummarySpeechRange(start,end,word=false){
 const area=$("summaryReading");let first=null;
 for(const t of summarySpeechTokens){
  const active=word? t.start<=start&&start<t.end : t.start<end&&t.end>start;
  t.span.classList.toggle("speech-active",active);
  if(active&&!first)first=t.span;
 }
 if(first){
  const top=first.offsetTop,lower=top+first.offsetHeight;
  if(top<area.scrollTop||lower>area.scrollTop+area.clientHeight)
   area.scrollTop=Math.max(0,top-area.clientHeight/3);
 }
}
function summaryPartsWithOffsets(value){
 const phrases=separateGermanSentences(value);
 let pos=0;
 return phrases.map(de=>{
  const start=Math.max(0,value.indexOf(de,pos));
  pos=start+de.length;
  return {de,start,end:pos};
 });
}
$("summaryReading").onclick=()=>{
 if(readingMode==="summary")stopSpeech();
 $("summaryGerman").focus();
};
function playSummary(){
 if(!synth){$("summaryStatus").textContent="Izgovor nije dostupan u ovom pregledaču.";return}
 const source=$("summaryGerman").value;
 const phrases=summaryPartsWithOffsets(source);
 if(!phrases.length){$("summaryStatus").textContent="Nema rečenica za slušanje.";return}
 stopSpeech();renderSummarySpeechText();
 $("summaryGerman").classList.add("reading-mode");
 $("summaryReading").hidden=false;
 $("summaryReading").scrollTop=$("summaryGerman").scrollTop;
 readingMode="summary";paused=false;
 const token=voiceToken;let i=0;
 updateSummaryAudioUI();
 function next(){
  if(token!==voiceToken||readingMode!=="summary"||paused)return;
  if(i>=phrases.length){
   stopSpeech();$("summaryStatus").textContent="Završeno čitanje kompletnog opisa.";return
  }
  const part=phrases[i];
  $("summaryStatus").textContent="Izgovor: rečenica "+(i+1)+" / "+phrases.length;
  markSummarySpeechRange(part.start,part.end,false);
  const u=new SpeechSynthesisUtterance(part.de);u.lang="de-DE";u.rate=.83;u.pitch=1;
  let seenBoundary=false;
  u.onboundary=e=>{
   if(token!==voiceToken||readingMode!=="summary"||paused)return;
   if(typeof e.charIndex!=="number"||!Number.isFinite(e.charIndex))return;
   // Use charLength when available; single-word fallback finds the enclosing token.
   const absolute=part.start+Math.min(part.de.length,Math.max(0,e.charIndex));
   seenBoundary=true;markSummarySpeechRange(absolute,absolute+(e.charLength||1),true);
  };
  u.onend=()=>{
   if(token!==voiceToken)return;
   i++;next()
  };
  u.onerror=err=>{
   if(token!==voiceToken)return;
   if(err.error==="canceled"||err.error==="interrupted")return;
   i++;next()
  };
  synth.speak(u)
 }
 next()
}
$("summaryAuto").onclick=()=>{
 if(readingMode==="summary"){if(paused){synth.resume();paused=false;updateSummaryAudioUI()}else stopSpeech();return}
 playSummary()
};
$("summaryPause").onclick=()=>{
 if(readingMode!=="summary"||!synth)return;
 if(paused){synth.resume();paused=false;$("summaryStatus").textContent="Nastavljeno slušanje."}
 else{synth.pause();paused=true;$("summaryStatus").textContent="Slušanje pauzirano."}
 updateSummaryAudioUI();
};
