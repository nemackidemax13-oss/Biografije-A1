<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#10285b">
<meta name="description" content="DE-MAX A1 • Vežbaj mejlove • pravi mobilni prikaz i na računaru">
<title>DE-MAX A1 | Vežbaj mejlove – mobilni prikaz</title>
<style>
  :root{color-scheme:light;--blue:#10285b}
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0}
  body{min-height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(ellipse at top,#284e8e,#10285b 65%,#071831);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
  main{width:100%;height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px 10px;overflow:hidden}
  .phone{width:408px;max-width:100%;height:min(880px,calc(100dvh - 32px));min-height:0;display:flex;flex-direction:column;padding:7px;background:#121b2b;border:2px solid #607396;border-radius:27px;box-shadow:0 15px 55px #0009;overflow:hidden}
  .screen{width:100%;min-width:0;min-height:0;flex:1;overflow:hidden;background:white;border-radius:20px}
  iframe{display:block;width:100%;height:100%;border:0;background:#fff}
  @media(max-width:799px){
    html,body{height:100dvh;max-width:100%;background:#fff;overflow:hidden}
    main{width:100%;height:100dvh;display:block;padding:0;overflow:hidden}
    .phone{border:0;border-radius:0;padding:0;width:100%;max-width:none;height:100dvh;max-height:none;box-shadow:none;background:#fff}
    .screen{border-radius:0;flex:1}
    iframe{height:100%}
  }
</style>
</head>
<body>
<main>
  <div class="phone">
    <div class="screen">
      <iframe src="./iframe.html?v=20261101-bodovi-prolaz-4" title="DE-MAX A1 – Vežbaj mejlove (mobilni prikaz)" allow="clipboard-write" loading="eager"></iframe>
    </div>
  </div>
</main>
</body>
</html>
