<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>DE-MAX – Vežbaj mejlove (iframe)</title>
  <style>
    body { margin:0;min-height:100dvh;display:grid;place-items:center;font-family:system-ui,Arial,sans-serif;background:#edf4ff;color:#12386d;text-align:center; }
    a { color:#1554ad;font-weight:700; }
  </style>
</head>
<body>
  <main>
    <p>Otvaranje DE-MAX mejlova…</p>
    <p><a id="go" href="./">Otvori mejlove</a></p>
  </main>
  <script>
    // Iframe-kompatibilni URL: jedna stranica, bez iframe-a unutar iframe-a.
    // replace() izbegava dodatni korak u istoriji i zadržava return adresu.
    const target = new URL('./', location.href);
    target.search = location.search;
    target.hash = location.hash;
    document.getElementById('go').href = target.href;
    location.replace(target.href);
  </script>
</body>
</html>
