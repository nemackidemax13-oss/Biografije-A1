*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:#fff;color:#102b58;font:600 16px system-ui,Segoe UI,sans-serif;display:flex;flex-direction:column}#stage{flex:1;min-height:0;display:grid;place-items:center;position:relative;overflow:hidden}#slide{position:relative;aspect-ratio:16/9;max-width:100%;max-height:100%;width:min(100vw,calc((100dvh - 44px)*16/9));overflow:hidden}#picture{width:100%;height:100%;display:block;object-fit:contain}#hotspot{position:absolute;border:0;background:transparent;cursor:pointer;padding:0}#hotspot:focus-visible{outline:3px solid #1d4ed8}nav{height:44px;flex:none;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:3px 8px;border-top:1px solid #e4e9f2}button{font:inherit;border:0;border-radius:7px;padding:6px 14px;color:white;cursor:pointer}button:disabled{opacity:.35;cursor:default}#prev{background:#c92636}#next{background:#13803d}.middle{display:flex;align-items:center;justify-content:center;gap:10px;min-width:0}#count{font-variant-numeric:tabular-nums;white-space:nowrap}#play{background:#1758b4;padding:6px 9px}#hide{background:#eaf0f7;color:#17365d;padding:6px 9px}#restore{position:absolute;right:5px;bottom:5px;background:#183d73;opacity:.65;z-index:5}body.clean nav{display:none}body.clean #slide{width:min(100vw,calc(100dvh*16/9))}[hidden]{display:none!important}@media(max-width:500px){nav{gap:3px;padding:3px}.middle{gap:4px}button{padding:6px 8px;font-size:12px}#count{font-size:12px}}

const $=id=>document.getElementById(id);let index=0;const a=$('audio'),img=$('picture');let preloads=[];function show(n){if(n<0||n>=slides.length)return;a.pause();a.removeAttribute('src');a.load();index=n;const s=slides[n],frame=$('quizFrame'),isQuiz=Boolean(s.quiz);document.body.classList.toggle('quiz-mode',isQuiz);$('slide').hidden=isQuiz;frame.hidden=!isQuiz;if(isQuiz){if(!frame.getAttribute('src'))frame.src=s.quiz;clean(false)}else{if(frame.hasAttribute('src'))frame.removeAttribute('src');img.src=s.image;img.alt='Originalni slajd '+(n<8?n+1:n);}$('count').textContent=(n+1)+' / '+slides.length;$('prev').disabled=n===0;$('next').disabled=n===slides.length-1;$('play').hidden=!s.audio;$('play').textContent='♫ Audio';$('hotspot').hidden=!s.hotspot;if(s.hotspot){const [x,y,w,h]=s.hotspot;Object.assign($('hotspot').style,{left:x+'%',top:y+'%',width:w+'%',height:h+'%'})}preloads=[];if(slides[n+1]){let im=new Image();im.src=slides[n+1].image;preloads.push(im)}}function toggleAudio(){const s=slides[index];if(!s.audio)return;if(!a.getAttribute('src'))a.src=s.audio;if(a.paused)a.play().catch(()=>{});else a.pause()}a.onplay=()=>{$('play').textContent='Ⅱ Pauza'};a.onpause=a.onended=()=>{$('play').textContent='♫ Audio'};function clean(b){document.body.classList.toggle('clean',b);$('restore').hidden=!b}$('prev').onclick=()=>show(index-1);$('next').onclick=()=>show(index+1);$('hide').onclick=()=>clean(true);$('restore').onclick=()=>clean(false);$('play').onclick=$('hotspot').onclick=toggleAudio;$('quizFrame').addEventListener('load',()=>{if(!slides[index].quiz)return;try{const qdoc=$('quizFrame').contentDocument;let adjust=qdoc.getElementById('demax-lesson-quiz-position');if(!adjust){adjust=qdoc.createElement('style');adjust.id='demax-lesson-quiz-position';adjust.textContent="@media(orientation:landscape){\nmain#app>.setup{padding-top:clamp(24px,11vh,100px)}\n.game-panel .question>.picture{align-self:end;object-position:center 75%}\n}\n@media(orientation:landscape) and (max-heig
