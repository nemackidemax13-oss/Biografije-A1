<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DE-MAX Tutin • Lektion 1 A1</title><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:#fff;color:#102b58;font:600 16px system-ui,Segoe UI,sans-serif;display:flex;flex-direction:column}#stage{flex:1;min-height:0;display:grid;place-items:center;position:relative;overflow:hidden}#slide{position:relative;aspect-ratio:16/9;max-width:100%;max-height:100%;width:min(100vw,calc((100dvh - 44px)*16/9));overflow:hidden}#picture{width:100%;height:100%;display:block;object-fit:contain}#hotspot{position:absolute;border:0;background:transparent;cursor:pointer;padding:0}#hotspot:focus-visible{outline:3px solid #1d4ed8}nav{height:44px;flex:none;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:3px 8px;border-top:1px solid #e4e9f2}button{font:inherit;border:0;border-radius:7px;padding:6px 14px;color:white;cursor:pointer}button:disabled{opacity:.35;cursor:default}#prev{background:#c92636}#next{background:#13803d}.middle{display:flex;align-items:center;justify-content:center;gap:10px;min-width:0}#count{font-variant-numeric:tabular-nums;white-space:nowrap}#play{background:#1758b4;padding:6px 9px}#hide{background:#eaf0f7;color:#17365d;padding:6px 9px}#restore{position:absolute;right:5px;bottom:5px;background:#183d73;opacity:.65;z-index:5}body.clean nav{display:none}body.clean #slide{width:min(100vw,calc(100dvh*16/9))}[hidden]{display:none!important}@media(max-width:500px){nav{gap:3px;padding:3px}.middle{gap:4px}button{padding:6px 8px;font-size:12px}#count{font-size:12px}}
</style></head><body><main id="stage"><div id="slide"><img id="picture" alt="Originalni slajd"><button id="hotspot" hidden aria-label="Pusti ili pauziraj originalni audio"></button></div><button id="restore" hidden aria-label="Prikaži navigaciju">☰</button></main><nav><button id="prev">← Zurück</button><div class="middle"><span id="count"></span><button id="play" hidden>♫ Audio</button><button id="hide" title="Sakrij navigaciju">⛶</button></div><button id="next">Weiter →</button></nav><audio id="audio" preload="none"></audio><script>const slides=[{"image":"slide-01.webp","audio":null,"hotspot":null},{"image":"slide-02.webp","audio":null,"hotspot":null},{"image":"slide-03.webp","audio":null,"hotspot":null},{"image":"slide-04.webp","audio":null,"hotspot":null},{"image":"slide-05.webp","audio":null,"hotspot":null},{"image":"slide-06.webp","audio":"audio-1.mp3","hotspot":[92.91666666666667,89.81481481481481,3.3333333333333335,5.925925925925926]},{"image":"slide-07.webp","audio":null,"hotspot":null},{"image":"slide-08.webp","audio":null,"hotspot":null},{"image":"slide-09.webp","audio":null,"hotspot":null},{"image":"slide-10.webp","audio":"audio-2.mp3","hotspot":[92.96875,86.11111111111111,3.3854166666666665,6.018518518518518]},{"image":"slide-11.webp","audio":null,"hotspot":null},{"image":"slide-12.webp","audio":null,"hotspot":null}];
const $=id=>document.getElementById(id);let index=0;const a=$('audio'),img=$('picture');let preloads=[];function show(n){if(n<0||n>=slides.length)return;a.pause();a.removeAttribute('src');a.load();index=n;const s=slides[n];img.src=s.image;img.alt='Originalni slajd '+(n+1);$('count').textContent=(n+1)+' / '+slides.length;$('prev').disabled=n===0;$('next').disabled=n===slides.length-1;$('play').hidden=!s.audio;$('play').textContent='♫ Audio';$('hotspot').hidden=!s.hotspot;if(s.hotspot){const [x,y,w,h]=s.hotspot;Object.assign($('hotspot').style,{left:x+'%',top:y+'%',width:w+'%',height:h+'%'})}preloads=[];if(slides[n+1]){let im=new Image();im.src=slides[n+1].image;preloads.push(im)}}function toggleAudio(){const s=slides[index];if(!s.audio)return;if(!a.getAttribute('src'))a.src=s.audio;if(a.paused)a.play().catch(()=>{});else a.pause()}a.onplay=()=>{$('play').textContent='Ⅱ Pauza'};a.onpause=a.onended=()=>{$('play').textContent='♫ Audio'};function clean(b){document.body.classList.toggle('clean',b);$('restore').hidden=!b}$('prev').onclick=()=>show(index-1);$('next').onclick=()=>show(index+1);$('hide').onclick=()=>clean(true);$('restore').onclick=()=>clean(false);$('play').onclick=$('hotspot').onclick=toggleAudio;document.addEventListener('keydown',e=>{if(e.ctrlKey||e.altKey||e.metaKey)return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();show(index+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();show(index-1)}else if(e.key==='Home'){e.preventDefault();show(0)}else if(e.key==='End'){e.preventDefault();show(slides.length-1)}else if(e.key==='Escape'){clean(false)}});show(0);</script></body></html>
