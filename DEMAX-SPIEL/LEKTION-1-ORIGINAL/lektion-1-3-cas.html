const $=id=>document.getElementById(id);let index=0,step=0;const a=$('audio'),img=$('picture');let preloads=[];function locate(el,p){const [x,y,w,h]=p;Object.assign(el.style,{left:x+'%',top:y+'%',width:w+'%',height:h+'%'})}function updateAnswers(){[...$('answers').children].forEach((el,i)=>el.classList.toggle('revealed',i<step))}function show(n,back=false){if(n<0||n>=slides.length)return;a.pause();a.removeAttribute('src');a.load();index=n;const s=slides[n];step=back?(s.answers?.length||0):0;img.src=s.image;img.alt='Originalni slajd '+(n+1);locate(img,s.position);$('count').textContent=(n+1)+' / '+slides.length;$('prev').disabled=n===0;$('next').disabled=n===slides.length-1;$('play').hidden=!s.audio;$('play').textContent='♫ Audio';$('hotspot').hidden=!s.hotspot;if(s.hotspot){locate($('hotspot'),s.hotspot);$('speaker').src=s.icon}const box=$('answers');box.replaceChildren();for(const answer of s.answers||[]){const el=document.createElement('span');el.className='answer';el.textContent=answer.text;locate(el,answer.position);box.append(el)}updateAnswers();preloads=[];for(const k of [n-1,n+1])if(slides[k]){const im=new Image();im.src=slides[k].image;preloads.push(im)}}function forward(){if(step<(slides[index].answers?.length||0)){step++;updateAnswers()}else show(index+1)}function backward(){if(step>0){step--;updateAnswers()}else show(index-1,true)}function toggleAudio(){const s=slides[index];if(!s.audio)return;if(!a.getAttribute('src'))a.src=s.audio;if(a.paused)a.play().catch(()=>{});else a.pause()}a.onplay=()=>{$('play').textContent='Ⅱ Pauza'};a.onpause=a.onended=()=>{$('play').textContent='♫ Audio'};$('prev').onclick=backward;$('next').onclick=forward;$('play').onclick=$('hotspot').onclick=toggleAudio;$('slide').addEventListener('click',e=>{if(e.target.closest('button'))return;if(slides[index].answers&&step<slides[index].answers.length)forward()});document.addEventListener('keydown',e=>{if(e.ctrlKey||e.altKey||e.metaKey)return;if(e.key==='ArrowRight'||e.key==='PageDown'||((e.key==='Enter'||e.key===' ')&&!e.target.closest('button'))){e.preventDefault();forward()}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();backward()}else if(e.key==='Home'){e.preventDefault();show(0)}else if(e.key==='End'){e.preventDefault();show(slides.length-1)}});show(0);</script></body></html>
