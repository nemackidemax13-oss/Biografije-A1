function hasEqualResults(rows){return rows.some((x,i)=>i>0&&x.score===rows[i-1].score&&x.correct===rows[i-1].correct)}
function drawFinal(){const rows=rankings();const order=[2,1,3];const sparks=[[4,16],[90,11],[12,50],[86,44],[3,76],[95,78],[30,2],[69,4]];app.innerHTML=`<section class="panel final final-screen"><div class="winner-title">🏆 DE-MAX Spiel</div><h1 class="winner-banner">Herzlichen Glückwunsch!</h1><div class="winner-stage" aria-label="Siegerehrung">${sparks.map(([x,y],i)=>`<span class="stage-spark" aria-hidden="true" style="left:${x}%;top:${y}%">${i%2?'✦':'★'}</span>`).join('')}${order.map(r=>{const row=rows[r-1];if(!row)return '';const visible=revealed>=4-r;return `<div class="podium-card ${r===1?'gold-place':r===3?'bronze-place':'silver-place'} ${visible?'':'pending'}"><img class="award-art" src="${AWARDS[r]}" alt="${r===1?'Pokal':r===2?'Silbermedaille':'Bronzemedaille'}"><div class="winner-label"><div class="winner-name" title="${visible?esc(row.name):''}">${visible?esc(row.name):'?'}</div><div class="winner-score">${visible?row.score+' '+(row.score===1?'Punkt':'Punkte'):'•••'}</div></div><div class="winner-block"><span class="laurel" aria-hidden="true">❧</span>${r}</div></div>`}).join('')}</div><p class="finalmessage">${revealed<3?'Die Spannung steigt …':'Super gemacht!'}</p>${revealed>=3&&hasEqualResults(rows)?'<p class="tie-note">Kod jednakih bodova i tačnih odgovora: redosled unosa.</p>':''}<div class="finalactions"><button id="replay">♫ Musik</button>${revealed<3?'<button class="gold" id="reveal">Ergebnisse anzeigen</button>':'<button class="primary green" id="details">Rangliste →</button>'}</div></section>`;$('replay').onclick=()=>{stopMusic();sound('win');fireworks();boom()};if($('reveal'))$('reveal').onclick=()=>{finalTimers.forEach(clearTimeout);finalTimers=[];revealed=3;drawFinal();boom();fireworks()};if($('details'))$('details').onclick=()=>showRanking(true)}
function showRanking(fx=false){stage='ranking';stopFX();document.querySelector('.boomFX')?.remove();document.querySelectorAll('.starFX').forEach(e=>e.remove());tones.filter(n=>n.buffer===fireNoise&&fireNoise).forEach(n=>{try{n.stop()}catch{}});finalTimers.forEach(clearTimeout);finalTimers=[];const rows=rankings();app.innerHTML=`<section class="panel results-screen"><div class="eyebrow">DE-MAX · Spiel</div><h1>Rangliste</h1><div class="results-sub">Konačni rezultati · ${players.length} učenika</div><p class="tie-note">Redosled: bodovi, broj tačnih odgovora, pa redosled unosa ako je rezultat potpuno isti.</p><div class="scoretable" role="table" aria-label="Rang lista učenika"><div class="scoreline scorehead" role="row"><span>Plasman</span><span>Ime i prezime</span><span>Tačno</span><span>Netačno</span><span>Bonus ✓</span><span>Bodovi</span></div>${rows.map(x=>`<div class="scoreline place${x.rank}" role="row" style="--rank-delay:${Math.min(x.rank-1,11)*85}ms"><b>${x.rank===1?'🥇':x.rank===2?'🥈':x.rank===3?'🥉':x.rank+'.'}</b><strong>${esc(x.name)}</strong><span class="rightnum">${x.correct}/${x.total}</span><span class="wrongnum">${x.wrong}</span><span>${x.bonus}</span><strong class="scorepoints">${x.score}</strong></div>`).join('')}</div><div class="finalactions"><button class="backred" id="backFinal">← Zurück</button><button class="primary green" id="new">Neues Spiel ↻</button></div></section>`;$('backFinal').onclick=()=>{stage='final';revealed=3;drawFinal()};$('new').onclick=()=>setup([]);}
function teacherUpdate(){if(window.parent!==window){const value=stage==='game'&&answers[pos]!==null?Q[game[pos]][3]:'';window.parent.postMessage({type:'demax-praesens-solution',value},location.origin)}}
function focusGame(){if(stage==='game'){try{app.focus({preventScroll:true})}catch(_){app.focus()}}}
window.addEventListener('keydown',e=>{
 if(stage!=='game'||e.isComposing||e.ctrlKey||e.metaKey||e.altKey)return;
 const target=e.target;
 if(target&&(/^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName)||target.isContentEditable))return;
 const k=e.key.toLowerCase();
 const map={'a':0,'b':1,'c':2,'1':0,'2':1,'3':2};
 let action=null;
 if(Object.prototype.hasOwnProperty.call(map,k))action=()=>answer(map[k]);
 else if(k==='arrowright'||k==='enter'&&!(target&&target.tagName==='BUTTON'))action=next;
 else if(k==='arrowleft')action=prev;
 if(!action)return;
 e.preventDefault();e.stopPropagation();
 if(!e.repeat)action();
},true);if(window.parent!==window&&new URLSearchParams(location.search).has('lesson')){document.body.classList.add('embedded-lesson');new MutationObserver(()=>teacherUpdate()).observe(app,{childList:true});}setup();
</script></body></html>
