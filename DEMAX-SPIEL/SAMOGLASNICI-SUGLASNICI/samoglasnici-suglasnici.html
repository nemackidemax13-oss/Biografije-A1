<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DE-MAX Tutin • A1 – Samoglasnici i suglasnici</title><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}body{position:relative;padding:3px;background:#fff;color:#102b58;font:600 16px system-ui,Segoe UI,sans-serif;display:flex;flex-direction:column;--nav-height:44px;--slide-width:min(calc(100vw - 6px),calc((100dvh - 6px - var(--nav-height))*16/9));--slide-height:min(calc((100vw - 6px)*9/16),calc(100dvh - 6px - var(--nav-height)))}#stage{width:100%;flex:1 1 0;min-height:0;display:grid;align-items:end;justify-items:center;position:relative;overflow:hidden}#slide{grid-area:1/1;position:relative;width:var(--slide-width);height:var(--slide-height);aspect-ratio:16/9;max-width:100%;max-height:100%;overflow:hidden}#picture{width:100%;height:100%;display:block;object-fit:contain}nav{flex:0 0 var(--nav-height);height:var(--nav-height);width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;padding:3px 8px;background:rgba(255,255,255,.96);border:1px solid #e4e9f2;border-radius:9px}button{font:inherit;border:0;border-radius:7px;padding:6px 14px;color:white;cursor:pointer;white-space:nowrap;touch-action:manipulation}button:disabled{opacity:.35;cursor:default}#prev{background:#c92636;justify-self:start}#next{background:#13803d;justify-self:end}#count{font-variant-numeric:tabular-nums;white-space:nowrap}#missing{grid-area:1/1;align-self:center;text-align:center;padding:20px;z-index:2;background:white;border:1px solid #e4e9f2;border-radius:9px}#missing label{display:block;margin-top:12px}#missing input{max-width:100%}[hidden]{display:none!important}@media(max-width:500px){body{--nav-height:36px}nav{gap:3px;padding:3px}button{padding:4px 8px;font-size:12px}#count{font-size:12px}}
</style></head><body><main id="stage"><div id="slide"><img id="picture" alt="Originalni slajd"></div><div id="missing" hidden>Slike još nisu dostupne na serveru.<label>Izaberite svih 35 WebP slika iz preuzetog paketa:<input id="files" type="file" accept="image/webp" multiple></label></div></main><nav><button id="prev">← Zurück</button><span id="count"></span><button id="next">Weiter →</button></nav><script>
const slides=Array.from({length:35},(_,i)=>({image:'slide-'+String(i+1).padStart(2,'0')+'.webp',audio:null,hotspot:null}));const $=id=>document.getElementById(id);let index=0,preloads=[],local={};const img=$('picture');function source(n){return local[slides[n].image]||slides[n].image}function show(n){if(n<0||n>=slides.length)return;index=n;img.src=source(n);img.alt='Originalni slajd '+(n+1);$('count').textContent=(n+1)+' / '+slides.length;$('prev').disabled=n===0;$('next').disabled=n===slides.length-1;preloads=[];if(slides[n+1]){let im=new Image();im.src=source(n+1);preloads.push(im)}}img.onload=()=>{$('missing').hidden=true};img.onerror=()=>{$('missing').hidden=false};$('files').onchange=e=>{for(const f of e.target.files){if(local[f.name])URL.revokeObjectURL(local[f.name]);local[f.name]=URL.createObjectURL(f)}show(index)};$('prev').onclick=()=>show(index-1);$('next').onclick=()=>show(index+1);document.addEventListener('keydown',e=>{if(e.ctrlKey||e.altKey||e.metaKey||e.target.tagName==='INPUT')return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();show(index+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();show(index-1)}else if(e.key==='Home'){e.preventDefault();show(0)}else if(e.key==='End'){e.preventDefault();show(slides.length-1)}});show(0);
</script></body></html>
