if(q.kind==='rewrite'){content+='<div class="q">'+color(q.q)+'</div><div class="start">'+color(q.start)+' '+(!revealed?'<span class="blank">________</span>':'<span style="color:#15803d">'+esc(q.a)+'</span>')+'</div>'}
else if(q.kind==='words'){content+='<div class="icon">'+esc(q.icon)+'</div><div class="words">'+q.q.split(' / ').map(w=>'<span class="word">'+esc(w)+'</span>').join('')+'</div><div class="start">'+(!revealed?esc(q.start)+' <span class="blank">________________</span>':'<span style="color:#15803d">'+color(q.solution)+'</span>')+'</div>'}
else{if(q.kind==='listen')content+='<div class="audio"><button id="listen">▶ Poslušaj tekst</button><button id="stop">■ Stop</button></div><div class="icon">'+esc(q.icon)+'</div>';content+='<div class="q">'+color(q.q)+'</div>';if(q.start)content+='<div class="start">'+color(q.start)+'</div>';content+=options(q);if(q.hint)content+='<p class="note">'+esc(q.hint)+'</p>'}
if(!['words','rewrite'].includes(q.kind))content+='<div class="result '+(revealed?'on':'empty')+'">'+(revealed?esc(answer(q)):'')+'</div>';
app.innerHTML='<section class="slide"><div><div class="top"><span>'+q.section+'. Übung · '+k+' / '+n+'</span><span class="clock">◷ <span id="clock">'+time()+'</span></span><select id="jump" aria-label="Izaberi celinu">'+sections.map((x,i)=>'<option value="'+(i+1)+'" '+(i+1===q.section?'selected':'')+'>'+(i+1)+'. '+esc(x)+'</option>').join('')+'</select></div><div class="brand">Nemački jezik De-Max Tutin</div></div><div class="progress"><span style="width:'+((pos+(revealed?1:0))/items.length*100)+'%"></span></div><div class="main">'+content+'</div><div class="nav"><button class="prev" id="prev">← Nazad</button><div class="teacher">'+(teacher?'<b>Rešenje:</b> '+esc(q.solution):'Rešenje skriveno')+' <button id="teacher" aria-label="Prikaži ili sakrij rešenje">'+(teacher?'Sakrij':'Prikaži')+'</button></div><button id="next">'+(revealed&&pos===items.length-1?'Završi':'Dalje')+' →</button></div></section>';
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=()=>go(pos-1);document.getElementById('teacher').onclick=()=>{teacher=!teacher;render()};document.getElementById('jump').onchange=e=>go(items.findIndex(x=>x.section===Number(e.target.value)));app.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>pick(Number(b.dataset.opt)));if(document.getElementById('listen')){document.getElementById('listen').onclick=listen;document.getElementById('stop').onclick=stopAudio}try{app.focus({preventScroll:true})}catch{}}
document.addEventListener('keydown',e=>{if(pos<0||e.target.tagName==='SELECT'||e.altKey||e.ctrlKey)return;if(e.key==='ArrowRight'||(e.key==='Enter'&&e.target===app)){e.preventDefault();next()}else if(e.key==='ArrowLeft'){e.preventDefault();go(pos-1)}else if(/^[1-4a-dA-D]$/.test(e.key)){const q=items[pos],i=/[1-4]/.test(e.key)?Number(e.key)-1:e.key.toUpperCase().charCodeAt(0)-65;if(q.opts&&i<q.opts.length){e.preventDefault();pick(i)}}});home();
</script></body></html>
