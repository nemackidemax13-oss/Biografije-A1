  .game-panel .questionSide .turnbox {min-width:48%;padding:clamp(3px,1vh,10px) clamp(12px,2vw,34px);border-left-width:clamp(5px,.8vw,10px);border-right-width:clamp(5px,.8vw,10px)}
  .game-panel .questionSide .turn strong {font-size:clamp(19px,min(7vh,4.6vw),64px);line-height:1.04;overflow-wrap:anywhere}
  .game-panel .questionSide .sentence {font-size:clamp(18px,min(7.3vh,4.0vw),72px);line-height:1.14;margin:clamp(3px,1vh,10px) 0;overflow-wrap:break-word}
  .game-panel .answers {gap:clamp(4px,.85vw,14px)}
  .game-panel .answer {height:clamp(34px,12vh,120px);font-size:clamp(16px,min(5.7vh,3.8vw),55px);gap:clamp(3px,.65vw,10px);padding:3px}
  .game-panel .answer span {width:clamp(16px,3.8vh,34px);height:clamp(16px,3.8vh,34px);font-size:clamp(10px,2.1vh,20px)}
  .game-panel .questionSide .feedback {height:clamp(23px,5.5vh,54px);min-height:0;margin:0}
  .game-panel .questionSide .feedback strong {font-size:clamp(14px,3.8vh,37px)}
  .game-panel .nav {padding-top:clamp(3px,.65vh,8px);gap:clamp(4px,.7vw,12px);grid-template-columns:auto minmax(0,1fr) auto}
  .game-panel .nav button {font-size:clamp(12px,2.8vh,26px);padding:clamp(5px,1.3vh,13px) clamp(7px,1.35vw,24px);white-space:nowrap}
  .game-panel .bottom-solution {font-size:clamp(12px,min(3.1vh,2.3vw),32px);padding:clamp(4px,.9vh,10px) 5px;line-height:1.18}
  main#app>.setup {height:100%;max-width:none;padding:clamp(6px,2vmin,25px);gap:clamp(5px,1.3vh,15px)}

  .setup h1 {font-size:clamp(24px,7vh,72px)}
  .setup .names {width:100%;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(3px,1vh,12px)}
  .setup .names input {font-size:clamp(13px,3.1vh,28px);padding:clamp(4px,1.2vh,13px)}
  .setup .names label {font-size:clamp(12px,2.7vh,24px)}
  .setup .actions button {font-size:clamp(12px,3vh,28px)}

  .results-screen .scorehead {font-size:clamp(9px,2.2vh,20px)}

/* Presenter View: keep slide content stationary when answering */
html,body{overscroll-behavior:none}
button{touch-action:manipulation}
.game-panel,.game-panel.enter{animation:none!important;transform:none!important}
.game-panel button,.game-panel button:hover,.game-panel button:active,.game-panel button:focus{transform:none!important;transition:background-color .16s,border-color .16s,box-shadow .16s,opacity .16s!important}
.game-panel .answer.rightPick,.game-panel .answer.wrongPick{animation:none!important}
.game-panel .answer.revealCorrect{animation:presenterGlow 1s ease-in-out infinite!important;transform:none!important}
@keyframes presenterGlow{50%{box-shadow:0 0 0 4px #86efac,0 0 18px #22c55e80}}
.game-panel .questionSide .feedback{flex-shrink:0}
.game-panel .answer{white-space:nowrap;overflow:hidden}
@media(orientation:landscape){
 main#app{height:100vh;height:100dvh;padding:3px}
 main#app>.game-panel{height:100%;max-height:100%;max-width:none;width:100%;padding:clamp(5px,1.2vmin,15px)}
 .game-panel .question{min-height:0}
 .game-panel .picture{width:100%;height:100%;object-fit:contain}
}
@media(prefers-reduced-motion:reduce){.game-panel .answer.revealCorrect{animation:none!important}}

function hasEqualResults(rows){return rows.some((x,i)=>i>0&&x.score===rows[i-1].score&&x.correct===rows[i-1].correct)}
function drawFinal(){const rows=rankings();const order=[2,1,3];const sparks=[[4,16],[90,11],[12,50],[86,44],[3,76],[95,78],[30,2],[69,4]];app.innerHTML=`<section class="panel final final-screen"><div class="winner-title">🏆 DE-MAX Spiel</div><h1 class="winner-banner">Herzlichen Glückwunsch!</h1><div class="winner-stage" aria-label="Siegerehrung">${sparks.map(([x,y],i)=>`<span class="stage-spark" aria-hidden="true" style="left:${x}%;top:${y}%">${i%2?'✦':'★'}</span>`).join('')}${order.map(r=>{const row=rows[r-1];if(!row)return '';const visible=revealed>=4-r;return `<div class="podium-card ${r===1?'gold-place':r===3?'bronze-place':'silver-place'} ${visible?'':'pending'}"><img class="award-art" src="${AWARDS[r]}" alt="${r===1?'Pokal':r===2?'Silbermedaille':'Bronzemedaille'}"><div class="winner-label"><div class="winner-name" title="${visible?esc(row.name):''}">${visible?esc(row.name):'?'}</div><div class="winner-score">${visible?row.score+' '+(row.score===1?'Punkt':'Punkte'):'•••'}</div></div><div class="winner-block"><span class="laurel" aria-hidden="true">❧</span>${r}</div></div>`}).join('')}</div><p class="finalmessage">${revealed<3?'Die Spannung steigt …':'Super gemacht!'}</p>${revealed>=3&&hasEqualResults(rows)?'<p class="tie-note">Kod jednakih bodova i tačnih odgovora: redosled unosa.</p>':''}<div class="finalactions"><button id="replay">♫ Musik</button>${revealed<3?'<button class="gold" id="reveal">Ergebnisse anzeigen</button>':'<button class="primary green" id="details">Rangliste →</button>'}</div></section>`;$('replay').onclick=()=>{stopMusic();sound('win');fireworks();boom()};if($('reveal'))$('reveal').onclick=()=>{finalTimers.forEach(clearTimeout);finalTimers=[];revealed=3;drawFinal();boom();fireworks()};if($('details'))$('details').onclick=()=>showRanking(true)}
function showRanking(fx=false){stage='ranking';const rows=rankings();app.innerHTML=`<section class="panel results-screen"><div class="eyebrow">DE-MAX · Spiel</div><h1>Rangliste</h1><div class="results-sub">Konačni rezultati · ${players.length} učenika</div><p class="tie-note">Redosled: bodovi, broj tačnih odgovora, pa redosled unosa ako je rezultat potpuno isti.</p><div class="scoretable" role="table" aria-label="Rang lista učenika"><div class="scoreline scorehead" role="row"><span>Plasman</span><span>Ime i prezime</span><span>Tačno</span><span>Netačno</span><span>Bonus ✓</span><span>Bodovi</span></div>${rows.map(x=>`<div class="scoreline place${x.rank}" role="row"><b>${x.rank===1?'🥇':x.rank===2?'🥈':x.rank===3?'🥉':x.rank+'.'}</b><strong>${esc(x.name)}</strong><span class="rightnum">${x.correct}/${x.total}</span><span class="wrongnum">${x.wrong}</span><span>${x.bonus}</span><strong class="scorepoints">${x.score}</strong></div>`).join('')}</div><div class="finalactions"><button class="backred" id="backFinal">← Zurück</button><button class="primary green" id="new">Neues Spiel ↻</button></div></section>`;$('backFinal').onclick=()=>{stage='final';revealed=3;drawFinal()};$('new').onclick=()=>setup([]);if(fx){boom();fireworks()}}
function teacherUpdate(){}
document.addEventListener('keydown',e=>{if(stage!=='game'||/INPUT|TEXTAREA|BUTTON/.test(document.activeElement.tagName)&&e.key==='Enter'||e.ctrlKey||e.metaKey||e.altKey)return;const i='abc'.indexOf(e.key.toLowerCase());if(e.key.length===1&&i>=0){e.preventDefault();answer(i)}else if(e.key==='ArrowRight'){e.preventDefault();next()}else if(e.key==='ArrowLeft'){e.preventDefault();prev()}});setup();
</script></body></html>
