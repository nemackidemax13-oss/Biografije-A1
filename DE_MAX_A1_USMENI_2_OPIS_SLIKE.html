<style>

body{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:linear-gradient(120deg,#e9f2ff,#f7fafe);display:flex;align-items:center;justify-content:center;color:#173352}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:2px solid #2b82ed;outline-offset:1px}
.app{width:min(100vw,56.25dvh);height:100dvh;max-height:100dvh;min-height:0;min-width:0;background:#fff;padding:5px;display:grid;grid-template-rows:27px 48px 46px minmax(0,1fr) minmax(188px,35%);gap:4px;overflow:hidden;box-shadow:0 10px 45px #1e406226}

.example{border:1px solid #cbdcef;border-radius:8px;background:#f7faff;min-height:0;padding:3px 8px;display:flex;flex-direction:column;justify-content:center;gap:2px;overflow:hidden}
.sample-content{width:100%;min-width:0;align-self:center;display:grid!important;grid-template-columns:20px minmax(0,1fr)!important;grid-template-rows:auto auto;column-gap:5px;row-gap:2px;align-items:start;overflow:hidden}
.sample-number{grid-column:1;grid-row:1;font-size:12.5px;font-weight:900;color:#173f73;line-height:1.15}
.sample-content>.samplehead{grid-column:2;grid-row:1;min-width:0;text-align:left}
.sample-content>.samplesr{grid-column:2;grid-row:2;min-width:0;text-align:left;margin-top:0;color:#111!important;font-weight:900!important}
.samplehead{font-size:12.5px;font-weight:900;color:#173f73;letter-spacing:0;white-space:nowrap;line-height:1.15}
.samplede{font-size:11px;line-height:1.13;font-weight:850;color:#173f73;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.samplesr{color:#161616;font-size:11.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;margin-top:3px}
.sound{min-height:30px;min-width:30px;border:1px solid #bcdaff;border-radius:7px;background:#eaf4ff;color:#19579f;display:grid;place-items:center;font-size:14px;padding:3px}
.panel{min-height:0;min-width:0;border:1px solid var(--line);border-radius:9px;background:#fff;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.paneltitle{flex:none;height:25px;padding:0 6px;background:#f3f8ff;border-bottom:1px solid #dde8f7;display:flex;align-items:center;justify-content:space-between;gap:5px}
.paneltitle strong{font-size:11px;color:#1b5398;line-height:1.05}
.paneltitle .small{font-size:10px;color:#667f9b;white-space:nowrap}
 .load{height:21px;flex:none;font-size:9px;font-weight:850;background:#eaf7ef;border:1px solid #b7dec6;border-radius:6px;color:#13734b;padding:2px 6px;white-space:nowrap}
 .rolebar{height:25px;flex:none;display:flex;align-items:center;gap:4px;padding:2px 5px;background:#fafcff;border-bottom:1px solid #e5edf8}
 .rolebar[hidden]{display:none}
 .rolebar button{flex:1;min-width:0;height:20px;border:1px solid #c8d8ed;background:#fff;color:#295b96;border-radius:5px;font-size:10px;font-weight:850}
 .rolebar button.active{background:#d6273e;border-color:#bd1d35;color:white}
.phrases{flex:1;min-height:0;display:grid;grid-template-rows:repeat(var(--page-rows,3),minmax(0,1fr));gap:1px;padding:2px;overflow:hidden}
.phrase{display:flex;align-items:stretch;gap:2px;border:1px solid #dce8f6;background:#fff;border-radius:5px;min-height:0;overflow:hidden}
.phrase.selected{background:#fff1f3;border:2px solid #ed1636;box-shadow:inset 0 0 0 1px #ed163622}
.phrase .add{flex:1;min-height:0;min-width:0;display:flex;align-items:center;gap:3px;background:transparent;border:0;text-align:left;padding:1px 3px}
.plus{width:15px;height:15px;flex:none;border-radius:5px;background:#e6effe;color:#2561ac;display:grid;place-items:center;font-size:11px;font-weight:950}

.phrasetxt{display:flex;min-height:0;min-width:0;flex-direction:column;justify-content:center;overflow:hidden;gap:1px}

.phrase .sound{align-self:center;min-width:21px;min-height:21px;padding:1px;margin-right:2px;font-size:10px}
.pagination{flex:none;height:24px;background:#f9fbff;border-top:1px solid #e9f0fa;display:flex;align-items:center;justify-content:space-between;padding:2px 7px;gap:5px}
.nav{height:24px;min-width:34px;padding:0 8px;border-radius:7px;border:1px solid #bb1833;background:#d6273e;color:#fff;font-weight:950;font-size:19px;line-height:1}

.pagecount{font-size:10px;font-weight:800;color:#53718f;white-space:nowrap}
.compose .paneltitle{height:25px}
.selected-area{flex:1;min-height:0;display:flex;align-items:stretch;padding:4px 5px;overflow:hidden}
.chosen-grid{width:100%;height:100%;min-height:0;display:grid;grid-template-rows:repeat(var(--chosen-rows,2),minmax(0,1fr));gap:3px}
.current{width:100%;min-height:0;max-height:100%;display:flex;align-items:center;gap:4px;padding:2px 4px;border:1px solid #e2eaf6;background:#fcfdff;border-radius:6px;overflow:hidden}
.current .index{width:22px;height:22px;min-width:22px;display:grid;place-items:center;align-self:center;font-size:10px;font-weight:900;color:#8fa1b7;flex:none;padding:0;border-radius:100%}
.current .sentence{min-width:0;flex:1;overflow:hidden;align-self:center}
.current .sentence .de{font-size:11px;line-height:1.2}
.current .sentence .sr{font-size:9px;line-height:1.2;margin-top:2px}
.current .remove{align-self:center;flex:none;border:1px solid #f0c3cb;border-radius:6px;background:#fff1f4;color:#bf2941;font-size:13px;font-weight:900;width:23px;height:24px}
.current .sound{min-width:23px;min-height:23px;font-size:11px}
/* Tokom automatskog čitanja u "Moj opis" označi upravo izgovaranu rečenicu. */
.current.speaking-now{border-color:#e32d49!important}

.current.speaking-now .sr{color:#715969}

.empty{font-size:10.5px;color:#768ca5;text-align:center;line-height:1.5;margin:auto;padding:0 8px}
.compact-nav{flex:none;height:23px;display:flex;justify-content:center;gap:6px;align-items:center;border-top:1px solid #edf2f9}

.compact-nav .nav{height:23px;min-width:31px;font-size:17px}
.controls{height:31px;flex:none;display:flex;gap:4px;align-items:center;padding:3px 5px;border-top:1px solid #e9eef7;background:#f9fbfe}

.ctrl.main{background:#189750;color:#fff;border-color:#137d42;flex:1.2}
.ctrl.active{background:#eaf8ef;border-color:#aed9bf;color:#17724c}
.ctrl.danger{color:#ba2b41;background:#fff3f5;border-color:#edc9d0;flex:.65}
.agebar{height:83px;min-height:83px;flex:none;display:flex;flex-direction:column;gap:3px;padding:4px 5px;background:#f8fbff;border-bottom:1px solid #dbe8f6;overflow:hidden}
.agebar[hidden]{display:none}
.agebar.age-selected{background:#fff3f5;box-shadow:inset 0 0 0 2px #ed1636}
.age-controls{display:flex;align-items:center;justify-content:center;gap:6px;flex:none;height:28px;min-width:0}
.age-person{font-size:10px;font-weight:950;color:#174886;margin-right:auto;white-space:nowrap}
.age-btn{width:29px;height:27px;border-radius:7px;border:1px solid #adc9e9;background:#eff6ff;color:#164a95;font-size:18px;font-weight:850;line-height:1;flex:none}
.age-btn:disabled{opacity:.35;cursor:default}
.age-number{min-width:29px;font-size:17px;text-align:center;font-weight:950;color:#173b6b}

.age-preview{display:flex;align-items:center;gap:4px;flex:1;min-height:0}

.modebar{height:23px;flex:none;display:flex;gap:4px;align-items:center;justify-content:center;padding:2px 5px;background:#fbfdff;border-bottom:1px solid #e1e9f5}

.optionline{flex:none;height:24px;display:flex;align-items:center;gap:3px;min-width:0}
.optionlabel{flex:none;width:46px;font-size:10px;font-weight:850;color:#25518a}
.optionarrow{width:25px;height:22px;flex:none;padding:0;border:1px solid #bdd3ec;background:white;border-radius:6px;color:#1b589d;font-size:14px;font-weight:950}
.optionvalue{flex:1;min-width:0;text-align:center;font-size:10px;font-weight:900;color:#1c477b;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.choicepreview{min-height:0;flex:1;display:flex;align-items:center;gap:4px;padding-top:1px}
.choicetext{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px}
.choicetext strong{font-size:10px;color:#153f76;line-height:1.12}
.choicetext small{font-size:8.5px;color:#637b98;line-height:1.13}
.choicepreview .sound{min-width:25px;min-height:25px;font-size:11px;flex:none;padding:1px}
.choiceadd{background:#e8f7ee;border:1px solid #a8d6bd;color:#14734d;height:26px;min-width:61px;flex:none;padding:2px 5px;border-radius:7px;font-size:10px;font-weight:900}
.choicebar.is-selected .choiceadd{background:#d6273e;border-color:#b71835;color:white}
.current.dynamic-current{border:1px solid #ed1636;background:#fff3f5;box-shadow:inset 0 0 0 1px #ed1636}
/* U koraku Izgled prikazuje se isključivo odabrani interaktivni deo, bez ostalih rečenica. */
.panel.appearance-only .phrases,.panel.appearance-only .pagination,.panel.appearance-only .load{display:none}

<body>
<main class="app" id="app" aria-label="A1 opis slike — mustra za učenike">
 <nav class="steps" id="steps" aria-label="Koraci opisa">
  <button class="step active" data-step="0"><span class="num">1</span><span>Osobe</span></button>
  <button class="step" data-step="1"><span class="num">2</span><span>Razgovor</span></button>
  <button class="step" data-step="2"><span class="num">3</span><span>Mesto</span></button>
  <button class="step" data-step="3"><span class="num">4</span><span>Izgled</span></button>
  <button class="step" data-step="4"><span class="num">5</span><span>Odeća</span></button>
  <button class="step" data-step="5"><span class="num">6</span><span>Detalji</span></button>
 </nav>
 <section class="example" aria-label="Ispitno pitanje i prevod">
  <div class="sample-content"><span class="sample-number" id="sampleNumber">1.</span><div class="samplehead" id="samplehead">Wie viele Personen sehen Sie?</div><div class="samplesr" id="samplesr">Koliko osoba vidite?</div></div>
 </section>
 <section class="panel" aria-label="Izbor rečenica">
  <div class="paneltitle"><strong id="selectorTitle">Izaberi rečenice</strong><span class="small" id="categoryCount">194 rečenice</span></div>
  <div class="rolebar" id="rolebar" hidden aria-label="Izbor osobe"><button data-role="mann" class="active">Muškarac</button><button data-role="frau">Žena</button><button data-role="kind">Dete</button></div>
  <div class="modebar" id="modebar" hidden aria-label="Izbor osobina"><button data-mode="description">Opis</button><button data-mode="age" class="active">Godine</button><button data-mode="hair">Kosa</button></div>
  <div class="agebar" id="agebar" hidden aria-label="Interaktivni izbor godina">
   <div class="age-controls"><span class="age-person" id="agePerson">Der Mann</span>
    <button type="button" class="age-btn" id="ageMinus" aria-label="Smanji broj godina">−</button>
    <span class="age-number" id="ageCount">30</span>
    <button type="button" class="age-btn" id="agePlus" aria-label="Povećaj broj godina">+</button>

 $("#selectedArea").style.setProperty("--chosen-rows",per);
 $("#selectedArea").innerHTML='<div class="chosen-grid">'+visible.map((i,offset)=>{
  const line=BANK[i],isSpeaking=speakingChosenPosition===first+offset;return '<div class="current '+(["age","custom-hair","custom-clothing"].includes(line.cat)?'dynamic-current':'')+(isSpeaking?' speaking-now':'')+'" data-chosen-position="'+(first+offset)+'"'+(isSpeaking?' aria-current="true"':'')+'><span class="index">'+(first+offset+1)+'.'+'</span><div class="sentence"><div class="de">'+escapeHTML(line.de)+'</div><div class="sr">'+escapeHTML(line.sr)+'</div></div><button class="sound" data-chosen-sound="'+i+'" aria-label="Poslušaj rečenicu">🔊</button><button class="remove" data-chosen-remove="'+i+'" aria-label="Ukloni rečenicu">×</button></div>'
 }).join("")+'</div>'
}
function updateSpeakingFrame(){
 const rows=[...document.querySelectorAll("#selectedArea .current[data-chosen-position]")];
 const per=chosenPageSize(),wantedPage=Math.floor(chosenIndex/per);
 if(!rows.length||Math.floor(Number(rows[0].dataset.chosenPosition)/per)!==wantedPage){renderChosen();return}
 for(const row of rows){
  const pos=Number(row.dataset.chosenPosition),speaking=pos===speakingChosenPosition;
  row.classList.toggle("speaking-now",speaking);
  if(speaking)row.setAttribute("aria-current","true");else row.removeAttribute("aria-current");
  row.querySelector(".index").textContent=(pos+1)+".";
 }
}
function addOrRemove(i){const pos=chosen.indexOf(i);if(pos<0){chosen.push(i);chosenIndex=chosen.length-1;listen(i)}else{stop();chosen.splice(pos,1);chosenIndex=Math.min(pos,chosen.length-1)}renderChosen();renderList();renderAge();renderHair();renderClothing()}
function showRoles(){
 const show=step===3||step===4,appearance=step===3&&appearanceMode!=="description";
 $("#rolebar").hidden=!show;
 const panel=$("#phrases").closest(".panel");
 panel.classList.toggle("appearance-only",appearance);
 $("#selectorTitle").textContent=step===3?(appearanceMode==="age"?"Izaberi godine":appearanceMode==="hair"?"Izaberi kosu":"Opis osobe"):"Izaberi rečenice";
 document.querySelectorAll("[data-role]").forEach(b=>b.classList.toggle("active",b.dataset.role===activeRole));
 renderModes();renderAge();renderHair();renderClothing();
}
function chooseStep(n){step=n;if(n===3){category=activeRole}else category=STEP_CATS[n];page=0;showRoles();renderSample();renderList()}
function playAll(){
 stop();
 const my=runId,arr=[...chosen];
 let position=0;
 function playNext(){
  if(my!==runId)return;
  if(position>=arr.length){
   speakingChosenPosition=-1;
   updateSpeakingFrame();
   return;
  }
  chosenIndex=position;
  speakingChosenPosition=position;
  updateSpeakingFrame();
  utter(BANK[arr[position++]].de,playNext);
 }
 playNext();
}
$("#steps").addEventListener("click",e=>{const b=e.target.closest("[data-step]");if(b)chooseStep(Number(b.dataset.step))});
$("#rolebar").addEventListener("click",e=>{const b=e.target.closest("[data-role]");if(!b)return;activeRole=b.dataset.role;if(step===3)category=activeRole;page=0;showRoles();renderSample();renderList()});
$("#modebar").addEventListener("click",e=>{const b=e.target.closest("[data-mode]");if(!b)return;appearanceMode=b.dataset.mode;page=0;showRoles();renderSample();renderList()});
$("#ageMinus").addEventListener("click",()=>adjustAge(-1));
$("#agePlus").addEventListener("click",()=>adjustAge(1));
$("#ageSound").addEventListener("click",()=>listen(AGE_INDEX[category]));
$("#ageAdd").addEventListener("click",()=>addOrRemove(AGE_INDEX[category]));
$("#hairbar").addEventListener("click",e=>{const b=e.target.closest("[data-hair-turn]");if(b)turnHair(b.dataset.hairTurn,Number(b.dataset.delta))});
$("#hairSound").addEventListener("click",()=>listen(HAIR_INDEX[category]));
$("#hairAdd").addEventListener("click",()=>addOrRemove(HAIR_INDEX[category]));
$("#clothingbar").addEventListener("click",e=>{const b=e.target.closest("[data-clothing-turn]");if(b)turnClothing(b.dataset.clothingTurn,Number(b.dataset.delta))});
$("#clothingSound").addEventListener("click",()=>listen(CLOTH_INDEX[activeRole]));
$("#clothingAdd").addEventListener("click",toggleClothing);
$("#phrases").addEventListener("click",e=>{let b=e.target.closest("[data-add]");if(b){addOrRemove(Number(b.dataset.add));return}b=e.target.closest("[data-sound]");if(b)listen(Number(b.dataset.sound))});
$("#prev").addEventListener("click",()=>{page--;renderList()});
$("#next").addEventListener("click",()=>{page++;renderList()});
$("#chosenPrev").addEventListener("click",()=>{chosenIndex=Math.max(0,(Math.floor(chosenIndex/chosenPageSize())-1)*chosenPageSize());renderChosen()});
$("#chosenNext").addEventListener("click",()=>{chosenIndex=Math.min(chosen.length-1,(Math.floor(chosenIndex/chosenPageSize())+1)*chosenPageSize());renderChosen()});
$("#selectedArea").addEventListener("click",e=>{const sound=e.target.closest("[data-chosen-sound]");if(sound){listen(Number(sound.dataset.chosenSound));return}const remove=e.target.closest("[data-chosen-remove]");if(remove)addOrRemove(Number(remove.dataset.chosenRemove))});
$("#playAll").addEventListener("click",playAll);
$("#clear").addEventListener("click",()=>{stop();chosen=[];chosenIndex=0;renderChosen();renderList()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")stop()});
if("speechSynthesis" in window)speechSynthesis.getVoices();
renderSample();showRoles();renderList();renderChosen();
// Resize layout when device orientation/available viewport changes, without introducing scrollbars.
if("ResizeObserver" in window){new ResizeObserver(()=>renderList()).observe($("#phrases"))}
window.addEventListener("resize",()=>{renderList();renderChosen()});
</script>
</body></html>
