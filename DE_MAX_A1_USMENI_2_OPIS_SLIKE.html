const $=(q)=>document.querySelector(q);
let PAGE_SIZE=6;

function voice(){if(!("speechSynthesis" in window))return null;const list=speechSynthesis.getVoices();return list.find(v=>/^de/i.test(v.lang)&&/google/i.test(v.name))||list.find(v=>/^de-DE/i.test(v.lang))||list.find(v=>/^de/i.test(v.lang))||null}

 document.documentElement.style.setProperty("--page-rows",PAGE_SIZE);

function chosenPageSize(){const box=$("#selectedArea");return Math.max(1,Math.min(4,Math.floor(Math.max(0,box.clientHeight-6)/(box.clientWidth<330?62:54))))}
function renderChosen(){
 const n=chosen.length;chosenIndex=Math.min(Math.max(0,chosenIndex),Math.max(0,n-1));
 $("#total").textContent=n+" rečenica";
 if(!n){$("#chosenPage").textContent="0 od 0";$("#chosenPrev").disabled=true;$("#chosenNext").disabled=true;$("#selectedArea").innerHTML='<p class="empty">Dodaj rečenice pomoću +. Ovde će se videti više rečenica tvog opisa istovremeno.</p>';return}

 }).join("")+'</div>'
}
function addOrRemove(i){const pos=chosen.indexOf(i);if(pos<0){chosen.push(i);chosenIndex=chosen.length-1;if(auto)listen(i)}else{stop();chosen.splice(pos,1);chosenIndex=Math.min(pos,chosen.length-1)}renderChosen();renderList()}
