function h3(){const lands=['Afrika','Amerika','Asien','Europa'];return `${heading('Hören · Aufgabe 3','10 bodova','Wo gefällt es Ihnen am besten? Sie hören fünf Personen. Hören Sie zu und kreuzen Sie pro Person genau eine Antwort an.')}${audioPanel(3)}${originalBtns([7])}<div class="card card-tight"><div class="image-grid" style="grid-template-columns:repeat(4,minmax(0,1fr));gap:4px">${lands.map((t,i)=>`<div style="min-width:0;text-align:center">${img(`hoeren3-land-${i+1}`,t)}<div style="font-size:10px;font-weight:850;margin-top:4px">${t}</div></div>`).join('')}</div></div><div class="card">${[1,2,3,4,5].map(i=>`<div class="question"><div class="question-title">Text ${i}</div>${answerChoices('h3_'+(i-1),lands,'n4')}</div>`).join('')}</div>`;}
function form(){return `${heading('Schreiben · Aufgabe 1','5 bodova','Situation: Ihr Freund Ricardo Torres will im September mit seiner Freundin Urlaub in der Schweiz machen. Sie fahren mit dem Zug und brauchen ein Zimmer für zwei Personen mit Frühstück. Sie möchten schwimmen und wandern. Die Reise zahlt Ricardo mit Kreditkarte. Er ist am 26. November 1979 geboren.')}${originalBtns([8])}<div class="card"><div class="center" style="font-size:16px;font-weight:950;margin:3px 0 12px">Reiseangebote<br><span style="color:#3e689e;font-size:11px">www.auf-und-weg.com</span><br>Formular</div><div class="field"><label>Nachname:</label><b style="font-size:13px">Torres</b></div><div class="field"><label>Vorname:</label>${freeInput('f_name','Vorname')}</div><div class="field"><label>Geburtsdatum:</label>${freeInput('f_birth','TT.MM.JJJJ')}</div><div class="field"><label>Urlaubsland:</label>${freeInput('f_country','Land')}</div><div class="field"><label>Monat:</label>${freeInput('f_month','Monat')}</div><div class="field"><label>Zimmer:</label><div class="form-options">${answerChoices('f_room',['Einzelzimmer','Doppelzimmer'])}</div></div><div class="field"><label>Frühstück:</label><div class="form-options">${answerChoices('f_break',['Ja','Nein'])}</div></div><div class="field"><label>Anreise mit:</label>${freeInput('f_arrive','Verkehrsmittel')}</div><div class="field"><label>Sport:</label><div class="form-options">${['Fußball','Wandern','Radfahren','Schwimmen'].map(x=>`<label class="opt"><input type="checkbox" ${get('f_sport_'+x)?'checked':''} onchange="set('f_sport_${x}',this.checked)">${x}</label>`).join('')}</div></div><div class="field"><label>Bezahlung:</label><div class="form-options">${answerChoices('f_pay',['bar','Kreditkarte'])}</div></div><button class="btn btn-wide btn-plain" id="solutionButton" onclick="toggleSolutions()">${storage.showSolutions?'Sakrij rešenja':'✓ Prikaži rešenja formulara'}</button>${storage.showSolutions?`<div class="solution"><b>Originalna ÖSD rešenja:</b><br>Nachname: Torres<br>Vorname: <b>Ricardo</b><br>Geburtsdatum: <b>26.11.1979</b><br>Urlaubsland: <b>Schweiz</b><br>Monat: <b>September</b><br>Zimmer: <b>Doppelzimmer</b><br>Frühstück: <b>Ja</b><br>Anreise mit: <b>Zug</b><br>Sport: <b>Wandern, Schwimmen</b><br>Bezahlung: <b>Kreditkarte</b><p style="font-size:11px;margin-bottom:0">Formular nosi do 5 bodova. Ocenjuje se 10 odgovora prema zvaničnom ključu.</p></div>`:''}</div>`;}
function mail(){return `${heading('Schreiben · Aufgabe 2','10 dodatnih bodova','Mejl se vežba u De-Max aplikaciji „Ispitni mejlovi“. Otvorite vežbu i nakon toga proverite svoj rezultat.')}
<div class="card card-green"><div class="center"><div style="font-size:36px;margin:7px 0">✉</div><h2 class="h2">Vežbanje ispitnih mejlova</h2><p class="note">Otvorite postojeću aplikaciju, vežbajte mejlove sa ispita i vratite se na rezultat.</p></div><a class="btn btn-wide btn-next" href="${MAIL_URL}" target="_blank" rel="noopener noreferrer">Otvori vežbanje mejlova ↗</a><div style="height:8px"></div><a class="btn btn-wide btn-plain" href="${AI_MAIL_URL}" target="_blank" rel="noopener noreferrer">Provera napisanog mejla ↗</a></div><div class="card"><div class="mini-title">Moje beleške / napisani mejl</div><textarea class="mail-editor" id="mailDraft" placeholder="Ovde možete napisati i sačuvati svoj tekst..." oninput="storage.email=this.value;save()">${h(storage.email)}</textarea><p class="small">Mejl se čuva samo u ovom pregledaču. Ovaj deo ne ocenjuje automatski gramatiku.</p><label class="mini-title" for="emailGrade">Bodovi za mejl nakon provere (0–10)</label><select class="sel" id="emailGrade" onchange="storage.emailGrade=this.value;save()"><option value="">— još nije ocenjen —</option>${Array.from({length:11},(_,i)=>`<option value="${i}" ${String(storage.emailGrade)===String(i)?'selected':''}>${i} / 10</option>`).join('')}</select></div>`;}
function norm(s){return String(s??'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[.,\s/\-]/g,'');}
function countMatches(prefix,keys){return keys.reduce((a,x,i)=>a+(String(get(prefix+'_'+i))===String(x)?1:0),0);}
function score10Five(n){return Math.max(0,Math.min(10,n*2));}
function score10Six(n){return n===6?10:n===5?8:n===4?6:n===3?4:n===2?2:0;}
function scoreForm(){let x=0;if(norm(get('f_name'))==='ricardo')x++;
if(['26111979','26november1979','26nov1979'].includes(norm(get('f_birth'))))x++;
if(['schweiz','schweizerischeeidgenossenschaft'].includes(norm(get('f_country'))))x++;
if(['september','sept'].includes(norm(get('f_month'))))x++;
if(get('f_room')==='Doppelzimmer')x++;
if(get('f_break')==='Ja')x++;
if(['zug','mitdemzug','bahn'].includes(norm(get('f_arrive'))))x++;
if(get('f_sport_Wandern') && !get('f_sport_Fußball')&&!get('f_sport_Radfahren'))x++;
if(get('f_sport_Schwimmen')&&!get('f_sport_Fußball')&&!get('f_sport_Radfahren'))x++;
if(get('f_pay')==='Kreditkarte')x++;
return {count:x,pts:Math.floor(x/2)};}
function scoreH2(){const x=[['dienstag','di','di.'].some(z=>norm(get('h2_0'))===norm(z)),['12','zwolf','zwölf','12.'].some(z=>norm(get('h2_1'))===norm(z)),['14','14:00','14uhr','zwei','2','2uhr'].some(z=>norm(get('h2_2'))===norm(z)),['berner','bernergasse'].some(z=>norm(get('h2_3'))===norm(z)),norm(get('h2_4'))==='2582641'];return {count:x.filter(Boolean).length,pts:2*x.filter(Boolean).length};}
function grades(){const r=[score10Five(countMatches('r1',KEYS.r1)),score10Six(countMatches('r2',KEYS.r2)),score10Five(countMatches('r3',KEYS.r3))];const l=[score10Five(countMatches('h1',KEYS.h1)),scoreH2().pts,score10Five(countMatches('h3',KEYS.h3))];const f=scoreForm();const base=r.reduce((a,b)=>a+b,0)+l.reduce((a,b)=>a+b,0)+f.pts;const mailPts=storage.emailGrade===''?null:Number(storage.emailGrade);return {r,l,f,base,mailPts,read:r.reduce((a,b)=>a+b,0),hear:l.reduce((a,b)=>a+b,0),write:f.pts+(mailPts||0)};}
function result(){const g=grades();const basePass=g.base>=38&&g.read>=6&&g.hear>=6;const writePass=g.write>=4;const success=basePass&&writePass;const done=storage.emailGrade!=='';return `<div class="center" style="margin:2px 0 11px"><div class="eyebrow">DE-MAX TUTIN · TEST 1</div><h1 class="h2">Vaš rezultat ispita</h1><div class="score-big">${g.base}<small> / 65</small></div><div style="margin-top:5px" class="status ${success?'ok':'bad'}">${success?'✓ Ispunjeni svi zadati uslovi':basePass?'◉ Osnovni prag ispunjen; nedostaje Schreiben minimum':'✕ Osnovni prag ili minimum po oblastima nije dostignut'}</div><p class="small">Prolaz je 38 bodova bez mejla, uz minimum 6 u čitanju i slušanju.</p></div><div class="card"><div class="result-row"><div><div class="l">📖 Razumevanje / Lesen</div><div class="result-sub">Aufgaben 1–3: ${g.r.join(' + ')}</div></div><div class="r">${g.read} / 30</div></div><div class="final-progress"><div style="width:${g.read/30*100}%"></div></div><div class="result-row"><div><div class="l">🎧 Slušanje / Hören</div><div class="result-sub">Aufgaben 1–3: ${g.l.join(' + ')}</div></div><div class="r">${g.hear} / 30</div></div><div class="final-progress"><div style="width:${g.hear/30*100}%"></div></div><div class="result-row"><div><div class="l">📝 Formular</div><div class="result-sub">${g.f.count} od 10 tačnih podataka</div></div><div class="r">${g.f.pts} / 5</div></div><div class="final-progress"><div style="width:${g.f.pts/5*100}%"></div></div><div class="result-row"><div><div class="l">✉ Mejl (posebno)</div><div class="result-sub">${done?'Ručni unos nakon provere':'Još nije ocenjen'}</div></div><div class="r">${done?g.mailPts:'—'} / 10</div></div><div class="result-row" style="border:0"><div class="l">UKUPNO SA MEJLOM</div><div class="r" style="font-size:19px;color:#0c7d58">${g.base+(g.mailPts||0)} / 75</div></div></div><div class="card card-gold"><div class="mini-title">Granice koje ste zadali</div><div class="note">Lesen <b>${g.read}/30</b> — najmanje 6; Hören <b>${g.hear}/30</b> — najmanje 6; Schreiben (formular + mejl) <b>${g.write}/15</b> — najmanje 4. Mejl nije uključen u prag od 38 bodova, već se prikazuje dodatno.</div><p class="small">${g.write>=4?'Schreiben: ispunjen zadati minimum prema unetim bodovima.':'Schreiben: zadati minimum još nije dostignut.'} ${!done?'Bodove za mejl unesite nakon provere.':''}</p></div><div style="display:flex;gap:8px"><button class="btn btn-plain" style="flex:1" onclick="go(11)">✉ Mejl</button><button class="btn btn-outline" style="flex:1" onclick="confirmReset()">↺ Novi pokušaj</button></div><p class="small center">Bodovanje Lesen i Hören prati zvanični ÖSD ključ; mejl se ne ocenjuje bez provere napisanog rada.</p>`;}
function cover(){return `<div class="intro cover-compact"><div class="hero"><div class="hero-medallion">A1</div><div class="med">DE-MAX TUTIN · PRIPREMA</div><h1>TEST 1</h1><div style="font-weight:750;font-size:18px">ÖSD Zertifikat A1</div><p style="color:#c8d9f1;font-size:11px;line-height:1.45;margin-top:9px">Kompletna simulacija ispita sa originalnim zadacima, slikama i snimcima.</p><span class="tag">SLUŠAJ · REŠAVAJ · PROVERI REZULTAT</span></div><div class="feature-tiles"><div class="tile"><strong>30</strong><small>Lesen</small></div><div class="tile"><strong>30</strong><small>Hören</small></div><div class="tile"><strong>15</strong><small>Schreiben*</small></div></div><div class="card card-tight" style="margin-bottom:8px"><label class="mini-title" for="candidate">Ime i prezime kandidata</label><input id="candidate" type="text" value="${h(storage.name)}" oninput="storage.name=this.value;save()" placeholder="Unesite ime i prezime" style="width:100%;border:1px solid #cbd8ec;border-radius:10px;padding:11px;background:#f9fbff"></div><p class="small center" style="margin:2px 0">*Formular 5 + mejl 10. Prolaz 38/65 bez mejla.</p></div>`;}
function intro(which){const reading=which==='read',hearing=which==='hear';let title=reading?'Razumevanje':hearing?'Slušanje':'Formular i mejl';let sub=reading?'LESEN':hearing?'HÖREN':'SCHREIBEN';let pts=reading?30:hearing?30:15;let tasks=reading?['Situationen + Anzeigen (10 bodova)','Anzeigen · JA / NEIN (10 bodova)','Texte + Bilder (10 bodova)']:hearing?['Fotos + 5 Texte (10 bodova)','Nachricht · Notizen (10 bodova)','Wo gefällt es Ihnen? (10 bodova)']:['Formular · Ricardo Torres (5 bodova)','Vežbanje mejlova (10 dodatnih bodova)','Završni rezultat (prag 38 bez mejla)'];return `<div class="intro section-intro intro-compact"><div class="topicicon">${reading?'📖':hearing?'🎧':'✉'}</div><div class="center"><div class="eyebrow">${sub} · ÖSD A1</div><h2>${title}</h2><p class="lead">${reading?'Čitajte pažljivo i izaberite tačne odgovore prema originalnom testu.<br><span class="sr-mini">Pažljivo pročitajte zadatke i označite tačne odgovore.</span>':hearing?'Originalni snimci se mogu automatski pustiti ili ručno pokrenuti.':'Popunite originalni formular i pređite na mejlove u postojećoj De-Max aplikaciji.'}</p><div class="points">${pts}<small> bodova</small></div><div class="medals"><span class="medal green">Minimum ${reading||hearing?6:4}</span>${hearing?'<span class="medal">3 originalna MP3</span>':reading?'<span class="medal">25 min na ispitu</span>':'<span class="medal">Mejl +10 posebno</span>'}</div></div><div class="card rules">${tasks.map((t,i)=>`<div class="rule"><span class="n">${i+1}</span><span>${t}</span></div>`).join('')}${hearing?`<div class="rule" style="border:0"><span>Automatsko pokretanje slušanja</span><button class="switch ${storage.autoPlay?'yes':''}" aria-label="Automatski pokreći snimke" onclick="storage.autoPlay=!storage.autoPlay;save();render()"></button></div>`:''}</div></div>`;}
function render(){if(![6,7,8].includes(page))stopAudio();let html='';switch(page){case 0:html=cover();break;case 1:html=intro('read');break;case 2:html=r1();break;case 3:html=r2();break;case 4:html=r3();break;case 5:html=intro('hear');break;case 6:html=h1();break;case 7:html=h2();break;case 8:html=h3();break;case 9:html=intro('write');break;case 10:html=form();break;case 11:html=mail();break;case 12:html=result();break;}
main.innerHTML=html;document.getElementById('pageLabel').textContent=String(page+1).padStart(2,'0')+' / 13';document.getElementById('sectionLabel').textContent=pages[page].toUpperCase();document.getElementById('progress').style.width=((page+1)/pages.length*100)+'%';document.getElementById('back').disabled=page===0;document.getElementById('back').style.opacity=page===0?.4:1;document.getElementById('next').textContent=page===12?'Početna ↺':page===0?'Počni →':page===11?'Rezultat →':'Sledeća →';if([6,7,8].includes(page))prepareAudio(page-5);}
function go(p){if(p<0||p>=pages.length)return;page=p;main.scrollTop=0;render();}
function toggleSolutions(){storage.showSolutions=!storage.showSolutions;save();const pos=main.scrollTop;render();main.scrollTop=pos;}
function stopAudio(){if(!audio.paused)audio.pause();playingPage=null;}
const PARTS={1:8,2:10,3:10},audioPromises={};
function loadAudio(n){if(audioPromises[n])return audioPromises[n];let paths=Array.from({length:PARTS[n]},(_,i)=>A+SOURCES[n-1].file+'.part'+String(i+1).padStart(2,'0'));audioPromises[n]=Promise.all(paths.map(u=>fetch(u).then(r=>{if(!r.ok)throw Error('Nije učitan '+u);return r.arrayBuffer()}))).then(arr=>URL.createObjectURL(new Blob(arr,{type:'audio/mpeg'}))).catch(e=>{delete audioPromises[n];throw e});return audioPromises[n];}
function prepareAudio(n){const old=playingPage;playingPage=n;if(old!==n){audio.pause();audio.removeAttribute('src');audio.load();}const stat=document.getElementById('playState');if(stat)stat.textContent='Učitavanje…';loadAudio(n).then(src=>{if(playingPage!==n)return;if(audio.getAttribute('src')!==src){audio.src=src;audio.load();}updateAudioUI();if(storage.autoPlay&&page===n+5)audio.play().then(updateAudioUI).catch(()=>{const hint=document.getElementById('audioHint');if(hint)hint.textContent='Pritisnite ▶ Pusti kada bude spremno.';});}).catch(()=>{if(playingPage===n){const st=document.getElementById('playState');if(st)st.textContent='Greška';toast('Snimak se nije učitao. Proverite internet i pokušajte ponovo.');}});}

function playPause(){if(audio.paused){if(!audio.getAttribute('src')&&playingPage){const n=playingPage;loadAudio(n).then(src=>{if(playingPage!==n)return;audio.src=src;audio.load();audio.play().then(updateAudioUI).catch(()=>toast('Pritisnite Pusti još jednom.'));}).catch(()=>toast('Greška pri učitavanju.'));return;}audio.play().then(updateAudioUI).catch(()=>toast('Dozvolite reprodukciju zvuka.'));}else{audio.pause();updateAudioUI();}}
function replayAudio(){if(!audio.getAttribute('src'))return playPause();audio.currentTime=0;audio.play().then(updateAudioUI).catch(()=>toast('Pritisnite Pusti.'));}
function seekAudio(x){if(Number.isFinite(audio.duration))audio.currentTime=Number(x)/1000*audio.duration;}
function mm(t){if(!Number.isFinite(t))t=0;let v=Math.floor(t);return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0');}
function updateAudioUI(){const p=document.getElementById('playButton'),status=document.getElementById('playState'),clock=document.getElementById('audioClock'),seek=document.getElementById('audioSeek');if(!p)return;p.textContent=audio.paused?'▶ Pusti':'❚❚ Pauza';status.textContent=audio.paused?'Pauza':'Reprodukcija';if(clock)clock.textContent=mm(audio.currentTime)+' / '+mm(audio.duration);if(seek)seek.value=Number.isFinite(audio.duration)&&audio.duration?Math.round(1000*audio.currentTime/audio.duration):0;}
function confirmReset(){if(!window.confirm('Obrisati sve upisane odgovore i ponovo započeti Test 1?'))return;storage={answers:{},name:'',email:'',emailGrade:'',autoPlay:true,showSolutions:false};save();go(0);toast('Novi test je spreman.');}
document.getElementById('back').onclick=()=>go(page-1);document.getElementById('next').onclick=()=>{if(page===0){storage.answers={};storage.email='';storage.emailGrade='';storage.showSolutions=false;save();}go(page===12?0:page+1);};document.getElementById('closeModal').onclick=()=>document.getElementById('modal').classList.remove('show');document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('show')});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('modal').classList.remove('show')});audio.addEventListener('play',updateAudioUI);audio.addEventListener('pause',updateAudioUI);audio.addEventListener('timeupdate',updateAudioUI);audio.addEventListener('loadedmetadata',updateAudioUI);audio.addEventListener('ended',()=>{updateAudioUI();toast('Snimak je završen. Možete ponovo pustiti ili preći dalje.');});render();
</script>
</body></html>
