<body>
<div id="shell">
  <header class="top"><div class="identity"><div class="brand"><div class="logo">D•M</div><div><div class="brand-name">DE-MAX TUTIN</div><div class="brand-sub">ÖSD A1 · Ispitna simulacija</div></div></div><div class="top-right"><div class="pg" id="pageLabel">01 / 15</div><small id="sectionLabel">TEST 1</small></div></div><div class="bar"><div class="fill" id="progress"></div></div></header>
  <main class="main" id="main" aria-live="polite"></main>
  <footer class="bottom"><button class="btn btn-back" id="back">← Nazad</button><button class="btn btn-next" id="next">Počni →</button></footer>
  <div class="toast" id="toast" role="status"></div>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="modal-head"><span id="modalTitle">Originalni zadatak</span><button class="x" id="closeModal">Zatvori ✕</button></div><div class="modal-scroll" id="modalScroll"><img class="largeimg" id="modalImg" alt="Originalni zadatak iz dostavljenog testa"></div><div style="color:#c8dbf3;font-size:11px">Dodirnite sliku za pregled i uvećanje.</div></div>
<div id="answerModal" class="answer-modal" role="dialog" aria-modal="true" aria-labelledby="answerModalTitle" hidden onclick="if(event.target===this)closeAnswerMenu()"><div class="answer-dialog"><h2 id="answerModalTitle">Izaberite odgovor</h2><div id="answerOptions" class="answer-options"></div><div class="answer-actions"><button type="button" class="answer-cancel" onclick="closeAnswerMenu()">Nazad</button><button type="button" class="answer-confirm" onclick="confirmAnswerMenu()">Potvrdi</button></div></div></div>
<audio id="audio" preload="metadata" playsinline></audio>
<script>
'use strict';
const A='assets/';
const pages=['Početna','Razumevanje','Razumevanje · 1','Razumevanje · 2 (1/3)','Razumevanje · 2 (2/3)','Razumevanje · 2 (3/3)','Razumevanje · 3','Slušanje','Slušanje · 1','Slušanje · 2','Slušanje · 3','Formular i mejl','Formular','Mejl','Rezultat'];
const MAIL_URL='https://nemackidemax13-oss.github.io/Biografije-A1/DE-MAX-A1-Ispitni-Mejlovi/?v=10';
const AI_MAIL_URL='https://e-mail-a-1.replit.app';
const SOURCES=[{name:'Slušanje 1',file:'slusanje-1.mp3'},{name:'Slušanje 2',file:'slusanje-2.mp3'},{name:'Slušanje 3',file:'slusanje-3.mp3'}];
const KEYS={r1:[4,6,1,5,2],r2:['NEIN','JA','NEIN','NEIN','NEIN','JA'],r3:[5,4,1,6,3],h1:[5,'-',2,4,1,3],h3:['Asien','Afrika','Europa','Amerika','Afrika']};
let page=0,storage={answers:{},name:'',email:'',emailGrade:'',autoPlay:true,showSolutions:false},toastTimer=null,playingPage=null;
try{const old=JSON.parse(localStorage.getItem('demax-a1-test1-v1')||'null');if(old&&typeof old==='object')storage={...storage,...old,answers:old.answers||{}};}catch(e){}
try{if(localStorage.getItem('demax-h1-six-v1')!=='yes'){for(let i=0;i<6;i++)delete storage.answers['h1_'+i];localStorage.setItem('demax-h1-six-v1','yes');localStorage.setItem('demax-a1-test1-v1',JSON.stringify(storage));}}catch(e){}
const main=document.getElementById('main'),audio=document.getElementById('audio');
function h(s){return String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function save(){try{localStorage.setItem('demax-a1-test1-v1',JSON.stringify(storage));}catch(e){}}
function set(k,v){storage.answers[k]=v;save();}
function get(k){return storage.answers[k]??'';}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3000);}
function tag(t){return `<span class="chip">${t}</span>`}
function heading(task,pts,desc){return `<div class="section-bar"><div><div class="eyebrow">ÖSD Zertifikat A1 · Test 1</div><h1 class="h2">${task}</h1></div>${tag(pts)}</div><p class="lead">${desc}</p>`;}
function showImage(file,title){const el=document.getElementById('modal');document.getElementById('modalImg').src=A+file;document.getElementById('modalTitle').textContent=title||'Originalni zadatak';document.getElementById('modalScroll').scrollTop=0;el.classList.add('show');}
function img(file,title,cls='docimg'){return `<img src="${A+file}.webp" alt="${h(title)}" class="${cls}" loading="lazy" onclick="showImage('${file}.webp','${h(title)}')" tabindex="0" onkeydown="if(event.key==='Enter')showImage('${file}.webp','${h(title)}')">`;}
function originalBtns(nums){return '';}
function selectOpts(k,values,label='Odaberi'){const current=String(get(k));const displayed=current===''?'Odaberi':current==='-'?'—':current;return `<button type="button" class="sel sel-trigger ${current!==''?'has-answer':''}" data-key="${h(k)}" data-options="${encodeURIComponent(JSON.stringify(values))}" data-label="${h(label)}" aria-haspopup="dialog" aria-label="${h(label)}" onclick="openAnswerMenu(this)"><span class="choice-value">${h(displayed)}</span><span class="select-arrow" aria-hidden="true">▾</span></button>`;}
let activeAnswer=null;
function openAnswerMenu(button){
  let values=[];try{values=JSON.parse(decodeURIComponent(button.dataset.options));}catch(e){return;}
  const key=button.dataset.key;
  activeAnswer={button,key,values,selected:String(get(key))};
  const options=document.getElementById('answerOptions');
  options.textContent='';
  for(const choice of values){
    const value=String(choice);
    const item=document.createElement('button');
    item.type='button';
    item.className='answer-option'+(activeAnswer.selected===value?' chosen':'');
    item.textContent=value==='-'?'Preskoči':value;
    item.setAttribute('aria-pressed',String(activeAnswer.selected===value));
    item.onclick=()=>{
      if(!activeAnswer)return;
      activeAnswer.selected=value;
      for(const el of options.children){el.classList.remove('chosen');el.setAttribute('aria-pressed','false');}
      item.classList.add('chosen');item.setAttribute('aria-pressed','true');
    };
    options.appendChild(item);
  }
  document.getElementById('answerModalTitle').textContent=button.dataset.label||'Izaberite odgovor';
  document.getElementById('answerModal').hidden=false;
  const preselected=options.querySelector('.chosen');
  (preselected||options.querySelector('button'))?.focus();
}
function closeAnswerMenu(){document.getElementById('answerModal').hidden=true;activeAnswer=null;}
function confirmAnswerMenu(){
  if(!activeAnswer)return;
  const {key,button,selected}=activeAnswer;
  if(selected!==''){
    set(key,selected);
    const span=button.querySelector('.choice-value');
    if(span)span.textContent=selected==='-'?'—':selected;
    button.classList.add('has-answer');
  }
  closeAnswerMenu();button.focus();
}
function answerChoices(k,items,cls='n2'){return `<div class="choice-grid ${cls}">${items.map(x=>`<label class="choice"><input type="radio" name="${k}" value="${h(x)}" ${String(get(k))===String(x)?'checked':''} onchange="set('${k}',this.value)">${h(x)}</label>`).join('')}</div>`;}
function freeInput(k,placeholder,extra=''){return `<input type="text" placeholder="${h(placeholder)}" value="${h(get(k))}" ${extra} oninput="set('${k}',this.value)">`;}
function partTag(n){return `<span class="chip chip-dark">Aufgabe ${n} · 10 Punkte</span>`;}
function r1(){const txt=['Sie haben viele Freunde in anderen Ländern und möchten billig mit ihnen telefonieren.','Sie sollen für ein Fest etwas zum Essen mitbringen. Sie haben keine Zeit zum Kochen.','Sie suchen einen Job. Sie wollen in einem Büro arbeiten.','Sie haben eine große Wohnung. Sie brauchen Hilfe bei der Hausarbeit.','Sie arbeiten viel am Computer. In Ihrer Freizeit möchten Sie Sport machen.'];const txtSr=['Imate mnogo prijatelja u drugim zemljama i želite jeftino da telefonirate sa njima.','Treba da ponesete nešto za jelo na jednu proslavu. Nemate vremena da kuvate.','Tražite posao. Želite da radite u kancelariji.','Imate veliki stan. Potrebna vam je pomoć u kućnim poslovima.','Mnogo radite na računaru. U slobodno vreme želite da se bavite sportom.'];return `${heading('Lesen · Aufgabe 1','10 bodova','U novinama tražite različite stvari. Za svaku situaciju A–E pronađite odgovarajući oglas 1–6. Jedan oglas je višak.')}${originalBtns([1,2])}<div class="card card-quiet"><div class="mini-title">Anzeigen 1–6 <span class="small">· dodirnite oglas za uvećanje</span></div><div class="image-grid">${[1,2,3,4,5,6].map(i=>`<div class="image-cell">${img(`lesen1-ad-${i}`,`Anzeige ${i}`)}</div>`).join('')}</div></div><div class="card"><div class="mini-title">Situacije A–E · pronađite odgovarajući oglas</div>${txt.map((x,i)=>`<div class="reading-situation-card"><div class="reading-marker">SITUACIJA ${'ABCDE'[i]}</div><div class="reading-de">${x}</div><div class="reading-sr">${txtSr[i]}</div><div class="reading-answer-row"><span>Broj oglasa</span><div class="reading-select">${selectOpts('r1_'+i,[1,2,3,4,5,6],'Broj oglasa za situaciju '+ 'ABCDE'[i])}</div></div></div>`).join('')}</div>`;}
const lesen2ads=[['Schönes-Wochenende-Ticket',['Kann man am Freitagabend mit dem Ticket fahren?','Kostet das Ticket beim Kauf am Bahnhof mehr?']],['Lesen im Park',['Darf man die Bücher nur im Park lesen?','Müssen die Kinder Papier und Stifte mitbringen?']],['3-Zimmer-Wohnung',['Kann man telefonisch Informationen bekommen?','Kann man die Wohnung am Vormittag sehen?']]];
function r2(adIndex){const ad=lesen2ads[adIndex];const qStart=adIndex*2;const answered=[0,1].filter(j=>get('r2_'+(qStart+j))!=='').length;return `<section class="r2-screen">
<div class="r2-topline"><span><strong>Lesen · Aufgabe 2</strong> <span class="r2-points">10 bodova</span></span><span>Oglas ${adIndex+1}/3 · <span id="r2Answered">${answered}</span>/2</span></div>
<div class="r2-card"><div class="r2-ad-img">${img('lesen2-ad-'+(adIndex+1),ad[0])}</div>
<div class="r2-questions">${ad[1].map((question,j)=>`<div class="r2-question"><div class="r2-q-content"><div class="r2-q-label">${qStart+j+1}. pitanje</div><div class="r2-q-text">${question}</div></div><div class="r2-answer-row"><button type="button" class="r2-answer ${get('r2_'+(qStart+j))==='JA'?'r2-chosen':''}" onclick="chooseLesen2(${qStart+j},'JA')" aria-pressed="${get('r2_'+(qStart+j))==='JA'}">JA</button><button type="button" class="r2-answer ${get('r2_'+(qStart+j))==='NEIN'?'r2-chosen':''}" onclick="chooseLesen2(${qStart+j},'NEIN')" aria-pressed="${get('r2_'+(qStart+j))==='NEIN'}">NEIN</button></div></div>`).join('')}</div></div>
</section>`;}
function chooseLesen2(questionIndex,value){if(page<3||page>5||!Number.isInteger(questionIndex)||!['JA','NEIN'].includes(value)||Math.floor(questionIndex/2)!==page-3)return;set('r2_'+questionIndex,value);const buttons=main.querySelectorAll('.r2-question')[questionIndex%2]?.querySelectorAll('.r2-answer');if(buttons){for(const btn of buttons){const on=btn.textContent.trim()===value;btn.classList.toggle('r2-chosen',on);btn.setAttribute('aria-pressed',String(on));}}const progress=document.getElementById('r2Answered');if(progress){const q=(page-3)*2;progress.textContent=String([q,q+1].filter(i=>get('r2_'+i)!=='').length);}}
const lesen3txt=[`<b>Liebe Besucherinnen und Besucher!</b><br>Im Krankenhaus ist das Telefonieren mit Handy verboten.<br>Bitte schalten Sie Ihr Handy während Ihres Besuchs bei uns aus.`,`<b>Gasthaus Neuwirth</b><br>leichte regionale Küche<br>frische Salate vom Buffet<br>günstige Mittagsmenüs<br>Mo – Sa: 9 – 22 Uhr<br>Sonntag Ruhetag`,`<b>Liebe Kolleginnen und Kollegen!</b><br>In den Büroräumen ist das Rauchen verboten. Bitte nützen Sie die Raucherzonen im Erdgeschoss.`,`<b>Liebe Hundebesitzer!</b><br>Wir bitten Sie im Interesse aller Parkbenützer Ihren Hund an die Leine zu nehmen.`,`<b>Der Flughafen-Bus</b><br>bringt Sie schnell und bequem ins Stadtzentrum.<br>Nützen Sie das Angebot!<br>Fahrplanauskünfte am Flughafen Graz:<br>+43 (316) 2902 172`];
const lesen3Sr=[
  'Poštovani posetioci! U bolnici je zabranjeno telefoniranje mobilnim telefonom. Molimo vas da tokom posete isključite mobilni telefon.',
  'Gostionica Neuwirth: lagana regionalna kuhinja, sveže salate sa bifea, povoljni meniji za ručak. Ponedeljak–subota: 9–22 h. Nedeljom zatvoreno.',
  'Drage koleginice i kolege! U kancelarijama je pušenje zabranjeno. Molimo vas da koristite prostore za pušače u prizemlju.',
  'Poštovani vlasnici pasa! Molimo vas da, zbog svih korisnika parka, držite psa na povocu.',
  'Autobus sa aerodroma brzo i udobno vas vodi do centra grada. Iskoristite ponudu! Informacije o redu vožnje na aerodromu Grac: +43 (316) 2902 172.'
];
function r3(){return `${heading('Lesen · Aufgabe 3','10 bodova','Pročitajte pet kratkih tekstova A–E i izaberite odgovarajuću sliku 1–6 za svaki tekst. Jedna slika je višak.')}${originalBtns([4,5])}<div class="card card-quiet"><div class="mini-title">Slike 1–6 · dodirnite sliku za uvećanje</div><div class="image-grid">${[1,2,3,4,5,6].map(i=>`<div class="image-cell">${img(`lesen3-bild-${i}`,`Bild ${i}`)}</div>`).join('')}</div></div><div class="card"><div class="mini-title">Tekstovi A–E · izaberite odgovarajuću sliku</div>${lesen3txt.map((t,i)=>`<div class="reading-situation-card"><div class="reading-marker">TEKST ${'ABCDE'[i]}</div><div class="reading-de">${t}</div><div class="reading-sr">${lesen3Sr[i]}</div><div class="reading-answer-row"><span>Broj slike</span><div class="reading-select">${selectOpts('r3_'+i,[1,2,3,4,5,6],'Broj slike za tekst '+ 'ABCDE'[i])}</div></div></div>`).join('')}</div>`;}
function audioPanel(n){return `<div class="audio-panel"><div class="audio-head"><div><strong>♫ Originalni snimak ${n}</strong><br><small>ÖSD A1 · bez skraćivanja</small></div><span class="chip" id="playState" style="background:#ffffff27;color:#fff">Spremno</span></div><div class="audio-actions"><button class="audio-play" onclick="playPause()" id="playButton">▶ Pusti</button><input class="audio-seek" id="audioSeek" aria-label="Pozicija snimka" type="range" min="0" max="1000" value="0" oninput="seekAudio(this.value)"><span class="audio-time" id="audioClock">00:00</span><button class="audio-replay" title="Ponovo slušaj" onclick="replayAudio()">↺</button></div><div class="audio-help" id="audioHint">Snimak kreće automatski pri ulasku. Ako telefon blokira reprodukciju, pritisnite „Pusti“.</div></div>`;}
function h1(){const photos=[1,2,3,4,5,6];const letters=['A','B','C','D','E','F'];return `${heading('Hören · Aufgabe 1','10 bodova','Pogledajte svih šest slika i za svaku odgovarajuću sliku izaberite broj teksta 1–5.')}${audioPanel(1)}<div class="card card-tight"><div class="hearing-grid">${photos.map((photo,i)=>`<div class="image-cell"><div class="image-caption">Slika ${i+1} (${letters[i]})</div>${img('hoeren1-foto-'+photo,'Slika '+(i+1))}<div class="choose">${selectOpts('h1_'+i,[1,2,3,4,5],'Broj teksta za sliku '+(i+1))}</div></div>`).join('')}</div></div>`;}
function h2(){return `${heading('Hören · Aufgabe 2','10 bodova','Pročitajte zadatak, saslušajte poruku dva puta i dopunite prazna polja.')}${audioPanel(2)}${originalBtns([7])}<div class="card"><div class="mini-title">✎ Notizen</div><div class="field"><label>Was:</label><span class="task-text">Auto ansehen</span></div><div class="field"><label>Wann: am</label>${freeInput('h2_0','Wochentag')}</div><div class="small">Nachmittag</div><div class="field"><label>Datum (Mai):</label>${freeInput('h2_1','Tag im Mai','inputmode="numeric"')}</div><div class="field"><label>Um:</label>${freeInput('h2_2','Uhrzeit')}</div><div class="field"><label>Wo: in der</label>${freeInput('h2_3','Straßenname')}<span class="small">gasse 12</span></div><div class="field"><label>Tel. 0664/</label>${freeInput('h2_4','Telefonnummer','inputmode="tel"')}</div><div class="result-note">Slušajte originalni snimak od početka. U njemu se poruka ponavlja dva puta.</div></div>`;}
function h3(){const lands=['Afrika','Amerika','Asien','Europa'];return `${heading('Hören · Aufgabe 3','10 bodova','Saslušajte pet osoba. Za svaku osobu odaberite kontinent koji joj se najviše dopada.')}${audioPanel(3)}${originalBtns([7])}<div class="card card-tight"><div class="image-grid" style="grid-template-columns:repeat(4,minmax(0,1fr));gap:4px">${lands.map((t,i)=>`<div style="min-width:0;text-align:center">${img(`hoeren3-land-${i+1}`,t)}<div style="font-size:10px;font-weight:850;margin-top:4px">${t}</div></div>`).join('')}</div></div><div class="card">${[1,2,3,4,5].map(i=>`<div class="question"><div class="question-title">Text ${i}</div>${answerChoices('h3_'+(i-1),lands,'n4')}</div>`).join('')}</div>`;}
function form(){return `${heading('Schreiben · Aufgabe 1','5 bodova','Vaš prijatelj Ricardo Torres putuje u septembru sa devojkom na odmor u Švajcarsku. Idu vozom, potrebna im je dvokrevetna soba sa doručkom. Žele da plivaju i planinare. Ricardo plaća kreditnom karticom i rođen je 26. novembra 1979. godine. Popunite formular.')}${originalBtns([8])}<div class="card"><div class="center" style="font-size:16px;font-weight:950;margin:3px 0 12px">Reiseangebote<br><span style="color:#3e689e;font-size:11px">www.auf-und-weg.com</span><br>Formular</div><div class="field"><label>Nachname:</label><b style="font-size:13px">Torres</b></div><div class="field"><label>Vorname:</label>${freeInput('f_name','Vorname')}</div><div class="field"><label>Geburtsdatum:</label>${freeInput('f_birth','TT.MM.JJJJ')}</div><div class="field"><label>Urlaubsland:</label>${freeInput('f_country','Land')}</div><div class="field"><label>Monat:</label>${freeInput('f_month','Monat')}</div><div class="field"><label>Zimmer:</label><div class="form-options">${answerChoices('f_room',['Einzelzimmer','Doppelzimmer'])}</div></div><div class="field"><label>Frühstück:</label><div class="form-options">${answerChoices('f_break',['Ja','Nein'])}</div></div><div class="field"><label>Anreise mit:</label>${freeInput('f_arrive','Verkehrsmittel')}</div><div class="field"><label>Sport:</label><div class="form-options">${['Fußball','Wandern','Radfahren','Schwimmen'].map(x=>`<label class="opt"><input type="checkbox" ${get('f_sport_'+x)?'checked':''} onchange="set('f_sport_${x}',this.checked)">${x}</label>`).join('')}</div></div><div class="field"><label>Bezahlung:</label><div class="form-options">${answerChoices('f_pay',['bar','Kreditkarte'])}</div></div><button class="btn btn-wide btn-plain" id="solutionButton" onclick="toggleSolutions()">${storage.showSolutions?'Sakrij rešenja':'✓ Prikaži rešenja formulara'}</button>${storage.showSolutions?`<div class="solution"><b>Originalna ÖSD rešenja:</b><br>Nachname: Torres<br>Vorname: <b>Ricardo</b><br>Geburtsdatum: <b>26.11.1979</b><br>Urlaubsland: <b>Schweiz</b><br>Monat: <b>September</b><br>Zimmer: <b>Doppelzimmer</b><br>Frühstück: <b>Ja</b><br>Anreise mit: <b>Zug</b><br>Sport: <b>Wandern, Schwimmen</b><br>Bezahlung: <b>Kreditkarte</b><p style="font-size:11px;margin-bottom:0">Formular nosi do 5 bodova. Ocenjuje se 10 odgovora prema zvaničnom ključu.</p></div>`:''}</div>`;}
function mail(){return `${heading('Schreiben · Aufgabe 2','10 dodatnih bodova','Mejl se vežba u De-Max aplikaciji „Ispitni mejlovi“. Otvorite vežbu i nakon toga proverite svoj rezultat.')}
<div class="card card-green"><div class="center"><div style="font-size:36px;margin:7px 0">✉</div><h2 class="h2">Vežbanje ispitnih mejlova</h2><p class="note">Otvorite postojeću aplikaciju, vežbajte mejlove sa ispita i vratite se na rezultat.</p></div><a class="btn btn-wide btn-next" href="${MAIL_URL}" target="_blank" rel="noopener noreferrer">Otvori vežbanje mejlova ↗</a><div style="height:8px"></div><a class="btn btn-wide btn-plain" href="${AI_MAIL_URL}" target="_blank" rel="noopener noreferrer">Provera napisanog mejla ↗</a></div><div class="card"><div class="mini-title">Moje beleške / napisani mejl</div><textarea class="mail-editor" id="mailDraft" placeholder="Ovde možete napisati i sačuvati svoj tekst..." oninput="storage.email=this.value;save()">${h(storage.email)}</textarea><p class="small">Mejl se čuva samo u ovom pregledaču. Ovaj deo ne ocenjuje automatski gramatiku.</p><label class="mini-title" for="emailGrade">Bodovi za mejl nakon provere (0–10)</label><select class="sel" id="emailGrade" onchange="storage.emailGrade=this.value;save()"><option value="">— još nije ocenjen —</option>${Array.from({length:11},(_,i)=>`<option value="${i}" ${String(storage.emailGrade)===String(i)?'selected':''}>${i} / 10</option>`).join('')}</select></div>`;}
function norm(s){return String(s??'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[.,\s/\-]/g,'');}
function countMatches(prefix,keys){return keys.reduce((a,x,i)=>a+(String(get(prefix+'_'+i))===String(x)?1:0),0);}
function score10Five(n){return Math.max(0,Math.min(10,n*2));}
function score10Six(n){return n===6?10:n===5?8:n===4?6:n===3?4:n===2?2:0;}
function scoreForm(){let x=0;if(norm(get('f_name'))==='ricardo')x++;
if(['26111979','26november1979','26nov1979'].includes(norm(get('f_birth'))))x++;
if(['schweiz','schweizerischeeidgenossenschaft'].includes(norm(get('f_country'))))x++;
if(['september','sept'].includes(norm(get('f_month'))))x++;
if(get('f_room')==='Doppelzimmer')x++;
if(get('f_break')==='Ja')x++;
if(['zug','mitdemzug','bahn'].includes(norm(get('f_arrive'))))x++;
if(get('f_sport_Wandern') && !get('f_sport_Fußball')&&!get('f_sport_Radfahren'))x++;
if(get('f_sport_Schwimmen')&&!get('f_sport_Fußball')&&!get('f_sport_Radfahren'))x++;
if(get('f_pay')==='Kreditkarte')x++;
return {count:x,pts:Math.floor(x/2)};}
function scoreH2(){const x=[['dienstag','di','di.'].some(z=>norm(get('h2_0'))===norm(z)),['12','zwolf','zwölf','12.'].some(z=>norm(get('h2_1'))===norm(z)),['14','14:00','14uhr','zwei','2','2uhr'].some(z=>norm(get('h2_2'))===norm(z)),['berner','bernergasse'].some(z=>norm(get('h2_3'))===norm(z)),norm(get('h2_4'))==='2582641'];return {count:x.filter(Boolean).length,pts:2*x.filter(Boolean).length};}
function grades(){const r=[score10Five(countMatches('r1',KEYS.r1)),score10Six(countMatches('r2',KEYS.r2)),score10Five(countMatches('r3',KEYS.r3))];const l=[score10Five(countMatches('h1',KEYS.h1)),scoreH2().pts,score10Five(countMatches('h3',KEYS.h3))];const f=scoreForm();const base=r.reduce((a,b)=>a+b,0)+l.reduce((a,b)=>a+b,0)+f.pts;const mailPts=storage.emailGrade===''?null:Number(storage.emailGrade);return {r,l,f,base,mailPts,read:r.reduce((a,b)=>a+b,0),hear:l.reduce((a,b)=>a+b,0),write:f.pts+(mailPts||0)};}
function result(){const g=grades();const basePass=g.base>=38&&g.read>=6&&g.hear>=6;const writePass=g.write>=4;const success=basePass&&writePass;const done=storage.emailGrade!=='';return `<div class="center" style="margin:2px 0 11px"><div class="eyebrow">DE-MAX TUTIN · TEST 1</div><h1 class="h2">Vaš rezultat ispita</h1><div class="score-big">${g.base}<small> / 65</small></div><div style="margin-top:5px" class="status ${success?'ok':'bad'}">${success?'✓ Ispunjeni svi zadati uslovi':basePass?'◉ Osnovni prag ispunjen; nedostaje Schreiben minimum':'✕ Osnovni prag ili minimum po oblastima nije dostignut'}</div><p class="small">Prolaz je 38 bodova bez mejla, uz minimum 6 u čitanju i slušanju.</p></div><div class="card"><div class="result-row"><div><div class="l">📖 Razumevanje / Lesen</div><div class="result-sub">Aufgaben 1–3: ${g.r.join(' + ')}</div></div><div class="r">${g.read} / 30</div></div><div class="final-progress"><div style="width:${g.read/30*100}%"></div></div><div class="result-row"><div><div class="l">🎧 Slušanje / Hören</div><div class="result-sub">Aufgaben 1–3: ${g.l.join(' + ')}</div></div><div class="r">${g.hear} / 30</div></div><div class="final-progress"><div style="width:${g.hear/30*100}%"></div></div><div class="result-row"><div><div class="l">📝 Formular</div><div class="result-sub">${g.f.count} od 10 tačnih podataka</div></div><div class="r">${g.f.pts} / 5</div></div><div class="final-progress"><div style="width:${g.f.pts/5*100}%"></div></div><div class="result-row"><div><div class="l">✉ Mejl (posebno)</div><div class="result-sub">${done?'Ručni unos nakon provere':'Još nije ocenjen'}</div></div><div class="r">${done?g.mailPts:'—'} / 10</div></div><div class="result-row" style="border:0"><div class="l">UKUPNO SA MEJLOM</div><div class="r" style="font-size:19px;color:#0c7d58">${g.base+(g.mailPts||0)} / 75</div></div></div><div class="card card-gold"><div class="mini-title">Granice koje ste zadali</div><div class="note">Lesen <b>${g.read}/30</b> — najmanje 6; Hören <b>${g.hear}/30</b> — najmanje 6; Schreiben (formular + mejl) <b>${g.write}/15</b> — najmanje 4. Mejl nije uključen u prag od 38 bodova, već se prikazuje dodatno.</div><p class="small">${g.write>=4?'Schreiben: ispunjen zadati minimum prema unetim bodovima.':'Schreiben: zadati minimum još nije dostignut.'} ${!done?'Bodove za mejl unesite nakon provere.':''}</p></div><div style="display:flex;gap:8px"><button class="btn btn-plain" style="flex:1" onclick="go(13)">✉ Mejl</button><button class="btn btn-outline" style="flex:1" onclick="confirmReset()">↺ Novi pokušaj</button></div><p class="small center">Bodovanje Lesen i Hören prati zvanični ÖSD ključ; mejl se ne ocenjuje bez provere napisanog rada.</p>`;}
function cover(){return `<div class="intro cover-compact"><div class="hero"><div class="hero-medallion">A1</div><div class="med">DE-MAX TUTIN · PRIPREMA</div><h1>TEST 1</h1><div style="font-weight:750;font-size:18px">ÖSD Zertifikat A1</div><p style="color:#c8d9f1;font-size:11px;line-height:1.45;margin-top:9px">Kompletna simulacija ispita sa originalnim zadacima, slikama i snimcima.</p><span class="tag">SLUŠAJ · REŠAVAJ · PROVERI REZULTAT</span></div><div class="feature-tiles"><div class="tile"><strong>30</strong><small>Lesen</small></div><div class="tile"><strong>30</strong><small>Hören</small></div><div class="tile"><strong>15</strong><small>Schreiben*</small></div></div><div class="card card-tight" style="margin-bottom:8px"><label class="mini-title" for="candidate">Ime i prezime kandidata</label><input id="candidate" type="text" value="${h(storage.name)}" oninput="storage.name=this.value;save()" placeholder="Unesite ime i prezime" style="width:100%;border:1px solid #cbd8ec;border-radius:10px;padding:11px;background:#f9fbff"></div><p class="small center" style="margin:2px 0">*Formular 5 + mejl 10. Prolaz 38/65 bez mejla.</p></div>`;}
function intro(which){const reading=which==='read',hearing=which==='hear';let title=reading?'Razumevanje':hearing?'Slušanje':'Formular i mejl';let sub=reading?'LESEN':hearing?'HÖREN':'SCHREIBEN';let pts=reading?30:hearing?30:15;let tasks=reading?['Situationen + Anzeigen (10 bodova)','Anzeigen · JA / NEIN (10 bodova)','Texte + Bilder (10 bodova)']:hearing?['Fotos + 5 Texte (10 bodova)','Nachricht · Notizen (10 bodova)','Wo gefällt es Ihnen? (10 bodova)']:['Formular · Ricardo Torres (5 bodova)','Vežbanje mejlova (10 dodatnih bodova)','Završni rezultat (prag 38 bez mejla)'];return `<div class="intro section-intro intro-compact"><div class="topicicon">${reading?'📖':hearing?'🎧':'✉'}</div><div class="center"><div class="eyebrow">${sub} · ÖSD A1</div><h2>${title}</h2><p class="lead">${reading?'Pročitajte zadatke i odaberite tačne odgovore.':hearing?'Originalni snimci se mogu automatski pustiti ili ručno pokrenuti.':'Popunite originalni formular i pređite na mejlove u postojećoj De-Max aplikaciji.'}</p><div class="points">${pts}<small> bodova</small></div><div class="medals"><span class="medal green">Minimum ${reading||hearing?6:4}</span>${hearing?'<span class="medal">3 originalna MP3</span>':reading?'<span class="medal">25 min na ispitu</span>':'<span class="medal">Mejl +10 posebno</span>'}</div></div><div class="card rules">${tasks.map((t,i)=>`<div class="rule"><span class="n">${i+1}</span><span>${t}</span></div>`).join('')}${hearing?`<div class="rule" style="border:0"><span>Automatsko pokretanje slušanja</span><button class="switch ${storage.autoPlay?'yes':''}" aria-label="Automatski pokreći snimke" onclick="storage.autoPlay=!storage.autoPlay;save();render()"></button></div>`:''}</div></div>`;}
function render(){if(![8,9,10].includes(page))stopAudio();let html='';switch(page){case 0:html=cover();break;case 1:html=intro('read');break;case 2:html=r1();break;case 3:html=r2(0);break;case 4:html=r2(1);break;case 5:html=r2(2);break;case 6:html=r3();break;case 7:html=intro('hear');break;case 8:html=h1();break;case 9:html=h2();break;case 10:html=h3();break;case 11:html=intro('write');break;case 12:html=form();break;case 13:html=mail();break;case 14:html=result();break;}
main.classList.toggle('r2-no-scroll',page>=3&&page<=5);main.innerHTML=html;document.getElementById('pageLabel').textContent=String(page+1).padStart(2,'0')+' / '+pages.length;document.getElementById('sectionLabel').textContent=pages[page].toUpperCase();document.getElementById('progress').style.width=((page+1)/pages.length*100)+'%';document.getElementById('back').disabled=page===0;document.getElementById('back').style.opacity=page===0?.4:1;document.getElementById('next').textContent=page===14?'Početna ↺':page===0?'Počni →':page===13?'Rezultat →':'Sledeća →';if([8,9,10].includes(page))prepareAudio(page-7);}
function go(p){if(p<0||p>=pages.length)return;page=p;main.scrollTop=0;render();}
function toggleSolutions(){storage.showSolutions=!storage.showSolutions;save();const pos=main.scrollTop;render();main.scrollTop=pos;}
function stopAudio(){if(!audio.paused)audio.pause();playingPage=null;}
const PARTS={1:8,2:10,3:10},audioPromises={};
function loadAudio(n){if(audioPromises[n])return audioPromises[n];let paths=Array.from({length:PARTS[n]},(_,i)=>A+SOURCES[n-1].file+'.part'+String(i+1).padStart(2,'0'));audioPromises[n]=Promise.all(paths.map(u=>fetch(u).then(r=>{if(!r.ok)throw Error('Nije učitan '+u);return r.arrayBuffer()}))).then(arr=>URL.createObjectURL(new Blob(arr,{type:'audio/mpeg'}))).catch(e=>{delete audioPromises[n];throw e});return audioPromises[n];}
function prepareAudio(n){const old=playingPage;playingPage=n;if(old!==n){audio.pause();audio.removeAttribute('src');audio.load();}const stat=document.getElementById('playState');if(stat)stat.textContent='Učitavanje…';loadAudio(n).then(src=>{if(playingPage!==n)return;if(audio.getAttribute('src')!==src){audio.src=src;audio.load();}updateAudioUI();if(storage.autoPlay&&page===n+7)audio.play().then(updateAudioUI).catch(()=>{const hint=document.getElementById('audioHint');if(hint)hint.textContent='Pritisnite ▶ Pusti kada bude spremno.';});}).catch(()=>{if(playingPage===n){const st=document.getElementById('playState');if(st)st.textContent='Greška';toast('Snimak se nije učitao. Proverite internet i pokušajte ponovo.');}});}

function playPause(){if(audio.paused){if(!audio.getAttribute('src')&&playingPage){const n=playingPage;loadAudio(n).then(src=>{if(playingPage!==n)return;audio.src=src;audio.load();audio.play().then(updateAudioUI).catch(()=>toast('Pritisnite Pusti još jednom.'));}).catch(()=>toast('Greška pri učitavanju.'));return;}audio.play().then(updateAudioUI).catch(()=>toast('Dozvolite reprodukciju zvuka.'));}else{audio.pause();updateAudioUI();}}
function replayAudio(){if(!audio.getAttribute('src'))return playPause();audio.currentTime=0;audio.play().then(updateAudioUI).catch(()=>toast('Pritisnite Pusti.'));}
function seekAudio(x){if(Number.isFinite(audio.duration))audio.currentTime=Number(x)/1000*audio.duration;}
function mm(t){if(!Number.isFinite(t))t=0;let v=Math.floor(t);return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0');}
function updateAudioUI(){const p=document.getElementById('playButton'),status=document.getElementById('playState'),clock=document.getElementById('audioClock'),seek=document.getElementById('audioSeek');if(!p)return;p.textContent=audio.paused?'▶ Pusti':'❚❚ Pauza';status.textContent=audio.paused?'Pauza':'Reprodukcija';if(clock)clock.textContent=mm(audio.currentTime)+' / '+mm(audio.duration);if(seek)seek.value=Number.isFinite(audio.duration)&&audio.duration?Math.round(1000*audio.currentTime/audio.duration):0;}
function confirmReset(){if(!window.confirm('Obrisati sve upisane odgovore i ponovo započeti Test 1?'))return;storage={answers:{},name:'',email:'',emailGrade:'',autoPlay:true,showSolutions:false};save();go(0);toast('Novi test je spreman.');}
document.getElementById('back').onclick=()=>go(page-1);document.getElementById('next').onclick=()=>{if(page===0){storage.answers={};storage.email='';storage.emailGrade='';storage.showSolutions=false;storage.r2Step=0;save();}go(page===14?0:page+1);};document.getElementById('closeModal').onclick=()=>document.getElementById('modal').classList.remove('show');document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('show')});document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('modal').classList.remove('show');if(!document.getElementById('answerModal').hidden)closeAnswerMenu();}});audio.addEventListener('play',updateAudioUI);audio.addEventListener('pause',updateAudioUI);audio.addEventListener('timeupdate',updateAudioUI);audio.addEventListener('loadedmetadata',updateAudioUI);audio.addEventListener('ended',()=>{updateAudioUI();toast('Snimak je završen. Možete ponovo pustiti ili preći dalje.');});render();
</script>
</body></html>
