function selectOpts(k,values,label='Odaberi'){const current=String(get(k));const displayed=current===''?'Odaberi':current==='-'?'—':current;return `<button type="button" class="sel sel-trigger ${current!==''?'has-answer':''}" data-key="${h(k)}" data-options="${encodeURIComponent(JSON.stringify(values))}" data-label="${h(label)}" aria-haspopup="dialog" aria-label="${h(label)}" onclick="openAnswerMenu(this)"><span class="choice-value">${h(displayed)}</span><span class="select-arrow" aria-hidden="true">▾</span></button>`;}
let activeAnswer=null;
function openAnswerMenu(button){
  let values=[];try{values=JSON.parse(decodeURIComponent(button.dataset.options));}catch(e){return;}
  const key=button.dataset.key;
  activeAnswer={button,key,values,selected:String(get(key))};
  const options=document.getElementById('answerOptions');
  options.textContent='';
  for(const choice of values){
    const value=String(choice);
    const item=document.createElement('button');
    item.type='button';
    item.className='answer-option'+(activeAnswer.selected===value?' chosen':'');
    item.textContent=value===''?'Bez broja':value==='-'?'Preskoči':value;
    item.setAttribute('aria-pressed',String(activeAnswer.selected===value));
    item.onclick=()=>{
      if(!activeAnswer)return;
      activeAnswer.selected=value;
      for(const el of options.children){el.classList.remove('chosen');el.setAttribute('aria-pressed','false');}
      item.classList.add('chosen');item.setAttribute('aria-pressed','true');
    };
    options.appendChild(item);
  }
  document.getElementById('answerModalTitle').textContent=button.dataset.label||'Izaberite odgovor';
  document.getElementById('answerModal').hidden=false;
  const preselected=options.querySelector('.chosen');
  (preselected||options.querySelector('button'))?.focus();
}
function closeAnswerMenu(){document.getElementById('answerModal').hidden=true;activeAnswer=null;}
function confirmAnswerMenu(){
  if(!activeAnswer)return;
  const {key,button,selected}=activeAnswer;
  if(key.startsWith('h1_')){
    if(selected!==''&&!['1','2','3','4','5'].includes(selected))return;
    if(selected!==''){
      for(let i=0;i<6;i++){
        const other='h1_'+i;
        if(other!==key&&String(get(other))===selected){
          delete storage.answers[other];
          const otherButton=Array.from(main.querySelectorAll('.hearing-answer-select .sel-trigger')).find(x=>x.dataset.key===other);
          if(otherButton){otherButton.querySelector('.choice-value').textContent='Odaberi';otherButton.classList.remove('has-answer');}
        }
      }
      storage.answers[key]=selected;
    }else{
      delete storage.answers[key];
    }
    save();
    button.querySelector('.choice-value').textContent=selected||'Odaberi';
    button.classList.toggle('has-answer',selected!=='');
  }else if(selected!==''){
    set(key,selected);
    const span=button.querySelector('.choice-value');
    if(span)span.textContent=selected==='-'?'—':selected;
    button.classList.add('has-answer');
  }
  closeAnswerMenu();button.focus();
}

function reviewRafaelaFields(){const x=rafaelaData(),missing=[];if(!x.one.trim())missing.push('dan i vreme dolaska');if(!x.two.trim())missing.push('dužina boravka');if(!x.three.trim())missing.push('koga dovodiš');const status=document.getElementById('rafaelaStatus');if(status)status.textContent=missing.length?'Nedostaje: '+missing.join(', ')+'.':'Sva tri pitanja imaju odgovor. Proveri gramatiku, pozdrav i potpis.';}
function rafaelaAIResult(x){return `<div class="rafaela-ai-result"><b>OpenAI procena: ${h(x.score)}/10</b><p>${h(x.summary||'')}</p>${(x.checks||[]).map((v,i)=>`<p>${i+1}. ${v.answered?'✓':'✕'} ${h(v.feedback||'')}</p>`).join('')}<b>Ispravljen predlog:</b><pre>${h(x.corrected_email||'')}</pre></div>`;}
async function checkRafaela(){
 const x=rafaelaData(),status=document.getElementById('rafaelaStatus');
 if(!x.one.trim()||!x.two.trim()||!x.three.trim()){reviewRafaelaFields();return;}
 if(!RAFAELA_CHECK_ENDPOINT){if(status)status.textContent='OpenAI API još nije povezan. OPENAI_API_KEY stavi samo na server u Replit Secrets, nikada na GitHub.';return;}
 const btn=document.getElementById('rafAI');btn.disabled=true;btn.textContent='Proveravam…';
 try{
  const response=await fetch(RAFAELA_CHECK_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:rafaelaText(),answers:{arrival:x.one,duration:x.two,companion:x.three,signature:x.name}})});
  const result=await response.json();if(!response.ok)throw Error(result.error||'Greška servera');
  if(!Number.isInteger(result.score)||result.score<0||result.score>10||!Array.isArray(result.checks))throw Error('Nepotpun odgovor provere');
  storage.rafaelaReview=result;storage.emailGrade=String(result.score);save();document.getElementById('rafaelaReview').innerHTML=rafaelaAIResult(result);
  if(status)status.textContent='Provera završena. Bodovi mejla dodati su u završni rezultat.';
 }catch(error){if(status)status.textContent='Provera nije uspela: '+(error.message||error)+'. Tekst je sačuvan.';}
 finally{btn.disabled=false;btn.textContent='✦ OpenAI provera';}
}
function norm(s){return String(s??'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[.,\s/\-]/g,'');}
function countMatches(prefix,keys){return keys.reduce((a,x,i)=>a+(String(get(prefix+'_'+i))===String(x)?1:0),0);}
function score10Five(n){return Math.max(0,Math.min(10,n*2));}
function score10Six(n){return n===6?10:n===5?8:n===4?6:n===3?4:n===2?2:0;}
function scoreForm(){let x=0;if(norm(get('f_name'))==='ricardo')x++;
if(['26111979','26november1979','26nov1979'].includes(norm(get('f_birth'))))x++;
if(['schweiz','schweizerischeeidgenossenschaft'].includes(norm(get('f_country'))))x++;
if(['september','sept'].includes(norm(get('f_month'))))x++;
if(get('f_room')==='Doppelzimmer')x++;
if(get('f_break')==='Ja')x++;
if(['zug','mitdemzug','bahn'].includes(norm(get('f_arrive'))))x++;
if(get('f_sport_Wandern') && !get('f_sport_Fußball')&&!get('f_sport_Radfahren'))x++;
if(get('f_sport_Schwimmen')&&!get('f_sport_Fußball')&&!get('f_sport_Radfahren'))x++;
if(get('f_pay')==='Kreditkarte')x++;
return {count:x,pts:Math.floor(x/2)};}
function scoreH2(){const x=[['dienstag','di','di.'].some(z=>norm(get('h2_0'))===norm(z)),['12','zwolf','zwölf','12.'].some(z=>norm(get('h2_1'))===norm(z)),['14','14:00','14uhr','zwei','2','2uhr'].some(z=>norm(get('h2_2'))===norm(z)),['berner','bernergasse'].some(z=>norm(get('h2_3'))===norm(z)),norm(get('h2_4'))==='2582641'];return {count:x.filter(Boolean).length,pts:2*x.filter(Boolean).length};}
function grades(){const r=[score10Five(countMatches('r1',KEYS.r1)),score10Six(countMatches('r2',KEYS.r2)),score10Five(countMatches('r3',KEYS.r3))];const l=[score10Five(countMatches('h1',KEYS.h1)),scoreH2().pts,score10Five(countMatches('h3',KEYS.h3))];const f=scoreForm();const base=r.reduce((a,b)=>a+b,0)+l.reduce((a,b)=>a+b,0)+f.pts;const mailPts=storage.emailGrade===''?null:Number(storage.emailGrade);return {r,l,f,base,mailPts,read:r.reduce((a,b)=>a+b,0),hear:l.reduce((a,b)=>a+b,0),write:f.pts+(mailPts||0)};}

 ];
 const totalCorrect=entries.reduce((s,entry)=>s+entry[1],0),totalQuestions=entries.reduce((s,entry)=>s+entry[2],0);
 return `<div class="card exam-review-overview"><h2>Statistika i tačna rešenja</h2><p>Ukupno: <strong>${totalCorrect} od ${totalQuestions} tačnih odgovora</strong> · ${g.base}/65 bodova bez mejla.</p><div class="exam-review-overview-grid">${entries.map(item=>`<div><span>${h(item[0])}</span><strong>${item[1]}/${item[2]}</strong></div>`).join('')}</div><p class="exam-review-note">Ispod su odgovor učenika i tačan odgovor za svaku vežbu. Pogrešni odgovori označeni su znakom ✕.</p></div>${entries.map(item=>examReviewGroup(...item)).join('')}`;
}
function showFullResults(){storage.showSolutions=false;save();go(15);}
function result(){const g=grades();const basePass=g.base>=38&&g.read>=6&&g.hear>=6;const writePass=g.write>=4;const success=basePass&&writePass;const done=storage.emailGrade!=='';return `<div class="center" style="margin:2px 0 11px"><div class="eyebrow">DE-MAX TUTIN · TEST 1</div><h1 class="h2">Vaš rezultat ispita</h1><div class="score-big">${g.base}<small> / 65</small></div><div style="margin-top:5px" class="status ${success?'ok':'bad'}">${success?'✓ Ispunjeni svi zadati uslovi':basePass?'◉ Osnovni prag ispunjen; nedostaje Schreiben minimum':'✕ Osnovni prag ili minimum po oblastima nije dostignut'}</div><p class="small">Prolaz je 38 bodova bez mejla, uz minimum 6 u čitanju i slušanju.</p></div><div class="card"><div class="result-row"><div><div class="l">📖 Razumevanje / Lesen</div><div class="result-sub">Aufgaben 1–3: ${g.r.join(' + ')}</div></div><div class="r">${g.read} / 30</div></div><div class="final-progress"><div style="width:${g.read/30*100}%"></div></div><div class="result-row"><div><div class="l">🎧 Slušanje / Hören</div><div class="result-sub">Aufgaben 1–3: ${g.l.join(' + ')}</div></div><div class="r">${g.hear} / 30</div></div><div class="final-progress"><div style="width:${g.hear/30*100}%"></div></div><div class="result-row"><div><div class="l">📝 Formular</div><div class="result-sub">${g.f.count} od 10 tačnih podataka</div></div><div class="r">${g.f.pts} / 5</div></div><div class="final-progress"><div style="width:${g.f.pts/5*100}%"></div></div><div class="result-row"><div><div class="l">✉ Mejl (posebno)</div><div class="result-sub">${done?'Ručni unos nakon provere':'Još nije ocenjen'}</div></div><div class="r">${done?g.mailPts:'—'} / 10</div></div><div class="result-row" style="border:0"><div class="l">UKUPNO SA MEJLOM</div><div class="r" style="font-size:19px;color:#0c7d58">${g.base+(g.mailPts||0)} / 75</div></div></div>${examCompleteReview(g)}<div class="card card-gold"><div class="mini-title">Granice koje ste zadali</div><div class="note">Lesen <b>${g.read}/30</b> — najmanje 6; Hören <b>${g.hear}/30</b> — najmanje 6; Schreiben (formular + mejl) <b>${g.write}/15</b> — najmanje 4. Mejl nije uključen u prag od 38 bodova, već se prikazuje dodatno.</div><p class="small">${g.write>=4?'Schreiben: ispunjen zadati minimum prema unetim bodovima.':'Schreiben: zadati minimum još nije dostignut.'} ${!done?'Bodove za mejl unesite nakon provere.':''}</p></div><div style="display:flex;gap:8px"><button class="btn btn-plain" style="flex:1" onclick="go(14)">✉ Mejl</button><button class="btn btn-outline" style="flex:1" onclick="confirmReset()">↺ Novi pokušaj</button></div><p class="small center">Bodovanje Lesen i Hören prati zvanični ÖSD ključ; mejl se ne ocenjuje bez provere napisanog rada.</p>`;}
function cover(){return `<div class="intro cover-compact"><div class="hero"><div class="hero-medallion">A1</div><div class="med">DE-MAX TUTIN · PRIPREMA</div><h1>TEST 1</h1><div style="font-weight:750;font-size:18px">ÖSD Zertifikat A1</div><p style="color:#c8d9f1;font-size:11px;line-height:1.45;margin-top:9px">Kompletna simulacija ispita sa originalnim zadacima, slikama i snimcima.</p><span class="tag">SLUŠAJ · REŠAVAJ · PROVERI REZULTAT</span></div><div class="feature-tiles"><div class="tile"><strong>30</strong><small>Lesen</small></div><div class="tile"><strong>30</strong><small>Hören</small></div><div class="tile"><strong>15</strong><small>Schreiben*</small></div></div><div class="card card-tight" style="margin-bottom:8px"><label class="mini-title" for="candidate">Ime i prezime kandidata</label><input id="candidate" type="text" value="${h(storage.name)}" oninput="storage.name=this.value;save()" placeholder="Unesite ime i prezime" style="width:100%;border:1px solid #cbd8ec;border-radius:10px;padding:11px;background:#f9fbff"></div><p class="small center" style="margin:2px 0">*Formular 5 + mejl 10. Prolaz 38/65 bez mejla.</p></div>`;}
function intro(which){const reading=which==='read',hearing=which==='hear';let title=reading?'Razumevanje':hearing?'Slušanje':'Formular i mejl';let sub=reading?'LESEN':hearing?'HÖREN':'SCHREIBEN';let pts=reading?30:hearing?30:15;let tasks=reading?['Situationen + Anzeigen (10 bodova)','Anzeigen · JA / NEIN (10 bodova)','Texte + Bilder (10 bodova)']:hearing?['Fotos + 5 Texte (10 bodova)','Nachricht · Notizen (10 bodova)','Wo gefällt es Ihnen? (10 bodova)']:['Formular · Ricardo Torres (5 bodova)','Vežbanje mejlova (10 dodatnih bodova)','Završni rezultat (prag 38 bez mejla)'];return `<div class="intro section-intro intro-compact"><div class="topicicon">${reading?'📖':hearing?'🎧':'✉'}</div><div class="center"><div class="eyebrow">${sub} · ÖSD A1</div><h2>${title}</h2><p class="lead">${reading?'Pročitajte zadatke i odaberite tačne odgovore.':hearing?'Originalni snimci se mogu automatski pustiti ili ručno pokrenuti.':'Popunite formular, pročitajte postavku mejla i napišite odgovor na sledećoj strani.'}</p><div class="points">${pts}<small> bodova</small></div><div class="medals"><span class="medal green">Minimum ${reading||hearing?6:4}</span>${hearing?'<span class="medal">3 originalna MP3</span>':reading?'<span class="medal">25 min na ispitu</span>':'<span class="medal">Mejl +10 posebno</span>'}</div></div><div class="card rules">${tasks.map((t,i)=>`<div class="rule"><span class="n">${i+1}</span><span>${t}</span></div>`).join('')}${hearing?`<div class="rule" style="border:0"><span>Automatsko pokretanje slušanja</span><button class="switch ${storage.autoPlay?'yes':''}" aria-label="Automatski pokreći snimke" onclick="storage.autoPlay=!storage.autoPlay;save();render()"></button></div>`:''}</div></div>`;}
function render(){if(![8,9,10].includes(page))stopAudio();let html='';switch(page){case 0:html=cover();break;case 1:html=intro('read');break;case 2:html=r1();break;case 3:html=r2(0);break;case 4:html=r2(1);break;case 5:html=r2(2);break;case 6:html=r3();break;case 7:html=intro('hear');break;case 8:html=h1();break;case 9:html=h2();break;case 10:html=h3();break;case 11:html=intro('write');break;case 12:html=form();break;case 13:html=mailPrompt();break;case 14:html=mail();break;case 15:html=result();break;}
const audioDock=document.getElementById('fixedAudioDock');audioDock.hidden=![8,9,10].includes(page);audioDock.innerHTML=[8,9,10].includes(page)?audioPanel(page-7):'';main.classList.toggle('r2-no-scroll',page>=3&&page<=5);main.classList.toggle('listen-no-scroll',page===9||page===10);main.classList.toggle('exam-form-no-scroll',page===12);main.classList.toggle('rafaela-page',page===14);main.classList.toggle('rafaela-prompt-page',page===13);main.classList.toggle('exam-form-solutions-open',false);main.innerHTML=html;document.getElementById('pageLabel').textContent=String(page+1).padStart(2,'0')+' / '+pages.length;document.getElementById('sectionLabel').textContent=pages[page].toUpperCase();document.getElementById('progress').style.width=((page+1)/pages.length*100)+'%';document.getElementById('back').disabled=page===0;document.getElementById('back').style.opacity=page===0?.4:1;document.getElementById('next').textContent=page===15?'Početna ↺':page===0?'Počni →':page===14?'Prikaži rezultat ✓':page===13?'Piši mejl →':page===12?'Postavka mejla →':'Sledeća →';if([8,9,10].includes(page))prepareAudio(page-7);}
function go(p){if(p<0||p>=pages.length)return;page=p;main.scrollTop=0;render();}
function toggleSolutions(){storage.showSolutions=!storage.showSolutions;save();const pos=main.scrollTop;render();main.scrollTop=pos;}
function stopAudio(){if(!audio.paused)audio.pause();playingPage=null;}
const PARTS={1:8,2:10,3:10},audioPromises={};
function loadAudio(n){if(audioPromises[n])return audioPromises[n];let paths=Array.from({length:PARTS[n]},(_,i)=>A+SOURCES[n-1].file+'.part'+String(i+1).padStart(2,'0'));audioPromises[n]=Promise.all(paths.map(u=>fetch(u).then(r=>{if(!r.ok)throw Error('Nije učitan '+u);return r.arrayBuffer()}))).then(arr=>URL.createObjectURL(new Blob(arr,{type:'audio/mpeg'}))).catch(e=>{delete audioPromises[n];throw e});return audioPromises[n];}
function prepareAudio(n){const old=playingPage;playingPage=n;if(old!==n){audio.pause();audio.removeAttribute('src');audio.load();}const stat=document.getElementById('playState');if(stat)stat.textContent='Učitavanje…';loadAudio(n).then(src=>{if(playingPage!==n)return;if(audio.getAttribute('src')!==src){audio.src=src;audio.load();}updateAudioUI();if(storage.autoPlay&&page===n+7)audio.play().then(updateAudioUI).catch(()=>{const hint=document.getElementById('audioHint');if(hint)hint.textContent='Pritisnite ▶ Pusti kada bude spremno.';});}).catch(()=>{if(playingPage===n){const st=document.getElementById('playState');if(st)st.textContent='Greška';toast('Snimak se nije učitao. Proverite internet i pokušajte ponovo.');}});}

function playPause(){if(audio.paused){if(!audio.getAttribute('src')&&playingPage){const n=playingPage;loadAudio(n).then(src=>{if(playingPage!==n)return;audio.src=src;audio.load();audio.play().then(updateAudioUI).catch(()=>toast('Pritisnite Pusti još jednom.'));}).catch(()=>toast('Greška pri učitavanju.'));return;}audio.play().then(updateAudioUI).catch(()=>toast('Dozvolite reprodukciju zvuka.'));}else{audio.pause();updateAudioUI();}}
function replayAudio(){if(!audio.getAttribute('src'))return playPause();audio.currentTime=0;audio.play().then(updateAudioUI).catch(()=>toast('Pritisnite Pusti.'));}
function seekAudio(x){if(Number.isFinite(audio.duration))audio.currentTime=Number(x)/1000*audio.duration;}
function mm(t){if(!Number.isFinite(t))t=0;let v=Math.floor(t);return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0');}
function updateAudioUI(){const p=document.getElementById('playButton'),status=document.getElementById('playState'),clock=document.getElementById('audioClock'),seek=document.getElementById('audioSeek');if(!p)return;p.textContent=audio.paused?'▶ Pusti':'❚❚ Pauza';status.textContent=audio.paused?'Pauza':'Reprodukcija';if(clock)clock.textContent=mm(audio.currentTime)+' / '+mm(audio.duration);if(seek)seek.value=Number.isFinite(audio.duration)&&audio.duration?Math.round(1000*audio.currentTime/audio.duration):0;}
function confirmReset(){if(!window.confirm('Obrisati sve upisane odgovore i ponovo započeti Test 1?'))return;storage={answers:{},name:'',email:'',emailGrade:'',rafaela:{one:'',two:'',three:'',name:''},rafaelaReview:null,autoPlay:true,showSolutions:false};save();go(0);toast('Novi test je spreman.');}
document.getElementById('back').onclick=()=>go(page-1);document.getElementById('next').onclick=()=>{if(page===0){storage.answers={};storage.email='';storage.emailGrade='';storage.rafaela={one:'',two:'',three:'',name:''};storage.rafaelaReview=null;storage.showSolutions=false;storage.r2Step=0;save();}go(page===15?0:page+1);};document.getElementById('closeModal').onclick=()=>document.getElementById('modal').classList.remove('show');document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('show')});document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('modal').classList.remove('show');if(!document.getElementById('answerModal').hidden)closeAnswerMenu();}});audio.addEventListener('play',updateAudioUI);audio.addEventListener('pause',updateAudioUI);audio.addEventListener('timeupdate',updateAudioUI);audio.addEventListener('loadedmetadata',updateAudioUI);audio.addEventListener('ended',()=>{updateAudioUI();toast('Snimak je završen. Možete ponovo pustiti ili preći dalje.');});
/* Keyboard-aware editing for the two written mobile exercises. */
const keyboardToolbar=document.getElementById('keyboardToolbar');
const keyboardDone=document.getElementById('keyboardDone');
const shell=document.getElementById('shell');
const isExamTextInput=el=>el&&el.matches&&el.matches('#main input[type="text"],#main input[type="number"],#main input[type="tel"],#main textarea.rafaela-entry')&&(page===9||page===12||page===14);
function updateMobileViewport(){
 if(window.visualViewport&&window.innerWidth<600){
  document.documentElement.style.setProperty('--app-viewport-height',Math.max(200,Math.round(window.visualViewport.height))+'px');
 }else document.documentElement.style.removeProperty('--app-viewport-height');
 if(shell.classList.contains('keyboard-open'))requestAnimationFrame(revealFocusedInput);
}
function revealFocusedInput(){
 const target=document.activeElement;
 if(!isExamTextInput(target))return;
 const box=main.getBoundingClientRect(),rect=target.getBoundingClientRect();
 const high=box.top+17,low=box.bottom-26;
 if(rect.bottom>low)main.scrollTop+=rect.bottom-low;
 else if(rect.top<high)main.scrollTop+=rect.top-high;
}
function activateKeyboardLayout(){
 if(window.innerWidth>=600)return;
 shell.classList.add('keyboard-open');
 keyboardToolbar.hidden=false;
 updateMobileViewport();
 requestAnimationFrame(revealFocusedInput);
 setTimeout(revealFocusedInput,130);
 setTimeout(revealFocusedInput,380);
}
function closeKeyboardLayout(){
 shell.classList.remove('keyboard-open');keyboardToolbar.hidden=true;
 updateMobileViewport();
}
document.addEventListener('focusin',e=>{if(isExamTextInput(e.target))activateKeyboardLayout()});
document.addEventListener('focusout',()=>setTimeout(()=>{if(!isExamTextInput(document.activeElement))closeKeyboardLayout()},110));
keyboardDone.addEventListener('click',()=>{if(document.activeElement instanceof HTMLElement)document.activeElement.blur();closeKeyboardLayout()});
main.addEventListener('keydown',e=>{
 if(e.key!=='Enter'||e.isComposing||!isExamTextInput(e.target)||e.target.matches('textarea'))return;
 e.preventDefault();
 const fields=Array.from(main.querySelectorAll('input[type="text"],input[type="number"],input[type="tel"]'));
 const nextField=fields[fields.indexOf(e.target)+1];
 if(nextField)nextField.focus();else e.target.blur();
});
if(window.visualViewport){
 window.visualViewport.addEventListener('resize',updateMobileViewport,{passive:true});
 window.visualViewport.addEventListener('scroll',updateMobileViewport,{passive:true});
}
window.addEventListener('resize',updateMobileViewport,{passive:true});
updateMobileViewport();render();
</script>
