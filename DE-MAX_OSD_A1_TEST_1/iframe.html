<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff">
<title>DE-MAX ÖSD A1 Test 1 — iframe</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#fff}
#frame{display:block;width:100%;height:100dvh;border:0;margin:0;background:white}
@supports (height:100svh){#frame{height:100svh}}
</style>
</head>
<body>
<iframe id="frame" src="./?embed=1" title="DE-MAX ÖSD A1 Test 1" loading="eager" allow="autoplay; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<script>
(function(){
  const iframe=document.getElementById('frame');
  function fit(){
    const vp=window.visualViewport;
    // Minimize blank space around the test on mobile when the keyboard is open.
    iframe.style.height=Math.max(200,Math.round(vp?vp.height:innerHeight))+'px';
  }
  fit();
  window.addEventListener('resize',fit,{passive:true});
  window.visualViewport?.addEventListener('resize',fit,{passive:true});
})();
</script>
</body>
</html>
