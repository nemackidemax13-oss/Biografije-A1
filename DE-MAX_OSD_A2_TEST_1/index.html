function wordCount(s){return (String(s||'').match(/[\p{L}\p{N}]+(?:[-’'][\p{L}\p{N}]+)*/gu)||[]).length}
function digits(s){return String(s||'').replace(/\D/g,'')}
function normalize(s){return String(s||'').trim().toLocaleLowerCase('de').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}


const EMAIL_AI_API='https://a2mejlovi.nemackidemax13.workers.dev/api/check-a2-email';
const EMAIL_AI_VERSIONS=['a2-de-max-50-words-rubric-v2','a2-de-max-26-min-50-target-v3','a2-de-max-original-first-v4'];
const EMAIL_INDEX_MICHAEL=1;
let aiPending=false;
function emailScore(){
 const answer=String(st.mail||'').trim(),count=wordCount(answer);
 if(count<26)return {count,points:0,valid:false,graded:true,status:'too_short',source:'word_limit'};
 const saved=st.aiEmail;
 if(saved&&saved.answer===answer&&saved.response&&Number.isInteger(Number(saved.response.score))&&Number(saved.response.score)>=0&&Number(saved.response.score)<=15){
  return {count,points:Number(saved.response.score),valid:true,graded:true,status:'ai',source:'cloudflare',feedback:saved.response};
 }
 return {count,points:0,valid:count<=50,graded:false,status:count>50?'too_long':'not_checked',source:'pending'};
}
function setAiStatus(message,isError){
 const field=document.getElementById('aiStatus');
 if(field){field.textContent=message;field.classList.toggle('bad',Boolean(isError));}
}
function validateAiResponse(data){
 if(!data||typeof data!=='object')throw Error('Cloudflare nije vratio JSON rezultat.');
 if(!Number.isInteger(Number(data.score))||Number(data.score)<0||Number(data.score)>15)throw Error('Cloudflare rezultat nema ispravnu ocenu 0–15.');
 if(!data.rubric||typeof data.rubric!=='object')throw Error('Cloudflare nije vratio raspodelu bodova.');
 if(!Array.isArray(data.questionPoints)||data.questionPoints.length!==4)throw Error('Cloudflare nije vratio bodove za četiri pitanja.');
 if(!EMAIL_AI_VERSIONS.includes(data.verificationVersion))throw Error('Cloudflare verzija ocenjivanja nije prepoznata.');
 return data;
}
async function checkEmailAI(thenShowResult){
 if(aiPending)return;
 const answer=String(st.mail||'').trim(),count=wordCount(answer);
 if(count<26){
  st.aiEmail=null;save();
  setAiStatus('Mejl ima '+count+' reči. Ispod 26 reči: Schreiben 0/15.');
  if(thenShowResult){st.page=LAST;st.resultTab='mail';render();}
  return;
 }
 if(count>50){
  setAiStatus('Cloudflare AI trenutno prihvata 26–50 reči. Napisano: '+count+'. Skratite mejl za '+(count-50)+' reči.',true);
  return;
 }
 if(st.aiEmail?.answer===answer&&st.aiEmail?.response&&thenShowResult){
  st.page=LAST;st.resultTab='score';render();return;
 }
 aiPending=true;
 const checkButton=document.getElementById('aiGradeBtn');
 const nextButton=document.getElementById('next');
 if(checkButton)checkButton.disabled=true;
 if(nextButton)nextButton.disabled=true;
 setAiStatus('AI proverava sva 4 pitanja, gramatiku i ispravke…');
 const controller=new AbortController();
 const cancel=setTimeout(()=>controller.abort(),58000);
 try{
  const response=await fetch(EMAIL_AI_API,{
   method:'POST',mode:'cors',credentials:'omit',cache:'no-store',
   headers:{'Content-Type':'application/json','Accept':'application/json'},
   signal:controller.signal,
   body:JSON.stringify({mailIndex:EMAIL_INDEX_MICHAEL,answer})
  });
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw Error(String(data.error||('Cloudflare HTTP '+response.status)));
  validateAiResponse(data);
  if(String(st.mail||'').trim()!==answer)throw Error('Tekst mejla je izmenjen tokom provere. Pokrenite novu proveru.');
  st.aiEmail={answer,response:data,checkedAt:Date.now()};save();
  setAiStatus('Cloudflare AI provera je završena: '+Number(data.score)+'/15 bodova.');
  if(thenShowResult){st.page=LAST;st.resultTab='score';render();}
 }catch(error){
  setAiStatus('AI provera nije uspela: '+(error.name==='AbortError'?'server nije odgovorio na vreme':error.message)+'. Tekst je sačuvan; možete pokušati ponovo.',true);
 }finally{
  clearTimeout(cancel);aiPending=false;
  if(checkButton&&checkButton.isConnected)checkButton.disabled=false;
  if(nextButton&&nextButton.isConnected)nextButton.disabled=false;
 }
}

function grade(){
 const rd1=['C','E','K','B','G'],rd2=['C','A','A','A','A'];
 const r1=st.r1.reduce((n,v,i)=>n+(v===rd1[i]?3:0),0);
 const r2=st.r2.reduce((n,v,i)=>n+(v===rd2[i]?2:0),0);
 const correct=[0,1,5,6],hit=st.w1.filter(i=>correct.includes(i)).length;
 let w1=st.w1.length>5?0:[0,1,4,7,10][hit];if(st.w1.length===5)w1=Math.max(0,w1-3);
 const noteok=[
 ['freitag','fr','fr.'].some(v=>normalize(st.w2[0])===normalize(v)),
 normalize(st.w2[1])==='salat',
 ['2','zwei','2euro','zwo'].includes(normalize(st.w2[2])),
 ['19','7','19uhr','7uhr','19:00','19.00','7:00','7.00','19h'].includes(String(st.w2[3]).trim().toLowerCase().replace(/\s/g,'')),
 digits(st.w2[4])==='7345682'
 ];
 const w2=noteok.filter(Boolean).length*2;
 const w3rows=st.w3.map((vals,i)=>{let errors=0;for(let j=0;j<5;j++)if(vals.includes(j)!==SPORTSKEY[i].includes(j))errors++;return Math.max(0,2-errors)});
 const w3=w3rows.reduce((sum,n)=>sum+n,0);
 const mail=emailScore(),lesen=r1+r2,horen=w1+w2+w3,total=lesen+horen+mail.points;
 const pass=mail.graded&&total>=35&&lesen>=5&&horen>=6&&mail.points>=3&&mail.valid;
 return {r1,r2,w1,w2,w3,w3rows,noteok,mail,lesen,horen,total,pass};
}
function solutionRow(name,actual,expected,points,max){
 return '<div class="solution-detail"><span>'+esc(name)+'</span><span><small>Tvoj: <b>'+esc(actual||'—')+'</b></small><small>Tačno: <b>'+esc(expected)+'</b></small><strong class="'+(points===max?'ok':'bad')+'">'+points+' / '+max+'</strong></span></div>';
}
function result(){
 const g=grade(),tab=st.resultTab||'score';
 const mailDisplay=g.mail.graded?g.mail.points:'—';
 const resultline=(name,pts,max)=>'<div class="result-row"><span class="l">'+esc(name)+'</span><strong class="r">'+pts+' / '+max+'</strong></div>';
 let area='';
 if(tab==='score'){
   area='<div class="card center"><div class="sub">'+(g.mail.graded?'Ukupan rezultat':'Trenutno poznati bodovi')+'</div><div class="score">'+(g.mail.graded?g.total:g.lesen+g.horen)+' <small>/ 70</small></div><h3 class="'+(!g.mail.graded?'':g.pass?'ok':'bad')+'">'+(!g.mail.graded?'AI PROVERA MEJLA NIJE ZAVRŠENA':g.pass?'POLOŽENO':'NIJE POLOŽENO')+'</h3><p class="small">Za prolaz najmanje 35/70 i minimum po oblastima.</p></div>'+
   '<div class="card">'+
   resultline('Lesen · Aufgabe 1',g.r1,15)+resultline('Lesen · Aufgabe 2',g.r2,10)+
   resultline('Hören · Aufgabe 1',g.w1,10)+resultline('Hören · Aufgabe 2',g.w2,10)+resultline('Hören · Aufgabe 3',g.w3,10)+
   resultline('Schreiben · E-Mail (Cloudflare AI)',mailDisplay,15)+'</div>'+
   '<div class="card greenish">'+
   resultline('LESEN · ukupno',g.lesen,25)+resultline('HÖREN · ukupno',g.horen,30)+resultline('E-MAIL · ukupno',mailDisplay,15)+
   '<p class="small">Pragovi: Lesen 5/25 · Hören 6/30 · E-Mail 3/15. E-Mail kraći od 25 reči ne dobija bodove.</p></div>'+
   '<p class="small">Ocena mejla dolazi iz Cloudflare AI servisa. Ovaj Worker koristi DE-MAX rubricu i opseg 26–50 reči, što nije potpuno isto kao zvanični ÖSD kriterijumi.</p>';
 }else if(tab==='lesen'){
   area='<div class="card"><h3>Lesen · Aufgabe 1 · '+g.r1+'/15</h3>'+
   ['C','E','K','B','G'].map((v,i)=>solutionRow('Text '+(i+1),st.r1[i],v,st.r1[i]===v?3:0,3)).join('')+'</div>'+
   '<div class="card"><h3>Lesen · Aufgabe 2 · '+g.r2+'/10</h3>'+
   ['C','A','A','A','A'].map((v,i)=>solutionRow('Frage '+(i+1),st.r2[i],v,st.r2[i]===v?2:0,2)).join('')+'</div>'+
   '<div class="card greenish"><b>Ukupno Lesen: '+g.lesen+'/25</b><p class="small">Minimum 5 bodova · '+(g.lesen>=5?'Prag ostvaren':'Prag nije ostvaren')+'</p></div>';
 }else if(tab==='horen'){
   const weather=['Sonne','Gewitter','18 Grad','Regen','Nebel','Wind','25 Grad','Wolken'];
   const nw=['Freitag','Salat','2 Euro','19 Uhr','734 56 82'];
   area='<div class="card"><h3>Hören · Aufgabe 1 · '+g.w1+'/10</h3>'+
   '<p class="small">Tvoj: '+esc(st.w1.map(i=>weather[i]).filter(Boolean).join(', ')||'—')+'</p><p class="small">Tačno: <b>Sonne, Gewitter, Wind, 25 Grad</b></p></div>'+
   '<div class="card"><h3>Hören · Aufgabe 2 · '+g.w2+'/10</h3>'+
   nw.map((v,i)=>solutionRow('Notiz '+(i+1),st.w2[i],v,g.noteok[i]?2:0,2)).join('')+'</div>'+
   '<div class="card"><h3>Hören · Aufgabe 3 · '+g.w3+'/10</h3>'+
   SPORTSKEY.map((v,i)=>solutionRow((i+1)+'. '+(i%2===0?'Sprecherin':'Sprecher'),st.w3[i].map(k=>SPORTS[k]).join(', '),v.map(k=>SPORTS[k]).join(', '),g.w3rows[i],2)).join('')+'</div>'+
   '<div class="card greenish"><b>Ukupno Hören: '+g.horen+'/30</b><p class="small">Minimum 6 bodova · '+(g.horen>=6?'Prag ostvaren':'Prag nije ostvaren')+'</p></div>';
 }else{
   const m=g.mail,verified=m.graded&&m.status==='ai',resp=verified?m.feedback:{},rubric=resp.rubric||{};
   area='<div class="card"><h3>E-Mail · '+(m.graded?m.points:'—')+'/15</h3>'+
   '<p class="small">Napisano: '+m.count+' reči · Prolaz: 3/15 · Cloudflare prihvata 26–50 reči.</p>'+
   (m.status==='too_short'?'<p class="bad">Manje od 26 reči: ceo Schreiben se ne ocenjuje (0 bodova).</p>':
   !verified?'<p class="bad">Mejl još nije AI ocenjen. Pokrenite proveru na prethodnom koraku.</p>':
   '<p class="ok"><b>AI provera završena.</b> Ocena: '+m.points+'/15.</p>')+'</div>';
   if(verified){
    const rubricRows=[
     ['Odgovori na 4 pitanja',rubric.questions,8],['Gramatika',rubric.grammar,4],
     ['Obraćanje',rubric.opening,1],['Završni pozdrav',rubric.closing,1],['Povezanost',rubric.coherence,1]
    ];
    area+='<div class="card"><h3>Cloudflare AI – bodovi</h3>'+
      rubricRows.map(row=>'<div class="result-row"><span>'+esc(row[0])+'</span><strong>'+esc(row[1]??'—')+'/'+row[2]+'</strong></div>').join('')+'</div>'+
      '<div class="card"><h3>Odgovori na četiri pitanja</h3>'+
      ['Hast du schon einmal eine Reise gemacht?','Wohin bist du gefahren?','Was gibt es bei dir Neues?','Wann hast du Zeit?']
       .map((question,i)=>'<div class="ai-question"><strong>'+esc((i+1)+'. '+question)+'</strong><span>'+esc(resp.questionPoints?.[i]??'—')+'/2</span><p class="small">'+esc(resp.questionFeedback?.[i]||'Nema dodatnog komentara.')+'</p></div>').join('')+'</div>';
    if(resp.feedback)area+='<div class="card"><h3>Mišljenje AI profesora</h3><p class="mail-result">'+esc(resp.feedback)+'</p></div>';
    if(Array.isArray(resp.grammarCorrections)&&resp.grammarCorrections.length)area+='<div class="card"><h3>Ispravke grešaka</h3>'+
      resp.grammarCorrections.map(x=>'<div class="ai-question"><p><b class="bad">Pre:</b> '+esc(x.original||'')+'</p><p><b class="ok">Ispravno:</b> '+esc(x.corrected||'')+'</p><p class="small">'+esc(x.explanation||'')+'</p></div>').join('')+'</div>';
    if(resp.correctedText)area+='<div class="card"><h3>Ispravljeni mejl</h3><p class="mail-result">'+esc(resp.correctedText)+'</p>'+
      (resp.translationSr?'<details><summary>Prevod ispravljenog mejla</summary><p class="mail-result">'+esc(resp.translationSr)+'</p></details>':'')+'</div>';
    if(resp.modelEmail)area+='<details class="card"><summary>Model – primer pravilnog mejla</summary><p class="mail-result">'+esc(resp.modelEmail)+'</p></details>';
   }else if(m.status==='not_checked'){
     area+='<div class="card"><button id="retryAiResult" type="button" class="btn primary" style="width:100%">✦ Proveri mejl AI</button><p id="aiStatus" class="small" role="status"></p></div>';
   }else if(m.status==='too_long'){
     area+='<div class="card"><p class="small">Radna verzija Cloudflare Workera trenutno ne prihvata više od 50 reči. Vratite se i skratite mejl ili koristite zasebnu procenu nastavnika.</p></div>';
   }
   area+='<div class="card"><h3>Tvoj mejl</h3><p class="mail-result">'+esc(st.mail||'Mejl nije napisan.')+'</p></div>';

 }
 return '<div class="stage-label">DE-MAX · ÖSD A2</div><h1 class="stage-title">Rezultati testa</h1>'+
 '<div class="result-tabs">'+[['score','Bodovi'],['lesen','Lesen'],['horen','Hören'],['mail','E-Mail']].map(([k,v])=>'<button type="button" data-result="'+k+'" class="'+(tab===k?'active':'')+'">'+v+'</button>').join('')+'</div>'+
 '<div class="result-details">'+area+'</div>'+
 '<div style="display:flex;gap:8px;margin-top:8px"><button class="btn soft" id="copyResult" style="flex:1">Kopiraj rezultat</button><button class="btn danger" id="reset" style="flex:1">Novi test ↺</button></div>';
}

const PAGES=[cover,lesenIntro,r1,r2,horenIntro,h1,h2,h3,schreibenIntro,mailPrompt,mailEditor,result];
const LAST=PAGES.length-1;
if(!st.flowV2){st.page=0;st.flowV2=true;st.speaker=0;save()}
if(!st.flowV3){
 const p=Number(st.page)||0;
 st.page=p<=1?p:p<=6?2:p<=15?3:p===16?4:p===17?5:p===18?6:p===19?7:p===20?8:p===21?9:10;
 st.flowV3=true;save();
}
if(!st.flowV12){if(Number(st.page)>=8)st.page=Math.min(11,Number(st.page)+1);st.flowV12=true;save();}
function fitPage(){
 const content=document.getElementById('pageContent');if(!content)return;
 content.style.transform='';
 if(st.page===2||st.page===3||st.page===7||st.page===LAST)return; // Scrolling tasks and results
 const h=main.clientHeight,n=content.scrollHeight;
 const ratio=h&&n?Math.min(1,(h-2)/n):1;
 content.style.transform='scale('+Math.max(.5,ratio)+')';
}

/* Hören 1 and 3 run once. Hören 2 runs twice. If the browser rejects autoplay,
   the user can trigger the first playback with a single button. */
function setupExamAudio(page){
 const idx=page-5, required=idx===1?2:1;
 if(!Array.isArray(st.audioUsed)||st.audioUsed.length!==3)st.audioUsed=[false,false,false];
 if(!Array.isArray(st.audioRounds)||st.audioRounds.length!==3)st.audioRounds=[0,0,0];
 const audio=document.getElementById('player');
 const status=document.getElementById('audiosignal');
 const bar=document.getElementById('audioBar');
 const fallback=document.getElementById('audioFallback');
 if(!audio||!status||!bar||!fallback)return;
 const valid=()=>st.page===page && audio.isConnected;
 const showFallback=(message,label)=>{
   if(!valid())return;
   status.textContent=message;
   fallback.textContent=label||'▶ Pokreni slušanje';
   fallback.hidden=false;
 };
 const progress=()=>{
   if(!valid())return;
   const pct=audio.duration>0&&Number.isFinite(audio.duration)?Math.min(100,(audio.currentTime/audio.duration)*100):0;
   bar.style.width=pct+'%';
 };
 function start(round){
   if(!valid())return;
   if(round===0&&st.audioUsed[idx]){
     status.textContent='Ovo slušanje je već pokrenuto i ne može se ponavljati.';
     fallback.hidden=true;return;
   }
   fallback.hidden=true;
   status.textContent='Učitavanje slušanja '+(round+1)+'/'+required+'…';
   let promise;
   try{promise=audio.play()}catch(e){
     showFallback('Za početak slušanja dodirnite ▶.','▶ Pokreni slušanje');
     return;
   }
   Promise.resolve(promise).then(()=>{
     if(!valid())return;
     if(!st.audioUsed[idx]){st.audioUsed[idx]=true;save();}
     status.textContent='Slušanje '+(round+1)+'/'+required+' je u toku';
   }).catch(()=>{
     if(!valid())return;
     showFallback('Telefon zahteva dodir za pokretanje zvuka.','▶ Pokreni slušanje');
   });
 }
 audio.addEventListener('timeupdate',progress);
 audio.addEventListener('ended',()=>{
   if(!valid())return;
   st.audioRounds[idx]=Math.min(required,(Number(st.audioRounds[idx])||0)+1);save();
   if(st.audioRounds[idx]<required){
      bar.style.width='0%';
      audio.currentTime=0;
      start(st.audioRounds[idx]);
   }else{
      status.textContent='Slušanje završeno ('+required+'/'+required+').';
      bar.style.width='100%';
      fallback.hidden=true;
   }
 });
 audio.addEventListener('error',()=>{
   if(!valid())return;
   if(!st.audioUsed[idx])showFallback('Snimak se nije učitao. Pokušajte ponovo.','▶ Pokušaj ponovo');
   else status.textContent='Snimak se prekinuo. Proverite internet.';
 });
 fallback.addEventListener('click',()=>{
   if(!valid()||st.audioRounds[idx]>=required)return;
   start(st.audioRounds[idx]);
 });
 if(st.audioRounds[idx]>=required){
   status.textContent='Slušanje završeno ('+required+'/'+required+').';
   bar.style.width='100%';
 }else if(st.audioUsed[idx]){
   status.textContent='Ovo slušanje je već pokrenuto i ne može se ponavljati.';
 }else{
   start(0);
 }
}

function render(){
 const a=document.getElementById('player');if(a){a.pause();if(objectAudio){URL.revokeObjectURL(objectAudio);objectAudio=null}}
 st.page=Math.max(0,Math.min(LAST,st.page));save();
 document.getElementById('app').classList.toggle('home-mode',st.page===0);
 prev.hidden=st.page===0;main.style.setProperty('--read-size',Math.max(11,Math.min(24,Number(st.fontSize)||14))+'px');
 main.classList.toggle('reading-scroll',st.page===2||st.page===3);
 main.classList.toggle('hearing-three',st.page===7);
 main.classList.toggle('results-scroll',st.page===LAST);
 main.innerHTML='<div id="pageContent">'+PAGES[st.page]()+'</div>';
 main.scrollTop=0;
 document.getElementById('bar').style.width=(st.page/LAST*100)+'%';
 document.getElementById('topstat').innerHTML=st.page+'/'+LAST+'<small>'+(st.page===LAST?'Rezultati':'ÖSD A2')+'</small>';
 const zoomFooter=document.getElementById('fontFooter');
 zoomFooter.hidden=!(st.page===2||st.page===3);
 const fontNow=Math.max(11,Math.min(24,Number(st.fontSize)||14));
 zoomFooter.querySelectorAll('[data-font-adjust]').forEach(b=>{b.disabled=b.dataset.fontAdjust==='-1'?fontNow<=11:fontNow>=24;});
 prev.disabled=st.page===0;
 next.textContent=st.page===0?'Počni test →':st.page===LAST-1?'Završi i oceni ✓':st.page===LAST?'Na početak ↺':'Nastavi →';
 requestAnimationFrame(fitPage);
 if(st.page===LAST){const copy=document.getElementById('copyResult');copy.onclick=()=>{const g=grade();const txt='DE-MAX ÖSD A2 Test 1 | Lesen '+g.lesen+'/25 | Hören '+g.horen+'/30 | E-Mail '+g.mail.points+'/15 | Ukupno '+g.total+'/70 | '+(g.pass?'POLOŽENO':'NIJE POLOŽENO')+' | E-Mail automatska procena';if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(()=>notify('Rezultat kopiran')).catch(()=>notify('Kopiranje nije dostupno'));else notify(txt)};
 document.getElementById('reset').onclick=()=>{if(confirm('Obrisati sve odgovore i početi ponovo?')){st=JSON.parse(JSON.stringify(DEFAULT));st.flowV2=true;st.flowV3=true;save();render()}}}
 if(st.page>=5&&st.page<=7)setupExamAudio(st.page);
}
window.addEventListener('resize',()=>requestAnimationFrame(fitPage),{passive:true});
window.visualViewport?.addEventListener('resize',()=>requestAnimationFrame(fitPage),{passive:true});
function notify(s){const el=document.createElement('div');el.className='toast';el.textContent=s;document.body.append(el);setTimeout(()=>el.remove(),2800)}

document.getElementById('app').addEventListener('click',e=>{
 const aiBtn=e.target.closest('#aiGradeBtn, #retryAiResult');
 if(aiBtn){checkEmailAI(aiBtn.id==='retryAiResult');return;}
 const skipBtn=e.target.closest('#skipAiBtn');
 if(skipBtn){st.page=LAST;st.resultTab='score';render();return;}
 const resultTab=e.target.closest('[data-result]');
 if(resultTab){st.resultTab=resultTab.dataset.result;save();render();return;}
 const b=e.target.closest('[data-font-adjust]');
 if(b){
  const n=Math.max(11,Math.min(24,(Number(st.fontSize)||14)+Number(b.dataset.fontAdjust)));
  st.fontSize=n;save(); main.style.setProperty('--read-size',n+'px');
  document.querySelectorAll('#fontFooter [data-font-adjust]').forEach(v=>v.disabled=v.dataset.fontAdjust==='-1'?n<=11:n>=24);
 }
});
main.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='emailAnswer'){st.mail=t.value;st.aiEmail=null;document.getElementById('wordCount').textContent=wordCount(st.mail)+' Wörter';setAiStatus('Tekst je izmenjen. Proverite ga ponovo preko Cloudflare AI.',false)}
 if(t.dataset.w2!==undefined)st.w2[Number(t.dataset.w2)]=t.value;
 save();
});
main.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.r1!==undefined)st.r1[Number(t.dataset.r1)]=t.value;
 if(t.dataset.r2!==undefined)st.r2[Number(t.dataset.r2)]=t.value;
 if(t.dataset.w1!==undefined){const i=Number(t.dataset.w1);st.w1=t.checked?[...new Set([...st.w1,i])]:st.w1.filter(x=>x!==i);const c=document.getElementById('weatherCount');if(c)c.textContent=st.w1.length+' / 4 izabrano';}
 if(t.dataset.sp!==undefined){const i=Number(t.dataset.sp),j=Number(t.dataset.sport);st.w3[i]=t.checked?[...new Set([...st.w3[i],j])]:st.w3[i].filter(x=>x!==j)}
 save();
});
prev.onclick=()=>{if(st.page>0){st.page--;render()}};
next.onclick=()=>{if(st.page===LAST-1){checkEmailAI(true);return;}if(st.page===0){st.started=Date.now();st.page=1}else if(st.page<LAST)st.page++;else st.page=0;render()};
render();
</script>
</body></html>
