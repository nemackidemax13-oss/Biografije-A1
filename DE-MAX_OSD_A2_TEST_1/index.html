const HEAD=[
'Jetzt das Fahrrad reparieren lassen','Im Rathaus: Informationen über Tiere','Tipp: Ausflug in den Tierpark','Frühlingspflanzen im Sonderangebot','Tipps fürs Radfahren in der Stadt','Radfahren ist gesund!','Mit neuen Pflanzen in den Frühling','Haustiere machen krank','Ausstellung: Blumen im Frühling','Wiener wurden zum Radfahren befragt'];
const TEXTS=[
'Seit Jahrzehnten ist der Oberberger Tierpark ein beliebtes Ausflugsziel. Die Vielfalt der Tiere und Pflanzen und die wunderbare Naturlandschaft sind die Gründe dafür. Das Angebot ist vielfältig: Führungen, Tierfütterungen, Naturlehrpfad, Waldspielplätze und vieles mehr. Info-Telefon 804 31 69.',
'Fahrrad fahren in Hamburg liegt voll im Trend. Das Fahrrad hat sich im Stadtgebiet heute einen wichtigen Platz erobert. Mehr als 1.000 Kilometer an Radwegen sollen Sie animieren, umzusteigen und das Fahrrad (neu) zu entdecken. Was Sie dabei beachten müssen, aber auch Tipps zu interessanten Routen – das finden Sie unter www.hamburg.de/verkehr/radfahren.',
'An Werktagen nützen 37 Prozent der Wiener ihr Rad in der Freizeit, aber auch für Wege in die Arbeit oder zur Schule/Uni ist das Rad ein beliebtes Verkehrsmittel. Das ging aus den Antworten auf eine Interview-Reihe zum Thema „Mit dem Fahrrad in Wien“ hervor. Das Ergebnis der Umfrage im Detail.',
'Die aktuelle Ausstellung im Rathaus bietet Wissenswertes über Tierschutz und Tierhaltung. Für Kinder gibt es die Möglichkeit, verschiedene Haustiere kennenzulernen und sich über das Zusammenleben mit ihnen zu informieren. Der Eintritt ist frei! Informationen: www.tierschutzinbern.ch.',
'„Unsere Stadt blüht auf!“ Das ist unser Motto für den Frühling und alle sind eingeladen, mitzumachen: Egal ob Sie neue Sträucher, Bäume oder Blumen am Fenster pflanzen – mehr Natur tut allen gut! Schicken Sie ein Foto von Ihren Frühlingspflanzen an das Gemeindeamt und gewinnen Sie einen Einkaufsgutschein im Wert von 50 Euro.'];
const STORY=[
'Dass sich zwei Menschen, die schon 65 Jahre verheiratet sind und einander stets treu waren, nach so langer Zeit immer noch lieben und achten wie am ersten Tag, ist doch etwas sehr Außergewöhnliches.',
'Franz und Hanna Böhm aus Linz sind ein solches Paar. „Liebe auf den ersten Blick war es nicht“, meint der 88-jährige Franz Böhm und lacht, „denn ich habe ihr anfangs gar nicht gefallen.“ Damals war seine Hanna 19 Jahre alt und „hatte es schon recht eilig“, endlich zu heiraten. Heute ist Hanna Böhm 84 und glücklich, dass ihr Franz sie doch noch erobert hat.',
'Er hat als Matrose auf einem Donauschiff gearbeitet, sie war die Tochter seines Chefs, des Steuermannes. Und als er erzählt, wie er einmal eine Frau aus dem Wasser geholt und so vor dem Ertrinken gerettet hat, da merkt man, wie stolz seine Ehefrau auf ihn ist.',
'Eigene Kinder haben die beiden leider nie bekommen, dafür haben sie ihren Neffen, den Sohn von Hannas Schwester, zu sich genommen und liebevoll erzogen.',
'Gemeinsame Spaziergänge am Pöstlingberg in der Nähe von Linz halten das rüstige Paar jung und fit – und natürlich auch ihre Liebe zueinander, die all die Jahre in guten wie in schlechten Zeiten bis heute andauert.'];
const QS=[
['Herr Böhm ist','65 Jahre alt.','84 Jahre alt.','88 Jahre alt.'],
['Franz Böhm','hat auf einem Schiff gearbeitet.','hat ein Schiff gekauft.','wollte auf einem Schiff arbeiten.'],
['Franz Böhm hat','einer Frau in Not geholfen.','seine Frau oft auf dem Schiff mitfahren lassen.','seinem Chef geholfen.'],
['Das Paar hat','einen Neffen bei sich aufgenommen.','einen Sohn bekommen.','viele Kinder bekommen.'],

function r2Item(i){const q=QS[i];return '<div class="stage-label">LESEN · Aufgabe 2 · 10 bodova</div><h1 class="stage-title">65 Jahre ohne ernsten Streit</h1><p class="small">Frage '+(i+1)+' / 5</p>'+
'<div class="card"><div class="qtop"><b>'+esc(q[0])+'</b><span class="pill">2 Punkte</span></div><div class="choices">'+['A','B','C'].map((c,j)=>'<label class="choice"><input type="radio" name="r2-'+i+'" data-r2="'+i+'" value="'+c+'" '+(st.r2[i]===c?'checked':'')+'><b>'+c+'</b> '+esc(q[j+1])+'</label>').join('')+'</div></div>'+
'<p class="small">Za povratak na originalni tekst koristite „Nazad”.</p>';}

function r1(){return intro('Lesen • Aufgabe 1','Die passende Überschrift','Lesen Sie die 10 Überschriften und die 5 Texte. Wählen Sie pro Text die richtige Überschrift. (15 Punkte)')+
'<details class="card" open><summary>10 Überschriften (A–K)</summary><div class="headings" style="margin-top:11px">'+H.map((h,i)=>'<div><b>'+h+'</b> '+esc(HEAD[i])+'</div>').join('')+'</div></details>'+
TEXTS.map((t,i)=>'<div class="card"><div class="qtop"><b>Text '+(i+1)+'</b><span class="pill">3 Punkte</span></div><p class="passage">'+esc(t)+'</p>'+getSelect(i)+'</div>').join('')}
function r2(){return intro('Lesen • Aufgabe 2','65 Jahre ohne ernsten Streit','Lesen Sie zuerst den Text und markieren Sie bei jeder Frage A, B oder C. (10 Punkte)')+
'<details class="card tinted" open><summary>Lesetext anzeigen / ausblenden</summary><div style="margin-top:10px">'+STORY.map(x=>'<p class="passage">'+esc(x)+'</p>').join('')+'</div></details>'+
'<div class="card goldish"><p class="small" style="margin:0">Beispiel: Herr und Frau Böhm sind seit 65 Jahren ein Ehepaar. (C)</p></div>'+
QS.map((q,i)=>'<div class="card"><div class="qtop"><b>'+(i+1)+'. '+esc(q[0])+'</b><span class="pill">2 Punkte</span></div><div class="choices">'+['A','B','C'].map((c,j)=>'<label class="choice"><input type="radio" name="r2-'+i+'" data-r2="'+i+'" value="'+c+'" '+(st.r2[i]===c?'checked':'')+'><b>'+c+'</b> '+esc(q[j+1])+'</label>').join('')+'</div></div>').join('')}

function player(i){return '<div class="audio" style="padding:9px;position:relative;top:auto;margin-bottom:8px"><div class="between"><b style="font-size:12px">🎧 Slušanje '+i+'</b><span style="font-size:10px;color:#d9eaff">10 bodova</span></div>'+
'<audio id="player" controls playsinline preload="metadata" src="./audio/track-'+i+'.mp3"></audio><div id="audiosignal" class="aux">Pritisnite ▶ za slušanje.</div>'+
'<details style="margin-top:4px"><summary>Ako snimak ne radi, izaberi MP3 sa telefona</summary><input id="localAudio" type="file" accept="audio/mpeg,audio/mp3,audio/*" aria-label="Dodaj audio '+i+'"></details></div>'}
function h1(){return '<div class="stage-label">HÖREN · Aufgabe 1 · 10 bodova</div><h1 class="stage-title">Das Wetter am Wochenende</h1>'+
'<p class="small" style="margin:0 0 7px">Slušate dva teksta istog sadržaja. Označite četiri odgovora.</p>'+player(1)+
'<div class="card"><div class="qtop"><b>Wählen Sie vier Antworten</b><span class="pill">10 Punkte</span></div><div class="twocol">'+WEATHER.map((w,i)=>'<label class="check"><input type="checkbox" data-w1="'+i+'" '+checked(st.w1,i)+'>'+esc(w)+'</label>').join('')+'</div><p class="small" id="weatherCount" style="margin:5px 0 0">'+st.w1.length+' / 4 izabrano</p></div>'}
function h2(){const lab=['Letzter Kurstag','Zum Essen mitnehmen','Für Getränke (Euro)','Anrufen ab (Uhr)','Telefonnummer'];return '<div class="stage-label">HÖREN · Aufgabe 2 · 10 bodova</div><h1 class="stage-title">Notizen – Abschlussfeier</h1>'+
'<p class="small" style="margin:0 0 7px">Slušate poruku dva puta. Dopunite pet beleški.</p>'+player(2)+
'<div class="card"><div class="qtop"><b>✎ Notizblatt</b><span class="pill">10 Punkte</span></div><div class="note-grid">'+lab.map((l,i)=>'<div><label class="fieldlabel" for="n'+i+'">'+esc(l)+'</label><input id="n'+i+'" data-w2="'+i+'" class="field" type="text" autocomplete="off" placeholder="'+(['Wochentag','Essen','Betrag','Stunde','Nummer'][i])+'" value="'+esc(st.w2[i])+'"></div>').join('')+'</div></div>'}
function speakerCard(i){return '<div class="card"><div class="qtop"><b>'+(i+1)+'. '+(i%2===0?'Sprecherin':'Sprecher')+'</b><span class="pill">2 Punkte</span></div>'+
'<p class="small">Koje sportove osoba navodi? Moguće je više odgovora.</p>'+
'<div class="rowchecks">'+SPORTS.map((n,j)=>'<label class="sport"><input type="checkbox" data-sp="'+i+'" data-sport="'+j+'" '+checked(st.w3[i],j)+'>'+esc(n)+'</label>').join('')+'</div></div>'}
function h3(){const i=Math.max(0,Math.min(4,Number(st.speaker)||0));return '<div class="stage-label">HÖREN · Aufgabe 3 · 10 bodova</div><h1 class="stage-title">Welchen Sport betreiben Sie?</h1>'+
'<p class="small" style="margin:0 0 7px">Slušate intervju sa 5 osoba. Za svaku označite tačne sportove.</p>'+player(3)+
'<div class="person-tabs">'+[0,1,2,3,4].map(j=>'<button type="button" data-person="'+j+'" class="'+(j===i?'active':'')+'">'+(j+1)+'</button>').join('')+'</div>'+
'<div id="speakerCard">'+speakerCard(i)+'</div><p class="small">Izaberite brojeve 1–5 za sve govornike. Audio nastavlja reprodukciju pri promeni osobe.</p>'}
function mailPrompt(){return '<div class="stage-label">SCHREIBEN · E-Mail</div><h1 class="stage-title">Eine E-Mail an Michael</h1><p class="small">Pročitajte poruku koju šalje Michael.</p>'+
'<div class="card tinted"><div class="between"><b style="font-size:12px">Von: Michael</b><small class="small">Betreff: Reise</small></div>'+
'<div class="letter" style="margin-top:6px"><p>Liebe/Lieber …,</p><p>wie geht es dir? Stell dir vor, ich fahre nächste Woche nach Österreich. Dort werde ich Wien, Salzburg und Innsbruck besuchen. Ich freue mich sehr darauf. Hast du schon einmal eine Reise gemacht? Wohin bist du gefahren? Was gibt es bei dir Neues?</p><p>Wir haben uns so lange nicht mehr gesehen. Nach meiner Reise müssen wir uns unbedingt treffen. Dann zeige ich dir auch meine Fotos.</p><p>Wann hast du Zeit?</p><p>Bis bald und liebe Grüße<br>Michael</p></div></div>'+
'<div class="card goldish"><b style="font-size:12px">Aufgabe</b><p class="small" style="margin:3px 0 0">Napišite odgovor od oko 50 reči, odgovorite na sva 4 pitanja i na kraju dodajte pozdrav.</p></div>'}
function mailEditor(){return '<div class="stage-label">SCHREIBEN · E-Mail</div><h1 class="stage-title">Tvoj odgovor Michaelu</h1>'+
'<p class="small" style="margin:0 0 8px">Odgovorite: kako ste, putovanje, novosti i kada imate vremena.</p>'+
'<div class="card"><label class="fieldlabel" for="emailAnswer">Deine E-Mail an Michael</label><textarea class="field editor" id="emailAnswer" style="height:min(42dvh,310px);min-height:160px" placeholder="Lieber Michael,&#10;&#10;vielen Dank für deine E-Mail. ...">'+esc(st.mail)+'</textarea><div class="between" style="margin-top:7px"><small class="small">Oko 50 reči.</small><b class="pill" id="wordCount">'+wordCount(st.mail)+' Wörter</b></div></div>'+
'<p class="small">Pritisni „Završi i oceni” kada završiš mejl.</p>'}

function wordCount(s){return String(s||'').trim().split(/\s+/).filter(Boolean).length}
function digits(s){return String(s||'').replace(/\D/g,'')}
function normalize(s){return String(s||'').trim().toLocaleLowerCase('de').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}
function grade(){
 const rd1=['C','E','K','B','G'],rd2=['C','A','A','A','A'];
 const r1=st.r1.reduce((n,v,i)=>n+(v===rd1[i]?3:0),0);
 const r2=st.r2.reduce((n,v,i)=>n+(v===rd2[i]?2:0),0);
 const truth=[0,1,5,6],valid=st.w1.filter(i=>truth.includes(i)).length;
 let w1=st.w1.length>5?0:[0,1,4,7,10][valid];if(st.w1.length===5)w1=Math.max(0,w1-3);
 const noteok=[
 ['freitag','fr','fr.'].some(x=>normalize(st.w2[0])===normalize(x)),
 normalize(st.w2[1])==='salat',
 ['2','zwei','2euro','zwo'].includes(normalize(st.w2[2])),
 ['19','7','19uhr','7uhr','19:00','19.00','7:00','7.00','19h'].includes(String(st.w2[3]).trim().toLowerCase().replace(/\s/g,'')),
 digits(st.w2[4])==='7345682'];
 const w2=noteok.filter(Boolean).length*2;
 const w3rows=st.w3.map((vals,i)=>{let errs=0;for(let s=0;s<5;s++)if(vals.includes(s)!==SPORTSKEY[i].includes(s))errs++;return Math.max(0,2-errs)});
 const w3=w3rows.reduce((n,v)=>n+v,0);
 return {r1,r2,w1,w2,w3,w3rows,noteok,total:r1+r2+w1+w2+w3};
}

function result(){
 const g=grade(), tab=st.resultTab||'score';
 let area='';
 if(tab==='score'){
 const rows=[['Lesen • Aufgabe 1',g.r1,15],['Lesen • Aufgabe 2',g.r2,10],['Hören • Aufgabe 1',g.w1,10],['Hören • Aufgabe 2',g.w2,10],['Hören • Aufgabe 3',g.w3,10]];
 area='<div class="card" style="text-align:center;padding:13px"><div class="sub">Ukupan rezultat</div><div class="score">'+g.total+' <small>/55</small></div><p class="small" style="margin:4px 0 0">Lesen '+(g.r1+g.r2)+'/25 · Hören '+(g.w1+g.w2+g.w3)+'/30</p></div>'+
 '<div class="card">'+rows.map(x=>'<div class="result-row" style="padding:6px 0"><div class="l">'+x[0]+'</div><div class="r">'+x[1]+' / '+x[2]+'</div></div>').join('')+'</div>'+
 '<p class="small">Minimum za Lesen 5 bodova, za Hören 6 bodova. Schreiben ocenjuje nastavnik; ovo nije zvanična ÖSD ocena.</p>';
 }else if(tab==='lesen'){
 area='<div class="card"><h3>Aufgabe 1 · 15 bodova</h3>'+
 ['C','E','K','B','G'].map((v,i)=>'<div class="result-row" style="padding:6px 0"><span>Text '+(i+1)+'</span><strong>'+v+' · ti: '+esc(st.r1[i]||'—')+'</strong></div>').join('')+'</div>'+
 '<div class="card"><h3>Aufgabe 2 · 10 bodova</h3>'+
 ['C','A','A','A','A'].map((v,i)=>'<div class="result-row" style="padding:6px 0"><span>Frage '+(i+1)+'</span><strong>'+v+' · ti: '+esc(st.r2[i]||'—')+'</strong></div>').join('')+'</div>';
 }else if(tab==='horen'){
 area='<div class="card"><h3>Aufgabe 1 · Wetter</h3><p class="small">Sonne · Gewitter · Wind · 25 Grad</p><h3>Aufgabe 2 · Abschlussfeier</h3><p class="small">Freitag · Salat · 2 Euro · 19 Uhr · 734 56 82</p></div>'+
 '<div class="card"><h3>Aufgabe 3 · Sport</h3>'+SPORTSKEY.map((arr,i)=>'<div class="result-row" style="padding:5px 0"><span>Person '+(i+1)+'</span><strong style="font-size:10px;max-width:75%;text-align:right">'+arr.map(j=>SPORTS[j]).join(', ')+'</strong></div>').join('')+'</div>';
 }else{
 area='<div class="card"><h3>Tvoj mejl</h3><div style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.5">'+(esc(st.mail)||'Mejl nije napisan.')+'</div><p class="small">'+wordCount(st.mail)+' Wörter · Za pregled kod nastavnika.</p></div>';
 }
 return '<div class="stage-label">DE-MAX · ÖSD A2</div><h1 class="stage-title">Rezultati testa</h1>'+
 '<div class="result-tabs">'+[['score','Bodovi'],['lesen','Lesen'],['horen','Hören'],['mail','Mejl']].map(x=>'<button type="button" data-result="'+x[0]+'" class="'+(tab===x[0]?'active':'')+'">'+x[1]+'</button>').join('')+'</div>'+
 '<div class="result-details">'+area+'</div>'+
 '<div style="display:flex;gap:8px;margin-top:8px"><button class="btn soft" id="copyResult" style="flex:1">Kopiraj rezultat</button><button class="btn danger" id="reset" style="flex:1">Novi test ↺</button></div>';
}

const PAGES=[cover,lesenIntro,r1,r2,horenIntro,h1,h2,h3,mailPrompt,mailEditor,result];
const LAST=PAGES.length-1;
if(!st.flowV2){st.page=0;st.flowV2=true;st.speaker=0;save()}
if(!st.flowV3){
 const p=Number(st.page)||0;
 st.page=p<=1?p:p<=6?2:p<=15?3:p===16?4:p===17?5:p===18?6:p===19?7:p===20?8:p===21?9:10;
 st.flowV3=true;save();
}
function fitPage(){
 const content=document.getElementById('pageContent');if(!content)return;
 content.style.transform='';
 if(st.page===2||st.page===3)return; // Lesen: original height and native vertical scroll
 const h=main.clientHeight,n=content.scrollHeight;
 const ratio=h&&n?Math.min(1,(h-2)/n):1;
 content.style.transform='scale('+Math.max(.5,ratio)+')';
}
function render(){
 const a=document.getElementById('player');if(a){a.pause();if(objectAudio){URL.revokeObjectURL(objectAudio);objectAudio=null}}
 st.page=Math.max(0,Math.min(LAST,st.page));save();
 main.classList.toggle('reading-scroll',st.page===2||st.page===3);
 main.innerHTML='<div id="pageContent">'+PAGES[st.page]()+'</div>';
 main.scrollTop=0;
 document.getElementById('bar').style.width=(st.page/LAST*100)+'%';
 document.getElementById('topstat').innerHTML=st.page+'/'+LAST+'<small>'+(st.page===LAST?'Rezultati':'ÖSD A2')+'</small>';
 prev.disabled=st.page===0;
 next.textContent=st.page===0?'Počni test →':st.page===LAST-1?'Završi i oceni ✓':st.page===LAST?'Na početak ↺':'Nastavi →';
 requestAnimationFrame(fitPage);
 if(st.page===LAST){const copy=document.getElementById('copyResult');copy.onclick=()=>{const g=grade();const txt='DE-MAX ÖSD A2 Test 1 | '+(st.name||'Učenik')+' | Lesen '+(g.r1+g.r2)+'/25 | Hören '+(g.w1+g.w2+g.w3)+'/30 | Ukupno '+g.total+'/55 | Schreiben '+wordCount(st.mail)+' Wörter';if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(()=>notify('Rezultat kopiran')).catch(()=>notify('Kopiranje nije dostupno'));else notify(txt)};
 document.getElementById('reset').onclick=()=>{if(confirm('Obrisati sve odgovore i početi ponovo?')){st=JSON.parse(JSON.stringify(DEFAULT));st.flowV2=true;st.flowV3=true;save();render()}}}
 if(st.page>=5&&st.page<=7){
 const audio=document.getElementById('player'),signal=document.getElementById('audiosignal');
 audio.addEventListener('error',()=>{signal.textContent='Snimak nije dostupan na serveru. Izaberi MP3 sa uređaja ispod.'});
 audio.addEventListener('canplay',()=>{signal.textContent='Snimak je spreman. Pritisnite ▶.'});
 document.getElementById('localAudio').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(objectAudio)URL.revokeObjectURL(objectAudio);objectAudio=URL.createObjectURL(file);audio.src=objectAudio;audio.load();signal.textContent='Učitan: '+file.name;});
 }
}
window.addEventListener('resize',()=>requestAnimationFrame(fitPage),{passive:true});
window.visualViewport?.addEventListener('resize',()=>requestAnimationFrame(fitPage),{passive:true});
function notify(s){const el=document.createElement('div');el.className='toast';el.textContent=s;document.body.append(el);setTimeout(()=>el.remove(),2800)}

main.addEventListener('click',e=>{
 const resultTab=e.target.closest('[data-result]');
 if(resultTab){st.resultTab=resultTab.dataset.result;save();render();return;}
 const b=e.target.closest('[data-person]');
 if(b){
 st.speaker=Number(b.dataset.person);save();
 const c=document.getElementById('speakerCard');if(c)c.innerHTML=speakerCard(st.speaker);
 main.querySelectorAll('[data-person]').forEach(x=>x.classList.toggle('active',Number(x.dataset.person)===st.speaker));
 requestAnimationFrame(fitPage);
 }
});
main.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='student')st.name=t.value;
 if(t.id==='emailAnswer'){st.mail=t.value;document.getElementById('wordCount').textContent=wordCount(st.mail)+' Wörter'}
 if(t.dataset.w2!==undefined)st.w2[Number(t.dataset.w2)]=t.value;
 save();
});
main.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.r1!==undefined)st.r1[Number(t.dataset.r1)]=t.value;
 if(t.dataset.r2!==undefined)st.r2[Number(t.dataset.r2)]=t.value;
 if(t.dataset.w1!==undefined){const i=Number(t.dataset.w1);st.w1=t.checked?[...new Set([...st.w1,i])]:st.w1.filter(x=>x!==i);const c=document.getElementById('weatherCount');if(c)c.textContent=st.w1.length+' / 4 izabrano';}
 if(t.dataset.sp!==undefined){const i=Number(t.dataset.sp),j=Number(t.dataset.sport);st.w3[i]=t.checked?[...new Set([...st.w3[i],j])]:st.w3[i].filter(x=>x!==j)}
 save();
});
prev.onclick=()=>{if(st.page>0){st.page--;render()}};
next.onclick=()=>{if(st.page===0){st.started=Date.now();st.page=1}else if(st.page<LAST)st.page++;else st.page=0;render()};
render();
</script>
</body></html>
