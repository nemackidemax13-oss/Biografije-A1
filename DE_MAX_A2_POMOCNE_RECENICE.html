'use strict';
const DB={"categories":[{"name":"Predlozi","deName":"Vorschläge","description":"Predloži zajedničku aktivnost","phrases":[{"de":"Ich habe eine Idee.","sr":"Imam ideju."},{"de":"Ich habe einen Vorschlag.","sr":"Imam predlog."},{"de":"Mein Vorschlag wäre, dass wir am Samstag fahren.","sr":"Moj predlog bi bio da idemo u subotu."},{"de":"Ich schlage vor, dass wir zusammen einen Ausflug machen.","sr":"Predlažem da zajedno idemo na izlet."},{"de":"Sollen wir am Wochenende etwas unternehmen?","sr":"Hoćemo li nešto da radimo za vikend?"},{"de":"Könnten wir am Samstag ins Kino gehen?","sr":"Da li bismo mogli da idemo u bioskop u subotu?"},{"de":"Wie findest du meine Idee?","sr":"Šta misliš o mojoj ideji?"},{"de":"Wie findest du meinen Vorschlag?","sr":"Šta misliš o mom predlogu?"},{"de":"Vielleicht wäre es besser, wenn wir am Sonntag fahren.","sr":"Možda bi bilo bolje da putujemo u nedelju."},{"de":"Ich denke, wir sollten mit dem Bus fahren.","sr":"Mislim da bi trebalo da idemo autobusom."},{"de":"Ich finde, wir könnten zusammen kochen.","sr":"Mislim da bismo mogli zajedno da kuvamo."},{"de":"Was hältst du davon, wenn wir einen Kurs besuchen?","sr":"Šta misliš o tome da zajedno pohađamo kurs?"},{"de":"Wir könnten auch etwas anderes machen.","sr":"Mogli bismo da radimo i nešto drugo."},{"de":"Lass uns zusammen einen Plan machen.","sr":"Hajde da zajedno napravimo plan."},{"de":"Vielleicht können wir einen Freund mitnehmen.","sr":"Možda možemo da povedemo jednog prijatelja."},{"de":"Ich würde gern in den Park gehen.","sr":"Rado bih išao/išla u park."},{"de":"Ich habe noch eine andere Idee.","sr":"Imam još jednu ideju."},{"de":"Was möchtest du lieber machen?","sr":"Šta bi ti radije radio/radila?"}]},{"name":"Vreme i susret","deName":"Zeitpunkt","description":"Dogovorite dan, sat i mesto susreta","phrases":[{"de":"Wann hast du Zeit?","sr":"Kada imaš vremena?"},{"de":"Hast du am Samstag Zeit?","sr":"Imaš li vremena u subotu?"},{"de":"Wie sieht es bei dir am Samstag aus?","sr":"Kakvi su ti planovi za subotu?"},{"de":"Kannst du am Samstag?","sr":"Možeš li u subotu?"},{"de":"Wann sollen wir uns treffen?","sr":"Kada bi trebalo da se nađemo?"},{"de":"Können wir uns am Samstag treffen?","sr":"Možemo li da se nađemo u subotu?"},{"de":"Um wie viel Uhr gehen wir los?","sr":"U koliko sati krećemo?"},{"de":"Kannst du am Samstag um 14 Uhr?","sr":"Možeš li u subotu u 14 časova?"},{"de":"Wäre es für dich in Ordnung, wenn wir uns am Sonntag treffen?","sr":"Da li bi ti odgovaralo da se nađemo u nedelju?"},{"de":"Am Sonntag habe ich den ganzen Tag Zeit.","sr":"U nedelju imam vremena ceo dan."},{"de":"Am Vormittag kann ich leider nicht.","sr":"Pre podne, nažalost, ne mogu."},{"de":"Treffen wir uns lieber am Nachmittag.","sr":"Bolje da se nađemo posle podne."},{"de":"Wie wäre es mit Freitag um 17 Uhr?","sr":"Šta kažeš na petak u 17 časova?"},{"de":"Wir treffen uns am Eingang.","sr":"Naći ćemo se na ulazu."},{"de":"Ich bin um 16 Uhr da.","sr":"Biću tamo u 16 časova."},{"de":"Passt dir dieser Termin?","sr":"Da li ti odgovara ovaj termin?"}]},{"name":"Mesto i prevoz","deName":"Ort & Fahrt","description":"Izaberite lokaciju i prevoz","phrases":[{"de":"Wo wollen wir uns treffen?","sr":"Gde želimo da se nađemo?"},{"de":"Wo sollen wir feiern?","sr":"Gde bi trebalo da proslavimo?"},{"de":"Wir könnten uns vor der Schule treffen.","sr":"Mogli bismo da se nađemo ispred škole."},{"de":"Ich schlage den Stadtpark vor.","sr":"Predlažem gradski park."},{"de":"Zu Hause haben wir genug Platz.","sr":"Kod kuće imamo dovoljno mesta."},{"de":"Im Café ist es gemütlicher.","sr":"U kafiću je prijatnije."},{"de":"Wie kommen wir dorthin?","sr":"Kako ćemo stići tamo?"},{"de":"Fahren wir mit dem Bus oder mit dem Auto?","sr":"Da li ćemo ići autobusom ili automobilom?"},{"de":"Ich denke, wir sollten mit dem Zug fahren.","sr":"Mislim da bi trebalo da idemo vozom."},{"de":"Mit dem Fahrrad ist es günstiger.","sr":"Biciklom je jeftinije."},{"de":"Der Bus fährt um neun Uhr ab.","sr":"Autobus polazi u devet sati."},{"de":"Ich kann dich mit dem Auto abholen.","sr":"Mogu da dođem po tebe automobilom."},{"de":"Der Treffpunkt ist vor dem Bahnhof.","sr":"Mesto okupljanja je ispred železničke stanice."},{"de":"Wir brauchen ungefähr zwanzig Minuten.","sr":"Treba nam otprilike dvadeset minuta."}]},{"name":"Organizacija","deName":"Organisation","description":"Dogovorite ko šta radi i donosi","phrases":[{"de":"Was müssen wir organisieren?","sr":"Šta moramo da organizujemo?"},{"de":"Was brauchen wir dafür?","sr":"Šta nam je potrebno za to?"},{"de":"Was sollen wir mitnehmen?","sr":"Šta bi trebalo da ponesemo?"},{"de":"Wir könnten etwas zu essen und zu trinken kaufen.","sr":"Mogli bismo da kupimo nešto za jelo i piće."},{"de":"Ich bringe Wasser und Saft mit.","sr":"Poneću vodu i sok."},{"de":"Kannst du bitte das Essen vorbereiten?","sr":"Možeš li, molim te, da pripremiš hranu?"},{"de":"Wer kauft die Getränke?","sr":"Ko će kupiti piće?"},{"de":"Ich kümmere mich um die Musik.","sr":"Ja ću se pobrinuti za muziku."},{"de":"Du kannst die Einladungen schreiben.","sr":"Ti možeš da napišeš pozivnice."},{"de":"Wie viel Geld brauchen wir?","sr":"Koliko novca nam je potrebno?"},{"de":"Wir können die Kosten teilen.","sr":"Možemo da podelimo troškove."},{"de":"Ich bezahle die Eintrittskarten.","sr":"Ja ću platiti ulaznice."},{"de":"Wen möchten wir einladen?","sr":"Koga želimo da pozovemo?"},{"de":"Laden wir auch die anderen aus dem Deutschkurs ein?","sr":"Hoćemo li pozvati i ostale sa kursa nemačkog?"},{"de":"Ich frage unsere Freunde.","sr":"Pitaću naše prijatelje."},{"de":"Wer reserviert den Tisch?","sr":"Ko će rezervisati sto?"},{"de":"Vergiss bitte die Getränke nicht.","sr":"Molim te, ne zaboravi piće."},{"de":"Wir sollten auch an das Wetter denken.","sr":"Trebalo bi da mislimo i na vreme."}]},{"name":"Slaganje","deName":"Zusagen","description":"Potvrdi da ti predlog odgovara","phrases":[{"de":"Ja, gern.","sr":"Da, rado."},{"de":"Ja, das ist eine gute Idee!","sr":"Da, to je dobra :"Ich habe einen Termin, den ich nicht verschieben kann.","sr":"Imam termin koji ne mogu da pomerim."},{"de":"Hast du vielleicht am Sonntag Zeit?","sr":"Imaš li možda vremena u nedelju?"},{"de":"Am Samstag passt es mir leider nicht.","sr":"U subotu mi, nažalost, ne odgovara."},{"de":"Könnten wir vielleicht am Sonntag den Kurs besuchen?","sr":"Da li bismo možda mogli da pohađamo kurs u nedelju?"},{"de":"Es tut mir leid, aber am Sonntag arbeite ich.","sr":"Žao mi je, ali u nedelju radim."},{"de":"Nein, das geht nicht. Ich muss arbeiten.","sr":"Ne, to ne može. Moram da radim."},{"de":"Da müssen wir uns etwas anderes überlegen.","sr":"Moramo da smislimo nešto drugo."},{"de":"Ich bin anderer Meinung.","sr":"Ja imam drugačije mišljenje."},{"de":"Das finde ich nicht so gut.","sr":"To mi ne deluje baš dobro."},{"de":"Da habe ich leider keine Zeit.","sr":"Tada, nažalost, nemam vremena."},{"de":"Da habe ich schon einen Termin.","sr":"Tada već imam zakazan termin."},{"de":"Darauf habe ich keine Lust.","sr":"Nemam volje za to."},{"de":"Leider kann ich nicht mitkommen.","sr":"Nažalost, ne mogu da pođem."},{"de":"Können wir den Plan ändern?","sr":"Možemo li da promenimo plan?"},{"de":"Wie wäre es stattdessen mit Freitag?","sr":"Šta kažeš da umesto toga bude petak?"}]},{"name":"Ponovo pitati","deName":"Nachfragen","description":"Ako ne razumeš partnera","phrases":[{"de":"Wie bitte?","sr":"Molim?"},{"de":"Entschuldigung, ich habe dich nicht verstanden.","sr":"Izvini, nisam te razumeo/razumela."},{"de":"Kannst du das bitte wiederholen?","sr":"Možeš li, molim te, to da ponoviš?"},{"de":"Kannst du die Frage noch einmal wiederholen?","sr":"Možeš li još jednom da ponoviš pitanje?"},{"de":"Kannst du bitte langsamer sprechen?","sr":"Možeš li, molim te, da govoriš sporije?"},{"de":"Was meinst du damit?","sr":"Šta time misliš?"},{"de":"Meinst du Samstag oder Sonntag?","sr":"Da li misliš na subotu ili nedelju?"},{"de":"Habe ich dich richtig verstanden?","sr":"Da li sam te dobro razumeo/razum function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function lookup(id){if(!id)return null;if(id.startsWith('c')){const parts=/^c(-?\d+)i(\d+)$/.exec(id);if(parts && cats[+parts[1]])return Object.assign({id},cats[+parts[1]].phrases[+parts[2]])}if(id.startsWith('d')){const parts=/^d(\d+)i(\d+)$/.exec(id);if(parts && dialogs[+parts[1]])return Object.assign({id},dialogs[+parts[1]].lines[+parts[2]])}return null}

function findVoice(lang){refreshVoices();let list=availableVoices;if(lang==='de'){return list.find(v=>/^de[-_](DE|AT)/i.test(v.lang))||list.find(v=>/^de([-_]|$)/i.test(v.lang))||null}return list.find(v=>/^sr([-_]|$)/i.test(v.lang))||list.find(v=>/^(bs|hr)([-_]|$)/i.test(v.lang))||null}

const OFFLINE_AUDIO={};

function sayOne(p,lang,token){return new Promise(resolve=>{
 if(token!==state.token)return resolve();let voice=findVoice(lang);let useEmbedded=(!voice && Boolean(OFFLINE_AUDIO[p.id+'_'+lang]));if(useEmbedded){playEmbedded(p,lang,token).then(resolve);return}
 if(!('speechSynthesis' in window)){playEmbedded(p,lang,token).then(resolve);return}
 const utt=new SpeechSynthesisUtterance(p[lang]);utt.lang=voice?voice.lang:(lang==='de'?'de-DE':'sr-RS');if(voice)utt.voice=voice;utt.rate=Number($('#speed').value)*(lang==='de'?.92:.95);utt.pitch=1;utt.volume=1;
 let finished=false;const finish=()=>{if(finished)return;finished=true;resolve()};utt.onend=finish;utt.onerror=()=>{if(OFFLINE_AUDIO[p.id+'_'+lang])playEmbedded(p,lang,token).then(finish);else finish()};
 try{speechSynthesis.speak(utt)}catch(e){playEmbedded(p,lang,token).then(finish)}
 })}
async function playList(items,mode){stopAudio();let token=state.token;for(let i=0;i<items.length;i++){const p=items[i];if(token!==state.token)break;const target=$('[data-id="'+p.id+'"]');if(target){$$('.phrase.highlight').forEach(x=>x.classList.remove('highlight'));target.classList.add('highlight');if(items.length>1)target.scrollIntoView({block:'nearest',behavior:'smooth'})}setCurrent(p.de);setStatus('Rečenica '+(i+1)+' / '+items.length);await sayOne(p,'de',token);if(token!==state.token)break;if(mode==='both')await sayOne(p,'sr',token)}if(token===state.token){setStatus('Završeno · izaberi rečenicu');setCurrent('A2 · Pomoćne rečenice');$$('.phrase.highlight').forEach(x=>x.classList.remove('highlight'))}}
function actionOne(p,mode){if(!p)return;if(mode==='sr'){stopAudio();let token=state.token;setCurrent(p.sr);setStatus('Srpski izgovor');sayOne(p,'sr',token).then(()=>{if(token===state.token)setStatus('Spremno za slušanje')})}else playList([p],mode)}
$$('.tab').forEach(t=>t.addEventListener('click',()=>{stopAudio();state.tab=t.dataset.tab;state.search='';els.search.value='';showView();els.main.scrollTop=0}));
els.chips.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if('category' in b.dataset){selectCategory(Number(b.dataset.category))}else if('dialog' in b.dataset){stopAudio();state.dialog=Number(b.dataset.dialog);showView();els.main.scrollTop=0}});
els.main.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.say){let p=lookup(b.dataset.id);if(state.tab==='practice')p=getPracticeItem();actionOne(p,b.dataset.say)}else if(b.dataset.fav){let p=lookup(b.dataset.fav);if(!p)return;let key=favKey(p);if(state.favs.has(key))state.favs.delete(key);else state.favs.add(key);saveFav();if(state.tab==='sentences')renderSentences();else if(state.tab==='dialogues')renderDialog()}else if(b.id==='reveal'){state.reveal=!state.reveal;renderPractice()}else if(b.id==='next'){state.exerciseIndex=(state.exerciseIndex+1)%cats[state.cat].phrases.length;state.reveal=false;renderPractice()}});
els.search.addEventListener('input',e=>{state.search=e.target.value.trim().toLocaleLowerCase();renderSentences();els.main.scrollTop=0});
els.translations.addEventListener('change',e=>{state.translation=e.target.checked;showView()});
$('#playDe').addEventListener('click',()=>playList(currentItems(),'de'));
$('#playBoth').addEventListener('click',()=>playList(currentItems(),'both'));
$('#stop').addEventListener('click',stopAudio);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAudio()});
$('#totalCount').textContent=cats.reduce((n,c)=>n+c.phrases.length,0);$('#dialogCount').textContent=dialogs.length;
showView();
</script>
</body></html>
