":"Ich bin nicht sicher, ob das klappt.","sr":"Nisam siguran/sigurna da li će to uspeti."},{"de":"Das ist vielleicht zu teuer.","sr":"To je možda preskupo."},{"de":"Können wir nicht etwas anderes machen?","sr":"Zar ne možemo da radimo nešto drugo?"},{"de":"Ich muss erst meine Familie fragen.","sr":"Prvo moram da pitam porodicu."},{"de":"Vielleicht finden wir eine bessere Lösung.","sr":"Možda ćemo naći bolje rešenje."},{"de":"Ich bin mir nicht sicher, ob wir genug Zeit haben.","sr":"Nisam siguran/sigurna da li imamo dovoljno vremena."}]},{"name":"Odbijanje","deName":"Absagen","description":"Ljubazno odbij i ponudi alternativu","phrases":[{"de":"Am Samstag um zehn Uhr kann ich leider nicht.","sr":"U subotu u deset sati, nažalost, ne mogu."},{"de":"Ich habe einen Termin, den ich nicht verschieben kann.","sr":"Imam termin koji ne mogu da pomerim."},{"de":"Hast du vielleicht am Sonntag Zeit?","sr":"Imaš li možda vremena u nedelju?"},{"de":"Am Samstag passt es mir leider nicht.","sr":"U subotu mi, nažalost, ne odgovara."},{"de":"Könnten wir vielleicht am Sonntag den Kurs besuchen?","sr":"Da li bismo možda mogli da pohađamo kurs u nedelju?"},{"de":"Es tut mir leid, aber am Sonntag arbeite ich.","sr":"Žao mi je, ali u nedelju radim."},{"de":"Nein, das geht nicht. Ich muss arbeiten.","sr":"Ne, to ne može. Moram da radim."},{"de":"Da müssen wir uns etwas anderes überlegen.","sr":"Moramo da smislimo nešto drugo."},{"de":"Ich bin anderer Meinung.","sr":"Ja imam drugačije mišljenje."},{"de":"Das finde ich nicht so gut.","sr":"To mi ne deluje baš dobro."},{"de":"Da habe ich leider keine Zeit.","sr":"Tada, nažalost, nemam vremena."},{"de":"Da habe ich schon einen Termin.","sr":"Tada već imam zakazan termin."},{"de":"Darauf habe ich keine Lust.","sr":"Nemam volje za to."},{"de":"Leider kann ich nicht mitkommen.","sr":"Nažalost, ne mogu da pođem."},{"de":"Können wir den Plan ändern?","sr":"Možemo li da promenimo plan?"},{"de":"Wie wäre es stattdessen mit Freitag?","sr":"Šta kažeš da  ali je autobus jeftiniji."},{"de":"Wer bringt Essen und Getränke mit?","sr":"Ko donosi hranu i piće?"},{"de":"Ich kann belegte Brote mitnehmen.","sr":"Mogu da ponesem sendviče."},{"de":"Welche Sportart möchtest du machen?","sr":"Kojim sportom bi želeo/želela da se baviš?"},{"de":"Wollen wir Tennis spielen oder klettern gehen?","sr":"Hoćemo li da igramo tenis ili da idemo na penjanje?"},{"de":"Wo können wir einen Tennisplatz finden?","sr":"Gde možemo da pronađemo teniski teren?"},{"de":"Wen fragen wir, ob er mitkommen möchte?","sr":"Koga ćemo pitati da li želi da pođe sa nama?"},{"de":"Sollen wir einen Trainer organisieren?","sr":"Da li da obezbedimo trenera?"},{"de":"Nach dem Sport können wir zusammen etwas trinken.","sr":"Posle sporta možemo zajedno nešto da popijemo."}]},{"name":"Kuvanje i večera","deName":"Kochen & Abendessen","description":"Hrana, sastojci, gosti i obaveze","phrases":[{"de":"Wollen wir am Wochenende zusammen kochen?","sr":"Hoćemo li zajedno da kuvamo za vikend?"},{"de":"Was kochen wir: Pizza, Suppe oder Gemüse?","sr":"Šta ćemo kuvati: picu, supu ili povrće?"},{"de":"Welche Zutaten brauchen wir?","sr":"Koji sastojci su nam potrebni?"},{"de":"Für die Pizza brauchen wir Mehl, Käse und Tomaten.","sr":"Za picu su nam potrebni brašno, sir i paradajz."},{"de":"Ich kann das Gemüse schneiden.","sr":"Mogu da isečem povrće."},{"de":"Kaufst du Fleisch oder Fisch?","sr":"Hoćeš li kupiti meso ili ribu?"},{"de":"Wie viele Personen kommen zum Essen?","sr":"Koliko osoba dolazi na večeru?"},{"de":"Ich frage meine Familie, ob sie mitessen möchte.","sr":"Pitaću svoju porodicu da li želi da jede s nama."},{"de":"Sollen wir im Haus oder im Garten essen?","sr":"Hoćemo li jesti u kući ili u bašti?"},{"de":"Wer geht einkaufen?","sr":"Ko ide u kupovinu?"},{"de":"Wer bezahlt die Lebensmittel?","sr":"Ko plaća namirnice?"},{"de":"Nach dem Essen räumen wir gemeinsam auf.","sr":"Posle jela ćemo zajedno raspremiti."}]},{"name":"Proslava i pozivi","deName":"Feier & Einladungen","description":"Rođendan, završna zabava i gosti","phrases":[{"de":"Wollen wir zu Hause oder im Park feiern?","sr":"Hoćemo li slaviti kod kuće ili u parku?"},{"de":"Wie viele Gäste wollen wir einladen?","sr":"Koliko gostiju želimo da pozovemo?"},{"de":"Laden wir auch unsere Lehrerin ein?","sr":"Hoćemo li pozvati i našu nastavnicu?"},{"de":"Kannst du die Einladungen schreiben?","sr":"Možeš li da napišeš pozivnice?"},{"de":"Ich bringe einen Kuchen mit.","sr":"Poneću kolač."},{"de":"Sollen wir Musik hören oder Spiele spielen?","sr":"Hoćemo li slušati muziku ili igrati igre?"},{"de":"Wer organisiert die Musik?","sr":"Ko organizuje muziku?"},{"de":"Um wie viel Uhr beginnt die Feier?","sr":"U koliko sati počinje proslava?"},{"de":"Ich kann die Tische und Stühle vorbereiten.","sr":"Mogu da pripremim stolove i stolice."},{"de":"Wenn es regnet, feiern wir drinnen.","sr":"Ako bude padala kiša, slavićemo unutra."},{"de":"Ich rufe die Gäste heute Abend an.","sr":"Pozvaću goste telefonom večeras."}]},{"name":"Buvljak i prodaja","deName":"Flohmarkt & Verkauf","description":"Prodaja stvari, prevoz, cene i kusur","phrases":[{"de":"Was wollen wir auf dem Flohmarkt verkaufen?","sr":"Šta želimo da prodajemo na buvljaku?"},{"de":"Ich habe alte Kleidung, Bücher und Filme.","sr":"Imam staru odeću, knjige i filmove."},{"de":"Wir können auch einen kleinen Tisch mitnehmen.","sr":"Možemo da ponesemo i mali sto."},{"de":"Wie bringen wir die Sachen dorthin?","sr":"Kako ćemo preneti stvari tamo?"},{"de":"Mein Bruder kann uns mit dem Auto helfen.","sr":"Moj brat može da nam pomogne automobilom."},{"de":"Wer nimmt Wechselgeld mit?","sr":"Ko će poneti sitan novac za kusur?"},{"de":"Wie viel soll die Jacke kosten?","sr":"Koliko bi trebalo da košta jakna?"},{"de":"Wir schreiben die Preise auf kleine Zettel.","sr":"Napisaćemo cene na male papiriće."},{"de":"Wann bauen wir unseren Stand auf?","sr":"Kada ćemo postaviti naš štand?"},{"de":"Nach dem Flohmarkt gehen wir noch ins Café.","sr":"Posle buvljaka ćemo otići i u kafić."}]},{"name":"Izlazak i kurs","deName":"Ausgehen & Kurs","description":"Bioskop, pozorište, izbor kursa i informacije","phrases":[{"de":"Wollen wir am Abend ins Kino oder ins Theater gehen?","sr":"Hoćemo li uveče u bioskop ili u pozorište?"},{"de":"Vielleicht gehen wir lieber bowlen.","sr":"Možda je bolje da idemo na kuglanje."},{"de":"Welcher Film läuft am Samstag?","sr":"Koji film se prikazuje u subotu?"},{"de":"Um wie viel Uhr beginnt der Film?","sr":"U koliko sati počinje film?"},{"de":"Treffen wir uns vor dem Kino?","sr":"Hoćemo li se naći ispred bioskopa?"},{"de":"Wollen wir danach noch etwas essen?","sr":"Hoćemo li posle toga još nešto da jedemo?"},{"de":"Welchen Kurs möchtest du besuchen?","sr":"Koji kurs bi želeo/želela da pohađaš?"},{"de":"Ein Computerkurs würde mich interessieren.","sr":"Zanimao bi me kurs računara."},{"de":"Wann findet der Englischkurs statt?","sr":"Kada se održava kurs engleskog?"},{"de":"Wie viel kostet der Kurs?","sr":"Koliko košta kurs?"},{"de":"Wo können wir uns darüber informieren?","sr":"Gde možemo da se informišemo o tome?"},{"de":"Ich suche die Informationen im Internet.","sr":"Potražiću informacije na internetu."},{"de":"Wie kommen wir zum Kurs: mit dem Bus oder mit der Straßenbahn?","sr":"Kako ćemo stići na kurs: autobusom ili tramvajem."}]}];
const nav=document.getElementById("categories");
const content=document.getElementById("content");
const notice=document.getElementById("notice");
const autoButton=document.getElementById("autoMode");
const manualButton=document.getElementById("manualMode");
const stopButton=document.getElementById("stopSound");
let categoryIndex=0,pageIndex=0,pages=[],active=null,sequence=0,mode='manual';
let voices=[];
const safe=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[ch]));
function updateVoices(){voices=("speechSynthesis" in window)?window.speechSynthesis.getVoices():[]}
updateVoices();
if("speechSynthesis" in window){window.speechSynthesis.addEventListener?.("voiceschanged",updateVoices)}
function resetSpeech(){
  sequence++;
  if("speechSynthesis" in window){try{window.speechSynthesis.cancel()}catch(_){}}
  content.querySelectorAll(".phrase.playing").forEach(el=>el.classList.remove("playing"));
  content.querySelectorAll(".listen button.active").forEach(el=>el.classList.remove("active"));
  active=null;
}
function phraseHtml(p,i){
  return '<article class="phrase" data-index="'+i+'"><div class="phraseText"><div class="num">REČENICA '+String(i+1).padStart(2,'0')+'</div><div class="de" lang="de">'+safe(p.de)+'</div><div class="sr" lang="sr">'+safe(p.sr)+'</div></div><div class="listen"><button type="button" data-index="'+i+'" aria-label="Slušaj nemački: '+safe(p.de)+'">🔊</button></div></article>';
}
function buildPages(){
  const c=categories[categoryIndex],style=getComputedStyle(content),section=content.querySelector(".section");
  const room=content.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom)-section.getBoundingClientRect().height-parseFloat(getComputedStyle(section).marginBottom)-2;
  const measure=document.createElement("div");
  measure.style.position="absolute";measure.style.visibility="hidden";measure.style.pointerEvents="none";
  measure.style.left=style.paddingLeft;measure.style.right=style.paddingRight;measure.style.top="0";
  content.appendChild(measure);
  let arr=[],batch=[],used=0;
  c.phrases.forEach((p,i)=>{
    measure.innerHTML=phraseHtml(p,i);
    const el=measure.firstElementChild;
    const h=el.getBoundingClientRect().height+parseFloat(getComputedStyle(el).marginBottom);
    if(batch.length && used+h>room){arr.push(batch);batch=[];used=0}
    batch.push(i);used+=h;
  });
  if(batch.length)arr.push(batch);
  measure.remove();
  return arr.length?arr:[[]];
}
function showPage(){
  const c=categories[categoryIndex],indices=pages[pageIndex]||[];
  content.querySelectorAll(".phrase").forEach(el=>el.remove());
  content.insertAdjacentHTML("beforeend",indices.map(i=>phraseHtml(c.phrases[i],i)).join(""));
  document.getElementById("pageLabel").textContent=(pageIndex+1)+" / "+pages.length;
  document.getElementById("pageRange").textContent=indices.length?"Rečenice "+(indices[0]+1)+"–"+(indices[indices.length-1]+1)+" od "+c.phrases.length:"Nema rečenica";
  document.getElementById("prevPage").disabled=pages.length<=1;
  document.getElementById("nextPage").disabled=pages.length<=1;
}
function render(){
  document.getElementById("catName").textContent=categories[categoryIndex].name;
  document.getElementById("catPage").textContent=(categoryIndex+1)+" / "+categories.length+" kategorija";
  const c=categories[categoryIndex];
  content.innerHTML='<div class="section"><div><h2>'+safe(c.name)+'</h2><p>'+safe(c.deName)+'</p></div><span class="count">'+c.phrases.length+' rečenica</span></div>';
  pages=buildPages();
  pageIndex=Math.max(0,Math.min(pageIndex,pages.length-1));
  showPage();
}
function pickVoice(lang){
  updateVoices();
  if(lang==="de")return voices.find(v=>/^de[-_](DE|AT)/i.test(v.lang))||voices.find(v=>/^de([-_]|$)/i.test(v.lang))||null;
  return voices.find(v=>/^sr([-_]|$)/i.test(v.lang))||voices.find(v=>/^(bs|hr)([-_]|$)/i.test(v.lang))||null;
}
function syncMode(){
  autoButton.classList.toggle("selected",mode==="auto");
  manualButton.classList.toggle("selected",mode==="manual");
  autoButton.setAttribute("aria-pressed",String(mode==="auto"));
  manualButton.setAttribute("aria-pressed",String(mode==="manual"));
}
function playGerman(index,ticket,after){
  if(ticket!==sequence)return;
  if(!("speechSynthesis" in window)){
    notice.textContent="Nemački izgovor nije dostupan u pregledaču.";
    mode="manual";syncMode();return;
  }
  const p=categories[categoryIndex].phrases[index];
  if(!p)return;
  const voice=pickVoice("de");
  const u=new SpeechSynthesisUtterance(p.de);
  u.lang=voice?voice.lang:"de-DE";if(voice)u.voice=voice;u.rate=.88;u.pitch=1;
  const card=content.querySelector('.phrase[data-index="'+index+'"]');
  if(card){card.classList.add("playing");card.querySelector("button")?.classList.add("active")}
  active={index,utterance:u};
  notice.textContent="Nemački · Rečenica "+(index+1);
  function clean(){card?.classList.remove("playing");card?.querySelector("button")?.classList.remove("active");active=null}
  u.onend=()=>{if(ticket!==sequence)return;clean();if(after)after();else notice.textContent="Spremno za slušanje."};
  u.onerror=e=>{if(ticket!==sequence)return;clean();if(e.error!=="canceled"&&e.error!=="interrupted"){notice.textContent="Nemački glas nije dostupan.";mode="manual";syncMode()}};
  try{speechSynthesis.speak(u)}catch(e){clean();mode="manual";syncMode();notice.textContent="Glas nije dostupan."}
}
function autoNext(ids,i,ticket){
  if(ticket!==sequence||mode!=="auto")return;
  if(i>=ids.length){notice.textContent="Završene rečenice na ovoj stranici.";return}
  playGerman(ids[i],ticket,()=>autoNext(ids,i+1,ticket));
}
function startAuto(){
  resetSpeech();mode="auto";syncMode();
  const ids=(pages[pageIndex]||[]).slice();
  if(ids.length)autoNext(ids,0,sequence);
}
function setManual(){
  resetSpeech();mode="manual";syncMode();
  notice.textContent="Ručno: pritisni zvučnik pored nemačke rečenice.";
}
function moveCategory(step){
  resetSpeech();categoryIndex=(categoryIndex+step+categories.length)%categories.length;pageIndex=0;render();
  if(mode==="auto")startAuto();
}
function movePage(step){
  resetSpeech();pageIndex=(pageIndex+step+pages.length)%pages.length;showPage();
  if(mode==="auto")startAuto();
}
nav.addEventListener("click",e=>{
  const b=e.target.closest("button[data-step]");
  if(b)moveCategory(Number(b.dataset.step));
});
content.addEventListener("click",e=>{
  const b=e.target.closest("button[data-index]");if(!b)return;
  const i=Number(b.dataset.index);
  if(active?.index===i){setManual();return}
  resetSpeech();mode="manual";syncMode();playGerman(i,sequence,null);
});
autoButton.addEventListener("click",startAuto);
manualButton.addEventListener("click",setManual);
stopButton.addEventListener("click",setManual);
document.getElementById("prevPage").addEventListener("click",()=>movePage(-1));
document.getElementById("nextPage").addEventListener("click",()=>movePage(1));
let resizeFrame=0;
window.addEventListener("resize",()=>{cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(()=>{resetSpeech();render()})});
document.addEventListener("visibilitychange",()=>{if(document.hidden)resetSpeech()});
render();syncMode();
</script>
</body>
</html>
