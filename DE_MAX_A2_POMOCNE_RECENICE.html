<style>

@media(min-width:700px){.app{border-inline:1px solid #d0d9e4}.header{padding-top:13px}.content{padding:10px 13px 0}}
@media(max-height:640px){.header{padding:7px 12px}.header h1{margin:5px 0 2px;font-size:18px}.subtitle{font-size:9px}.categories{padding:5px 9px}.categories .arrow{height:34px;flex-basis:39px;font-size:22px}.content{padding-top:5px}.phrase{padding:6px 8px 5px;margin-bottom:5px}.de{font-size:13px}.sr{font-size:11px}.num{font-size:8px;margin-bottom:2px}.listen{margin-top:5px}.listen button{min-height:25px;padding:3px 8px}.paging{height:41px}}

</style>
</head>
<body>
<div class="app">

devet sati."},{"de":"Ich kann dich mit dem Auto abholen.","sr":"Mogu da dođem po tebe automobilom."},{"de":"Der Treffpunkt ist vor dem Bahnhof.","sr":"Mesto okupljanja je ispred železničke stanice."},{"de":"Wir brauchen ungefähr zwanzig Minuten.","sr":"Treba nam otprilike dvadeset minuta."}]},{"name":"Organizacija","deName":"Organisation","description":"Dogovorite ko šta radi i donosi","phrases":[{"de":"Was müssen wir organisieren?","sr":"Šta moramo da organizujemo?"},{"de":"Was brauchen wir dafür?","sr":"Šta nam je potrebno za to?"},{"de":"Was sollen wir mitnehmen?","sr":"Šta bi trebalo da ponesemo?"},{"de":"Wir könnten etwas zu essen und zu trinken kaufen.","sr":"Mogli bismo da kupimo nešto za jelo i piće."},{"de":"Ich bringe Wasser und Saft mit.","sr":"Poneću vodu i sok."},{"de":"Kannst du bitte das Essen vorbereiten?","sr":"Možeš li, molim te, da pripremiš hranu?"},{"de":"Wer kauft die Getränke?","sr":"Ko će kupiti piće?"},{"de":"Ich kümmere mich um die Musik.","sr":"Ja ću se pobrinuti za muziku."},{"de":"Du kannst die Einladungen schreiben.","sr":"Ti možeš da napišeš pozivnice."},{"de":"Wie viel Geld brauchen wir?","sr":"Koliko novca nam je potrebno?"},{"de":"Wir können die Kosten teilen.","sr":"Možemo da podelimo troškove."},{"de":"Ich bezahle die Eintrittskarten.","sr":"Ja ću platiti ulaznice."},{"de":"Wen möchten wir einladen?","sr":"Koga želimo da pozovemo?"},{"de":"Laden wir auch die anderen aus dem Deutschkurs ein?","sr":"Hoćemo li pozvati i ostale sa kursa nemačkog?"},{"de":"Ich frage unsere Freunde.","sr":"Pitaću naše prijatelje."},{"de":"Wer reserviert den Tisch?","sr":"Ko će rezervisati sto?"},{"de":"Vergiss bitte die Getränke nicht.","sr":"Molim te, ne zaboravi piće."},{"de":"Wir sollten auch an das Wetter denken.","sr":"Trebalo bi da mislimo i na vreme."}]},{"name":"Slaganje","deName":"Zusagen","description":"Potvrdi da ti predlog odgovara","phrases":[{"de":"Ja, gern.","sr":"Da, rado."},{"de":"Ja, das ist eine gute Idee!","sr":"Da, to je dobra ideja!"},{"de":"Ja, das finde ich gut.","sr":"Da, mislim da je to dobro."},{"de":"Das finde ich interessant.","sr":"To mi deluje zanimljivo."},{"de":"Das ist ein toller Vorschlag.","sr":"To je sjajan predlog."},{"de":"Damit bin ich einverstanden.","sr":"S tim se slažem."},{"de":"Das gefällt mir.","sr":"To mi se sviđa."},{"de":"Sonntag klingt ganz gut.","sr":"Nedelja mi zvuči sasvim dobro."},{"de":"Prima! Das ist für mich perfekt.","sr":"Odlično! To mi savršeno odgovara."},{"de":"Das passt mir sehr gut.","sr":"To mi baš odgovara."},{"de":"Das können wir gern machen.","sr":"To možemo rado da uradimo."},{"de":"Genau, so machen wir das.","sr":"Upravo tako ćemo uraditi."},{"de":"Einverstanden!","sr":"Dogovoreno!"},{"de":"Ich bin auch dafür.","sr":"I ja sam za to."}]},{"name":"Nesigurnost","deName":"Unsicher sein","description":"Traži drugo rešenje ili vreme za razmišljanje","phrases":[{"de":"Ich bin mir noch nicht sicher.","sr":"Još nisam siguran/sigurna."},{"de":"Darüber muss ich noch nachdenken.","sr":"Moram još da razmislim o tome."},{"de":"Vielleicht wäre es besser, wenn wir am Sonntag fahren.","sr":"Možda bi bilo bolje da idemo u nedelju."},{"de":"Ich finde es besser, wenn wir am Sonntag gehen.","sr":"Mislim da je bolje da idemo u nedelju."},{"de":"Ich weiß nicht, ob ich am Samstag Zeit habe.","sr":"Ne znam da li imam vremena u subotu."},{"de":"Ich bin nicht sicher, ob das klappt.","sr":"Nisam siguran/sigurna da li će to uspeti."},{"de":"Das ist vielleicht zu teuer.","sr":"To je možda preskupo."},{"de":"Können wir nicht etwas anderes machen?","sr":"Zar ne možemo da radimo nešto drugo?"},{"de":"Ich muss erst meine Familie fragen.","sr":"Prvo moram da pitam porodicu."},{"de":"Vielleicht finden wir eine bessere Lösung.","sr":"Možda ćemo naći bolje rešenje."}]},{"name":"Odbijanje","deName":"Absagen","description":"Ljubazno odbij i ponudi alternativu","phrases":[{"de":"Am Samstag um zehn Uhr kann ich leider nicht.","sr":"U subotu u deset sati, nažalost, ne mogu."},{"de":"Ich habe einen Termin, den ich nicht verschieben kann.","sr":"Imam termin koji ne mogu da pomerim."},{"de":"Hast du vielleicht am Sonntag Zeit?","sr":"Imaš li možda vremena u nedelju?"},{"de":"Am Samstag passt es mir leider nicht.","sr":"U subotu mi, nažalost, ne odgovara."},{"de":"Könnten wir vielleicht am Sonntag den Kurs besuchen?","sr":"Da li bismo možda mogli da pohađamo kurs u nedelju?"},{"de":"Es tut mir leid, aber am Sonntag arbeite ich.","sr":"Žao mi je, ali u nedelju radim."},{"de":"Nein, das geht nicht. Ich muss arbeiten.","sr":"Ne, to ne može. Moram da radim."},{"de":"Da müssen wir uns etwas anderes überlegen.","sr":"Moramo da smislimo nešto drugo."},{"de":"Ich bin anderer Meinung.","sr":"Ja imam drugačije mišljenje."},{"de":"Das finde ich nicht so gut.","sr":"To mi ne deluje baš dobro."},{"de":"Da habe ich leider keine Zeit.","sr":"Tada, nažalost, nemam vremena."},{"de":"Da habe ich schon einen Termin.","sr":"Tada već imam zakazan termin."},{"de":"Darauf habe ich keine Lust.","sr":"Nemam volje za to."},{"de":"Leider kann ich nicht mitkommen.","sr":"Nažalost, ne mogu da pođem."},{"de":"Können wir den Plan ändern?","sr":"Možemo li da promenimo plan?"},{"de":"Wie wäre es stattdessen mit Freitag?","sr":"Šta kažeš da umesto toga bude petak?"}]},{"name":"Ponovo pitati","deName":"Nachfragen","description":"Ako ne razumeš partnera","phrases":[{"de":"Wie bitte?","sr":"Molim?"},{"de":"Entschuldigung, ich habe dich nicht verstanden.","sr":"Izvini, nisam te razumeo/razumela."},{"de":"Kannst du das bitte wiederholen?","sr":"Možeš li, molim te, to da ponoviš?"},{"de":"Kannst du die Frage noch einmal wiederholen?","sr":"Možeš li još jednom da ponoviš pitanje?"},{"de":"Kannst du bitte langsamer sprechen?","sr":"Možeš li, molim te, da govoriš sporije?"},{"de":"Was meinst du damit?","sr":"Šta time misliš?"},{"de":"Meinst du Samstag oder Sonntag?","sr":"Da li misliš na subotu ili nedelju?"},{"de":"Habe ich dich richtig verstanden?","sr":"Da li sam te dobro razumeo/razumela?"},{"de":"Kannst du mir ein Beispiel geben?","sr":"Možeš li da mi daš primer?"},{"de":"Was sollen wir genau machen?","sr":"Šta tačno treba da uradimo?"}]},{"name":"Završetak plana","deName":"Abschluss","description":"Potvrdite zajednički dogovor","phrases":[{"de":"Dann machen wir das so.","sr":"Onda ćemo tako uraditi."},{"de":"Also, wir treffen uns am Samstag um 14 Uhr.","sr":"Dakle, naći ćemo se u subotu u 14 časova."},{"de":"Gut, dann ist alles klar.","sr":"Dobro, onda je sve jasno."},{"de":"Wir haben alles besprochen.","sr":"O svemu smo razgovarali."},{"de":"Ich freue mich schon darauf.","sr":"Već se radujem tome."},{"de":"Danke für deine Hilfe.","sr":"Hvala ti na pomoći."},{"de":"Super, bis Samstag!","sr":"Super, vidimo se u subotu!"},{"de":"Vergiss bitte nicht, pünktlich zu kommen.","sr":"Molim te, ne zaboravi da dođeš na vreme."},{"de":"Ich schreibe dir später noch eine Nachricht.","sr":"Poslaću ti kasnije još jednu poruku."},{"de":"Dann bis morgen!","sr":"Onda, vidimo se sutra!"}]}];
const nav=document.getElementById("categories");
const content=document.getElementById("content");
const notice=document.getElementById("notice");
let categoryIndex=0,pageIndex=0,pages=[],active=null,sequence=0;
let voices=[];
const safe=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[ch]));
function updateVoices(){voices=("speechSynthesis" in window)?window.speechSynthesis.getVoices():[]}
updateVoices();
if("speechSynthesis" in window){window.speechSynthesis.addEventListener?.("voiceschanged",updateVoices)}
function resetSpeech(){
  sequence++;
  if("speechSynthesis" in window){try{window.speechSynthesis.cancel()}catch(_){}}
  content.querySelectorAll(".phrase.playing").forEach(el=>el.classList.remove("playing"));
  content.querySelectorAll(".listen button.active").forEach(el=>el.classList.remove("active"));
  active=null;
}
function phraseHtml(p,i){
  return '<article class="phrase" data-index="'+i+'"><div class="num">REČENICA '+String(i+1).padStart(2,'0')+'</div><div class="de" lang="de">'+safe(p.de)+'</div><div class="sr" lang="sr">'+safe(p.sr)+'</div><div class="listen"><button type="button" data-lang="de" data-index="'+i+'" aria-label="Slušaj nemački izgovor: '+safe(p.de)+'">🔊 DE</button><button type="button" class="srButton" data-lang="sr" data-index="'+i+'" aria-label="Slušaj srpski izgovor: '+safe(p.sr)+'">🔊 SR</button></div></article>';
}
function buildPages(){
  const c=categories[categoryIndex],style=getComputedStyle(content),section=content.querySelector(".section");
  const room=content.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom)-section.getBoundingClientRect().height-parseFloat(getComputedStyle(section).marginBottom)-2;
  const measure=document.createElement("div");
  measure.style.position="absolute";measure.style.visibility="hidden";measure.style.pointerEvents="none";
  measure.style.left=style.paddingLeft;measure.style.right=style.paddingRight;measure.style.top="0";
  content.appendChild(measure);
  let arr=[],batch=[],used=0;
  c.phrases.forEach((p,i)=>{
    measure.innerHTML=phraseHtml(p,i);
    const el=measure.firstElementChild;
    const h=el.getBoundingClientRect().height+parseFloat(getComputedStyle(el).marginBottom);
    if(batch.length && used+h>room){arr.push(batch);batch=[];used=0}
    batch.push(i);used+=h;
  });
  if(batch.length)arr.push(batch);
  measure.remove();
  return arr.length?arr:[[]];
}
function showPage(){
  const c=categories[categoryIndex],indices=pages[pageIndex]||[];
  content.querySelectorAll(".phrase").forEach(el=>el.remove());
  content.insertAdjacentHTML("beforeend",indices.map(i=>phraseHtml(c.phrases[i],i)).join(""));
  document.getElementById("pageLabel").textContent=(pageIndex+1)+" / "+pages.length;
  document.getElementById("pageRange").textContent=indices.length?"Rečenice "+(indices[0]+1)+"–"+(indices[indices.length-1]+1)+" od "+c.phrases.length:"Nema rečenica";
  document.getElementById("prevPage").disabled=pages.length<=1;
  document.getElementById("nextPage").disabled=pages.length<=1;
}
function render(){
  document.getElementById("catName").textContent=categories[categoryIndex].name;
  document.getElementById("catPage").textContent=(categoryIndex+1)+" / "+categories.length+" kategorija";
  const c=categories[categoryIndex];
  content.innerHTML='<div class="section"><div><h2>'+safe(c.name)+'</h2><p>'+safe(c.deName)+'</p></div><span class="count">'+c.phrases.length+' rečenica</span></div>';
  pages=buildPages();
  pageIndex=Math.max(0,Math.min(pageIndex,pages.length-1));
  showPage();
}
function pickVoice(lang){
  updateVoices();
  if(lang==="de")return voices.find(v=>/^de[-_](DE|AT)/i.test(v.lang))||voices.find(v=>/^de([-_]|$)/i.test(v.lang))||null;
  return voices.find(v=>/^sr([-_]|$)/i.test(v.lang))||voices.find(v=>/^(bs|hr)([-_]|$)/i.test(v.lang))||null;
}
function speak(index,lang,btn){
  if(active?.button===btn){resetSpeech();notice.textContent="Izgovor je zaustavljen.";return}
  resetSpeech();
  if(!("speechSynthesis" in window)){notice.textContent="Pregledač ne podržava glasovni izgovor.";return}
  const phrase=categories[categoryIndex].phrases[index];
  if(!phrase)return;
  const voice=pickVoice(lang);
  const utterance=new SpeechSynthesisUtterance(phrase[lang]);
  utterance.lang=voice?voice.lang:(lang==="de"?"de-DE":"sr-RS");
  if(voice)utterance.voice=voice;
  utterance.rate=lang==="de"?.87:.94;
  utterance.pitch=1;
  const call=sequence;
  active={button:btn,utterance};
  btn.classList.add("active");
  btn.closest(".phrase")?.classList.add("playing");
  notice.textContent="Slušanje: "+(lang==="de"?"nemački":"srpski");
  const finish=()=>{if(call!==sequence)return;resetSpeech();notice.textContent="Izaberi sledeću rečenicu za slušanje."};
  utterance.onend=finish;
  utterance.onerror=e=>{if(call!==sequence)return;resetSpeech();notice.textContent=e.error==="canceled"?"Izgovor je zaustavljen.":"Glas nije dostupan na ovom uređaju. Proveri glasove u pregledaču."};
  try{window.speechSynthesis.speak(utterance)}catch(e){resetSpeech();notice.textContent="Izgovor nije dostupan u ovom pregledaču."}
}
nav.addEventListener("click",e=>{
 const b=e.target.closest("button[data-step]");if(!b)return;
 resetSpeech();categoryIndex=(categoryIndex+Number(b.dataset.step)+categories.length)%categories.length;pageIndex=0;render();notice.textContent="Izaberi rečenicu za slušanje.";
});
content.addEventListener("click",e=>{
 const b=e.target.closest("button[data-lang]");if(b)speak(Number(b.dataset.index),b.dataset.lang,b);
});
document.getElementById("prevPage").addEventListener("click",()=>{resetSpeech();pageIndex=(pageIndex-1+pages.length)%pages.length;showPage()});
document.getElementById("nextPage").addEventListener("click",()=>{resetSpeech();pageIndex=(pageIndex+1)%pages.length;showPage()});
let resizeFrame=0;
window.addEventListener("resize",()=>{cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(()=>{resetSpeech();render()})});
document.addEventListener("visibilitychange",()=>{if(document.hidden)resetSpeech()});
render();
</script>
</body>
</html>
