<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#122b4a">
<meta name="description" content="DE-MAX A2 – pomoćne rečenice za zajedničko planiranje sa nemačkim izgovorom i srpskim prevodom.">
<title>DE-MAX A2 | Pomoćne rečenice</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#142b42;background:#e5ebf3;font-synthesis:none}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{overflow:hidden}
button{font:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid #fba34d;outline-offset:3px}
.app{width:100%;max-width:480px;height:100vh;height:100dvh;margin:auto;display:flex;flex-direction:column;overflow:hidden;background:#f1f5fa;box-shadow:0 0 35px #132c4b21}
.header{background:linear-gradient(130deg,#102844,#22486d);color:#fff;padding:14px 15px 14px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:850;letter-spacing:.05em;color:#e7f2ff}
.level{margin-left:auto;border:1px solid #6f8fac;border-radius:18px;padding:5px 10px;font-size:11px;letter-spacing:.03em}
h1{font-size:24px;line-height:1.14;margin:14px 0 5px;letter-spacing:-.7px}
h1 em{color:#ffb574;font-style:normal}
.subtitle{margin:0;font-size:12px;color:#d7e5f3;line-height:1.4}
.categories{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0;padding:9px 12px;background:#fff;border-bottom:1px solid #e0e7f0}
.arrow{display:flex;align-items:center;justify-content:center;flex:0 0 52px;height:48px;border:2px solid #d82b4b;border-radius:12px;background:#fff5f7;color:#cf183b;font-size:31px;line-height:1;font-weight:900;box-shadow:0 2px 6px #a5002212}
.arrow:active{background:#ffe0e7}
.catCenter{flex:1;min-width:0;text-align:center}
.catCenter strong{display:block;color:#19395e;font-size:16px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catCenter small{display:block;color:#728199;margin-top:3px;font-size:11px;font-weight:750}
.content{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 12px 22px;scrollbar-width:thin}
.section{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:0 1px 12px}
.section h2{font-size:19px;margin:0;color:#173a61;letter-spacing:-.4px}
.section p{font-size:12px;color:#687c92;margin:4px 0 0}
.section .count{font-size:11px;font-weight:800;color:#62748a;white-space:nowrap}
.phrase{background:#fff;padding:15px 14px 13px;margin-bottom:10px;border-radius:14px;border:1px solid #dfe8f3;box-shadow:0 3px 9px #1529440a}
.phrase.playing{border-color:#488cd6;box-shadow:0 0 0 2px #d7e8ff}
.num{color:#8797a9;font-size:10px;font-weight:800;letter-spacing:.05em;margin-bottom:6px}
.de{font-size:17px;line-height:1.4;font-weight:770;color:#152d48;overflow-wrap:anywhere}
.sr{font-size:14px;line-height:1.5;font-weight:600;color:#bf3052;margin-top:7px;overflow-wrap:anywhere}
.listen{display:flex;gap:8px;margin-top:12px}
.listen button{border:1px solid #d5e6f7;border-radius:9px;padding:9px 14px;min-width:83px;background:#eaf3ff;color:#175eaf;font-size:12px;font-weight:850}
.listen button.srButton{background:#fff0f2;border-color:#f5d8df;color:#b12b4d}
.listen button.active{background:#154e8e;color:white}
.listen button.srButton.active{background:#b12b4d;color:white}
#notice{background:#ffffff;color:#345473;padding:8px 13px;font-size:11px;border-top:1px solid #e2e8f0;flex-shrink:0;min-height:33px;display:flex;align-items:center}
@media(min-width:700px){.app{border-inline:1px solid #d0d9e4}.header{padding-top:18px}.content{padding:17px}}
@media(max-height:640px){.header{padding:9px 13px}.header h1{margin:8px 0 3px;font-size:21px}.categories{padding:6px 9px}.arrow{height:42px;flex-basis:46px;font-size:27px}.content{padding-top:9px}}
@media(prefers-reduced-motion:no-preference){button{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand"><span>DE-MAX · NEMAČKI JEZIK</span><span class="level">ÖSD A2</span></div>
    <h1>Pomoćne <em>rečenice</em></h1>
    <p class="subtitle">Gemeinsam etwas planen · Nemački i srpski izgovor</p>
  </header>
  <nav class="categories" id="categories" aria-label="Kategorije pomoćnih rečenica">
    <button class="arrow" type="button" data-step="-1" aria-label="Prethodna kategorija">❮</button>
    <div class="catCenter" aria-live="polite"><strong id="catName"></strong><small id="catPage"></small></div>
    <button class="arrow" type="button" data-step="1" aria-label="Sledeća kategorija">❯</button>
  </nav>
  <main class="content" id="content" tabindex="-1"></main>
  <div id="notice" role="status" aria-live="polite">Izaberi kategoriju i slušaj rečenice na nemačkom ili srpskom.</div>
</div>
<script>
"use strict";
const categories=[{"name":"Predlozi","deName":"Vorschläge","description":"Predloži zajedničku aktivnost","phrases":[{"de":"Ich habe eine Idee.","sr":"Imam ideju."},{"de":"Ich habe einen Vorschlag.","sr":"Imam predlog."},{"de":"Mein Vorschlag wäre, dass wir am Samstag fahren.","sr":"Moj predlog bi bio da idemo u subotu."},{"de":"Ich schlage vor, dass wir zusammen einen Ausflug machen.","sr":"Predlažem da zajedno idemo na izlet."},{"de":"Sollen wir am Wochenende etwas unternehmen?","sr":"Hoćemo li nešto da radimo za vikend?"},{"de":"Könnten wir am Samstag ins Kino gehen?","sr":"Da li bismo mogli da idemo u bioskop u subotu?"},{"de":"Wie findest du meine Idee?","sr":"Šta misliš o mojoj ideji?"},{"de":"Wie findest du meinen Vorschlag?","sr":"Šta misliš o mom predlogu?"},{"de":"Vielleicht wäre es besser, wenn wir am Sonntag fahren.","sr":"Možda bi bilo bolje da putujemo u nedelju."},{"de":"Ich denke, wir sollten mit dem Bus fahren.","sr":"Mislim da bi trebalo da idemo autobusom."},{"de":"Ich finde, wir könnten zusammen kochen.","sr":"Mislim da bismo mogli zajedno da kuvamo."},{"de":"Was hältst du davon, wenn wir einen Kurs besuchen?","sr":"Šta misliš o tome da zajedno pohađamo kurs?"},{"de":"Wir könnten auch etwas anderes machen.","sr":"Mogli bismo da radimo i nešto drugo."},{"de":"Lass uns zusammen einen Plan machen.","sr":"Hajde da zajedno napravimo plan."},{"de":"Vielleicht können wir einen Freund mitnehmen.","sr":"Možda možemo da povedemo jednog prijatelja."},{"de":"Ich würde gern in den Park gehen.","sr":"Rado bih išao/išla u park."},{"de":"Ich habe noch eine andere Idee.","sr":"Imam još jednu ideju."},{"de":"Was möchtest du lieber machen?","sr":"Šta bi ti radije radio/radila?"}]},{"name":"Vreme i susret","deName":"Zeitpunkt","description":"Dogovorite dan, sat i mesto susreta","phrases":[{"de":"Wann hast du Zeit?","sr":"Kada imaš vremena?"},{"de":"Hast du am Samstag Zeit?","sr":"Imaš li vremena u subotu?"},{"de":"Wie sieht es bei dir am Samstag aus?","sr":"Kakvi su ti planovi za subotu?"},{"de":"Kannst du am Samstag?","sr":"Možeš li u subotu?"},{"de":"Wann sollen wir uns treffen?","sr":"Kada bi trebalo da se nađemo?"},{"de":"Können wir uns am Samstag treffen?","sr":"Možemo li da se nađemo u subotu?"},{"de":"Um wie viel Uhr gehen wir los?","sr":"U koliko sati krećemo?"},{"de":"Kannst du am Samstag um 14 Uhr?","sr":"Možeš li u subotu u 14 časova?"},{"de":"Wäre es für dich in Ordnung, wenn wir uns am Sonntag treffen?","sr":"Da li bi ti odgovaralo da se nađemo u nedelju?"},{"de":"Am Sonntag habe ich den ganzen Tag Zeit.","sr":"U nedelju imam vremena ceo dan."},{"de":"Am Vormittag kann ich leider nicht.","sr":"Pre podne, nažalost, ne mogu."},{"de":"Treffen wir uns lieber am Nachmittag.","sr":"Bolje da se nađemo posle podne."},{"de":"Wie wäre es mit Freitag um 17 Uhr?","sr":"Šta kažeš na petak u 17 časova?"},{"de":"Wir treffen uns am Eingang.","sr":"Naći ćemo se na ulazu."},{"de":"Ich bin um 16 Uhr da.","sr":"Biću tamo u 16 časova."},{"de":"Passt dir dieser Termin?","sr":"Da li ti odgovara ovaj termin?"}]},{"name":"Mesto i prevoz","deName":"Ort & Fahrt","description":"Izaberite lokaciju i prevoz","phrases":[{"de":"Wo wollen wir uns treffen?","sr":"Gde želimo da se nađemo?"},{"de":"Wo sollen wir feiern?","sr":"Gde bi trebalo da proslavimo?"},{"de":"Wir könnten uns vor der Schule treffen.","sr":"Mogli bismo da se nađemo ispred škole."},{"de":"Ich schlage den Stadtpark vor.","sr":"Predlažem gradski park."},{"de":"Zu Hause haben wir genug Platz.","sr":"Kod kuće imamo dovoljno mesta."},{"de":"Im Café ist es gemütlicher.","sr":"U kafiću je prijatnije."},{"de":"Wie kommen wir dorthin?","sr":"Kako ćemo stići tamo?"},{"de":"Fahren wir mit dem Bus oder mit dem Auto?","sr":"Da li ćemo ići autobusom ili automobilom?"},{"de":"Ich denke, wir sollten mit dem Zug fahren.","sr":"Mislim da bi trebalo da idemo vozom."},{"de":"Mit dem Fahrrad ist es günstiger.","sr":"Biciklom je jeftinije."},{"de":"Der Bus fährt um neun Uhr ab.","sr":"Autobus polazi u devet sati."},{"de":"Ich kann dich mit dem Auto abholen.","sr":"Mogu da dođem po tebe automobilom."},{"de":"Der Treffpunkt ist vor dem Bahnhof.","sr":"Mesto okupljanja je ispred železničke stanice."},{"de":"Wir brauchen ungefähr zwanzig Minuten.","sr":"Treba nam otprilike dvadeset minuta."}]},{"name":"Organizacija","deName":"Organisation","description":"Dogovorite ko šta radi i donosi","phrases":[{"de":"Was müssen wir organisieren?","sr":"Šta moramo da organizujemo?"},{"de":"Was brauchen wir dafür?","sr":"Šta nam je potrebno za to?"},{"de":"Was sollen wir mitnehmen?","sr":"Šta bi trebalo da ponesemo?"},{"de":"Wir könnten etwas zu essen und zu trinken kaufen.","sr":"Mogli bismo da kupimo nešto za jelo i piće."},{"de":"Ich bringe Wasser und Saft mit.","sr":"Poneću vodu i sok."},{"de":"Kannst du bitte das Essen vorbereiten?","sr":"Možeš li, molim te, da pripremiš hranu?"},{"de":"Wer kauft die Getränke?","sr":"Ko će kupiti piće?"},{"de":"Ich kümmere mich um die Musik.","sr":"Ja ću se pobrinuti za muziku."},{"de":"Du kannst die Einladungen schreiben.","sr":"Ti možeš da napišeš pozivnice."},{"de":"Wie viel Geld brauchen wir?","sr":"Koliko novca nam je potrebno?"},{"de":"Wir können die Kosten teilen.","sr":"Možemo da podelimo troškove."},{"de":"Ich bezahle die Eintrittskarten.","sr":"Ja ću platiti ulaznice."},{"de":"Wen möchten wir einladen?","sr":"Koga želimo da pozovemo?"},{"de":"Laden wir auch die anderen aus dem Deutschkurs ein?","sr":"Hoćemo li pozvati i ostale sa kursa nemačkog?"},{"de":"Ich frage unsere Freunde.","sr":"Pitaću naše prijatelje."},{"de":"Wer reserviert den Tisch?","sr":"Ko će rezervisati sto?"},{"de":"Vergiss bitte die Getränke nicht.","sr":"Molim te, ne zaboravi piće."},{"de":"Wir sollten auch an das Wetter denken.","sr":"Trebalo bi da mislimo i na vreme."}]},{"name":"Slaganje","deName":"Zusagen","description":"Potvrdi da ti predlog odgovara","phrases":[{"de":"Ja, gern.","sr":"Da, rado."},{"de":"Ja, das ist eine gute Idee!","sr":"Da, to je dobra ideja!"},{"de":"Ja, das finde ich gut.","sr":"Da, mislim da je to dobro."},{"de":"Das finde ich interessant.","sr":"To mi deluje zanimljivo."},{"de":"Das ist ein toller Vorschlag.","sr":"To je sjajan predlog."},{"de":"Damit bin ich einverstanden.","sr":"S tim se slažem."},{"de":"Das gefällt mir.","sr":"To mi se sviđa."},{"de":"Sonntag klingt ganz gut.","sr":"Nedelja mi zvuči sasvim dobro."},{"de":"Prima! Das ist für mich perfekt.","sr":"Odlično! To mi savršeno odgovara."},{"de":"Das passt mir sehr gut.","sr":"To mi baš odgovara."},{"de":"Das können wir gern machen.","sr":"To možemo rado da uradimo."},{"de":"Genau, so machen wir das.","sr":"Upravo tako ćemo uraditi."},{"de":"Einverstanden!","sr":"Dogovoreno!"},{"de":"Ich bin auch dafür.","sr":"I ja sam za to."}]},{"name":"Nesigurnost","deName":"Unsicher sein","description":"Traži drugo rešenje ili vreme za razmišljanje","phrases":[{"de":"Ich bin mir noch nicht sicher.","sr":"Još nisam siguran/sigurna."},{"de":"Darüber muss ich noch nachdenken.","sr":"Moram još da razmislim o tome."},{"de":"Vielleicht wäre es besser, wenn wir am Sonntag fahren.","sr":"Možda bi bilo bolje da idemo u nedelju."},{"de":"Ich finde es besser, wenn wir am Sonntag gehen.","sr":"Mislim da je bolje da idemo u nedelju."},{"de":"Ich weiß nicht, ob ich am Samstag Zeit habe.","sr":"Ne znam da li imam vremena u subotu."},{"de":"Ich bin nicht sicher, ob das klappt.","sr":"Nisam siguran/sigurna da li će to uspeti."},{"de":"Das ist vielleicht zu teuer.","sr":"To je možda preskupo."},{"de":"Können wir nicht etwas anderes machen?","sr":"Zar ne možemo da radimo nešto drugo?"},{"de":"Ich muss erst meine Familie fragen.","sr":"Prvo moram da pitam porodicu."},{"de":"Vielleicht finden wir eine bessere Lösung.","sr":"Možda ćemo naći bolje rešenje."}]},{"name":"Odbijanje","deName":"Absagen","description":"Ljubazno odbij i ponudi alternativu","phrases":[{"de":"Am Samstag um zehn Uhr kann ich leider nicht.","sr":"U subotu u deset sati, nažalost, ne mogu."},{"de":"Ich habe einen Termin, den ich nicht verschieben kann.","sr":"Imam termin koji ne mogu da pomerim."},{"de":"Hast du vielleicht am Sonntag Zeit?","sr":"Imaš li možda vremena u nedelju?"},{"de":"Am Samstag passt es mir leider nicht.","sr":"U subotu mi, nažalost, ne odgovara."},{"de":"Könnten wir vielleicht am Sonntag den Kurs besuchen?","sr":"Da li bismo možda mogli da pohađamo kurs u nedelju?"},{"de":"Es tut mir leid, aber am Sonntag arbeite ich.","sr":"Žao mi je, ali u nedelju radim."},{"de":"Nein, das geht nicht. Ich muss arbeiten.","sr":"Ne, to ne može. Moram da radim."},{"de":"Da müssen wir uns etwas anderes überlegen.","sr":"Moramo da smislimo nešto drugo."},{"de":"Ich bin anderer Meinung.","sr":"Ja imam drugačije mišljenje."},{"de":"Das finde ich nicht so gut.","sr":"To mi ne deluje baš dobro."},{"de":"Da habe ich leider keine Zeit.","sr":"Tada, nažalost, nemam vremena."},{"de":"Da habe ich schon einen Termin.","sr":"Tada već imam zakazan termin."},{"de":"Darauf habe ich keine Lust.","sr":"Nemam volje za to."},{"de":"Leider kann ich nicht mitkommen.","sr":"Nažalost, ne mogu da pođem."},{"de":"Können wir den Plan ändern?","sr":"Možemo li da promenimo plan?"},{"de":"Wie wäre es stattdessen mit Freitag?","sr":"Šta kažeš da umesto toga bude petak?"}]},{"name":"Ponovo pitati","deName":"Nachfragen","description":"Ako ne razumeš partnera","phrases":[{"de":"Wie bitte?","sr":"Molim?"},{"de":"Entschuldigung, ich habe dich nicht verstanden.","sr":"Izvini, nisam te razumeo/razumela."},{"de":"Kannst du das bitte wiederholen?","sr":"Možeš li, molim te, to da ponoviš?"},{"de":"Kannst du die Frage noch einmal wiederholen?","sr":"Možeš li još jednom da ponoviš pitanje?"},{"de":"Kannst du bitte langsamer sprechen?","sr":"Možeš li, molim te, da govoriš sporije?"},{"de":"Was meinst du damit?","sr":"Šta time misliš?"},{"de":"Meinst du Samstag oder Sonntag?","sr":"Da li misliš na subotu ili nedelju?"},{"de":"Habe ich dich richtig verstanden?","sr":"Da li sam te dobro razumeo/razumela?"},{"de":"Kannst du mir ein Beispiel geben?","sr":"Možeš li da mi daš primer?"},{"de":"Was sollen wir genau machen?","sr":"Šta tačno treba da uradimo?"}]},{"name":"Završetak plana","deName":"Abschluss","description":"Potvrdite zajednički dogovor","phrases":[{"de":"Dann machen wir das so.","sr":"Onda ćemo tako uraditi."},{"de":"Also, wir treffen uns am Samstag um 14 Uhr.","sr":"Dakle, naći ćemo se u subotu u 14 časova."},{"de":"Gut, dann ist alles klar.","sr":"Dobro, onda je sve jasno."},{"de":"Wir haben alles besprochen.","sr":"O svemu smo razgovarali."},{"de":"Ich freue mich schon darauf.","sr":"Već se radujem tome."},{"de":"Danke für deine Hilfe.","sr":"Hvala ti na pomoći."},{"de":"Super, bis Samstag!","sr":"Super, vidimo se u subotu!"},{"de":"Vergiss bitte nicht, pünktlich zu kommen.","sr":"Molim te, ne zaboravi da dođeš na vreme."},{"de":"Ich schreibe dir später noch eine Nachricht.","sr":"Poslaću ti kasnije još jednu poruku."},{"de":"Dann bis morgen!","sr":"Onda, vidimo se sutra!"}]}];
const nav=document.getElementById("categories");
const content=document.getElementById("content");
const notice=document.getElementById("notice");
let categoryIndex=0,active=null,sequence=0;
let voices=[];
const safe=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[ch]));
function updateVoices(){voices=("speechSynthesis" in window)?window.speechSynthesis.getVoices():[]}
updateVoices();
if("speechSynthesis" in window){window.speechSynthesis.addEventListener?.("voiceschanged",updateVoices)}
function resetSpeech(){
  sequence++;
  if("speechSynthesis" in window){try{window.speechSynthesis.cancel()}catch(_){}}
  content.querySelectorAll(".phrase.playing").forEach(el=>el.classList.remove("playing"));
  content.querySelectorAll(".listen button.active").forEach(el=>el.classList.remove("active"));
  active=null;
}
function render(){
  document.getElementById("catName").textContent=categories[categoryIndex].name;
  document.getElementById("catPage").textContent=(categoryIndex+1)+" / "+categories.length+" kategorija";
  const c=categories[categoryIndex];
  content.innerHTML='<div class="section"><div><h2>'+safe(c.name)+'</h2><p>'+safe(c.deName)+'</p></div><span class="count">'+c.phrases.length+' rečenica</span></div>'+
    c.phrases.map((p,i)=>'<article class="phrase" data-index="'+i+'"><div class="num">REČENICA '+String(i+1).padStart(2,'0')+'</div><div class="de" lang="de">'+safe(p.de)+'</div><div class="sr" lang="sr">'+safe(p.sr)+'</div><div class="listen"><button type="button" data-lang="de" data-index="'+i+'" aria-label="Slušaj nemački izgovor: '+safe(p.de)+'">🔊 DE</button><button type="button" class="srButton" data-lang="sr" data-index="'+i+'" aria-label="Slušaj srpski izgovor: '+safe(p.sr)+'">🔊 SR</button></div></article>').join("");
  content.scrollTop=0;
}
function pickVoice(lang){
  updateVoices();
  if(lang==="de")return voices.find(v=>/^de[-_](DE|AT)/i.test(v.lang))||voices.find(v=>/^de([-_]|$)/i.test(v.lang))||null;
  return voices.find(v=>/^sr([-_]|$)/i.test(v.lang))||voices.find(v=>/^(bs|hr)([-_]|$)/i.test(v.lang))||null;
}
function speak(index,lang,btn){
  if(active?.button===btn){resetSpeech();notice.textContent="Izgovor je zaustavljen.";return}
  resetSpeech();
  if(!("speechSynthesis" in window)){notice.textContent="Pregledač ne podržava glasovni izgovor.";return}
  const phrase=categories[categoryIndex].phrases[index];
  if(!phrase)return;
  const voice=pickVoice(lang);
  const utterance=new SpeechSynthesisUtterance(phrase[lang]);
  utterance.lang=voice?voice.lang:(lang==="de"?"de-DE":"sr-RS");
  if(voice)utterance.voice=voice;
  utterance.rate=lang==="de"?.87:.94;
  utterance.pitch=1;
  const call=sequence;
  active={button:btn,utterance};
  btn.classList.add("active");
  btn.closest(".phrase")?.classList.add("playing");
  notice.textContent="Slušanje: "+(lang==="de"?"nemački":"srpski");
  const finish=()=>{if(call!==sequence)return;resetSpeech();notice.textContent="Izaberi sledeću rečenicu za slušanje."};
  utterance.onend=finish;
  utterance.onerror=e=>{if(call!==sequence)return;resetSpeech();notice.textContent=e.error==="canceled"?"Izgovor je zaustavljen.":"Glas nije dostupan na ovom uređaju. Proveri glasove u pregledaču."};
  try{window.speechSynthesis.speak(utterance)}catch(e){resetSpeech();notice.textContent="Izgovor nije dostupan u ovom pregledaču."}
}
nav.addEventListener("click",e=>{
 const b=e.target.closest("button[data-step]");if(!b)return;
 resetSpeech();categoryIndex=(categoryIndex+Number(b.dataset.step)+categories.length)%categories.length;render();notice.textContent="Izaberi rečenicu za slušanje.";
});
content.addEventListener("click",e=>{
 const b=e.target.closest("button[data-lang]");if(b)speak(Number(b.dataset.index),b.dataset.lang,b);
});
document.addEventListener("visibilitychange",()=>{if(document.hidden)resetSpeech()});
render();
</script>
</body>
</html>
